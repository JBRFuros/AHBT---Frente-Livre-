   RELATÓRIO
--------------------------------------------------------- */
function renderRelatorio(){
  if(DB.registros.length===0){
    return `
      <div class="topbar"><div><h2>Relatório</h2><p class="desc">Indicadores consolidados de todos os projetos, empresas e estruturas, prontos para exportar.</p></div></div>
      <div class="card"><div class="empty"><div class="big">Nenhum dado lançado ainda</div><p>Use a aba Apontar para começar.</p></div></div>`;
  }
  let regsBase = DB.registros;
  if(state.filtroProjeto!=='all') regsBase = regsBase.filter(r=>r.projetoId===state.filtroProjeto);

  const aguardando = regsBase.filter(r=>!r.inicio);
  const executando = regsBase.filter(r=>r.inicio && !r.termino);
  const concluidas = regsBase.filter(r=>r.termino);
  const concluidasExec = regsBase.filter(r=>r.inicio && r.termino);

  const regsOcio = regsBase.map(r => ({ ...r, h: idleHours(r) }));
  const totalOcioso = regsOcio.reduce((s,r)=>s+r.h, 0);
  const mediaOcioso = regsOcio.length ? totalOcioso/regsOcio.length : 0;
  const porEtapaOcio = {};
  regsOcio.forEach(r=>{ if(!porEtapaOcio[r.etapaId]) porEtapaOcio[r.etapaId]={soma:0,n:0}; porEtapaOcio[r.etapaId].soma+=r.h; porEtapaOcio[r.etapaId].n+=1; });
  const rankingOcio = Object.entries(porEtapaOcio).map(([etapaId,v])=>({ etapaId, media: v.soma/v.n, n: v.n })).sort((a,b)=>b.media-a.media);
  const maxOcio = Math.max(...rankingOcio.map(r=>r.media), 1);
  const etapaMaisOciosa = rankingOcio[0] ? nomeEtapa(rankingOcio[0].etapaId) : '—';

  const RE = montarRankingEmpresa(concluidasExec, execHours);
  const agora = new Date().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

function exportarCSV(){
  const linhas = [['Projeto','Elemento','Estrutura','Empresa','Trecho','Frente (estacas)','Etapa','Liberação','Início','Término','Ociosidade (h)','Duração (h)','Metros','Produtividade (m/h)','Quantidade executada','Unidade','Índice real','Situação','Recursos de apoio alocados','Custo AHBT (R$)']];
  DB.registros.forEach(r=>{
    const hOcio = idleHours(r);
    const hExec = execHours(r);
    const m = comprimentoFrenteMetros(r.faixaInicio, r.faixaFim);
    const situacao = r.termino ? 'Concluída' : (r.pausadoDesde ? 'Pausada' : (r.inicio ? 'Em execução' : 'Aguardando efetivo'));
    const custo = custoRecursosRegistro(r);
    const ir = indiceRealRegistro(r);
    linhas.push([nomeProjeto(r.projetoId), r.elementoId ? (nomeElemento(r.elementoId)||'') : '', nomeEstrutura(r.estruturaId), nomeEmpresa(r.empresaId), trechoNomeCurto(r.trechoId), `${r.faixaInicio}-${r.faixaFim}`, nomeEtapa(r.etapaId), r.liberacao||'', r.inicio||'', r.termino||'', hOcio.toFixed(2), hExec!==null?hExec.toFixed(2):'', m, (hExec && m) ? (m/hExec).toFixed(1) : '', r.quantidadeExecutada??'', r.unidadeExecutada||'', ir!==null?ir.toFixed(2):'', situacao, recursosResumo(r), custo.toFixed(2)]);
  });
  const csv = linhas.map(linha => linha.map(campo => {
    const s = String(campo??'');
    return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `frente-livre-indicadores-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV exportado.');
}
window.exportarCSV = exportarCSV;

function importarBackupJSON(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const leitor = new FileReader();
  leitor.onload = async (e) => {
    try{
      const backup = JSON.parse(e.target.result);
      if(!backup || !Array.isArray(backup.registros)){ showToast('Arquivo inválido.'); return; }
      const resumo = `Projetos: ${(backup.projetos||[]).length} · Trechos: ${(backup.estacas||[]).length} · Estruturas: ${(backup.estruturas||[]).length} · Etapas: ${(backup.etapas||[]).length} · Empresas: ${(backup.empresas||[]).length} · Recursos: ${(backup.recursos||[]).length} · Elementos: ${(backup.elementos||[]).length} · Lançamentos: ${(backup.registros||[]).length}`;
      if(!confirm(`Isso vai SUBSTITUIR todos os dados atuais pelos do backup (exportado em ${backup.exportadoEm ? fmtDataHora(backup.exportadoEm) : 'data desconhecida'}).\n\n${resumo}\n\nContinuar?`)) return;
      DB.projetos = backup.projetos || [{ id: uid(), nome: 'Projeto Padrão' }];
      DB.estacas = backup.estacas || [];
      DB.estruturas = (backup.estruturas || []).map(e => ({ usaElementos:false, categoria:null, projetoId: DB.projetos[0].id, ...e }));
      DB.etapas = backup.etapas || [];
      DB.empresas = (backup.empresas || []).map(e => ({ profissionais:[], ...e }));
      DB.recursos = (backup.recursos || []).map(r => ({ custoHora:0, ...r }));
      DB.elementos = (backup.elementos || []).map(el => ({ orcamento:[], projetoId: DB.projetos[0].id, ...el }));
      DB.registros = (backup.registros || []).map(r => ({ recursos:[], quantidadeExecutada:null, unidadeExecutada:null, elementoId:null, pausas:[], pausadoDesde:null, efetivoDiario:[], projetoId: DB.projetos[0].id, ...r }));
      await Promise.all([persist.projetos(), persist.estacas(), persist.estruturas(), persist.etapas(), persist.empresas(), persist.recursos(), persist.elementos(), persist.registros()]);
      showToast('Backup restaurado com sucesso.');
      inputEl.value = '';
      render();
    } catch(err){ showToast('Não foi possível ler o arquivo de backup.'); }
  };
  leitor.readAsText(file);
}
window.importarBackupJSON = importarBackupJSON;

function elementoConcluido(elementoId){
  const el = DB.elementos.find(x=>x.id===elementoId);
  if(el && el.concluido) return true;
  const etapas = etapasDoElemento(elementoId);
  if(!etapas.length) return false;
  return etapas.every(et => DB.registros.some(r=>r.elementoId===elementoId && r.etapaId===et.id && r.termino));
}
function avancoFisicoProjeto(projetoId){
  const elementos = DB.elementos.filter(el=>el.projetoId===projetoId);
  const total = elementos.length;
  if(total===0) return { total:0, concluidos:0, pct:0 };
  const concluidos = elementos.filter(el=>elementoConcluido(el.id)).length;
  return { total, concluidos, pct: Math.round((concluidos/total)*100) };
}

function moveContrato(id, dir){
  const lista = DB.contratos.slice().sort((a,b)=>(a.order??0)-(b.order??0));
  const idx = lista.findIndex(c=>c.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=lista.length) return;
  const tmp = lista[idx].order??idx; lista[idx].order = lista[swapIdx].order??swapIdx; lista[swapIdx].order = tmp;
  persist.contratos(); render();
}
window.moveContrato = moveContrato;
function submitContrato(ev){
  ev.preventDefault();
  const f = ev.target;
  const codigo = f.codigo.value.trim().toUpperCase();
  const nome = f.nome.value.trim();
  const obs = f.obs.value.trim() || null;

  lista.forEach(es=>{ const k=es.nome.toLowerCase(); nomesContagem[k]=(nomesContagem[k]||0)+1; });
  const duplicadas = Object.entries(nomesContagem).filter(([,n])=>n>1).map(([k])=>k);
  const avisoDuplicidade = duplicadas.length ? `
    <div class="card" style="border-left:3px solid var(--vermelho)">
      <p style="font-size:13px; margin:0">⚠️ <strong>Nomes duplicados detectados neste projeto:</strong> ${duplicadas.map(esc).join(', ')}. Isso pode causar confusão no Apontar (elementos/etapas espalhados entre as cópias). Recomendo excluir a duplicata e mover o que for preciso pra que sobre só uma.</p>
    </div>` : '';
  // catálogo: nomes de estrutura já usados em outros projetos, pra reaproveitar num toque
  const catalogoMap = new Map();
  DB.estruturas.forEach(es=>{
    if(es.projetoId===state.estruturasProjetoId) return; // não repete o que já está neste projeto
    const chave = es.nome.toLowerCase();
    if(!catalogoMap.has(chave)) catalogoMap.set(chave, es);
  });
  const jaTemNoProjeto = new Set(lista.map(es=>es.nome.toLowerCase()));
  const catalogo = [...catalogoMap.values()].filter(es=>!jaTemNoProjeto.has(es.nome.toLowerCase()));
  const catalogoHtml = catalogo.length ? `
    <div class="card">
      <h3>Reaproveitar do catálogo <span class="tag">já usadas em outros projetos</span></h3>
      <div class="tap-grid">
        ${catalogo.map(es=>`<button class="tap-card" onclick="criarEstruturaDoCatalogo('${esc(es.nome).replace(/'/g,"\\'")}', ${es.categoria?`'${es.categoria}'`:'null'}, ${es.usaElementos})">
          <span class="tap-card-title">${esc(es.nome)}</span>
          <span class="tap-card-sub">${es.categoria ? esc(es.categoria)+' · ' : ''}${es.usaElementos ? 'por elemento' : 'por trecho'}</span>
        </button>`).join('')}
      </div>
    </div>` : '';

  return `
    <div class="topbar"><div><h2>Estruturas</h2><p class="desc">Tipos de peça de cada projeto (Bloco de Fundação, Pilar, Viga Travessa...). Cada projeto tem seu próprio conjunto — uma obra pode ter peças diferentes de outra.</p></div>
      <div style="min-width:220px"><label>Projeto</label><select onchange="state.estruturasProjetoId=this.value; render();">${projetoOptions}</select></div>
    </div>
    ${avisoDuplicidade}
    ${catalogoHtml}
    <div class="card"><h3>Nova estrutura em "${esc(nomeProjeto(state.estruturasProjetoId))}"</h3>
      <form onsubmit="return submitEstrutura(event)">
        <div class="grid3">
          <div class="field"><label>Nome *</label><input type="text" name="nome" required placeholder="Ex.: Bloco de Fundação"></div>
          <div class="field"><label>Categoria</label><select name="categoria">${categoriaOptions(null)}</select></div>
          <div class="field"><label>Usa elementos (peças individuais)?</label>
            <select name="usaElementos"><option value="nao">Não — só trecho + faixa</option><option value="sim">Sim — peças com código, ex.: BL-01</option></select>
          </div>
        </div>
        <button class="btn" type="submit">${ICONS.plus} Adicionar</button>
      </form>
    </div>
    <div class="card"><h3>Estruturas de "${esc(nomeProjeto(state.estruturasProjetoId))}" <span class="tag">${lista.length}</span></h3>
      ${lista.length ? `<table><thead><tr><th>Nome</th><th>Categoria</th><th>Etapas</th><th>Usa elementos</th><th>Elementos</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty"><div class="big">Nenhuma estrutura neste projeto</div></div>`}
    </div>`;
}
function updateNomeEstrutura(id, valor){
  const es = DB.estruturas.find(e=>e.id===id);
  const nome = valor.trim().toUpperCase();
  if(!nome) return;
  es.nome = nome;
  persist.estruturas();
  showToast('Nome atualizado.');
  render();
}
window.updateNomeEstrutura = updateNomeEstrutura;
function updateCategoriaEstrutura(id, valor){
  const es = DB.estruturas.find(e=>e.id===id);
  es.categoria = valor || null;
  persist.estruturas();
  render();
}
window.updateCategoriaEstrutura = updateCategoriaEstrutura;
function toggleUsaElementos(id, checked){
  const es = DB.estruturas.find(e=>e.id===id);
  es.usaElementos = checked;
  persist.estruturas();
  showToast(checked ? `"${es.nome}" agora usa elementos.` : `"${es.nome}" não usa mais elementos.`);
  render();
}
window.toggleUsaElementos = toggleUsaElementos;
function submitEstrutura(ev){
  ev.preventDefault();
  const f = ev.target;
  const nome = f.nome.value.trim().toUpperCase();
  if(!nome) return false;
  const usaElementos = f.usaElementos.value === 'sim';
  const existente = DB.estruturas.find(e=>e.projetoId===state.estruturasProjetoId && e.nome.toLowerCase()===nome.toLowerCase());
  if(existente){
    showToast(`Já existe "${nome}" neste projeto — abrindo ela, sem duplicar.`);
    f.reset();
    if(existente.usaElementos){
      state.tab = 'elementos';
      state.elementosProjetoId = existente.projetoId;
      state.elementosEstruturaId = existente.id;
      resetElForm();
    }
    render();
    return false;
  }
  const novaEstrutura = { id: uid(), projetoId: state.estruturasProjetoId, nome, categoria: f.categoria.value || null, usaElementos };
  DB.estruturas.push(novaEstrutura);
  persist.estruturas();
  f.reset();
  if(usaElementos){
    showToast(`Estrutura "${nome}" cadastrada. Agora cadastre os elementos dela.`);
    state.tab = 'elementos';
    state.elementosProjetoId = novaEstrutura.projetoId;
    state.elementosEstruturaId = novaEstrutura.id;
    resetElForm();
  } else {
    showToast('Estrutura cadastrada.');
  }
  render();
  return false;
}
window.submitEstrutura = submitEstrutura;
function criarEstruturaDoCatalogo(nome, categoria, usaElementos){
  const existente = DB.estruturas.find(e=>e.projetoId===state.estruturasProjetoId && e.nome.toLowerCase()===nome.toLowerCase());
  if(existente){
    showToast(`Já existe "${nome}" neste projeto — abrindo ela, sem duplicar.`);
    if(existente.usaElementos){
      state.tab = 'elementos';
      state.elementosProjetoId = existente.projetoId;
      state.elementosEstruturaId = existente.id;
      resetElForm();
    }
    render();
    return;
  }
  const novaEstrutura = { id: uid(), projetoId: state.estruturasProjetoId, nome, categoria, usaElementos };
  DB.estruturas.push(novaEstrutura);
  persist.estruturas();
  if(usaElementos){
    showToast(`Estrutura "${nome}" adicionada. Agora cadastre os elementos dela.`);
    state.tab = 'elementos';
    state.elementosProjetoId = novaEstrutura.projetoId;
    state.elementosEstruturaId = novaEstrutura.id;
    resetElForm();
  } else {
    showToast(`Estrutura "${nome}" adicionada.`);
  }
  render();
}
window.criarEstruturaDoCatalogo = criarEstruturaDoCatalogo;
function deleteEstrutura(id){
  const temEtapas = DB.etapas.some(e=>e.estruturaId===id);
  const temRegistros = DB.registros.some(r=>r.estruturaId===id);
  if((temEtapas || temRegistros) && !confirm('Essa estrutura já tem etapas e/ou lançamentos vinculados. Excluir não apaga o histórico, mas as etapas ficarão órfãs. Continuar?')) return;
  DB.estruturas = DB.estruturas.filter(e=>e.id!==id);
  persist.estruturas(); render();
}
window.deleteEstrutura = deleteEstrutura;

   ELEMENTOS — com seletor de localização por toque (igual ao Apontar)
--------------------------------------------------------- */
function resetElForm(){ state.elForm = { trechoId:null, faixaInicio:null, faixaFim:null, eixoInicioId:null, eixoFimId:null }; state.elementoDuplicadoAviso = null; }
function renderElementosTab(){
  if(DB.projetos.length===0){

  if(!state.elementosProjetoId || !DB.projetos.find(p=>p.id===state.elementosProjetoId)) state.elementosProjetoId = DB.projetos[0].id;

  const estruturasComElemento = DB.estruturas.filter(e=>e.usaElementos && e.projetoId===state.elementosProjetoId);
  if(!estruturasComElemento.length){
    return `<div class="topbar"><div><h2>Elementos</h2><p class="desc">Peças específicas de uma estrutura (ex.: BL-01), categorizadas por projeto, tipo da peça e nome da peça.</p></div>
      <div style="min-width:220px"><label>Projeto</label><select onchange="state.elementosProjetoId=this.value; state.elementosEstruturaId=null; resetElForm(); render();">${projetoOptions}</select></div>
    </div>
      <div class="card"><div class="empty"><div class="big">Nenhuma estrutura com elementos em "${esc(nomeProjeto(state.elementosProjetoId))}"</div>

      <button class="btn" style="margin-top:10px" onclick="setTab('estruturas')">Ir para Estruturas</button></div></div>`;

  if(!state.elementosEstruturaId || !estruturasComElemento.find(e=>e.id===state.elementosEstruturaId)){
    state.elementosEstruturaId = estruturasComElemento[0].id;
  }
  const estrutura = DB.estruturas.find(e=>e.id===state.elementosEstruturaId);
  const estruturaOptions = estruturasComElemento.map(e=>`<option value="${e.id}" ${e.id===state.elementosEstruturaId?'selected':''}>${esc(e.nome)}</option>`).join('');

  // -- localização: trecho (por estaca) e eixo são independentes — pode preencher um, outro, ou os dois --
  const trechosEstaca = DB.estacas.filter(f=>f.projetoId===state.elementosProjetoId && f.tipo==='estaca').sort((a,b)=>(a.order??0)-(b.order??0));
  const pontosEixo = DB.estacas.filter(f=>f.projetoId===state.elementosProjetoId && f.tipo==='eixo').sort((a,b)=>(a.order??0)-(b.order??0));

  // bloco Trecho (estaca)
  let blocoTrecho;
  if(!state.elForm.trechoId){
    const cards = trechosEstaca.map(f=>`<button class="tap-card" onclick="state.elForm.trechoId='${f.id}'; state.elForm.faixaInicio=null; state.elForm.faixaFim=null; render();"><span class="tap-card-title">${esc(f.trecho||'—')}</span><span class="tap-card-sub">Estacas ${esc(f.estacaInicio)}${f.estacaInicio!==f.estacaTermino?' – '+esc(f.estacaTermino):''}</span></button>`).join('');
    blocoTrecho = trechosEstaca.length ? `<div class="tap-grid">${cards}</div>` : `<p style="font-size:12px; color:var(--grafite-suave)">Nenhum trecho (estaca) cadastrado neste projeto.</p>`;
  } else {
    const trecho = DB.estacas.find(f=>f.id===state.elForm.trechoId);
    const estacas = listaEstacasDoTrecho(trecho);
    const min = state.elForm.faixaInicio===null ? null : Math.min(state.elForm.faixaInicio, state.elForm.faixaFim);
    const max = state.elForm.faixaInicio===null ? null : Math.max(state.elForm.faixaInicio, state.elForm.faixaFim);
    const chips = estacas.map(val=>{
      const emFaixa = min!==null && val>=min && val<=max;
      const borda = min!==null && (val===min || val===max);
      return `<button class="estaca-chip ${emFaixa?'selected':''} ${borda?'edge':''}" onclick="tapEstacaElemento(${val})">${formatEstacaVal(val)}</button>`;
    }).join('');
    blocoTrecho = `
      <p style="font-size:12.5px; color:var(--grafite-suave); margin:0 0 8px 0">${esc(trechoLabel(trecho))} <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="state.elForm.trechoId=null; state.elForm.faixaInicio=null; state.elForm.faixaFim=null; render();">◂ trocar</span></p>
      <div class="estaca-grid">${chips}</div>
      <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap">
        <button class="btn small ghost" ${min===null?'disabled':''} onclick="ajustarFaixaFimElemento(-10)">− 10m</button>
        <button class="btn small ghost" ${min===null?'disabled':''} onclick="ajustarFaixaFimElemento(10)">+ 10m</button>
        ${min!==null ? `<button class="btn small ghost" onclick="state.elForm.faixaInicio=null; state.elForm.faixaFim=null; render();">Limpar</button>` : ''}
      </div>
      ${min!==null ? `<p style="font-size:13px; margin-top:10px">Selecionado: <strong style="color:var(--grafite)">${esc(faixaLabel(formatEstacaVal(min), formatEstacaVal(max)))}</strong></p>` : `<p style="font-size:13px; margin-top:10px; color:var(--grafite-suave)">Toque na primeira estaca.</p>`}`;
  }

  // bloco Eixo (início + fim, pode ser ponto único repetindo o mesmo)

    const eixoFim = DB.estacas.find(x=>x.id===state.elForm.eixoFimId);
    blocoEixo = `
      <p style="font-size:12.5px; color:var(--grafite-suave); margin:0 0 8px 0">Início: <strong style="color:var(--grafite)">${esc(eixoIni.trecho)}</strong> <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="state.elForm.eixoInicioId=null; state.elForm.eixoFimId=null; render();">◂ trocar</span></p>

  const seletorLocalizacaoHtml = `

        <select onchange="updateQuantidadeEtapaElemento('${et.id}','unidadeOrcada', this.value)" style="font-size:12px; padding:6px 4px;">${unidadeOptionsHtml(et.unidadeOrcada, false)}</select>
        <button class="icon-btn" title="Excluir etapa" onclick="deleteEtapaElemento('${el.id}','${et.id}')">${ICONS.trash}</button>

      ${et.quantidadeOrcada!=null ? `<div class="bar-track" style="margin:2px 0 10px 34px; width:calc(100% - 34px)"><div class="bar-fill ${pct>=100?'verde':(pct>0?'amarelo':'vermelho')}" style="width:${Math.max(pct,2)}%"></div></div><p style="font-size:11px; color:var(--grafite-suave); margin:0 0 10px 34px;">executado: ${executado} ${esc(et.unidadeOrcada||'')} (${pct.toFixed(0)}%)</p>` : ''}`;

    const editandoCodigo = emEdicao('elemento', el.id);
    return `<div style="border:1px solid var(--linha-grade); border-radius:6px; padding:14px 16px; margin-bottom:12px; background:${el.concluido ? '#F2F7F3' : '#FBFBFA'};">

function ajustarFaixaFimElemento(deltaMetros){
  if(state.elForm.faixaInicio===null) return;
  const trecho = DB.estacas.find(f=>f.id===state.elForm.trechoId);
  const minMetros = Math.min(distEstacaMetros(trecho.estacaInicio), distEstacaMetros(trecho.estacaTermino));
  const maxMetros = Math.max(distEstacaMetros(trecho.estacaInicio), distEstacaMetros(trecho.estacaTermino));
  function deslocar(val){
    const metrosAtual = distEstacaMetros(formatEstacaVal(val));
    let novoMetros = metrosAtual + deltaMetros;
    if(novoMetros > maxMetros) novoMetros = maxMetros;
    if(novoMetros < minMetros) novoMetros = minMetros;
    const novaBase = Math.floor(novoMetros / METROS_POR_ESTACA);
    const novoResto = Math.round(novoMetros - novaBase*METROS_POR_ESTACA);
    return novaBase + novoResto/1000;
  }
  if(state.elForm.faixaInicio === state.elForm.faixaFim){
    const novoVal = deslocar(state.elForm.faixaFim);
    state.elForm.faixaInicio = novoVal; state.elForm.faixaFim = novoVal;
  } else {
    state.elForm.faixaFim = deslocar(state.elForm.faixaFim);
    if(state.elForm.faixaFim < state.elForm.faixaInicio){
      const tmp = state.elForm.faixaInicio; state.elForm.faixaInicio = state.elForm.faixaFim; state.elForm.faixaFim = tmp;
    }
  }
  render();
}

  const existente = DB.elementos.find(el=>{

function proximoCodigoSequencial(codigo, existeFn){
  const re = /\d+/g;
  let m, ultimo = null;
  while((m = re.exec(codigo))){ ultimo = m; }
  if(!ultimo) return null;
  const numStr = ultimo[0];
  const start = ultimo.index;
  const end = start + numStr.length;
  let n = parseInt(numStr, 10);
  let novo;
  do {
    n += 1;
    const nStr = String(n).padStart(numStr.length, '0');
    novo = codigo.slice(0, start) + nStr + codigo.slice(end);
  } while(existeFn(novo));
  return novo;
}
function duplicarElementoSequencia(id){

  );
  if(!novoCodigo){

  persist.elementos();

  showToast(`"${novoCodigo}" criado na sequência de "${original.codigo}", com ${etapasOriginais.length} etapa(s) copiada(s).`);

}

function renderAtividadesRecurso(recurso){
  const atividades = DB.registros.filter(r =>
    (r.recursos||[]).some(a=>a.recursoId===recurso.id) &&
    r.quantidadeExecutada!=null && r.termino
  ).map(r=>{
    const h = execHours(r);
    const indice = (h && h>0) ? r.quantidadeExecutada/h : null;
    const elLabel = r.elementoId ? (nomeElemento(r.elementoId) || regFrenteLabel(r)) : regFrenteLabel(r);
    return { etapa: nomeEtapa(r.etapaId), elemento: elLabel, quantidade: r.quantidadeExecutada, unidade: r.unidadeExecutada||'', horas: h, indice, data: r.termino };
  }).sort((a,b)=> new Date(b.data) - new Date(a.data));
  if(!atividades.length) return '';
  const linhas = atividades.map(a=>`
    <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--linha-grade); flex-wrap:wrap;">
      <span style="font-size:12.5px;">${esc(a.etapa)} — Elemento (${esc(a.elemento)})</span>
      <span class="mono" style="font-size:12px; color:var(--grafite-suave); white-space:nowrap;">${a.quantidade}${esc(a.unidade)} em ${fmtHoras(a.horas)} ${a.indice!==null ? `→ <strong style="color:var(--grafite)">${a.indice.toFixed(2)} ${esc(a.unidade)}/h</strong>` : ''}</span>
    </div>`).join('');
  return `<div style="margin-bottom:16px;">
    <p style="font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.02em; text-transform:uppercase; margin-bottom:6px;">${esc(recurso.nome)}</p>
    ${linhas}
  </div>`;
}

/* -- Efetivo retroativo a partir do Histórico -- */
function renderHistoricoEfetivoEditor(regId){
  const reg = DB.registros.find(r=>r.id===regId);
  if(!reg){ state.historicoEfetivoRegId=null; return renderRegistros(); }
  const empresa = DB.empresas.find(e=>e.id===reg.empresaId);
  const profissionais = (empresa && empresa.profissionais) || [];
  if(!state.historicoEfetivoData) state.historicoEfetivoData = hojeStr();
  const data = state.historicoEfetivoData;
  if(!reg.efetivoDiario) reg.efetivoDiario = [];
  let entrada = reg.efetivoDiario.find(e=>e.data===data);
  function qtd(profId){ if(!entrada) return 0; const it = entrada.itens.find(i=>i.profissionalId===profId); return it ? it.quantidade : 0; }
  const cards = profissionais.map(p=>`
    <div class="stepper-row">
      <span class="nome">${esc(p.nome)}</span>
      <div class="stepper-controls">
        <button class="btn small ghost" onclick="alterarQtdProfissional('${regId}','${p.id}','${esc(p.nome)}',-1,'${data}')">−</button>
        <span class="qtd">${qtd(p.id)}</span>
        <button class="btn small ghost" onclick="alterarQtdProfissional('${regId}','${p.id}','${esc(p.nome)}',1,'${data}')">+</button>
      </div>
    </div>`).join('');
  const dataMin = reg.inicio ? reg.inicio.slice(0,10) : (reg.liberacao ? reg.liberacao.slice(0,10) : hojeStr());
  const horaFimVal = entrada ? (entrada.horaFim||'') : '';
  const horaInicioVal = entrada ? (entrada.horaInicio||'') : '';

  const diasLancados = reg.efetivoDiario.filter(e=>e.itens && e.itens.length).slice().sort((a,b)=>b.data.localeCompare(a.data));
  const listaDias = diasLancados.length ? diasLancados.map(e=>{
    const total = e.itens.reduce((s,i)=>s+i.quantidade,0);
    const resumo = e.itens.map(i=>`${i.nome} (${i.quantidade})`).join(', ');
    return `<div class="idle-row" style="cursor:default">
        <div class="head">
          <span class="name">${fmtData(e.data+'T12:00:00')} <span class="tag">${total} pessoa${total!==1?'s':''}</span></span>
          <span class="meta">${esc(resumo)}${e.horaInicio||e.horaFim ? ` · ${e.horaInicio||'?'}–${e.horaFim||'?'}` : ''}</span>
        </div>
        <div style="display:flex; gap:6px; margin-top:8px;">
          <button class="btn small ghost" onclick="state.historicoEfetivoData='${e.data}'; render();">Editar esse dia</button>
          <button class="icon-btn" title="Excluir efetivo desse dia" onclick="excluirEfetivoDia('${regId}','${e.data}')">${ICONS.trash}</button>
        </div>
      </div>`;
  }).join('') : `<p style="font-size:12.5px; color:var(--grafite-suave)">Nenhum efetivo lançado ainda pra esse lançamento.</p>`;

  return `
    <div class="topbar"><div><h2>Efetivo retroativo</h2><p class="desc">Lance ou corrija o efetivo de qualquer dia desse lançamento, mesmo já concluído.</p></div></div>
    <div class="card">
      <h3>${esc(regFrenteLabel(reg))} <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="state.historicoEfetivoRegId=null; state.historicoEfetivoData=null; render();">◂ voltar ao histórico</span></h3>
      <p style="font-size:13px; color:var(--grafite-suave); margin-bottom:10px">${esc(nomeEstrutura(reg.estruturaId))} · ${esc(nomeEtapa(reg.etapaId))} · <strong style="color:var(--grafite)">${esc(nomeEmpresa(reg.empresaId))}</strong></p>

function efetivoLinhasBrutas(){
  const linhas = [];
  DB.registros.forEach(r=>{
    (r.efetivoDiario||[]).forEach(e=>{
      if(!e.itens || !e.itens.length) return;
      linhas.push({ reg:r, data:e.data, entrada:e, total: e.itens.reduce((s,i)=>s+(i.quantidade||0),0) });
    });
  });
  return linhas;
}
function totalEfetivoPorDia(){
  const porDia = {};
  let regsFiltrados = DB.registros;
  if(state.efFiltroProjeto!=='all') regsFiltrados = regsFiltrados.filter(r=>r.projetoId===state.efFiltroProjeto);
  if(state.efFiltroEmpresa!=='all') regsFiltrados = regsFiltrados.filter(r=>r.empresaId===state.efFiltroEmpresa);
  regsFiltrados.forEach(r=>{
    (r.efetivoDiario||[]).forEach(e=>{
      if(!e.itens || !e.itens.length) return;
      if(state.efFiltroDataDe && e.data < state.efFiltroDataDe) return;
      if(state.efFiltroDataAte && e.data > state.efFiltroDataAte) return;
      const tot = e.itens.reduce((s,i)=>s+(i.quantidade||0),0);
      if(tot<=0) return;
      porDia[e.data] = (porDia[e.data]||0) + tot;
    });
  });
  efetivoGeralLista().forEach(g=>{
    if(!g.data || !g.quantidade) return;
    porDia[g.data] = (porDia[g.data]||0) + g.quantidade;
  });
  return porDia;
}
function renderEfetivoGraficoHtml(){

    entries = Object.entries(porDiaMap).sort((a,b)=>a[0].localeCompare(b[0]));
  } else {
    const porMes = {};
    Object.entries(porDiaMap).forEach(([data,total])=>{
      const mes = data.slice(0,7);
      porMes[mes] = (porMes[mes]||0) + total;
    });
    entries = Object.entries(porMes).sort((a,b)=>a[0].localeCompare(b[0]));
  }

  const bars = entries.map(([k,v])=>{

    return `<div class="daybar"><div class="val">${v}</div><div class="col" style="height:${Math.max((v/maxV)*100,3)}px"></div><div class="dlabel">${esc(label)}</div></div>`;

function importarEfetivoGeralExcel(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array', cellDates:true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const linhas = XLSX.utils.sheet_to_json(ws, { defval:'' });
      let importados = 0, ignorados = 0;
      linhas.forEach(l=>{
        const nomeCol = (obj, ...chaves) => { for(const c of chaves){ if(obj[c]!==undefined && obj[c]!=='') return obj[c]; } return null; };
        const dataRaw = nomeCol(l, 'Data','data','DATA');
        const projetoNome = nomeCol(l, 'Projeto','projeto','PROJETO');
        const empresaNome = nomeCol(l, 'Empresa','empresa','EMPRESA');
        const profissional = nomeCol(l, 'Profissional','profissional','Função','função');
        const quantidade = parseInt(nomeCol(l, 'Quantidade','quantidade','QUANTIDADE'), 10);
        const obs = nomeCol(l, 'Observação','Observacao','observação','obs');
        let dataStr = null;
        if(dataRaw instanceof Date){ dataStr = dataRaw.toISOString().slice(0,10); }
        else if(typeof dataRaw === 'string'){
          const m1 = dataRaw.match(/^(\d{4})-(\d{2})-(\d{2})/);
          const m2 = dataRaw.match(/^(\d{2})\/(\d{2})\/(\d{2,4})/);
          if(m1) dataStr = `${m1[1]}-${m1[2]}-${m1[3]}`;
          else if(m2) dataStr = `${m2[3].length===2?'20'+m2[3]:m2[3]}-${m2[2]}-${m2[1]}`;
        }
        const projeto = projetoNome ? DB.projetos.find(p=>p.nome.toLowerCase()===String(projetoNome).toLowerCase().trim()) : null;
        const empresa = empresaNome ? DB.empresas.find(e=>e.nome.toLowerCase()===String(empresaNome).toLowerCase().trim()) : null;
        if(!dataStr || !projeto || !quantidade || quantidade<=0){ ignorados++; return; }
        DB.efetivoGeral.push({
          id: uid(), data: dataStr, projetoId: projeto.id, empresaId: empresa ? empresa.id : null,
          profissional: profissional ? String(profissional).trim() : null, quantidade, obs: obs ? String(obs).trim() : null, createdAt: Date.now(),
        });
        importados++;
      });
      if(importados) persist.efetivoGeral();
      showToast(`${importados} lançamento(s) importado(s)${ignorados ? `, ${ignorados} ignorado(s) (projeto/data/quantidade inválidos)` : ''}.`);
      render();
    } catch(err){
      showToast('Não foi possível ler essa planilha. Confira o formato (Data, Projeto, Empresa, Profissional, Quantidade).');
    }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function consistenciaEfetivo(){
  const apontadoTotal = {};
  const apontadoDetalhe = {};
  DB.registros.forEach(r=>{
    (r.efetivoDiario||[]).forEach(e=>{
      (e.itens||[]).forEach(it=>{
        if(!it.quantidade) return;
        const keyD = `${r.empresaId}|${e.data}`;
        const keyP = `${r.empresaId}|${e.data}|${(it.nome||'').toLowerCase().trim()}`;
        apontadoTotal[keyD] = (apontadoTotal[keyD]||0) + it.quantidade;
        apontadoDetalhe[keyP] = (apontadoDetalhe[keyP]||0) + it.quantidade;
      });
    });
  });
  const informadoTotal = {};
  const informadoDetalhe = {};
  DB.efetivoGeral.forEach(g=>{
    if(!g.empresaId || !g.quantidade) return;
    const keyD = `${g.empresaId}|${g.data}`;
    informadoTotal[keyD] = (informadoTotal[keyD]||0) + g.quantidade;
    if(g.profissional){
      const keyP = `${g.empresaId}|${g.data}|${g.profissional.toLowerCase().trim()}`;
      informadoDetalhe[keyP] = (informadoDetalhe[keyP]||0) + g.quantidade;
    }
  });
  const chaves = new Set([...Object.keys(apontadoTotal), ...Object.keys(informadoTotal)]);
  const divergencias = [];
  chaves.forEach(keyD=>{
    const informado = informadoTotal[keyD];
    if(informado==null) return; // sem efetivo geral cadastrado pra essa empresa/dia -> nada a cruzar
    const apontado = apontadoTotal[keyD]||0;
    if(apontado === informado) return;
    const [empresaId, data] = keyD.split('|');
    // detalhe por função, quando dá pra cruzar (função aparece nos dois lados)
    const funcoes = new Set();
    Object.keys(apontadoDetalhe).forEach(k=>{ if(k.startsWith(keyD+'|')) funcoes.add(k.slice(keyD.length+1)); });
    Object.keys(informadoDetalhe).forEach(k=>{ if(k.startsWith(keyD+'|')) funcoes.add(k.slice(keyD.length+1)); });
    const porFuncao = [...funcoes].map(fn=>({
      funcao: fn, apontado: apontadoDetalhe[`${keyD}|${fn}`]||0, informado: informadoDetalhe[`${keyD}|${fn}`]||null,
    })).filter(f=>f.informado!=null && f.apontado!==f.informado);
    divergencias.push({ empresaId, data, apontado, informado, diff: apontado-informado, porFuncao });
  });
  divergencias.sort((a,b)=> b.data.localeCompare(a.data));
  return divergencias;
}
function renderConsistenciaEfetivoHtml(){
  const divergencias = consistenciaEfetivo();
  if(!divergencias.length){
    return `<div class="card">
      <h3>Consistência do efetivo <span class="chip verde">✓ tudo bate</span></h3>
      <p style="font-size:12.5px; color:var(--grafite-suave); margin:0">O efetivo apontado nas frentes bate com o efetivo geral informado por empresa/dia, sempre que os dois estão cadastrados. Lance o efetivo geral (abaixo) por empresa pra ativar essa checagem.</p>
    </div>`;
  }
  const rows = divergencias.map(d=>{
    const sobrando = d.diff > 0;
    const detalheFuncoes = d.porFuncao.length ? `<div style="font-size:11.5px; color:var(--grafite-suave); margin-top:4px;">${d.porFuncao.map(f=>`${esc(f.funcao)}: apontado ${f.apontado} × informado ${f.informado}`).join(' · ')}</div>` : '';
    return `<tr>
      <td class="mono">${fmtData(d.data+'T12:00:00')}</td>
      <td>${esc(nomeEmpresa(d.empresaId))}</td>
      <td class="num">${d.apontado}</td>
      <td class="num">${d.informado}</td>
      <td><span class="chip ${sobrando?'vermelho':'amarelo'}">${sobrando?'+':''}${d.diff} ${sobrando?'apontado a mais':'apontado a menos'}</span>${detalheFuncoes}</td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <h3>Consistência do efetivo <span class="chip vermelho">⚠ ${divergencias.length} divergência(s)</span></h3>
    <p style="font-size:12.5px; color:var(--grafite-suave); margin:-2px 0 12px 0">Cruza o efetivo apontado nas frentes (Apontar) com o efetivo geral informado por empresa/dia. Quando o apontado é maior que o informado, alguém foi contado em mais de uma frente no mesmo dia — sinal de erro de lançamento.</p>
    <table><thead><tr><th>Data</th><th>Empresa</th><th>Apontado nas frentes</th><th>Efetivo geral informado</th><th>Diferença</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function exportarEfetivoCSV(){
  const linhas = [['Data','Projeto','Frente','Estrutura','Etapa','Empresa','Profissional','Quantidade','Início do dia','Fim do dia']];
  efetivoLinhasBrutas().forEach(l=>{
    const r = l.reg;
    l.entrada.itens.forEach(it=>{
      linhas.push([l.data, nomeProjeto(r.projetoId), regFrenteLabel(r), nomeEstrutura(r.estruturaId), nomeEtapa(r.etapaId), nomeEmpresa(r.empresaId), it.nome, it.quantidade, l.entrada.horaInicio||'', l.entrada.horaFim||'']);
    });
  });
  const csv = linhas.map(linha => linha.map(campo => {
    const s = String(campo??'');
    return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `frente-livre-efetivo-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV de efetivo exportado.');
}
window.exportarEfetivoCSV = exportarEfetivoCSV;

function trechoOptionsGlobal(projetoId, selId){
  return DB.estacas.filter(e=>e.projetoId===projetoId).sort((a,b)=>(a.trecho||'').localeCompare(b.trecho||'', undefined, {numeric:true})).map(e=>`<option value="${e.id}" ${e.id===selId?'selected':''}>${esc(e.trecho||nomeTrecho(e.id))} (${esc(e.estacaInicio)}–${esc(e.estacaTermino)})</option>`).join('');
}
window.trechoOptionsGlobal = trechoOptionsGlobal;
function submitRegistro(ev){
  ev.preventDefault();
  const f = ev.target;
  const projetoId = f.projetoId.value;
  const trechoId = f.trechoId.value;
  const faixaInicio = f.faixaInicio.value.trim().toUpperCase();
  const faixaFim = f.faixaFim.value.trim().toUpperCase();
  const estruturaId = f.estruturaId.value;
  const etapaId = f.etapaId.value;
  const empresaId = f.empresaId.value;
  const liberacao = f.liberacao.value;
  const inicio = f.inicio.value;
  const termino = f.termino.value;
  if(!projetoId || !trechoId || !faixaInicio || !faixaFim || !estruturaId || !etapaId || !empresaId || !liberacao){
    showToast('Preencha todos os campos obrigatórios.');
    return false;
  }
  if(inicio && new Date(inicio) < new Date(liberacao)){ showToast('O início não pode ser antes da liberação.'); return false; }
  if(termino && !inicio){ showToast('Preencha o início antes do término.'); return false; }
  if(termino && new Date(termino) < new Date(inicio)){ showToast('O término não pode ser antes do início.'); return false; }
  DB.registros.push({ id: uid(), projetoId, trechoId, faixaInicio, faixaFim, estruturaId, etapaId, empresaId, liberacao, inicio: inicio||null, termino: termino||null, pausas:[], pausadoDesde:null, recursos:[], efetivoDiario:[], quantidadeExecutada:null, unidadeExecutada:null, elementoId:null, obs: f.obs.value.trim(), createdAt: Date.now() });
  persist.registros();
  showToast('Lançamento registrado.');
  f.reset(); render();
  return false;
}
window.submitRegistro = submitRegistro;
function updateInicio(id, value){
  const reg = DB.registros.find(r=>r.id===id);
  if(value && new Date(value) < new Date(reg.liberacao)){ showToast('O início não pode ser antes da liberação.'); render(); return; }
  reg.inicio = value || null;
  if(!reg.inicio) reg.termino = null;
  persist.registros();
  render();
}
window.updateInicio = updateInicio;
function updateTermino(id, value){
  const reg = DB.registros.find(r=>r.id===id);
  if(value && reg.inicio && new Date(value) < new Date(reg.inicio)){ showToast('O término não pode ser antes do início.'); render(); return; }
  reg.termino = value || null;
  persist.registros();
  render();
}

  const r = DB.registros.find(x=>x.id===id);
  const projetoId = document.getElementById(`edit-reg-projeto-${id}`).value;
  const trechoId = document.getElementById(`edit-reg-trecho-${id}`).value;
  const faixaInicio = document.getElementById(`edit-reg-faixaIni-${id}`).value.trim().toUpperCase();
  const faixaFim = document.getElementById(`edit-reg-faixaFim-${id}`).value.trim().toUpperCase();
  const estruturaId = document.getElementById(`edit-reg-estrutura-${id}`).value;
  const etapaId = document.getElementById(`edit-reg-etapa-${id}`).value;
  const empresaId = document.getElementById(`edit-reg-empresa-${id}`).value;
  if(!projetoId || !trechoId || !faixaInicio || !faixaFim || !estruturaId || !etapaId || !empresaId){
    showToast('Preencha todos os campos.');
    return;
  }
  r.projetoId=projetoId; r.trechoId=trechoId; r.faixaInicio=faixaInicio; r.faixaFim=faixaFim; r.estruturaId=estruturaId; r.etapaId=etapaId; r.empresaId=empresaId;
  persist.registros();
  state.editRegId = null;
  showToast('Registro atualizado.');
  render();
}
window.salvarEdicaoRegistro = salvarEdicaoRegistro;
function deleteRegistro(id){
  DB.registros = DB.registros.filter(r=>r.id!==id);
  persist.registros(); render();
}
window.deleteRegistro = deleteRegistro;

        <p style="font-size:14px; line-height:1.6;">Este arquivo está pronto pra funcionar como site, mas falta colar as credenciais do seu projeto Firebase.</p>
      </div>`;
    return;
  }
  await loadAll();
  render();
})();
</script>
