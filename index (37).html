<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AH Brant — Frente Livre · Indicadores de Produtividade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --preto:#161311; --preto2:#141110; --fundo:#F1EFED; --papel:#FFFFFF;
    --vinho:#96110D; --vinho-escuro:#6E0C09;
    --verde:#3D8361; --verde-bg:#E4F1E9;
    --vermelho:#D64545; --vermelho-bg:#FBE6E3;
    --amarelo:#C97A1A; --amarelo-bg:#FBEEDD;
    --azul:#3D6A8B; --azul-bg:#E4EDF3;
    --roxo:#6B4C9A; --roxo-bg:#EBE5F3;
    --grafite:#211D1C; --grafite-suave:#655D5A; --linha-grade:#DCD8D5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'IBM Plex Sans', sans-serif; background:var(--fundo); color:var(--grafite);
    background-image: linear-gradient(var(--linha-grade) 1px, transparent 1px), linear-gradient(90deg, var(--linha-grade) 1px, transparent 1px);
    background-size: 28px 28px; }
  h1,h2,h3,h4{ font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.03em; margin:0; color:var(--preto2); }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  #shell{ display:flex; min-height:100vh; }

  #sidebar{ width:230px; flex-shrink:0; background:var(--preto);
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 28px);
    color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  #brand{ padding:20px 20px 16px 20px; border-bottom:1px solid rgba(255,255,255,0.12); }
  #brand img{ width:100%; max-width:196px; display:block; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.35); }
  #brand .mark{ font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; letter-spacing:0.05em; color:#fff; display:flex; align-items:center; gap:7px; margin-top:12px; }
  #brand .sub{ font-size:11px; color:#B9B2AE; margin-top:4px; letter-spacing:0.03em; line-height:1.4; }
  nav{ padding:14px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
  nav button{ all:unset; cursor:pointer; display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:4px;
    font-family:'Oswald', sans-serif; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:#C9C4C1; transition:background .15s, color .15s; }
  nav button svg{ flex-shrink:0; opacity:0.85; }
  nav button:hover{ background:rgba(255,255,255,0.07); color:#fff; }
  nav button.active{ background:var(--vinho); color:#fff; }
  #sidebar-foot{ margin-top:auto; padding:16px 20px; font-size:10.5px; color:#8C8480; border-top:1px solid rgba(255,255,255,0.12); line-height:1.5; }

  #main{ flex:1; min-width:0; padding:32px 40px 60px 40px; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .topbar h2{ font-size:26px; }
  .topbar p.desc{ color:var(--grafite-suave); font-size:13.5px; margin-top:4px; max-width:560px; }

  .card{ background:var(--papel); border:1px solid var(--linha-grade); border-radius:6px; padding:20px 22px; margin-bottom:18px; box-shadow:0 1px 2px rgba(11,30,51,0.04); }
  .card h3{ font-size:16px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .card h3 .tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:11px; color:var(--grafite-suave); font-weight:400; }
  .relatorio-header{ display:flex; align-items:center; gap:14px; }
  .empresa-tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; background:var(--roxo-bg); color:var(--roxo); }
  .estrutura-tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; background:var(--azul-bg); color:var(--azul); }
  .projeto-tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; background:var(--amarelo-bg); color:var(--amarelo); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .grid4{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; }
  @media (max-width:900px){ .grid2,.grid3,.grid4{ grid-template-columns:1fr; } }

  label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--grafite-suave); margin-bottom:5px; font-weight:600; }
  input, select, textarea{ width:100%; padding:9px 10px; border:1px solid var(--linha-grade); border-radius:4px; font-size:13.5px;
    font-family:'IBM Plex Sans',sans-serif; background:#fff; color:var(--grafite); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--vinho); outline-offset:1px; border-color:var(--vinho); }
  input:disabled, select:disabled{ background:var(--fundo); color:var(--grafite-suave); }
  .field{ margin-bottom:12px; }
  .btn{ all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px; background:var(--vinho); color:#fff; padding:10px 18px;
    border-radius:4px; font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.05em; text-transform:uppercase; transition:background .15s; }
  .btn:hover{ background:var(--vinho-escuro); }
  .btn:focus-visible{ outline:2px solid var(--preto2); outline-offset:2px; }
  .btn.secondary{ background:var(--preto); }
  .btn.secondary:hover{ background:var(--preto2); }
  .btn.small{ padding:7px 12px; font-size:11.5px; }
  .btn.ghost{ background:transparent; color:var(--grafite-suave); border:1px solid var(--linha-grade); }
  .btn.ghost:hover{ background:var(--fundo); color:var(--grafite); }
  .btn[disabled]{ opacity:.4; cursor:default; pointer-events:none; }
  .icon-btn{ all:unset; cursor:pointer; color:var(--grafite-suave); padding:4px 6px; border-radius:4px; }
  .icon-btn:hover{ background:var(--vermelho-bg); color:var(--vermelho); }
  .icon-btn.up:hover, .icon-btn.down:hover{ background:var(--azul-bg); color:var(--azul); }
  .icon-btn.edit:hover{ background:var(--azul-bg); color:var(--azul); }
  .edit-row-box{ background:var(--azul-bg); border:1px solid var(--azul); border-radius:6px; padding:14px; }
  .inline-edit{ display:inline-flex; align-items:center; gap:6px; }
  .inline-edit input{ padding:4px 8px; font-size:13px; max-width:180px; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-family:'Oswald',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--grafite-suave);
    padding:8px 8px; border-bottom:2px solid var(--linha-grade); }
  td{ padding:9px 8px; border-bottom:1px solid var(--linha-grade); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .num{ font-family:'IBM Plex Mono',monospace; text-align:right; }

  .empty{ text-align:center; padding:44px 20px; color:var(--grafite-suave); }
  .empty .big{ font-family:'Oswald',sans-serif; font-size:16px; color:var(--preto2); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em; }

  .chip{ display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
  .chip.verde{ background:var(--verde-bg); color:var(--verde); }
  .chip.amarelo{ background:var(--amarelo-bg); color:var(--amarelo); }
  .chip.vermelho{ background:var(--vermelho-bg); color:var(--vermelho); }
  .chip.azul{ background:var(--azul-bg); color:var(--azul); }
  .chip.roxo{ background:var(--roxo-bg); color:var(--roxo); }
  .chip.pulse{ position:relative; }
  .chip.pulse::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:6px; animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .kpi-row{ display:flex; gap:22px; margin-bottom:6px; flex-wrap:wrap; }
  .kpi{ min-width:160px; }
  .kpi .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--grafite-suave); margin-bottom:4px; }
  .kpi .value{ font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--preto2); font-weight:600; }

  .idle-row{ margin-bottom:16px; }
  .idle-row .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; gap:10px; flex-wrap:wrap; }
  .idle-row .head .name{ font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.02em; text-transform:uppercase; color:var(--grafite); }
  .idle-row .head .meta{ font-size:11.5px; color:var(--grafite-suave); font-family:'IBM Plex Mono',monospace; }
  .bar-track{ position:relative; height:22px; background:repeating-linear-gradient(90deg, #E3E1DE 0 1px, #F6F5F3 1px 10px, #F6F5F3 10px 50px);
    border:1px solid var(--linha-grade); border-radius:3px; overflow:hidden; }
  .bar-fill{ position:absolute; top:0; left:0; bottom:0; border-radius:2px 0 0 2px; transition:width .3s; min-width:2px; }
  .bar-fill.verde{ background:linear-gradient(180deg, #4C9975, var(--verde)); }
  .bar-fill.amarelo{ background:linear-gradient(180deg, #D98A2C, var(--amarelo)); }
  .bar-fill.vermelho{ background:linear-gradient(180deg, #D14A3B, var(--vermelho)); }
  .bar-fill.azul{ background:linear-gradient(180deg, #5786A6, var(--azul)); }
  .bar-fill.roxo{ background:linear-gradient(180deg, #8367AC, var(--roxo)); }

  .rank-row{ display:grid; grid-template-columns:170px 1fr 230px; align-items:center; gap:10px; margin-bottom:10px; }
  .rank-row .label{ font-size:12.5px; color:var(--grafite); font-family:'Oswald',sans-serif; letter-spacing:0.02em; text-transform:uppercase; }
  .rank-row .val{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:right; color:var(--grafite-suave); }

  .daybars{ display:flex; align-items:flex-end; gap:10px; height:140px; padding:10px 4px 0 4px; overflow-x:auto; }
  .daybar{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:38px; }
  .daybar .col{ width:22px; border-radius:3px 3px 0 0; background:linear-gradient(180deg, #C0433B, var(--vinho)); min-height:3px; }
  .daybar .val{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafite-suave); }
  .daybar .dlabel{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafite-suave); }

  .toast{ position:fixed; bottom:22px; right:22px; background:var(--preto2); color:#fff; padding:12px 18px; border-radius:5px; font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,0.2); opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:none; z-index:999; }
  .toast.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .loading-screen{ display:flex; align-items:center; justify-content:center; height:100vh; width:100%; font-family:'Oswald',sans-serif;
    color:var(--grafite-suave); letter-spacing:0.05em; text-transform:uppercase; font-size:13px; }

  .tap-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .tap-card{ all:unset; cursor:pointer; box-sizing:border-box; display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    gap:3px; min-height:64px; padding:14px 16px; border:1.5px solid var(--linha-grade); border-radius:8px; background:#fff;
    transition:border-color .15s, background .15s, transform .1s; position:relative; }
  .tap-card:active{ transform:scale(0.97); }
  .tap-card:hover{ border-color:var(--vinho); background:#FBF4F3; }
  .tap-card.wait{ border-color:var(--vermelho); background:var(--vermelho-bg); align-items:flex-start; }
  .tap-card.exec{ border-color:var(--roxo); background:var(--roxo-bg); align-items:flex-start; }
  .tap-card.opening{ border-color:var(--azul); background:var(--azul-bg); align-items:flex-start; }
  .tap-card.sugerida{ border-color:var(--verde); }
  .tap-card-num{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--grafite-suave); }
  .tap-card-title{ font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:0.02em; text-transform:uppercase; color:var(--grafite); }
  .tap-card-sub{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--grafite-suave); }
  .menu-card{ position:relative; }
  .menu-card .count{ position:absolute; top:10px; right:10px; background:var(--vinho); color:#fff; font-family:'IBM Plex Mono',monospace;
    font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600; }

  .estaca-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .estaca-chip{ all:unset; cursor:pointer; box-sizing:border-box; min-width:64px; text-align:center; padding:12px 10px;
    border:1.5px solid var(--linha-grade); border-radius:8px; background:#fff; font-family:'IBM Plex Mono',monospace;
    font-size:13px; color:var(--grafite); transition:all .12s; }
  .estaca-chip:active{ transform:scale(0.95); }
  .estaca-chip:hover{ border-color:var(--vinho); }
  .estaca-chip.selected{ background:var(--vermelho-bg); border-color:var(--vinho); color:var(--vinho-escuro); }
  .estaca-chip.edge{ background:var(--vinho); border-color:var(--vinho); color:#fff; font-weight:600; }

  .stepper-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--linha-grade); border-radius:8px; background:#fff; margin-bottom:8px; }
  .stepper-row .nome{ font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.02em; }
  .stepper-controls{ display:flex; align-items:center; gap:10px; }
  .stepper-controls .qtd{ min-width:22px; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; }

  .grupo-recolhivel{ border:1px solid var(--linha-grade); border-radius:8px; margin-bottom:8px; overflow:hidden; }
  .grupo-recolhivel summary{ cursor:pointer; padding:10px 14px; font-family:'Oswald',sans-serif; font-size:12.5px; text-transform:uppercase; letter-spacing:0.03em; background:#FBFBFA; list-style:none; display:flex; justify-content:space-between; align-items:center; }
  .grupo-recolhivel summary::-webkit-details-marker{ display:none; }
  .grupo-recolhivel summary::after{ content:'▾'; color:var(--grafite-suave); transition:transform .15s; font-size:11px; }
  .grupo-recolhivel[open] summary::after{ transform:rotate(180deg); }
  .grupo-recolhivel summary .tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; color:var(--grafite-suave); font-size:11px; }
  .lista-compacta{ padding:4px; }
  .lista-item{ all:unset; box-sizing:border-box; cursor:pointer; display:flex; justify-content:space-between; align-items:center; width:100%;
    padding:9px 10px; border-radius:5px; font-size:13px; }
  .lista-item:hover{ background:var(--vermelho-bg); }
  .lista-item:active{ transform:scale(0.99); }
  .lista-item .info{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--grafite-suave); }
  .lista-item .add{ color:var(--vinho); font-weight:700; font-size:15px; margin-left:8px; }

  .board{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  @media (max-width:900px){ .board{ grid-template-columns:1fr; } }
  .board-col{ border:1.5px solid var(--linha-grade); border-radius:8px; overflow:hidden; background:#FBFBFA; display:flex; flex-direction:column; }
  .board-col-head{ padding:11px 14px; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.03em; text-transform:uppercase;
    display:flex; justify-content:space-between; align-items:center; color:#fff; }
  .board-col-head .n{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; }
  .board-col.vermelho .board-col-head{ background:var(--vermelho); }
  .board-col.roxo .board-col-head{ background:var(--roxo); }
  .board-col.verde .board-col-head{ background:var(--verde); }
  .board-col-body{ padding:10px; display:flex; flex-direction:column; gap:7px; max-height:340px; overflow-y:auto; }
  .board-item{ background:#fff; border:1px solid var(--linha-grade); border-radius:6px; padding:8px 10px; }
  .board-item .t{ font-family:'Oswald',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:0.02em; color:var(--grafite); }
  .board-item .s{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--grafite-suave); margin-top:2px; }
  .board-empty{ padding:16px 10px; text-align:center; font-size:11.5px; color:var(--grafite-suave); }

  @media print{
    #sidebar, .no-print, .toast{ display:none !important; }
    body{ background:#fff; } #shell{ display:block; } #main{ padding:0; }
    .card{ box-shadow:none; border:1px solid #ccc; break-inside:avoid; }
    .bar-track, .bar-fill, .chip{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    @page{ size:landscape; margin:12mm; }
    table{ display:table !important; width:100% !important; table-layout:auto; overflow:visible !important; font-size:10px; }
    th, td{ padding:4px 5px; white-space:normal !important; word-break:break-word; }
    #diario-print table, #relatorio-print table{ font-size:9.5px; }
  }
  @media (max-width:760px){
    #shell{ flex-direction:column; }
    #sidebar{ width:100%; height:auto; position:sticky; top:0; z-index:50; flex-direction:row; align-items:center; }
    #brand{ display:none; }
    nav{ flex-direction:row; padding:8px 6px; gap:4px; overflow-x:auto; flex:1; }
    nav button{ flex-direction:column; gap:3px; font-size:8.5px; padding:7px 7px; white-space:nowrap; }
    nav button svg{ width:16px; height:16px; }
    #sidebar-foot{ display:none; }
    #main{ padding:16px 14px 40px 14px; }
    .topbar{ flex-direction:column; align-items:flex-start; }
    .topbar h2{ font-size:21px; }
    .card{ padding:16px 14px; }
    .tap-grid{ grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); }
    .kpi-row{ gap:14px; } .kpi{ min-width:44%; }
    .rank-row{ grid-template-columns:1fr; gap:4px; margin-bottom:16px; }
    table{ display:block; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; }
    [style*="min-width:160px"], [style*="min-width:190px"], [style*="min-width:200px"], [style*="min-width:220px"]{ min-width:0 !important; width:100% !important; }
    .board{ grid-template-columns:1fr; }
    input, select, textarea{ font-size:16px; }
    .btn{ padding:10px 14px; }
    [style*="grid-template-columns:28px 1fr 90px 80px auto"]{ grid-template-columns:1fr 1fr !important; row-gap:4px !important; }
  }
</style>
</head>
<body>
<div id="shell">

async function loadKey(key, fallback){
  if(!db) return fallback;
  try{
    const doc = await db.collection('frente_livre_dados').doc(key).get();
    if(doc.exists && doc.data().value) return JSON.parse(doc.data().value);
    return fallback;
  } catch(e){ return fallback; }
}
async function saveKey(key, value){
  if(!db) return;
  try{ await db.collection('frente_livre_dados').doc(key).set({ value: JSON.stringify(value) }); }
  catch(e){ showToast('Não foi possível salvar. Verifique a conexão.'); }
}

function idleHours(reg){
  const start = new Date(reg.liberacao).getTime();
  const end = reg.inicio ? new Date(reg.inicio).getTime() : Date.now();
  if(isNaN(start)) return 0;
  return Math.max(0, (end - start) / 3600000);
}
function execHours(reg){
  if(!reg.inicio) return null;
  // se o dia a dia foi apontado com hora de início/fim (fechamento do dia), soma essas janelas —
  // muito mais preciso que início->término corrido, que contaria a madrugada como trabalho.
  const janelasDiarias = (reg.efetivoDiario||[]).filter(e=>e.horaInicio && e.horaFim);
  if(janelasDiarias.length){
    return janelasDiarias.reduce((s,e)=>{
      const ini = new Date(`${e.data}T${e.horaInicio}`).getTime();
      const fim = new Date(`${e.data}T${e.horaFim}`).getTime();
      if(isNaN(ini) || isNaN(fim)) return s;
      return s + Math.max(0, (fim-ini)/3600000);
    }, 0);
  }
  const start = new Date(reg.inicio).getTime();
  const end = reg.termino ? new Date(reg.termino).getTime() : Date.now();
  if(isNaN(start)) return null;
  let pausadoMs = (reg.pausas||[]).reduce((s,p)=> s + Math.max(0, new Date(p.fim).getTime() - new Date(p.inicio).getTime()), 0);
  if(reg.pausadoDesde && !reg.termino) pausadoMs += Math.max(0, Date.now() - new Date(reg.pausadoDesde).getTime());
  return Math.max(0, (end - start - pausadoMs) / 3600000);
}
function custoRecursosRegistro(reg){
  // qualquer empresa pode ter recursos alocados aqui, mas só os da AHBT têm custo/h > 0
  // (forçado a 0 na hora do cadastro pras demais, que trabalham por pacote fechado)
  const h = execHours(reg);
  if(h===null) return 0;
  return (reg.recursos||[]).reduce((s,a)=>{
    const rec = DB.recursos.find(x=>x.id===a.recursoId);
    if(!rec) return s;
    return s + (rec.custoHora||0) * a.quantidade * h;
  }, 0);
}
function fmtMoeda(v){ return (v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
function fmtHoras(h){
  if(h < 1) return Math.round(h*60) + 'min';
  const inteiro = Math.floor(h);
  const min = Math.round((h-inteiro)*60);
  return min>0 ? `${inteiro}h${min.toString().padStart(2,'0')}` : `${inteiro}h`;
}
function fmtHorasDias(h){
  if(h < 24) return fmtHoras(h);
  const dias = Math.floor(h/24);
  const horasResto = h - dias*24;
  const horasArred = Math.round(horasResto);
  return horasArred>0 ? `${dias}d ${horasArred}h` : `${dias}d`;
}
function severidade(h){

  return 'vermelho';
}

  if(el.eixoInicioId){
    const ini = DB.estacas.find(x=>x.id===el.eixoInicioId);
    const fim = DB.estacas.find(x=>x.id===el.eixoFimId);
    if(ini) partes.push(fim && fim.id!==ini.id ? `Eixo ${ini.trecho} a ${fim.trecho}` : `Eixo ${ini.trecho}`);
  }
  return partes.length ? partes.join(' · ') : '—';
}
function compararCodigoNatural(a, b){
  const re = /(\d+|\D+)/g;
  const pa = String(a).match(re) || [];
  const pb = String(b).match(re) || [];
  const len = Math.max(pa.length, pb.length);
  for(let i=0;i<len;i++){
    const xa = pa[i] ?? '';
    const xb = pb[i] ?? '';
    const na = /^\d+$/.test(xa) ? parseInt(xa,10) : null;
    const nb = /^\d+$/.test(xb) ? parseInt(xb,10) : null;
    if(na!==null && nb!==null){
      if(na!==nb) return na-nb;
    } else {
      const cmp = xa.localeCompare(xb, 'pt-BR', {sensitivity:'base'});
      if(cmp!==0) return cmp;
    }
  }
  return 0;
}
function ordenarElementosPorCodigo(lista){
  return [...lista].sort((a,b)=>compararCodigoNatural(a.codigo, b.codigo));
}
function elementoGrupoKey(el){
  if(el.eixoInicioId) return `eixo:${el.eixoInicioId}:${el.eixoFimId}`;
  if(el.trechoId && el.faixaInicio!=null) return `trecho:${el.trechoId}:${el.faixaInicio}:${el.faixaFim}`;
  return 'sem-local';
}
function elementoGrupoLabel(el){
  if(el.eixoInicioId){
    const ini = DB.estacas.find(x=>x.id===el.eixoInicioId);
    const fim = DB.estacas.find(x=>x.id===el.eixoFimId);
    if(ini) return fim && fim.id!==ini.id ? `Eixo ${ini.trecho} a ${fim.trecho}` : `Eixo ${ini.trecho}`;
  }
  if(el.trechoId && el.faixaInicio!=null){
    return `${trechoNomeCurto(el.trechoId)} · ${faixaLabel(el.faixaInicio, el.faixaFim)}`;
  }
  return 'Sem localização';
}
function regFrenteLabel(r){
  if(r.elementoId){
    const el = DB.elementos.find(x=>x.id===r.elementoId);
    if(el) return `${el.codigo} · ${localizacaoElementoTxt(el)}`;
  }
  return `${trechoNomeCurto(r.trechoId)} · ${faixaLabel(r.faixaInicio, r.faixaFim)}`;
}
function recursosResumo(reg){
  if(!reg.recursos || !reg.recursos.length) return '—';
  return reg.recursos.map(a=>{
    const r = DB.recursos.find(x=>x.id===a.recursoId);
    return r ? `${a.quantidade}×${r.nome}` : null;
  }).filter(Boolean).join(', ') || '—';
}
function efetivoHojeResumo(reg){
  const hoje = hojeStr();
  const entrada = (reg.efetivoDiario||[]).find(e=>e.data===hoje);
  if(!entrada || !entrada.itens.length) return null;
  return entrada.itens.map(i=>`${i.quantidade}×${i.nome}`).join(', ');
}
function indiceRealRegistro(reg){
  if(reg.quantidadeExecutada==null) return null;
  const h = execHours(reg);
  if(!h || h<=0) return null;
  return reg.quantidadeExecutada / h;
}

function parseEstacaVal(str){
  const parts = String(str).trim().split('+');
  const base = parseInt(parts[0], 10) || 0;
  const plus = parts[1] ? parseInt(parts[1], 10) : 0;
  return base + plus/1000;
}
function formatEstacaVal(val){
  const base = Math.floor(val + 1e-9);
  const rem = Math.round((val-base)*1000);
  return rem>0 ? `${base}+${rem}` : `${base}`;
}
function listaEstacasDoTrecho(f){
  const startVal = parseEstacaVal(f.estacaInicio);
  const endVal = parseEstacaVal(f.estacaTermino);
  const list = [];
  if(Math.abs(startVal - Math.floor(startVal)) > 1e-9) list.push(startVal);
  for(let b = Math.ceil(startVal - 1e-9); b <= Math.floor(endVal + 1e-9); b++) list.push(b);
  if(Math.abs(endVal - Math.floor(endVal)) > 1e-9) list.push(endVal);
  return [...new Set(list)].sort((a,b)=>a-b);
}
const METROS_POR_ESTACA = 20;
function distEstacaMetros(str){
  const parts = String(str).trim().split('+');
  const base = parseInt(parts[0], 10) || 0;
  const plus = parts[1] ? parseInt(parts[1], 10) : 0;
  return base*METROS_POR_ESTACA + plus;
}
function comprimentoFrenteMetros(faixaInicio, faixaFim){
  if(faixaInicio==null || faixaFim==null) return 0;
  return Math.abs(distEstacaMetros(faixaFim) - distEstacaMetros(faixaInicio));
}

/* -- seleção de trecho + intervalo de estacas -- */
function renderSeletorTrechoFaixa(tituloPasso, aoConfirmar){
  if(!apontar.trechoId){
    const lista = DB.estacas.filter(f=>f.projetoId===apontar.projetoId && f.tipo!=='eixo').sort((a,b)=>(a.trecho||'').localeCompare(b.trecho||'', undefined, {numeric:true}));

        <span class="tap-card-sub">Estacas ${esc(f.estacaInicio)} – ${esc(f.estacaTermino)}</span>
      </button>
    `).join('');
    return `
      <div class="card">
        <h3>${esc(tituloPasso)} — qual trecho? ${voltarLink('menu')}</h3>
        ${lista.length ? `<div class="tap-grid">${cards}</div>` : `<div class="empty"><div class="big">Nenhum trecho neste projeto</div><p>Cadastre trechos para "${esc(nomeProjeto(apontar.projetoId))}" na aba Trechos.</p></div>`}
      </div>`;
  }
  const trecho = DB.estacas.find(f=>f.id===apontar.trechoId);
  const estacas = listaEstacasDoTrecho(trecho);
  const min = apontar.faixaInicio===null ? null : Math.min(apontar.faixaInicio, apontar.faixaFim);
  const max = apontar.faixaInicio===null ? null : Math.max(apontar.faixaInicio, apontar.faixaFim);
  const chips = estacas.map(val=>{
    const emFaixa = min!==null && val>=min && val<=max;
    const borda = min!==null && (val===min || val===max);
    return `<button class="estaca-chip ${emFaixa?'selected':''} ${borda?'edge':''}" onclick="tapEstaca(${val})">${formatEstacaVal(val)}</button>`;
  }).join('');
  const resumo = min===null
    ? `Toque na primeira estaca da frente.`
    : (min===max
        ? `Frente selecionada: <strong style="color:var(--grafite)">Estaca ${formatEstacaVal(min)}</strong> — toque em outra pra formar um intervalo, ou confirme só esta.`
        : `Frente selecionada: <strong style="color:var(--grafite)">Estacas ${formatEstacaVal(min)} a ${formatEstacaVal(max)}</strong>`);
  return `
    <div class="card">
      <h3>${esc(tituloPasso)} — qual intervalo? <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="apontar.trechoId=null; apontar.faixaInicio=null; apontar.faixaFim=null; render();">◂ trocar trecho</span></h3>
      <p style="font-size:13px; color:var(--grafite-suave); margin:-6px 0 14px 0">Trecho: <strong style="color:var(--grafite)">${esc(trechoLabel(trecho))}</strong></p>
      <div class="estaca-grid">${chips}</div>
      <p style="font-size:13px; margin:16px 0 0 0">${resumo}</p>
      <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap">
        <button class="btn small ghost" ${min===null?'disabled':''} onclick="ajustarFaixaFim(-10)">− 10m</button>
        <button class="btn small ghost" ${min===null?'disabled':''} onclick="ajustarFaixaFim(10)">+ 10m</button>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap">
        <button class="btn" ${min===null?'disabled':''} onclick="${aoConfirmar}">Confirmar intervalo ▸</button>
        ${min!==null ? `<button class="btn ghost" onclick="limparFaixa()">Limpar seleção</button>` : ''}
      </div>
    </div>`;
}
function tapEstaca(val){
  if(apontar.faixaInicio===null){ apontar.faixaInicio = val; apontar.faixaFim = val; }
  else if(apontar.faixaInicio===apontar.faixaFim && val!==apontar.faixaInicio){
    if(val > apontar.faixaInicio) apontar.faixaFim = val;
    else { apontar.faixaFim = apontar.faixaInicio; apontar.faixaInicio = val; }
  } else { apontar.faixaInicio = val; apontar.faixaFim = val; }
  render();
}
window.tapEstaca = tapEstaca;
function limparFaixa(){ apontar.faixaInicio = null; apontar.faixaFim = null; render(); }
window.limparFaixa = limparFaixa;
function ajustarFaixaFim(deltaMetros){
  if(apontar.faixaInicio===null) return;
  const trecho = DB.estacas.find(f=>f.id===apontar.trechoId);
  const minMetros = Math.min(distEstacaMetros(trecho.estacaInicio), distEstacaMetros(trecho.estacaTermino));
  const maxMetros = Math.max(distEstacaMetros(trecho.estacaInicio), distEstacaMetros(trecho.estacaTermino));
  function deslocar(val){
    const metrosAtual = distEstacaMetros(formatEstacaVal(val));
    let novoMetros = metrosAtual + deltaMetros;
    if(novoMetros > maxMetros) novoMetros = maxMetros;
    if(novoMetros < minMetros) novoMetros = minMetros;
    const novaBase = Math.floor(novoMetros / METROS_POR_ESTACA);
    const novoResto = Math.round(novoMetros - novaBase*METROS_POR_ESTACA);
    return novaBase + novoResto/1000;
  }
  if(apontar.faixaInicio === apontar.faixaFim){
    const novoVal = deslocar(apontar.faixaFim);
    apontar.faixaInicio = novoVal; apontar.faixaFim = novoVal;
  } else {
    apontar.faixaFim = deslocar(apontar.faixaFim);
    if(apontar.faixaFim < apontar.faixaInicio){
      const tmp = apontar.faixaInicio; apontar.faixaInicio = apontar.faixaFim; apontar.faixaFim = tmp;
    }
  }
  render();
}
window.ajustarFaixaFim = ajustarFaixaFim;

      const trocarEixoLink = gruposArr.length>1 ? `<span class="tag" style="cursor:pointer; text-decoration:underline" onclick="apontar.elGrupoLocId=null; render();">◂ trocar eixo/trecho</span>` : `<span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarEstrutura()">◂ trocar estrutura</span>`;
      const cards = lista.map(el=>`
        <button class="tap-card" onclick="selecionarElementoLiberar('${el.id}')">
          <span class="tap-card-title">${esc(el.codigo)}</span>
        </button>
      `).join('');
      return `
        <div class="card">
          <h3>3. Qual elemento? ${trocarEixoLink}</h3>
          <p style="font-size:13px; color:var(--grafite-suave); margin:-6px 0 14px 0">${esc(nomeProjeto(apontar.projetoId))} · ${esc(estrutura.nome)} · ${esc(grupoAtual ? grupoAtual.label : '')}</p>
          ${lista.length ? `<div class="tap-grid">${cards}</div>` : `<div class="empty"><div class="big">Nenhum elemento neste eixo/trecho</div></div>`}
        </div>`;
    }
  } else if(!apontar.faixaConfirmada){
    return renderSeletorTrechoFaixa('4', 'confirmarFaixaLiberar()');
  }

  if(estrutura.usaElementos && apontar.elementoId && !apontar.usarLocalizacao){
    const el = DB.elementos.find(x=>x.id===apontar.elementoId);
    const temTrecho = !!(el.trechoId && el.faixaInicio!=null);
    const temEixo = !!el.eixoInicioId;
    if(temTrecho && temEixo){
      return `
        <div class="card">
          <h3>4. Qual localização usar nesta liberação? <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarElemento()">◂ trocar elemento</span></h3>
          <p style="font-size:13px; color:var(--grafite-suave); margin:-6px 0 14px 0">${esc(nomeProjeto(apontar.projetoId))} · ${esc(estrutura.nome)} · ${esc(el.codigo)}</p>
          <p style="font-size:12px; color:var(--grafite-suave); margin-bottom:14px">Essa peça foi cadastrada com trecho e eixo — escolha qual vale pra essa liberação específica.</p>
          <div class="tap-grid">
            <button class="tap-card" onclick="escolherLocalizacaoElemento('trecho')">
              <span class="tap-card-title">Por trecho</span>
              <span class="tap-card-sub">${esc(trechoNomeCurto(el.trechoId))} · ${esc(faixaLabel(el.faixaInicio, el.faixaFim))}</span>
            </button>
            <button class="tap-card" onclick="escolherLocalizacaoElemento('eixo')">
              <span class="tap-card-title">Por eixo</span>
              <span class="tap-card-sub">${(() => { const ini=DB.estacas.find(x=>x.id===el.eixoInicioId); const fim=DB.estacas.find(x=>x.id===el.eixoFimId); return esc(fim && fim.id!==ini.id ? `${ini.trecho} a ${fim.trecho}` : ini.trecho); })()}</span>
            </button>
          </div>
        </div>`;
    } else if(temTrecho || temEixo){
      escolherLocalizacaoElemento(temTrecho ? 'trecho' : 'eixo');
      return renderApontarLiberar();
    } else {
      apontar.usarLocalizacao = 'none';
    }
  }

  const localizacaoTxt = apontar.elementoId
    ? (() => {
        const el = DB.elementos.find(x=>x.id===apontar.elementoId);
        if(apontar.usarLocalizacao==='eixo' && apontar.eixoInicioId){
          const ini = DB.estacas.find(x=>x.id===apontar.eixoInicioId);
          const fim = DB.estacas.find(x=>x.id===apontar.eixoFimId);
          return `${el.codigo} · Eixo ${fim && fim.id!==ini.id ? `${ini.trecho} a ${fim.trecho}` : ini.trecho}`;
        }
        if(apontar.usarLocalizacao==='trecho' && apontar.trechoId){
          return `${el.codigo} · ${trechoNomeCurto(apontar.trechoId)} · ${faixaLabel(formatEstacaVal(apontar.faixaInicio), formatEstacaVal(apontar.faixaFim))}`;
        }
        return el.codigo;
      })()
    : (() => { const min = Math.min(apontar.faixaInicio, apontar.faixaFim), max = Math.max(apontar.faixaInicio, apontar.faixaFim); return faixaLabel(formatEstacaVal(min), formatEstacaVal(max)); })();
  const trocarLocalLink = estrutura.usaElementos
    ? `<span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarElemento()">◂ trocar elemento</span>`
    : `<span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarIntervalo()">◂ trocar intervalo</span>`;

  if(!apontar.etapaId && !apontar.forcarEscolhaEtapa){
    const lista = etapasDoApontar();
    if(lista.length===1){ apontar.etapaId = lista[0].id; }
  }
  if(!apontar.etapaId){
    apontar.forcarEscolhaEtapa = false;
    const lista = etapasDoApontar();
    const cards = lista.map((e,i)=>{
      let orcTxt = e.desc ? esc(e.desc) : '';
      if(e.quantidadeOrcada!=null){
        const executado = DB.registros.filter(r=>r.elementoId===apontar.elementoId && r.etapaId===e.id).reduce((s,r)=>s+(r.quantidadeExecutada||0),0);
        orcTxt = `Orçado: ${e.quantidadeOrcada} ${esc(e.unidadeOrcada||'')} · executado: ${executado} ${esc(e.unidadeOrcada||'')}`;
      }
      return `
      <button class="tap-card" onclick="apontar.etapaId='${e.id}'; apontar.forcarEscolhaEtapa=false; render();">
        <span class="tap-card-num">${i+1}</span>
        <span class="tap-card-title" style="text-transform:none; font-size:13px">${esc(e.name)}</span>
        ${orcTxt ? `<span class="tap-card-sub">${orcTxt}</span>` : ''}
      </button>`;
    }).join('');
    const ondeGerenciar = apontar.elementoId ? `no Elemento "${esc(nomeElemento(apontar.elementoId))}", na aba Elementos` : `nessa estrutura, na aba Etapas`;
    // diagnostico: existe outro elemento com o MESMO codigo (nesta estrutura) que TEM etapas cadastradas? provavel duplicata
    let avisoDuplicataHtml = '';
    if(!lista.length && apontar.elementoId){
      const elAtual = DB.elementos.find(x=>x.id===apontar.elementoId);
      if(elAtual){
        const outrosComMesmoCodigo = DB.elementos.filter(x=>x.id!==elAtual.id && x.estruturaId===elAtual.estruturaId && x.codigo.toLowerCase()===elAtual.codigo.toLowerCase());
        const comEtapas = outrosComMesmoCodigo.filter(x=>etapasDoElemento(x.id).length>0);
        if(comEtapas.length){
          avisoDuplicataHtml = `
            <div class="card" style="border-left:3px solid var(--vermelho); margin-top:14px;">
              <p style="font-size:13px; margin:0 0 10px 0">⚠️ <strong>Encontrei uma duplicata!</strong> Existe outro elemento "${esc(elAtual.codigo)}" (mesma estrutura) que já tem ${etapasDoElemento(comEtapas[0].id).length} etapa(s) cadastrada(s). Provavelmente é esse que você quer usar:</p>
              <button class="btn small" onclick="selecionarElementoLiberar('${comEtapas[0].id}')">Usar esse "${esc(comEtapas[0].codigo)}" em vez do atual</button>
            </div>`;
        }
      }
    }
    return `
      <div class="card">
        <h3>5. Qual etapa? ${trocarLocalLink}</h3>
        <p style="font-size:12.5px; color:var(--grafite-suave); margin:-6px 0 14px 0; font-family:'IBM Plex Mono',monospace;">${breadcrumbApontar(false)}</p>
        ${lista.length ? `<div class="tap-grid">${cards}</div>` : `<div class="empty"><div class="big">Nenhuma etapa cadastrada</div><p>Cadastre etapas ${ondeGerenciar}.</p></div>`}
      </div>
      ${avisoDuplicataHtml}`;
  }

  if(!apontar.empresaId){
    const etapa = DB.etapas.find(e=>e.id===apontar.etapaId);
    if(!etapa){ apontar.etapaId = null; return renderApontarLiberar(); }
    const cards = DB.empresas.map(emp=>`
      <button class="tap-card ${emp.id===etapa.empresaPadraoId?'sugerida':''}" onclick="apontar.empresaId='${emp.id}'; render();">
        <span class="tap-card-title">${esc(emp.nome)}</span>
        ${emp.id===etapa.empresaPadraoId ? `<span class="chip verde">sugerida</span>` : ''}
      </button>
    `).join('');
    return `
      <div class="card">
        <h3>6. Qual empresa vai executar? <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarEtapa()">◂ trocar etapa</span></h3>
        <p style="font-size:12.5px; color:var(--grafite-suave); margin:-6px 0 14px 0; font-family:'IBM Plex Mono',monospace;">${breadcrumbApontar(true)}</p>
        <div class="tap-grid">${cards}</div>
      </div>`;
  }

  const etapa = DB.etapas.find(e=>e.id===apontar.etapaId);
  if(!etapa){ apontar.etapaId = null; return renderApontarLiberar(); }
  return `
    <div class="card">
      <h3>7. Quando foi liberada? <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="apontar.empresaId=null; render();">◂ trocar empresa</span></h3>
      <p style="font-size:12.5px; color:var(--grafite-suave); margin:-6px 0 16px 0; font-family:'IBM Plex Mono',monospace;">${breadcrumbApontar(true)} <span style="color:var(--linha-grade)">›</span> ${esc(nomeEmpresa(apontar.empresaId))}</p>
      <button class="btn" onclick="liberarAgora()">Agora ▸</button>
      <p style="font-size:12px; color:var(--grafite-suave); margin:18px 0 8px 0">Ou lance retroativo, se já foi liberada há um tempo e não deu pra apontar na hora:</p>
      <div class="field"><input type="datetime-local" id="liberar-retro-datetime" max="${nowLocalISO()}"></div>
      <button class="btn secondary" onclick="liberarRetroativo()">Usar esse horário</button>
    </div>`;
}
function selecionarElementoLiberar(elementoId){
  apontar.elementoId = elementoId;
  apontar.usarLocalizacao = null;
  apontar.trechoId = null; apontar.faixaInicio = null; apontar.faixaFim = null;
  apontar.eixoInicioId = null; apontar.eixoFimId = null;
  render();
}
window.selecionarElementoLiberar = selecionarElementoLiberar;
function escolherLocalizacaoElemento(tipo){
  const el = DB.elementos.find(x=>x.id===apontar.elementoId);
  apontar.usarLocalizacao = tipo;
  if(tipo==='trecho'){
    apontar.trechoId = el.trechoId;
    apontar.faixaInicio = parseEstacaVal(el.faixaInicio);
    apontar.faixaFim = parseEstacaVal(el.faixaFim);
    apontar.eixoInicioId = null; apontar.eixoFimId = null;
  } else {
    apontar.eixoInicioId = el.eixoInicioId;
    apontar.eixoFimId = el.eixoFimId;
    apontar.trechoId = null; apontar.faixaInicio = null; apontar.faixaFim = null;
  }
  render();
}
window.escolherLocalizacaoElemento = escolherLocalizacaoElemento;
function confirmarFaixaLiberar(){ if(apontar.faixaInicio===null) return; apontar.faixaConfirmada = true; render(); }
window.confirmarFaixaLiberar = confirmarFaixaLiberar;
function liberarAgora(){ criarRegistro(nowLocalISO()); }
window.liberarAgora = liberarAgora;
function liberarRetroativo(){
  const valor = document.getElementById('liberar-retro-datetime').value;
  if(!valor){ showToast('Escolha um horário.'); return; }
  if(new Date(valor) > new Date()){ showToast('O horário não pode ser no futuro.'); return; }
  criarRegistro(valor);
}
window.liberarRetroativo = liberarRetroativo;
function criarRegistro(liberacaoISO){
  const trechoId = apontar.trechoId;
  const faixaInicio = apontar.faixaInicio!==null ? formatEstacaVal(Math.min(apontar.faixaInicio, apontar.faixaFim)) : null;
  const faixaFim = apontar.faixaInicio!==null ? formatEstacaVal(Math.max(apontar.faixaInicio, apontar.faixaFim)) : null;
  const eixoInicioId = apontar.eixoInicioId || null;
  const eixoFimId = apontar.eixoFimId || null;
  const reg = { id: uid(), projetoId: apontar.projetoId, trechoId, faixaInicio, faixaFim, eixoInicioId, eixoFimId, estruturaId: apontar.estruturaId, etapaId: apontar.etapaId, empresaId: apontar.empresaId,
    liberacao: liberacaoISO, inicio: null, termino: null, pausas: [], pausadoDesde: null, obs: '', recursos: [], efetivoDiario: [], quantidadeExecutada: null, unidadeExecutada: null, elementoId: apontar.elementoId || null, createdAt: Date.now() };
  DB.registros.push(reg);
  persist.registros();
  voltarMenu();
  showToast(`Liberada: ${regFrenteLabel(reg)} — ${nomeEtapa(reg.etapaId)} (${nomeEmpresa(reg.empresaId)})`, 'Desfazer', () => {
    DB.registros = DB.registros.filter(r=>r.id!==reg.id);
    persist.registros();
    render();
  });
}

/* -- MARCAR INÍCIO (com data/hora editável) -- */
function renderApontarIniciar(lista){
  if(apontar.efetivoRegId){ return renderEfetivoStepper(apontar.efetivoRegId, 'iniciar'); }
  if(apontar.alocarRegId){ return renderAlocarRecursos(apontar.alocarRegId); }
  if(!lista.length){
    return `<div class="card"><h3>Marcar início ${voltarLink('menu')}</h3>
      <div class="empty"><div class="big">Nenhuma frente aguardando</div><p>Assim que liberar uma etapa, ela aparece aqui.</p></div></div>`;
  }
  if(apontar.confirmarInicioId){
    const reg = DB.registros.find(r=>r.id===apontar.confirmarInicioId);
    if(!reg || reg.inicio){ apontar.confirmarInicioId = null; }
    else {
      const h = idleHours(reg);
      return `
        <div class="card">
          <h3>Confirmar início <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="apontar.confirmarInicioId=null; render();">◂ voltar</span></h3>
          <p style="font-size:15px; margin-bottom:4px"><strong>${esc(regFrenteLabel(reg))}</strong></p>
          <p style="font-size:13px; color:var(--grafite-suave); margin-bottom:18px"><span class="projeto-tag">${esc(nomeProjeto(reg.projetoId))}</span> ${esc(nomeEstrutura(reg.estruturaId))} · ${esc(nomeEtapa(reg.etapaId))} · ${esc(nomeEmpresa(reg.empresaId))} · aguardando há ${fmtHoras(h)}</p>
          <button class="btn" onclick="iniciarAgora('${reg.id}')">Sim, começou agora</button>
          <p style="font-size:12px; color:var(--grafite-suave); margin:18px 0 8px 0">Ou informe outro horário, se o profissional está apontando em atraso:</p>
          <div class="field"><input type="datetime-local" id="iniciar-retro-datetime" max="${nowLocalISO()}"></div>
          <button class="btn secondary" onclick="iniciarRetroativo('${reg.id}')">Usar esse horário</button>
          <div style="margin-top:14px"><button class="btn ghost" onclick="apontar.confirmarInicioId=null; render();">Cancelar</button></div>
        </div>`;
    }
  }
  const cards = lista.map(r=>{
    const h = idleHours(r);
    return `
    <div class="tap-card wait" style="align-items:stretch; gap:6px; position:relative;">
      <button class="icon-btn" title="Excluir lançamento" style="position:absolute; top:8px; right:8px; background:rgba(255,255,255,0.6); border-radius:4px;" onclick="event.stopPropagation(); excluirRegistroApontar('${r.id}')">${ICONS.trash}</button>
      <div style="cursor:pointer; display:flex; flex-direction:column; align-items:stretch; gap:6px;" onclick="apontar.confirmarInicioId='${r.id}'; render();">
        <span class="projeto-tag" style="align-self:flex-start">${esc(nomeProjeto(r.projetoId))}</span>
        <span class="tap-card-title" style="text-transform:none; font-size:13px; white-space:normal; line-height:1.35; padding-right:20px;">${esc(nomeEstrutura(r.estruturaId))} · ${esc(regFrenteLabel(r))}</span>
        <span class="tap-card-sub" style="white-space:normal; line-height:1.5;">${esc(nomeEtapa(r.etapaId))} · ${esc(nomeEmpresa(r.empresaId))}</span>
        <span class="chip vermelho pulse" style="margin-top:2px; align-self:flex-start;">aguardando há ${fmtHoras(h)}</span>
      </div>
    </div>`;
  }).join('');
  return `<div class="card"><h3>Marcar início ${voltarLink('menu')} <span class="tag">toque quando o efetivo entrar</span></h3><div class="tap-grid" style="grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));">${cards}</div></div>`;
}
function excluirRegistroApontar(id){
  if(!confirm('Excluir esse lançamento? Não dá pra desfazer.')) return;
  DB.registros = DB.registros.filter(r=>r.id!==id);
  persist.registros();
  showToast('Lançamento excluído.');
  render();
}
window.excluirRegistroApontar = excluirRegistroApontar;
function iniciarAgora(registroId){ marcarInicio(registroId, nowLocalISO()); }
window.iniciarAgora = iniciarAgora;
function iniciarRetroativo(registroId){
  const valor = document.getElementById('iniciar-retro-datetime').value;
  if(!valor){ showToast('Escolha um horário.'); return; }
  if(new Date(valor) > new Date()){ showToast('O horário não pode ser no futuro.'); return; }
  marcarInicio(registroId, valor);
}
window.iniciarRetroativo = iniciarRetroativo;
function marcarInicio(registroId, inicioISO){
  const reg = DB.registros.find(r=>r.id===registroId);
  const prevInicio = reg.inicio;
  reg.inicio = inicioISO;
  persist.registros();
  apontar.confirmarInicioId = null;
  apontar.efetivoRegId = registroId;
  render();
  showToast('Início marcado — ociosidade encerrada.', 'Desfazer', () => {
    reg.inicio = prevInicio;
    apontar.efetivoRegId = null;
    persist.registros();
    render();
  });
}

/* -- EFETIVO DO DIA (profissionais da empresa executora) — reutilizável -- */
function renderEfetivoStepper(regId, origemAcao){
  const reg = DB.registros.find(r=>r.id===regId);
  if(!reg){ apontar.efetivoRegId=null; return renderApontar(); }
  const empresa = DB.empresas.find(e=>e.id===reg.empresaId);
  const profissionais = (empresa && empresa.profissionais) || [];
  if(!apontar.efetivoData) apontar.efetivoData = hojeStr();
  const data = apontar.efetivoData;
  if(!reg.efetivoDiario) reg.efetivoDiario = [];
  let entrada = reg.efetivoDiario.find(e=>e.data===data);
  function qtd(profId){ if(!entrada) return 0; const it = entrada.itens.find(i=>i.profissionalId===profId); return it ? it.quantidade : 0; }
  const cards = profissionais.map(p=>`
    <div class="stepper-row">
      <span class="nome">${esc(p.nome)}</span>
      <div class="stepper-controls">
        <button class="btn small ghost" onclick="alterarQtdProfissional('${regId}','${p.id}','${esc(p.nome)}',-1)">−</button>
        <span class="qtd">${qtd(p.id)}</span>
        <button class="btn small ghost" onclick="alterarQtdProfissional('${regId}','${p.id}','${esc(p.nome)}',1)">+</button>
      </div>
    </div>`).join('');
  const dataInicioReg = reg.inicio ? reg.inicio.slice(0,10) : hojeStr();
  const horaInicioPadrao = (reg.inicio && reg.inicio.slice(0,10)===data) ? reg.inicio.slice(11,16) : '07:00';
  const horaFimVal = entrada ? (entrada.horaFim||'') : '';
  const horaInicioVal = entrada ? (entrada.horaInicio||horaInicioPadrao) : horaInicioPadrao;
  return `
    <div class="card">
      <h3>Efetivo do dia <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="pularEfetivo('${regId}')">◂ pular / menu</span> <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="state.tab='efetivo'; render();">ver todos os lançamentos ▸</span></h3>
      <p style="font-size:13px; color:var(--grafite-suave); margin-bottom:10px">${esc(regFrenteLabel(reg))} · ${esc(nomeEtapa(reg.etapaId))} · <strong style="color:var(--grafite)">${esc(nomeEmpresa(reg.empresaId))}</strong></p>
      <div class="grid3" style="align-items:end">
        <div class="field" style="margin-bottom:0"><label>Data ${data===hojeStr() ? '(hoje)' : '(retroativo)'}</label><input type="date" value="${data}" min="${dataInicioReg}" max="${hojeStr()}" onchange="apontar.efetivoData=this.value; render();"></div>
        <div class="field" style="margin-bottom:0"><label>Início do dia</label><input type="time" value="${horaInicioVal}" onchange="atualizarHoraDia('${regId}','horaInicio', this.value)"></div>
        <div class="field" style="margin-bottom:0"><label>Fim do dia <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="atualizarHoraDia('${regId}','horaFim', horaAgora())">usar agora</span></label><input type="time" value="${horaFimVal}" onchange="atualizarHoraDia('${regId}','horaFim', this.value)"></div>
      </div>
      <p style="font-size:11.5px; color:var(--grafite-suave); margin:8px 0 18px 0;">Preencher início/fim aqui "encerra o dia" — a partir disso, as horas trabalhadas passam a ser contadas por esse fechamento diário (e não mais início→término corrido). Esqueceu ontem? Só voltar a data acima e preencher.</p>
      ${profissionais.length ? cards : `<div class="empty"><div class="big">Nenhum profissional cadastrado</div><p>Cadastre os tipos de profissional de "${esc(nomeEmpresa(reg.empresaId))}" na aba Empresas.</p></div>`}
      <button class="btn" style="margin-top:16px" onclick="confirmarEfetivo('${regId}','${origemAcao}')">Confirmar efetivo desse dia ▸</button>
    </div>`;
}
function horaAgora(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
window.horaAgora = horaAgora;
function atualizarHoraDia(regId, campo, valor, dataOverride){
  const reg = DB.registros.find(r=>r.id===regId);
  const data = dataOverride || apontar.efetivoData || hojeStr();
  if(!reg.efetivoDiario) reg.efetivoDiario = [];
  let entrada = reg.efetivoDiario.find(e=>e.data===data);
  if(!entrada){ entrada = { data, itens: [], horaInicio: null, horaFim: null }; reg.efetivoDiario.push(entrada); }
  entrada[campo] = valor || null;

  }

}

function alterarQtdProfissional(regId, profissionalId, nome, delta, dataOverride){
  const reg = DB.registros.find(r=>r.id===regId);

  if(!reg.efetivoDiario) reg.efetivoDiario = [];

function pausarRegistro(id){

function retomarRegistro(id){
  const r = DB.registros.find(x=>x.id===id);

  r.pausas.push({ inicio: r.pausadoDesde, fim: nowLocalISO() });

}
window.retomarRegistro = retomarRegistro;
function concluirRegistroAgora(id){
  const r = DB.registros.find(x=>x.id===id);
  const prevTermino = r.termino;
  const prevPausadoDesde = r.pausadoDesde;
  const prevPausas = (r.pausas||[]).slice();
  if(r.pausadoDesde){
    r.pausas = [...(r.pausas||[]), { inicio: r.pausadoDesde, fim: nowLocalISO() }];
    r.pausadoDesde = null;
  }
  r.termino = nowLocalISO();
  persist.registros();
  apontar.quantidadeRegId = id;
  render();
  showToast('Etapa concluída.', 'Desfazer', () => {
    r.termino = prevTermino; r.pausadoDesde = prevPausadoDesde; r.pausas = prevPausas;
    apontar.quantidadeRegId = null;
    persist.registros();
    render();
  });
}
window.concluirRegistroAgora = concluirRegistroAgora;

/* -- alocar recursos AHBT (M.O./equipamento próprios) — disponível pra qualquer empresa executora -- */
function renderAlocarRecursos(regId){
  const reg = DB.registros.find(r=>r.id===regId);
  if(!reg){ apontar.alocarRegId = null; return renderApontar(); }
  if(!reg.recursos) reg.recursos = [];
  function qtd(recursoId){ const a = reg.recursos.find(x=>x.recursoId===recursoId); return a ? a.quantidade : 0; }

  // -- já alocados: em destaque no topo, com stepper completo pra ajustar rápido --
  const idsAlocados = new Set(reg.recursos.filter(a=>a.quantidade>0).map(a=>a.recursoId));
  const alocadosHtml = [...idsAlocados].map(id=>{
    const r = DB.recursos.find(x=>x.id===id);
    if(!r) return '';
    return `
      <div class="stepper-row">
        <div>
          <div class="nome">${esc(r.nome)} <span class="tag" style="font-weight:400;">${esc(nomeEmpresa(r.empresaId))}</span></div>
          <div style="font-size:11px; color:var(--grafite-suave); font-family:'IBM Plex Mono',monospace;">${esc(r.unidade)}${r.custoHora>0 ? ` · ${fmtMoeda(r.custoHora)}/h` : ''}</div>
        </div>
        <div class="stepper-controls">
          <button class="btn small ghost" onclick="alterarQtdRecurso('${regId}','${r.id}',-1)">−</button>
          <span class="qtd">${qtd(r.id)}</span>
          <button class="btn small ghost" onclick="alterarQtdRecurso('${regId}','${r.id}',1)">+</button>
        </div>
      </div>`;
  }).join('');

  // -- disponíveis: lista compacta, um toque adiciona 1 e o item sobe pra "alocados" --
  const empresasComRecurso = DB.empresas.filter(emp => DB.recursos.some(r=>r.empresaId===emp.id));
  const gruposHtml = empresasComRecurso.map((emp, idx)=>{
    const disponiveis = DB.recursos.filter(r=>r.empresaId===emp.id && !idsAlocados.has(r.id));
    if(!disponiveis.length) return '';
    const itensHtml = disponiveis.map(r=>`
      <button class="lista-item" onclick="alterarQtdRecurso('${regId}','${r.id}',1)">
        <span>${esc(r.nome)}</span>
        <span><span class="info">${esc(r.unidade)}${r.custoHora>0 ? ` · ${fmtMoeda(r.custoHora)}/h` : ''}</span><span class="add">+</span></span>
      </button>`).join('');
    return `
      <details class="grupo-recolhivel" ${idx===0 && !idsAlocados.size ? 'open' : ''}>
        <summary><span>${esc(emp.nome)}</span><span class="tag">${disponiveis.length} disponível(is)</span></summary>
        <div class="lista-compacta">${itensHtml}</div>
      </details>`;
  }).join('');

  const semNadaCadastrado = DB.recursos.length===0;
  return `
    <div class="card">
      <h3>Recursos de apoio nesta frente <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="pularAlocacao()">◂ pular / menu</span></h3>
      <p style="font-size:13px; color:var(--grafite-suave); margin-bottom:6px">${esc(regFrenteLabel(reg))} · ${esc(nomeEtapa(reg.etapaId))} · executando: <strong style="color:var(--grafite)">${esc(nomeEmpresa(reg.empresaId))}</strong></p>
      <p style="font-size:12px; color:var(--grafite-suave); margin-bottom:16px">Toque num recurso da lista pra adicionar. Só conta custo (H/H) quando o recurso é da AHBT.</p>
      ${idsAlocados.size ? `<h4 style="font-size:11px; color:var(--grafite-suave); text-transform:uppercase; letter-spacing:0.04em; margin:0 0 8px 0;">Alocados</h4>${alocadosHtml}<div style="margin:16px 0 14px 0; border-top:1px solid var(--linha-grade);"></div>` : ''}
      ${gruposHtml || (semNadaCadastrado ? `<div class="empty"><div class="big">Nenhum recurso cadastrado</div><p>Cadastre mão de obra e equipamentos na aba Recursos.</p></div>` : '')}
      <button class="btn" style="margin-top:14px" onclick="pularAlocacao()">Concluído ▸</button>
    </div>`;
}
function alterarQtdRecurso(regId, recursoId, delta){
  const reg = DB.registros.find(r=>r.id===regId);
  if(!reg.recursos) reg.recursos = [];
  let item = reg.recursos.find(x=>x.recursoId===recursoId);
  if(!item){ item = { recursoId, quantidade: 0 }; reg.recursos.push(item); }
  item.quantidade = Math.max(0, item.quantidade + delta);
  if(item.quantidade===0) reg.recursos = reg.recursos.filter(x=>x.recursoId!==recursoId);
  persist.registros();
  render();
}

/* ---------------------------------------------------------
   RANKINGS REUTILIZÁVEIS
--------------------------------------------------------- */
function montarRanking(items, calcH){
  const comH = items.map(x => ({ ...x, h: calcH(x), m: comprimentoFrenteMetros(x.faixaInicio, x.faixaFim) }));
  const totalH = comH.reduce((s,x)=>s+x.h, 0);
  const totalM = comH.reduce((s,x)=>s+x.m, 0);
  const media = comH.length ? totalH/comH.length : 0;
  const porEtapa = {};
  comH.forEach(x=>{
    if(!porEtapa[x.etapaId]) porEtapa[x.etapaId] = { soma:0, n:0, metros:0 };
    porEtapa[x.etapaId].soma += x.h; porEtapa[x.etapaId].n += 1; porEtapa[x.etapaId].metros += x.m;
  });
  const ranking = Object.entries(porEtapa).map(([etapaId, v]) => ({
    etapaId, media: v.soma/v.n, n: v.n, metros: v.metros, mPorHora: v.soma>0 ? v.metros/v.soma : null,
  })).sort((a,b)=>b.media-a.media);
  return { comH, mediaGeral: media, ranking, maxMedia: Math.max(...ranking.map(r=>r.media), 1), totalM, totalH, produtividadeGeral: totalH>0 ? totalM/totalH : null };
}
function rankingHtml(ranking, maxMedia, cor){
  return ranking.map(r=>`
    <div class="rank-row">
      <div class="label">${esc(nomeEtapa(r.etapaId))}</div>
      <div class="bar-track"><div class="bar-fill ${cor}" style="width:${Math.max((r.media/maxMedia)*100,2)}%"></div></div>
      <div class="val">${fmtHoras(r.media)} méd. · ${r.n}x${(r.metros>0 && r.mPorHora!==null) ? ` · ${r.metros}m · ${r.mPorHora.toFixed(1)} m/h` : ''}</div>
    </div>`).join('');
}
function montarRankingEmpresa(items, calcH){
  const comH = items.map(x => ({ ...x, h: calcH(x), m: comprimentoFrenteMetros(x.faixaInicio, x.faixaFim) }));
  const porEmpresa = {};
  comH.forEach(x=>{
    if(!porEmpresa[x.empresaId]) porEmpresa[x.empresaId] = { soma:0, n:0, metros:0 };
    porEmpresa[x.empresaId].soma += x.h; porEmpresa[x.empresaId].n += 1; porEmpresa[x.empresaId].metros += x.m;
  });
  const ranking = Object.entries(porEmpresa).map(([empresaId, v]) => ({
    empresaId, media: v.soma/v.n, n: v.n, metros: v.metros, mPorHora: v.soma>0 ? v.metros/v.soma : null,
  })).sort((a,b)=> (b.mPorHora||0) - (a.mPorHora||0));
  return { ranking, maxMPorHora: Math.max(...ranking.map(r=>r.mPorHora||0), 1) };
}
function rankingEmpresaHtml(ranking, maxMPorHora){
  return ranking.map(r=>`
    <div class="rank-row">
      <div class="label">${esc(nomeEmpresa(r.empresaId))}</div>
      <div class="bar-track"><div class="bar-fill verde" style="width:${Math.max(((r.mPorHora||0)/maxMPorHora)*100,2)}%"></div></div>
      <div class="val">${r.mPorHora!==null ? r.mPorHora.toFixed(1)+' m/h' : '—'} · ${fmtHoras(r.media)} méd. · ${r.n}x</div>
    </div>`).join('');
}

function renderPainel(){

  const concluidas = regs.filter(r=>r.termino);

  // efetivo do dia: soma de profissionais lançados hoje (total geral, sem detalhar função)
  const hojeK = hojeStr();
  const efetivoPorEmpresa = {};
  regs.forEach(r=>{

        <div class="val">${v.total} pessoa${v.total!==1?'s':''} · ${v.frentes} frente${v.frentes!==1?'s':''}</div>
      </div>`;
  }).join('') : `<div class="board-empty">Nenhum efetivo lançado hoje ainda</div>`;
  const efetivoHojeCard = `
    <div class="card">
      <h3>Efetivo de hoje <span class="tag">${totalEfetivoHoje} pessoa${totalEfetivoHoje!==1?'s':''} em campo</span></h3>
      <p style="font-size:12px; color:var(--grafite-suave); margin:-4px 0 12px 0">Soma do efetivo diário registrado por empresa — compare dia a dia pra notar variações de equipe.</p>
      ${efetivoHojeHtml}
    </div>`;

  const board = `
    <div class="card">
      <h3>Quadro de todas as frentes <span class="tag">visão rápida do ciclo completo</span> <span class="chip roxo" style="margin-left:4px;">👤 ${totalEfetivoHoje} pessoa${totalEfetivoHoje!==1?'s':''} em campo hoje</span></h3>
      <div class="board">
        <div class="board-col vermelho">
          <div class="board-col-head"><span>Aguardando efetivo</span><span class="n">${aguardando.length}</span></div>
          <div class="board-col-body">
            ${aguardando.length ? aguardando.map(r=>`<div class="board-item"><span class="projeto-tag" style="margin-bottom:4px; display:inline-block">${esc(nomeProjeto(r.projetoId))}</span><div class="t">${esc(regFrenteLabel(r))}</div><div class="s">${esc(nomeEtapa(r.etapaId))} · ${esc(nomeEmpresa(r.empresaId))}<br>liberada ${fmtData(r.liberacao)} · há ${fmtHorasDias(idleHours(r))}</div></div>`).join('') : `<div class="board-empty">Vazio</div>`}
          </div>
        </div>
        <div class="board-col roxo">
          <div class="board-col-head"><span>Em execução</span><span class="n">${executando.length}</span></div>
          <div class="board-col-body">
            ${executando.length ? executando.map(r=>{
              const efetivoHoje = efetivoHojeResumo(r);
              const totalHoje = efetivoHoje ? (r.efetivoDiario.find(e=>e.data===hojeStr()).itens.reduce((s,i)=>s+i.quantidade,0)) : 0;
              return `<div class="board-item"><span class="projeto-tag" style="margin-bottom:4px; display:inline-block">${esc(nomeProjeto(r.projetoId))}</span><div class="t">${esc(regFrenteLabel(r))}</div><div class="s">${esc(nomeEtapa(r.etapaId))} · ${esc(nomeEmpresa(r.empresaId))}<br>início ${fmtData(r.inicio)} · ${r.pausadoDesde?'pausado · ':''}há ${fmtHorasDias(execHours(r))}</div>${efetivoHoje ? `<div class="chip roxo" style="margin-top:6px; display:inline-block;">👤 ${totalHoje} hoje: ${esc(efetivoHoje)}</div>` : `<div class="chip amarelo pulse" style="margin-top:6px; display:inline-block;">👤 0 hoje: efetivo pendente</div>`}</div>`;
            }).join('') : `<div class="board-empty">Vazio</div>`}
          </div>
        </div>
        <div class="board-col verde">
          <div class="board-col-head"><span>Concluídas</span><span class="n">${concluidas.length}</span></div>
          <div class="board-col-body">
            ${concluidas.length ? concluidas.slice().sort((a,b)=> new Date(b.termino)-new Date(a.termino)).slice(0,15).map(r=>`<div class="board-item"><span class="projeto-tag" style="margin-bottom:4px; display:inline-block">${esc(nomeProjeto(r.projetoId))}</span><div class="t">${esc(regFrenteLabel(r))}</div><div class="s">${esc(nomeEtapa(r.etapaId))} · ${esc(nomeEmpresa(r.empresaId))}<br>início ${fmtData(r.inicio)} → concluída ${fmtData(r.termino)}</div></div>`).join('') : `<div class="board-empty">Vazio</div>`}
          </div>
        </div>
      </div>
    </div>`;

  const regsH = regs.map(r => ({ ...r, h: idleHours(r) }));
  const totalHoras = regsH.reduce((s,r)=>s+r.h, 0);
  const mediaHoras = regsH.length ? totalHoras/regsH.length : 0;
  const porEtapa = {};
  regsH.forEach(r=>{
    if(!porEtapa[r.etapaId]) porEtapa[r.etapaId] = { soma:0, n:0 };
    porEtapa[r.etapaId].soma += r.h; porEtapa[r.etapaId].n += 1;
  });
  const ranking = Object.entries(porEtapa).map(([etapaId, v]) => ({ etapaId, media: v.soma/v.n, n: v.n })).sort((a,b)=>b.media-a.media);
  const maxMedia = Math.max(...ranking.map(r=>r.media), 1);
  const etapaCritica = ranking[0] ? nomeEtapa(ranking[0].etapaId) : '—';

  const rankingOcioHtml = ranking.map(r=>{
    const sev = severidade(r.media);
    return `<div class="rank-row">
        <div class="label">${esc(nomeEtapa(r.etapaId))}</div>
        <div class="bar-track"><div class="bar-fill ${sev}" style="width:${Math.max((r.media/maxMedia)*100,2)}%"></div></div>
        <div class="val">${fmtHoras(r.media)} méd. · ${r.n}x</div>
      </div>`;
  }).join('');

  const porDia = {};
  regsH.forEach(r=>{
    const d = new Date(r.liberacao);
    if(isNaN(d.getTime())) return;
    const key = d.toISOString().slice(0,10);
    porDia[key] = (porDia[key]||0) + r.h;
  });
  const dias = Object.keys(porDia).sort();
  const maxDia = Math.max(...Object.values(porDia), 1);
  const daybarsHtml = dias.map(k=>{
    const v = porDia[k];
    const alt = new Date(k+'T12:00:00');
    return `<div class="daybar"><div class="val">${fmtHoras(v)}</div><div class="col" style="height:${Math.max((v/maxDia)*100,3)}px"></div><div class="dlabel">${alt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div></div>`;
  }).join('');

  const timeline = regsH.slice().sort((a,b)=> new Date(b.liberacao) - new Date(a.liberacao));
  const maxH = Math.max(...regsH.map(r=>r.h), 1);
  const timelineHtml = timeline.map(r=>{
    const sev = severidade(r.h);
    const situacao = r.inicio
      ? `<span class="chip ${sev}">${fmtHoras(r.h)} ocioso</span>`
      : `<span class="chip vermelho pulse">aguardando efetivo · ${fmtHoras(r.h)}</span>`;
    return `<div class="idle-row">
        <div class="head">
          <span class="name">${esc(regFrenteLabel(r))} · ${esc(nomeEtapa(r.etapaId))} · <span class="empresa-tag">${esc(nomeEmpresa(r.empresaId))}</span></span>
          <span class="meta">Liberada ${fmtDataHora(r.liberacao)} ${r.inicio?`→ iniciada ${fmtDataHora(r.inicio)}`:''}</span>
        </div>
        <div class="bar-track"><div class="bar-fill ${sev}" style="width:${Math.max((r.h/maxH)*100,2)}%"></div></div>
        <div style="margin-top:5px">${situacao}</div>
      </div>`;
  }).join('');

  return `
    <div class="topbar"><div><h2>Painel</h2><p class="desc">Visão geral de todas as frentes: ociosas, em execução e concluídas.</p></div>
      ${filtros}
    </div>
    ${board}
    ${efetivoHojeCard}
    <div class="card">
      <div class="kpi-row">
        <div class="kpi"><div class="label">Ociosidade total</div><div class="value">${fmtHoras(totalHoras)}</div></div>
        <div class="kpi"><div class="label">Ociosidade média</div><div class="value">${fmtHoras(mediaHoras)}</div></div>
        <div class="kpi"><div class="label">Aguardando efetivo agora</div><div class="value" style="color:${aguardando.length>0?'var(--vermelho)':'var(--verde)'}">${aguardando.length}</div></div>
        <div class="kpi"><div class="label">Etapa mais crítica</div><div class="value" style="font-size:14px; font-family:'Oswald',sans-serif; text-transform:uppercase;">${esc(etapaCritica)}</div></div>
      </div>
    </div>
    <div class="card"><h3>Ociosidade média por etapa <span class="tag">${ranking.length} etapa(s)</span></h3>${rankingOcioHtml}</div>
    <div class="card"><h3>Ociosidade por dia de liberação <span class="tag">soma de horas ociosas</span></h3><div class="daybars">${daybarsHtml}</div></div>
    <div class="card"><h3>Linha do tempo de liberações <span class="tag">${timeline.length} registro(s), mais recentes primeiro</span></h3>${timelineHtml}</div>
  `;
}

function renderDuracao(){
  const concluidas = DB.registros.filter(r=>r.inicio && r.termino);
  const emExecucao = DB.registros.filter(r=>r.inicio && !r.termino);

  const filtros = `
    <div class="card no-print">
      <div class="grid3">
        <div class="field"><label>Filtrar por projeto</label><select onchange="state.filtroProjeto=this.value; render();">${filtroProjetoOptionsHtml(state.filtroProjeto)}</select></div>
        <div class="field"><label>Filtrar por estrutura</label><select onchange="state.filtroEstrutura=this.value; render();"><option value="all">Todas as estruturas</option>${DB.estruturas.map(e=>`<option value="${e.id}" ${state.filtroEstrutura===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></div>
        <div class="field"><label>Filtrar por empresa</label><select onchange="state.filtroEmpresa=this.value; render();"><option value="all">Todas as empresas</option>${DB.empresas.map(e=>`<option value="${e.id}" ${state.filtroEmpresa===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></div>
      </div>
    </div>`;

  let concluidasF = concluidas, emExecucaoF = emExecucao;
  if(state.filtroProjeto!=='all'){ concluidasF = concluidasF.filter(r=>r.projetoId===state.filtroProjeto); emExecucaoF = emExecucaoF.filter(r=>r.projetoId===state.filtroProjeto); }
  if(state.filtroEstrutura!=='all'){ concluidasF = concluidasF.filter(r=>r.estruturaId===state.filtroEstrutura); emExecucaoF = emExecucaoF.filter(r=>r.estruturaId===state.filtroEstrutura); }
  if(state.filtroEmpresa!=='all'){ concluidasF = concluidasF.filter(r=>r.empresaId===state.filtroEmpresa); emExecucaoF = emExecucaoF.filter(r=>r.empresaId===state.filtroEmpresa); }

  if(concluidasF.length===0){
    return `
      <div class="topbar"><div><h2>Duração</h2><p class="desc">Tempo médio de execução por etapa e por empresa — ajuda a enxergar onde existe deficiência ou espaço de melhoria.</p></div></div>
      ${filtros}
      <div class="card"><div class="empty">
        <div class="big">Nenhuma etapa concluída com esse filtro</div>
        <p>Assim que marcar uma conclusão em Apontar, os tempos de execução aparecem aqui.</p>
        ${emExecucaoF.length ? `<p style="margin-top:6px">${emExecucaoF.length} frente(s) em execução agora.</p>` : ''}
      </div></div>`;
  }

  const R = montarRanking(concluidasF, execHours);
  const etapaMaisLenta = R.ranking[0] ? nomeEtapa(R.ranking[0].etapaId) : '—';
  const etapaMaisRapida = R.ranking.length ? nomeEtapa(R.ranking[R.ranking.length-1].etapaId) : '—';
  const RE = montarRankingEmpresa(concluidasF, execHours);

  // indice real (quantidade/hora) por etapa, na unidade mais usada naquela etapa
  const indicePorEtapa = {};
  concluidasF.forEach(r=>{
    const ir = indiceRealRegistro(r);
    if(ir===null || !r.unidadeExecutada) return;
    if(!indicePorEtapa[r.etapaId]) indicePorEtapa[r.etapaId] = {};
    if(!indicePorEtapa[r.etapaId][r.unidadeExecutada]) indicePorEtapa[r.etapaId][r.unidadeExecutada] = { soma:0, n:0 };
    indicePorEtapa[r.etapaId][r.unidadeExecutada].soma += ir;
    indicePorEtapa[r.etapaId][r.unidadeExecutada].n += 1;
  });
  function indiceTxt(etapaId){
    const porUnidade = indicePorEtapa[etapaId];
    if(!porUnidade) return '';
    let melhor = null;
    Object.entries(porUnidade).forEach(([unidade, v])=>{ if(!melhor || v.n>melhor.n) melhor = { unidade, media: v.soma/v.n, n: v.n }; });
    return melhor ? ` · ${melhor.media.toFixed(2)} ${esc(melhor.unidade)}/h` : '';
  }
  const rankingEtapaComIndiceHtml = R.ranking.map(r=>`
    <div class="rank-row">
      <div class="label">${esc(nomeEtapa(r.etapaId))}</div>
      <div class="bar-track"><div class="bar-fill roxo" style="width:${Math.max((r.media/R.maxMedia)*100,2)}%"></div></div>
      <div class="val">${fmtHoras(r.media)} méd. · ${r.n}x${indiceTxt(r.etapaId)}</div>
    </div>`).join('');

  const emExecHtml = emExecucaoF.length ? emExecucaoF.map(r=>{
    const h = execHours(r);
    const pausado = !!r.pausadoDesde;
    return `<div class="idle-row">
      <div class="head"><span class="name">${esc(regFrenteLabel(r))} · ${esc(nomeEtapa(r.etapaId))} · <span class="empresa-tag">${esc(nomeEmpresa(r.empresaId))}</span></span><span class="meta">Início ${fmtDataHora(r.inicio)}</span></div>
      <div class="bar-track"><div class="bar-fill ${pausado?'amarelo':'roxo'}" style="width:${Math.min((h/(R.maxMedia*1.2||1))*100,100)}%"></div></div>
      <div style="margin-top:5px"><span class="chip ${pausado?'amarelo':'roxo'} pulse">${pausado?'pausado':'em execução'} há ${fmtHoras(h)}</span></div>
    </div>`;
  }).join('') : `<div class="empty"><div class="big">Nenhuma frente em execução agora</div></div>`;

  return `
    <div class="topbar"><div><h2>Duração</h2><p class="desc">Tempo médio de execução por etapa e por empresa — ajuda a enxergar onde existe deficiência ou espaço de melhoria.</p></div></div>
    ${filtros}
    <div class="card">
      <div class="kpi-row">
        <div class="kpi"><div class="label">Duração média geral</div><div class="value">${fmtHoras(R.mediaGeral)}</div></div>
        <div class="kpi"><div class="label">Etapas concluídas</div><div class="value">${concluidasF.length}</div></div>
        <div class="kpi"><div class="label">Metros executados</div><div class="value">${R.totalM}m</div></div>
        <div class="kpi"><div class="label">Produtividade média</div><div class="value">${R.produtividadeGeral!==null ? R.produtividadeGeral.toFixed(1)+' m/h' : '—'}</div></div>
        <div class="kpi"><div class="label">Etapa mais demorada</div><div class="value" style="font-size:14px; font-family:'Oswald',sans-serif; text-transform:uppercase;">${esc(etapaMaisLenta)}</div></div>
        <div class="kpi"><div class="label">Etapa mais rápida</div><div class="value" style="font-size:14px; font-family:'Oswald',sans-serif; text-transform:uppercase;">${esc(etapaMaisRapida)}</div></div>
      </div>
    </div>
    <div class="card"><h3>Produtividade por empresa <span class="tag">comparativo — mais produtiva primeiro</span></h3>${rankingEmpresaHtml(RE.ranking, RE.maxMPorHora)}</div>
    <div class="card"><h3>Duração média por etapa <span class="tag">${R.ranking.length} etapa(s) · com índice real quando disponível</span></h3>${rankingEtapaComIndiceHtml}</div>
    <div class="card"><h3>Em execução agora <span class="tag">${emExecucaoF.length} frente(s)</span></h3>${emExecHtml}</div>
  `;
}

   DIÁRIO DE OBRA
--------------------------------------------------------- */
function listaDiarioLinhas(){
  const linhas = [];
  DB.registros.forEach(r=>{
    (r.efetivoDiario||[]).forEach(entrada=>{
      entrada.itens.forEach(item=>{
        linhas.push({
          data: entrada.data, empresaId: r.empresaId, projetoId: r.projetoId,
          frente: regFrenteLabel(r), etapa: nomeEtapa(r.etapaId), estrutura: nomeEstrutura(r.estruturaId),
          profissional: item.nome, quantidade: item.quantidade, registroId: r.id,
          horaInicio: entrada.horaInicio||null, horaFim: entrada.horaFim||null,
        });
      });
    });
  });
  return linhas.sort((a,b)=> b.data.localeCompare(a.data));
}
function renderDiario(){
  if(DB.empresas.length===0){
    return `<div class="topbar"><div><h2>Diário de Obra</h2></div></div><div class="card"><div class="empty"><div class="big">Cadastre empresas primeiro</div></div></div>`;
  }
  if(!state.diarioEmpresaId) state.diarioEmpresaId = DB.empresas[0].id;
  const empresaOptions = DB.empresas.map(e=>`<option value="${e.id}" ${state.diarioEmpresaId===e.id?'selected':''}>${esc(e.nome)}</option>`).join('');

  let linhas = listaDiarioLinhas().filter(l=>l.empresaId===state.diarioEmpresaId);
  if(state.diarioProjetoId!=='all') linhas = linhas.filter(l=>l.projetoId===state.diarioProjetoId);

  const totalPessoasDia = {};
  linhas.forEach(l=>{ totalPessoasDia[l.data] = (totalPessoasDia[l.data]||0) + l.quantidade; });
  const diasComRegistro = Object.keys(totalPessoasDia).length;

  const rows = linhas.map(l=>`
    <tr>
      <td class="mono">${fmtData(l.data)}</td>
      <td>${esc(nomeProjeto(l.projetoId))}</td>
      <td>${esc(l.frente)}</td>
      <td>${esc(l.estrutura)}</td>
      <td>${esc(l.etapa)}</td>
      <td>${esc(l.profissional)}</td>
      <td class="num">${l.quantidade}</td>
      <td class="mono">${l.horaInicio && l.horaFim ? `${l.horaInicio}–${l.horaFim}` : '—'}</td>
    </tr>`).join('');

  return `
    <div class="topbar no-print"><div><h2>Diário de Obra</h2><p class="desc">Efetivo e horário diário lançado por empresa — exporte em PDF ou Excel.</p></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn secondary" onclick="exportarDiarioExcel()">${ICONS.download} Exportar Excel</button>
        <button class="btn" onclick="window.print()">${ICONS.print} Exportar / Imprimir PDF</button>
      </div>
    </div>
    <div class="card no-print">
      <div class="grid2">
        <div class="field"><label>Empresa *</label><select onchange="state.diarioEmpresaId=this.value; render();">${empresaOptions}</select></div>
        <div class="field"><label>Projeto</label><select onchange="state.diarioProjetoId=this.value; render();">${filtroProjetoOptionsHtml(state.diarioProjetoId)}</select></div>
      </div>
    </div>
    <div id="diario-print">
      <div class="card relatorio-header">
        <img src="${document.querySelector('#brand img').src}" alt="AH Brant" style="height:40px; width:auto; border-radius:3px;">
        <div>
          <h2 style="font-size:18px; margin-bottom:2px;">Diário de Obra — ${esc(nomeEmpresa(state.diarioEmpresaId))}</h2>
          <p style="font-size:12px; color:var(--grafite-suave); margin:0;">${diasComRegistro} dia(s) com efetivo lançado</p>
        </div>
      </div>
      <div class="card">
        <h3>Lançamentos <span class="tag">${linhas.length} registro(s)</span></h3>
        ${linhas.length ? `<table><thead><tr><th>Data</th><th>Projeto</th><th>Frente</th><th>Estrutura</th><th>Etapa</th><th>Profissional</th><th style="text-align:right">Qtd.</th><th>Horário do dia</th></tr></thead><tbody>${rows}</tbody></table>`
          : `<div class="empty"><div class="big">Nenhum efetivo lançado ainda</div><p>Use Apontar › Marcar início ou Efetivo do dia.</p></div>`}
      </div>
    </div>
  `;
}
function exportarDiarioExcel(){
  const linhas = listaDiarioLinhas().filter(l=>l.empresaId===state.diarioEmpresaId && (state.diarioProjetoId==='all' || l.projetoId===state.diarioProjetoId));
  const dados = linhas.map(l=>({
    Data: fmtData(l.data), Projeto: nomeProjeto(l.projetoId), Frente: l.frente, Estrutura: l.estrutura,
    Etapa: l.etapa, Profissional: l.profissional, Quantidade: l.quantidade,
    'Início do dia': l.horaInicio||'', 'Fim do dia': l.horaFim||'',
  }));
  if(!dados.length){ showToast('Nenhum dado pra exportar com esse filtro.'); return; }
  const ws = XLSX.utils.json_to_sheet(dados);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Diário de Obra');
  XLSX.writeFile(wb, `diario-obra-${nomeEmpresa(state.diarioEmpresaId).replace(/\\s+/g,'-')}-${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Excel exportado.');
}
window.exportarDiarioExcel = exportarDiarioExcel;
