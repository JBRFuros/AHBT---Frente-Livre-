/* -- seleção de trecho + intervalo de estacas -- */
function renderSeletorTrechoFaixa(tituloPasso, aoConfirmar){
  if(!apontar.trechoId){
    const lista = DB.estacas.filter(f=>f.projetoId===apontar.projetoId && f.tipo!=='eixo').sort((a,b)=>(a.trecho||'').localeCompare(b.trecho||'', undefined, {numeric:true}));
    const cards = lista.map(f=>`
      <button class="tap-card" onclick="apontar.trechoId='${f.id}'; render();">
        <span class="tap-card-title">${esc(f.trecho||'—')}</span>
        <span class="tap-card-sub">Estacas ${esc(f.estacaInicio)} – ${esc(f.estacaTermino)}</span>
      </button>
    `).join('');
    return `
      <div class="card">
        <h3>${esc(tituloPasso)} — qual trecho? ${voltarLink('menu')}</h3>
        ${lista.length ? `<div class="tap-grid">${cards}</div>` : `<div class="empty"><div class="big">Nenhum trecho neste projeto</div><p>Cadastre trechos para "${esc(nomeProjeto(apontar.projetoId))}" na aba Trechos.</p></div>`}
      </div>`;
  }
  const trecho = DB.estacas.find(f=>f.id===apontar.trechoId);
  const estacas = listaEstacasDoTrecho(trecho);
  const min = apontar.faixaInicio===null ? null : Math.min(apontar.faixaInicio, apontar.faixaFim);
  const max = apontar.faixaInicio===null ? null : Math.max(apontar.faixaInicio, apontar.faixaFim);
  const chips = estacas.map(val=>{
    const emFaixa = min!==null && val>=min && val<=max;
    const borda = min!==null && (val===min || val===max);
    return `<button class="estaca-chip ${emFaixa?'selected':''} ${borda?'edge':''}" onclick="tapEstaca(${val})">${formatEstacaVal(val)}</button>`;
  }).join('');
  const resumo = min===null
    ? `Toque na primeira estaca da frente.`
    : (min===max
        ? `Frente selecionada: <strong style="color:var(--grafite)">Estaca ${formatEstacaVal(min)}</strong> — toque em outra pra formar um intervalo, ou confirme só esta.`
        : `Frente selecionada: <strong style="color:var(--grafite)">Estacas ${formatEstacaVal(min)} a ${formatEstacaVal(max)}</strong>`);
  return `
    <div class="card">
      <h3>${esc(tituloPasso)} — qual intervalo? <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="apontar.trechoId=null; apontar.faixaInicio=null; apontar.faixaFim=null; render();">◂ trocar trecho</span></h3>
      <p style="font-size:13px; color:var(--grafite-suave); margin:-6px 0 14px 0">Trecho: <strong style="color:var(--grafite)">${esc(trechoLabel(trecho))}</strong></p>
      <div class="estaca-grid">${chips}</div>
      <p style="font-size:13px; margin:16px 0 0 0">${resumo}</p>
      <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap">
        <button class="btn small ghost" ${min===null?'disabled':''} onclick="ajustarFaixaFim(-10)">− 10m</button>
        <button class="btn small ghost" ${min===null?'disabled':''} onclick="ajustarFaixaFim(10)">+ 10m</button>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap">
        <button class="btn" ${min===null?'disabled':''} onclick="${aoConfirmar}">Confirmar intervalo ▸</button>
        ${min!==null ? `<button class="btn ghost" onclick="limparFaixa()">Limpar seleção</button>` : ''}
      </div>
    </div>`;
}
function tapEstaca(val){
  if(apontar.faixaInicio===null){ apontar.faixaInicio = val; apontar.faixaFim = val; }
  else if(apontar.faixaInicio===apontar.faixaFim && val!==apontar.faixaInicio){
    if(val > apontar.faixaInicio) apontar.faixaFim = val;
    else { apontar.faixaFim = apontar.faixaInicio; apontar.faixaInicio = val; }
  } else { apontar.faixaInicio = val; apontar.faixaFim = val; }
  render();
}
window.tapEstaca = tapEstaca;
function limparFaixa(){ apontar.faixaInicio = null; apontar.faixaFim = null; render(); }
window.limparFaixa = limparFaixa;
function ajustarFaixaFim(deltaMetros){
  if(apontar.faixaInicio===null) return;
  const trecho = DB.estacas.find(f=>f.id===apontar.trechoId);
  const minMetros = Math.min(distEstacaMetros(trecho.estacaInicio), distEstacaMetros(trecho.estacaTermino));
  const maxMetros = Math.max(distEstacaMetros(trecho.estacaInicio), distEstacaMetros(trecho.estacaTermino));
  function deslocar(val){
    const metrosAtual = distEstacaMetros(formatEstacaVal(val));
    let novoMetros = metrosAtual + deltaMetros;
    if(novoMetros > maxMetros) novoMetros = maxMetros;
    if(novoMetros < minMetros) novoMetros = minMetros;
    const novaBase = Math.floor(novoMetros / METROS_POR_ESTACA);
    const novoResto = Math.round(novoMetros - novaBase*METROS_POR_ESTACA);
    return novaBase + novoResto/1000;
  }
  if(apontar.faixaInicio === apontar.faixaFim){
    const novoVal = deslocar(apontar.faixaFim);
    apontar.faixaInicio = novoVal; apontar.faixaFim = novoVal;
  } else {
    apontar.faixaFim = deslocar(apontar.faixaFim);
    if(apontar.faixaFim < apontar.faixaInicio){
      const tmp = apontar.faixaInicio; apontar.faixaInicio = apontar.faixaFim; apontar.faixaFim = tmp;
    }
  }
  render();
}
window.ajustarFaixaFim = ajustarFaixaFim;

/* -- LIBERAR ETAPA: projeto -> estrutura -> elemento/trecho+faixa -> etapa -> empresa -> quando -- */
function renderApontarLiberar(){
  if(!apontar.projetoId){
    const cards = DB.projetos.map(p=>`
      <button class="tap-card" onclick="apontar.projetoId='${p.id}'; render();">
        <span class="tap-card-title">${esc(p.nome)}</span>
      </button>
    `).join('');
    return `<div class="card"><h3>1. Qual projeto? ${voltarLink('menu')}</h3><div class="tap-grid">${cards}</div></div>`;
  }

  if(!apontar.estruturaId){
    const lista = DB.estruturas.filter(es=>es.projetoId===apontar.projetoId);
    const cards = lista.map(es=>`
      <button class="tap-card" onclick="apontar.estruturaId='${es.id}'; render();">
        <span class="tap-card-title">${esc(es.nome)}</span>
        ${es.usaElementos ? `<span class="tap-card-sub">por elemento (ex.: BL-01)</span>` : `<span class="tap-card-sub">por trecho + estaca</span>`}
      </button>
    `).join('');
    return `
      <div class="card">
        <h3>2. Qual estrutura? <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarProjeto()">◂ trocar projeto</span></h3>
        <p style="font-size:13px; color:var(--grafite-suave); margin:-6px 0 14px 0">${esc(nomeProjeto(apontar.projetoId))}</p>
        ${lista.length ? `<div class="tap-grid">${cards}</div>` : `<div class="empty"><div class="big">Nenhuma estrutura neste projeto</div><p>Cadastre estruturas para "${esc(nomeProjeto(apontar.projetoId))}" na aba Estruturas.</p>
          <button class="btn" style="margin-top:10px" onclick="setTab('estruturas')">Ir para Estruturas</button></div>`}
      </div>`;
  }
  const estrutura = DB.estruturas.find(e=>e.id===apontar.estruturaId);

  if(estrutura.usaElementos){
    if(!apontar.elementoId){
      const totalNaEstrutura = DB.elementos.filter(el=>el.estruturaId===estrutura.id && el.projetoId===apontar.projetoId).length;
      // R70: elemento executado (marcado como concluído OU com todas as etapas terminadas) sai da lista — evita apontar a mesma peça duas vezes
      const doProjetoEstrutura = DB.elementos.filter(el=>el.estruturaId===estrutura.id && el.projetoId===apontar.projetoId);
      const etapasTerminadas = new Set(DB.registros.filter(r=>r.elementoId && r.termino).map(r=>r.elementoId+'|'+r.etapaId));
      const executado = el => {
        if(el.concluido) return true;
        const ets = etapasDoElemento(el.id);
        return ets.length>0 && ets.every(et=>etapasTerminadas.has(el.id+'|'+et.id));
      };
      const listaTodos = doProjetoEstrutura.filter(el=>!executado(el));
      const ocultosPorGrupo = {};
      doProjetoEstrutura.filter(executado).forEach(el=>{ const k = elementoGrupoKey(el); ocultosPorGrupo[k] = (ocultosPorGrupo[k]||0) + 1; });
      const grupos = {};
      listaTodos.forEach(el=>{
        const key = elementoGrupoKey(el);
        if(!grupos[key]) grupos[key] = { label: elementoGrupoLabel(el), elementos: [] };
        grupos[key].elementos.push(el);
      });
      const gruposArr = Object.entries(grupos).sort((a,b)=>a[1].label.localeCompare(b[1].label,'pt-BR'));

      if(apontar.elGrupoLocId && !grupos[apontar.elGrupoLocId]) apontar.elGrupoLocId = null; // eixo/trecho ficou todo executado
      if(!apontar.elGrupoLocId && gruposArr.length===1){
        apontar.elGrupoLocId = gruposArr[0][0];
      }

      if(!apontar.elGrupoLocId){
        const cards = gruposArr.map(([key,g])=>`
          <button class="tap-card" onclick="apontar.elGrupoLocId='${key}'; render();">
            <span class="tap-card-title">${esc(g.label)}</span>
            <span class="tap-card-sub">${g.elementos.length} elemento${g.elementos.length!==1?'s':''}</span>
          </button>
        `).join('');
        const msgVazio = totalNaEstrutura>0
          ? `<div class="empty"><div class="big">Todas as peças cadastradas em "${esc(estrutura.nome)}" já estão concluídas</div><p>Se precisar apontar em alguma delas de novo (retrabalho ou conclusão por engano), use "↺ Reabrir" na etapa concluída, no Painel — a peça volta a aparecer aqui.</p></div>`
          : `<div class="empty"><div class="big">Confirmado: "${esc(estrutura.nome)}" ainda não tem nenhum elemento cadastrado</div><p>Antes de liberar uma etapa, cadastre ao menos uma peça (ex.: BL-01) para essa estrutura em "${esc(nomeProjeto(apontar.projetoId))}".</p>
              <button class="btn" style="margin-top:10px" onclick="setTab('elementos')">Ir para Elementos e cadastrar</button></div>`;
        return `
          <div class="card">
            <h3>3. Qual eixo/trecho? <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarEstrutura()">◂ trocar estrutura</span></h3>
            <p style="font-size:13px; color:var(--grafite-suave); margin:-6px 0 14px 0">${esc(nomeProjeto(apontar.projetoId))} · ${esc(estrutura.nome)}</p>
            ${gruposArr.length ? `<div class="tap-grid">${cards}</div>` : msgVazio}
          </div>`;
      }

      const grupoAtual = grupos[apontar.elGrupoLocId];
      const lista = grupoAtual ? ordenarElementosPorCodigo(grupoAtual.elementos) : [];
      const trocarEixoLink = gruposArr.length>1 ? `<span class="tag" style="cursor:pointer; text-decoration:underline" onclick="apontar.elGrupoLocId=null; render();">◂ trocar eixo/trecho</span>` : `<span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarEstrutura()">◂ trocar estrutura</span>`;
      const cards = lista.map(el=>`
        <button class="tap-card" onclick="selecionarElementoLiberar('${el.id}')">
          <span class="tap-card-title">${esc(el.codigo)}</span>
        </button>
      `).join('');
      return `
        <div class="card">
          <h3>3. Qual elemento? ${trocarEixoLink}</h3>
          <p style="font-size:13px; color:var(--grafite-suave); margin:-6px 0 14px 0">${esc(nomeProjeto(apontar.projetoId))} · ${esc(estrutura.nome)} · ${esc(grupoAtual ? grupoAtual.label : '')}${ocultosPorGrupo[apontar.elGrupoLocId] ? ` <span style="font-size:12px; opacity:.8">· ${ocultosPorGrupo[apontar.elGrupoLocId]} já executado${ocultosPorGrupo[apontar.elGrupoLocId]!==1?'s':''} (oculto${ocultosPorGrupo[apontar.elGrupoLocId]!==1?'s':''})</span>` : ''}</p>
          ${lista.length ? `<div class="tap-grid">${cards}</div>` : `<div class="empty"><div class="big">${ocultosPorGrupo[apontar.elGrupoLocId] ? 'Todos os elementos deste eixo/trecho já foram executados' : 'Nenhum elemento neste eixo/trecho'}</div></div>`}
        </div>`;
    }
  } else if(!apontar.faixaConfirmada){
    return renderSeletorTrechoFaixa('4', 'confirmarFaixaLiberar()');
  }

  if(estrutura.usaElementos && apontar.elementoId && !apontar.usarLocalizacao){
    const el = DB.elementos.find(x=>x.id===apontar.elementoId);
    const temTrecho = !!(el.trechoId && el.faixaInicio!=null);
    const temEixo = !!el.eixoInicioId;
    if(temTrecho && temEixo){
      return `
        <div class="card">
          <h3>4. Qual localização usar nesta liberação? <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarElemento()">◂ trocar elemento</span></h3>
          <p style="font-size:13px; color:var(--grafite-suave); margin:-6px 0 14px 0">${esc(nomeProjeto(apontar.projetoId))} · ${esc(estrutura.nome)} · ${esc(el.codigo)}</p>
          <p style="font-size:12px; color:var(--grafite-suave); margin-bottom:14px">Essa peça foi cadastrada com trecho e eixo — escolha qual vale pra essa liberação específica.</p>
          <div class="tap-grid">
            <button class="tap-card" onclick="escolherLocalizacaoElemento('trecho')">
              <span class="tap-card-title">Por trecho</span>
              <span class="tap-card-sub">${esc(trechoNomeCurto(el.trechoId))} · ${esc(faixaLabel(el.faixaInicio, el.faixaFim))}</span>
            </button>
            <button class="tap-card" onclick="escolherLocalizacaoElemento('eixo')">
              <span class="tap-card-title">Por eixo</span>
              <span class="tap-card-sub">${(() => { const ini=DB.estacas.find(x=>x.id===el.eixoInicioId); const fim=DB.estacas.find(x=>x.id===el.eixoFimId); return esc(fim && fim.id!==ini.id ? `${ini.trecho} a ${fim.trecho}` : ini.trecho); })()}</span>
            </button>
          </div>
        </div>`;
    } else if(temTrecho || temEixo){
      escolherLocalizacaoElemento(temTrecho ? 'trecho' : 'eixo');
      return renderApontarLiberar();
    } else {
      apontar.usarLocalizacao = 'none';
    }
  }

  const localizacaoTxt = apontar.elementoId
    ? (() => {
        const el = DB.elementos.find(x=>x.id===apontar.elementoId);
        if(apontar.usarLocalizacao==='eixo' && apontar.eixoInicioId){
          const ini = DB.estacas.find(x=>x.id===apontar.eixoInicioId);
          const fim = DB.estacas.find(x=>x.id===apontar.eixoFimId);
          return `${el.codigo} · Eixo ${fim && fim.id!==ini.id ? `${ini.trecho} a ${fim.trecho}` : ini.trecho}`;
        }
        if(apontar.usarLocalizacao==='trecho' && apontar.trechoId){
          return `${el.codigo} · ${trechoNomeCurto(apontar.trechoId)} · ${faixaLabel(formatEstacaVal(apontar.faixaInicio), formatEstacaVal(apontar.faixaFim))}`;
        }
        return el.codigo;
      })()
    : (() => { const min = Math.min(apontar.faixaInicio, apontar.faixaFim), max = Math.max(apontar.faixaInicio, apontar.faixaFim); return faixaLabel(formatEstacaVal(min), formatEstacaVal(max)); })();
  const trocarLocalLink = estrutura.usaElementos
    ? `<span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarElemento()">◂ trocar elemento</span>`
    : `<span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarIntervalo()">◂ trocar intervalo</span>`;

  if(!apontar.etapaId && !apontar.forcarEscolhaEtapa){
    const lista = etapasDoApontar();
    if(lista.length===1){ apontar.etapaId = lista[0].id; }
  }
  if(!apontar.etapaId){
    apontar.forcarEscolhaEtapa = false;
    const lista = etapasDoApontar();
    const cards = lista.map((e,i)=>{
      let orcTxt = e.desc ? esc(e.desc) : '';
      if(e.quantidadeOrcada!=null){
        const executado = DB.registros.filter(r=>r.elementoId===apontar.elementoId && r.etapaId===e.id).reduce((s,r)=>s+(r.quantidadeExecutada||0),0);
        orcTxt = `Orçado: ${e.quantidadeOrcada} ${esc(e.unidadeOrcada||'')} · executado: ${executado} ${esc(e.unidadeOrcada||'')}`;
      }
      return `
      <button class="tap-card" onclick="apontar.etapaId='${e.id}'; apontar.forcarEscolhaEtapa=false; render();">
        <span class="tap-card-num">${i+1}</span>
        <span class="tap-card-title" style="text-transform:none; font-size:13px">${esc(e.name)}</span>
        ${orcTxt ? `<span class="tap-card-sub">${orcTxt}</span>` : ''}
      </button>`;
    }).join('');
    const ondeGerenciar = apontar.elementoId ? `no Elemento "${esc(nomeElemento(apontar.elementoId))}", na aba Elementos` : `nessa estrutura, na aba Etapas`;
    // diagnostico: existe outro elemento com o MESMO codigo (nesta estrutura) que TEM etapas cadastradas? provavel duplicata
    let avisoDuplicataHtml = '';
    if(!lista.length && apontar.elementoId){
      const elAtual = DB.elementos.find(x=>x.id===apontar.elementoId);
      if(elAtual){
        const outrosComMesmoCodigo = DB.elementos.filter(x=>x.id!==elAtual.id && x.estruturaId===elAtual.estruturaId && x.codigo.toLowerCase()===elAtual.codigo.toLowerCase());
        const comEtapas = outrosComMesmoCodigo.filter(x=>etapasDoElemento(x.id).length>0);
        if(comEtapas.length){
          avisoDuplicataHtml = `
            <div class="card" style="border-left:3px solid var(--vermelho); margin-top:14px;">
              <p style="font-size:13px; margin:0 0 10px 0">⚠️ <strong>Encontrei uma duplicata!</strong> Existe outro elemento "${esc(elAtual.codigo)}" (mesma estrutura) que já tem ${etapasDoElemento(comEtapas[0].id).length} etapa(s) cadastrada(s). Provavelmente é esse que você quer usar:</p>
              <button class="btn small" onclick="selecionarElementoLiberar('${comEtapas[0].id}')">Usar esse "${esc(comEtapas[0].codigo)}" em vez do atual</button>
            </div>`;
        }
      }
    }
    return `
      <div class="card">
        <h3>5. Qual etapa? ${trocarLocalLink}</h3>
        <p style="font-size:12.5px; color:var(--grafite-suave); margin:-6px 0 14px 0; font-family:'IBM Plex Mono',monospace;">${breadcrumbApontar(false)}</p>
        ${lista.length ? `<div class="tap-grid">${cards}</div>` : `<div class="empty"><div class="big">Nenhuma etapa cadastrada</div><p>Cadastre etapas ${ondeGerenciar}.</p></div>`}
      </div>
      ${avisoDuplicataHtml}`;
  }

  if(!apontar.empresaId){
    const etapa = DB.etapas.find(e=>e.id===apontar.etapaId);
    if(!etapa){ apontar.etapaId = null; return renderApontarLiberar(); }
    const cards = DB.empresas.map(emp=>`
      <button class="tap-card ${emp.id===etapa.empresaPadraoId?'sugerida':''}" onclick="apontar.empresaId='${emp.id}'; render();">
        <span class="tap-card-title">${esc(emp.nome)}</span>
        ${emp.id===etapa.empresaPadraoId ? `<span class="chip verde">sugerida</span>` : ''}
      </button>
    `).join('');
    return `
      <div class="card">
        <h3>6. Qual empresa vai executar? <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="trocarEtapa()">◂ trocar etapa</span></h3>
        <p style="font-size:12.5px; color:var(--grafite-suave); margin:-6px 0 14px 0; font-family:'IBM Plex Mono',monospace;">${breadcrumbApontar(true)}</p>
        <div class="tap-grid">${cards}</div>
      </div>`;
  }

  const etapa = DB.etapas.find(e=>e.id===apontar.etapaId);
  if(!etapa){ apontar.etapaId = null; return renderApontarLiberar(); }
  return `
    <div class="card">
      <h3>7. ${apontar.inicioDireto ? 'Quando começou?' : 'Quando foi liberada?'} <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="apontar.empresaId=null; render();">◂ trocar empresa</span></h3>
      <p style="font-size:12.5px; color:var(--grafite-suave); margin:-6px 0 16px 0; font-family:'IBM Plex Mono',monospace;">${breadcrumbApontar(true)} <span style="color:var(--linha-grade)">›</span> ${esc(nomeEmpresa(apontar.empresaId))}</p>
      <button class="btn" onclick="liberarAgora()">${apontar.inicioDireto ? 'Começou agora ▸' : 'Agora ▸'}</button>
      <p style="font-size:12px; color:var(--grafite-suave); margin:18px 0 8px 0">${apontar.inicioDireto ? 'Ou informe o horário em que a equipe começou:' : 'Ou lance retroativo, se já foi liberada há um tempo e não deu pra apontar na hora:'}</p>
      <div class="field"><input type="datetime-local" id="liberar-retro-datetime" max="${nowLocalISO()}"></div>
      <button class="btn secondary" onclick="liberarRetroativo()">Usar esse horário</button>
    </div>`;
}
function selecionarElementoLiberar(elementoId){
  apontar.elementoId = elementoId;
  apontar.usarLocalizacao = null;
  apontar.trechoId = null; apontar.faixaInicio = null; apontar.faixaFim = null;
  apontar.eixoInicioId = null; apontar.eixoFimId = null;
  render();
}
window.selecionarElementoLiberar = selecionarElementoLiberar;
function escolherLocalizacaoElemento(tipo){
  const el = DB.elementos.find(x=>x.id===apontar.elementoId);

    apontar.trechoId = el.trechoId;

    apontar.faixaFim = parseEstacaVal(el.faixaFim);
    apontar.eixoInicioId = null; apontar.eixoFimId = null;
  } else {
    apontar.eixoInicioId = el.eixoInicioId;
    apontar.eixoFimId = el.eixoFimId;
    apontar.trechoId = null; apontar.faixaInicio = null; apontar.faixaFim = null;

}
window.escolherLocalizacaoElemento = escolherLocalizacaoElemento;
function confirmarFaixaLiberar(){ if(apontar.faixaInicio===null) return; apontar.faixaConfirmada = true; render(); }
window.confirmarFaixaLiberar = confirmarFaixaLiberar;
function liberarAgora(){ criarRegistro(nowLocalISO()); }
window.liberarAgora = liberarAgora;
function liberarRetroativo(){
  const valor = document.getElementById('liberar-retro-datetime').value;
  if(!valor){ showToast('Escolha um horário.'); return; }
  if(new Date(valor) > new Date()){ showToast('O horário não pode ser no futuro.'); return; }
  criarRegistro(valor);
}
window.liberarRetroativo = liberarRetroativo;
function criarRegistro(liberacaoISO){
  const trechoId = apontar.trechoId;
  const faixaInicio = apontar.faixaInicio!==null ? formatEstacaVal(Math.min(apontar.faixaInicio, apontar.faixaFim)) : null;
  const faixaFim = apontar.faixaInicio!==null ? formatEstacaVal(Math.max(apontar.faixaInicio, apontar.faixaFim)) : null;
  const eixoInicioId = apontar.eixoInicioId || null;
  const eixoFimId = apontar.eixoFimId || null;
  const reg = { id: uid(), projetoId: apontar.projetoId, trechoId, faixaInicio, faixaFim, eixoInicioId, eixoFimId, estruturaId: apontar.estruturaId, etapaId: apontar.etapaId, empresaId: apontar.empresaId,
    liberacao: liberacaoISO, inicio: null, termino: null, pausas: [], pausadoDesde: null, obs: '', recursos: [], efetivoDiario: [], ocorrencias: [], quantidadeExecutada: null, unidadeExecutada: null, elementoId: apontar.elementoId || null, createdAt: Date.now() };
  if(apontar.inicioDireto){
    // início direto: liberação = início → ociosidade zero
    reg.inicio = liberacaoISO; reg.inicioDireto = true;
    DB.registros.push(reg);
    persist.registros();
    voltarMenu(); apontar.acao = 'iniciar'; apontar.efetivoRegId = reg.id; render();
    showToast(`Iniciada (sem liberação): ${regFrenteLabel(reg)} — ${nomeEtapa(reg.etapaId)}`, 'Desfazer', () => {
      DB.registros = DB.registros.filter(r=>r.id!==reg.id); persist.registros(); voltarMenu(); });
    return;
  }
  DB.registros.push(reg);
  persist.registros();
  voltarMenu();
  showToast(`Liberada: ${regFrenteLabel(reg)} — ${nomeEtapa(reg.etapaId)} (${nomeEmpresa(reg.empresaId)})`, 'Desfazer', () => {
    DB.registros = DB.registros.filter(r=>r.id!==reg.id);
    persist.registros();
    render();
  });
}

      <div style="cursor:pointer; display:flex; flex-direction:column; align-items:stretch; gap:6px;" onclick="${selApontar.ativo ? `toggleSelecionadoApontar('${r.id}')` : `apontar.confirmarInicioId='${r.id}'; render();`}">

  <div class="card"><h3>Marcar início ${voltarLink('menu')} <span class="tag">${selApontar.ativo?'toque nos cards para selecionar':'toque quando o efetivo entrar'}</span> ${botaoSelecao()}</h3>${barraSelecao(lista)}<div class="tap-grid" style="grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));">${cards}</div></div>`;

/* -- EFETIVO DO DIA (profissionais da empresa executora) — reutilizável -- */
function renderEfetivoStepper(regId, origemAcao){
  const reg = DB.registros.find(r=>r.id===regId);
  if(!reg){ apontar.efetivoRegId=null; return renderApontar(); }
  const empresa = DB.empresas.find(e=>e.id===reg.empresaId);
  const profissionais = (empresa && empresa.profissionais) || [];
  if(!apontar.efetivoData) apontar.efetivoData = dataTurno(reg);
  const data = apontar.efetivoData;
  if(!reg.efetivoDiario) reg.efetivoDiario = [];
  let entrada = reg.efetivoDiario.find(e=>e.data===data);
  function qtd(profId){ if(!entrada) return 0; const it = entrada.itens.find(i=>i.profissionalId===profId); return it ? it.quantidade : 0; }
  const cards = profissionais.map(p=>`
    <div class="stepper-row">
      <span class="nome">${esc(p.nome)}</span>
      <div class="stepper-controls">
        <button class="btn small ghost" onclick="alterarQtdProfissional('${regId}','${p.id}','${esc(p.nome)}',-1)">−</button>
        <span class="qtd">${qtd(p.id)}</span>
        <button class="btn small ghost" onclick="alterarQtdProfissional('${regId}','${p.id}','${esc(p.nome)}',1)">+</button>
      </div>
    </div>`).join('');
  const dataInicioReg = reg.inicio ? reg.inicio.slice(0,10) : hojeStr();
  const horaInicioPadrao = horaInicioPadraoDia(reg, data);
  const _jDia = janelasDoDia(data, reg.projetoId, calendarioIdDoReg(reg)).janelas;
  const fimJornada = _jDia.length ? _jDia[_jDia.length-1].fim : null;
  const horaFimVal = entrada ? (entrada.horaFim||'') : '';
  const horaInicioVal = entrada ? (entrada.horaInicio||horaInicioPadrao) : horaInicioPadrao;
  return `
    <div class="card">
      <h3>Efetivo do dia <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="pularEfetivo('${regId}')">◂ pular / menu</span> <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="state.tab='efetivo'; render();">ver todos os lançamentos ▸</span></h3>
      <p style="font-size:13px; color:var(--grafite-suave); margin-bottom:10px">${esc(regFrenteLabel(reg))} · ${esc(nomeEtapa(reg.etapaId))} · <strong style="color:var(--grafite)">${esc(nomeEmpresa(reg.empresaId))}</strong></p>
      <div class="grid3" style="align-items:end">
        <div class="field" style="margin-bottom:0"><label>Data do turno ${data===dataTurno(reg) ? (data===hojeStr() ? '(hoje)' : '(turno da noite anterior)') : '(retroativo)'}</label><input type="date" value="${data}" min="${dataInicioReg}" max="${hojeStr()}" onchange="apontar.efetivoData=this.value; render();"></div>
        <div class="field" style="margin-bottom:0"><label>Início do dia</label><input type="time" value="${horaInicioVal}" onchange="atualizarHoraDia('${regId}','horaInicio', this.value)"></div>
        <div class="field" style="margin-bottom:0"><label>Fim do dia <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="atualizarHoraDia('${regId}','horaFim', horaAgora())">usar agora</span>${fimJornada ? ` <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="atualizarHoraDia('${regId}','horaFim','${fimJornada}')">fim da jornada ${fimJornada}</span>` : ''}</label><input type="time" value="${horaFimVal}" onchange="atualizarHoraDia('${regId}','horaFim', this.value)"></div>
      </div>
      <p style="font-size:11.5px; color:var(--grafite-suave); margin:8px 0 18px 0;">Preencher início/fim aqui "encerra o dia" — nesse dia vale o horário real informado (descontando o almoço do calendário); dias não encerrados usam a jornada da aba Calendário. Esqueceu ontem? Só voltar a data acima e preencher.</p>
      ${profissionais.length ? cards : `<div class="empty"><div class="big">Nenhum profissional cadastrado</div><p>Cadastre os tipos de profissional de "${esc(nomeEmpresa(reg.empresaId))}" na aba Empresas.</p></div>`}
      ${renderTurnosExtras(reg, data)}
      <button class="btn" style="margin-top:16px" onclick="confirmarEfetivo('${regId}','${origemAcao}')">Confirmar efetivo desse dia ▸</button>
    </div>`;
}
/* -- turnos extras (2ª equipe no mesmo lançamento, ex.: noturna) -- */
function janelasSugeridasTurnoExtra(reg, data){
  const cal = DB.calendario;
  const principal = calendarioIdDoReg(reg);
  const alvo = cal.calendarios.find(c=>c.id==='noturno' && c.id!==principal) || cal.calendarios.find(c=>c.id!==principal);
  if(alvo){ const wd = new Date(data+'T12:00:00').getDay(); if((alvo.semana[wd]||[]).length) return alvo.semana[wd]; return jornadaBase(alvo.id); }
  return [{ini:'22:00',fim:'05:00'}];
}
function _extraDe(regId, data, extraId){
  const reg = DB.registros.find(r=>r.id===regId); if(!reg) return {};
  const entrada = (reg.efetivoDiario||[]).find(e=>e.data===data);
  const x = entrada && (entrada.extras||[]).find(x=>x.id===extraId);

}

function alterarQtdTurnoExtra(regId, data, extraId, profissionalId, nome, delta){

  if(!item){ item = { profissionalId, nome, quantidade: 0 }; x.itens.push(item); }

function ocorrenciasAbertasDe(reg){ return (reg.ocorrencias||[]).filter(o=>!o.fim); }
function duracaoOcorrencia(oc){
  const fim = oc.fim ? new Date(oc.fim) : new Date();
  return Math.max(0, (fim - new Date(oc.inicio)) / 3600000);
}
function nowLocalISOValueForInput(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function isoParaInputDatetime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function abrirOcorrencia(ev, regId){
  ev.preventDefault();
  const f = ev.target;
  const reg = DB.registros.find(r=>r.id===regId);
  if(!reg) return false;
  if(!reg.ocorrencias) reg.ocorrencias = [];
  const tipoSel = f.tipo.value;
  const tipoOutro = f.tipoOutro ? f.tipoOutro.value.trim() : '';
  const tipo = tipoSel==='Outro' ? tipoOutro : tipoSel;
  const descricao = f.descricao.value.trim() || null;
  const inicioVal = f.inicio.value;
  if(!tipoSel || (tipoSel==='Outro' && !tipoOutro)){ showToast('Escolha (ou especifique) o tipo da ocorrência.'); return false; }
  if(!inicioVal){ showToast('Informe o horário de início.'); return false; }
  reg.ocorrencias.push({ id: uid(), tipo, descricao, inicio: new Date(inicioVal).toISOString(), fim: null, createdAt: Date.now() });
  persist.registros();
  showToast('Ocorrência registrada.');
  f.reset();
  render();
  return false;
}

    return `<div class="card"><h3>Concluir etapa ${voltarLink('menu')}</h3>

  const cards = lista.map(r=>{
    const h = execHours(r);

    return `

        <span class="projeto-tag" style="align-self:flex-start">${esc(nomeProjeto(r.projetoId))}</span>
        <span class="tap-card-title" style="text-transform:none; font-size:13px; white-space:normal; line-height:1.35;">${esc(nomeEstrutura(r.estruturaId))} · ${esc(regFrenteLabel(r))}</span>
        <span class="tap-card-sub" style="white-space:normal; line-height:1.5;">${esc(nomeEtapa(r.etapaId))} · ${esc(nomeEmpresa(r.empresaId))}</span>
        ${pausado
          ? `<span class="chip amarelo pulse" style="margin-top:2px; align-self:flex-start;">pausado · ${fmtHoras(h)} até agora</span>`
          : `<span class="chip roxo pulse" style="margin-top:2px; align-self:flex-start;">em execução há ${fmtHoras(h)}</span>`}
        ${(() => { const dt = dataTurno(r); const hoje = (r.efetivoDiario||[]).find(e=>e.data===dt); return hoje && hoje.horaFim ? `<span class="chip verde" style="margin-top:4px; align-self:flex-start;">turno ${dt===hojeStr()?'de hoje':'da noite anterior'} encerrado às ${hoje.horaFim}</span>` : ''; })()}
        ${ocsAbertas.length ? `<span class="chip vermelho pulse" style="margin-top:4px; align-self:flex-start;">⚠ ${ocsAbertas.length>1 ? `${ocsAbertas.length} ocorrências em aberto` : `${esc(ocsAbertas[0].tipo)} em aberto`}</span>` : ''}
        ${pausado && !selApontar.ativo ? `<input type="text" value="${esc(r.pausaObsAtual||'')}" placeholder="Motivo da pausa (opcional)" onchange="atualizarObsPausaAtual('${r.id}', this.value)" style="font-size:11.5px; padding:5px 8px; margin-top:6px; width:100%;">` : ''}
        <div style="display:${selApontar.ativo?'none':'flex'}; gap:6px; margin-top:10px; width:100%; flex-wrap:wrap">

          <button class="btn small ghost" onclick="apontar.efetivoData=null; apontar.efetivoRegId='${r.id}'; render();">🌙 Encerrar o dia</button>
          <button class="btn small ghost" onclick="apontar.alocarRegId='${r.id}'; render();">+ Recursos de apoio</button>
          ${(()=>{ const el = r.elementoId && DB.elementos.find(e=>e.id===r.elementoId); if(!el || !geoRaiz(el)) return '';
              const n = (nomeEtapa(r.etapaId)||'').toUpperCase(); const perf = /PERFUR/.test(n), inj = /INJE|CONCRET|ARGAMASS/.test(n);
              return `${perf || !inj ? `<button class="btn small ghost" onclick="abrirRaiz('perf','${r.id}')">⛏ Perfuração${perfuracaoDe(el.id)?' ✓':''}</button>` : ''}${inj || !perf ? `<button class="btn small ghost" onclick="abrirRaiz('inj','${r.id}')">▦ Injeção${batidasDoElemento(el.id).length?' ('+batidasDoElemento(el.id).length+')':''}</button>` : ''}`; })()}

  return `<div class="card"><h3>Concluir etapa ${voltarLink('menu')} <span class="tag">${selApontar.ativo?'toque nos cards para selecionar':'pause se precisar remanejar equipamento/material'}</span> ${botaoSelecao()}</h3>${barraSelecao(lista)}<div class="tap-grid" style="grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));">${cards}</div></div>`;

function pausarRegistro(id){
  const r = DB.registros.find(x=>x.id===id);
  if(r.pausadoDesde) return;
  r.pausadoDesde = nowLocalISO();
  r.pausaObsAtual = null;
  persist.registros();
  showToast('Etapa pausada.');
  render();
}
window.pausarRegistro = pausarRegistro;
function atualizarObsPausaAtual(id, valor){
  const r = DB.registros.find(x=>x.id===id);
  if(!r || !r.pausadoDesde) return;
  r.pausaObsAtual = valor.trim() || null;
  persist.registros();
}
window.atualizarObsPausaAtual = atualizarObsPausaAtual;
function atualizarInicioPausaAtual(id, valor){
  const r = DB.registros.find(x=>x.id===id);
  if(!r || !r.pausadoDesde) return;
  if(!valor){ showToast('O início da pausa não pode ficar vazio.'); render(); return; }
  const novoInicio = new Date(valor);
  if(novoInicio > new Date()){ showToast('O início da pausa não pode ser no futuro.'); render(); return; }
  r.pausadoDesde = novoInicio.toISOString();
  persist.registros();
  showToast('Início da pausa atualizado.');
  render();
}
window.atualizarInicioPausaAtual = atualizarInicioPausaAtual;
function retomarRegistro(id){
  const r = DB.registros.find(x=>x.id===id);
  if(!r.pausadoDesde) return;
  if(!r.pausas) r.pausas = [];
  r.pausas.push({ id: uid(), inicio: r.pausadoDesde, fim: nowLocalISO(), obs: r.pausaObsAtual || null, tipo: r.pausaTipoAtual || null });
  r.pausaTipoAtual = null;
  r.pausadoDesde = null;
  r.pausaObsAtual = null;
  persist.registros();
  showToast('Etapa retomada.');
  render();
}
window.retomarRegistro = retomarRegistro;
function duracaoPausa(p, aberta){
  const fim = p.fim ? new Date(p.fim) : new Date();
  return Math.max(0, (fim - new Date(p.inicio)) / 3600000);
}
function totalPausadoReg(reg){
  let total = (reg.pausas||[]).reduce((s,p)=>s+duracaoPausa(p), 0);
  if(reg.pausadoDesde) total += duracaoPausa({ inicio: reg.pausadoDesde, fim: null });
  return total;
}
function atualizarPausa(regId, pausaId, campo, valor){
  const reg = DB.registros.find(r=>r.id===regId);
  const p = reg && (reg.pausas||[]).find(x=>x.id===pausaId);
  if(!p) return;
  if(campo==='inicio' || campo==='fim'){
    if(campo==='inicio' && !valor){ showToast('O início não pode ficar vazio.'); render(); return; }
    p[campo] = valor ? new Date(valor).toISOString() : null;
  } else {
    p[campo] = valor.trim() || null;
  }
  if(p.fim && new Date(p.fim) <= new Date(p.inicio)){ showToast('O fim da pausa precisa ser depois do início.'); }
  persist.registros();
  showToast('Pausa atualizada.');
  render();
}
window.atualizarPausa = atualizarPausa;
function atualizarTipoPausaAtual(id, valor){
  const r = DB.registros.find(x=>x.id===id); if(!r || !r.pausadoDesde) return;
  r.pausaTipoAtual = valor || null; persist.registros(); render();
}
window.atualizarTipoPausaAtual = atualizarTipoPausaAtual;
function registrarPausaManual(ev, regId){
  ev.preventDefault();
  const f = ev.target, reg = DB.registros.find(r=>r.id===regId); if(!reg) return false;
  const tipo = f.tipo.value, ini = f.inicio.value, fim = f.fim.value, obs = f.obs.value.trim();
  if(!tipo){ showToast('Escolha o motivo da pausa.'); return false; }
  if(!ini){ showToast('Informe o início da pausa.'); return false; }
  const iniD = new Date(ini), fimD = fim ? new Date(fim) : null, agora = new Date();
  if(iniD > agora){ showToast('O início não pode ser no futuro.'); return false; }
  if(reg.inicio && iniD < new Date(reg.inicio)){ showToast('A pausa não pode começar antes do início da etapa.'); return false; }
  if(fimD && fimD <= iniD){ showToast('O fim precisa ser depois do início.'); return false; }
  if(fimD && fimD > agora){ showToast('O fim não pode ser no futuro.'); return false; }
  if(reg.termino && (!fimD || fimD > new Date(reg.termino))){ showToast('Etapa concluída: a pausa precisa terminar até a conclusão.'); return false; }
  const a = iniD.getTime(), b = fimD ? fimD.getTime() : Infinity;
  const choca = (reg.pausas||[]).some(p=>{ const x = new Date(p.inicio).getTime(), y = p.fim ? new Date(p.fim).getTime() : Date.now(); return a < y && x < b; })
    || (reg.pausadoDesde && a < Date.now() && new Date(reg.pausadoDesde).getTime() < b);
  if(choca){ showToast('Essa pausa se sobrepõe a outra já registrada.'); return false; }
  if(!fimD){
    if(reg.pausadoDesde){ showToast('Já existe uma pausa em aberto.'); return false; }
    reg.pausadoDesde = ini; reg.pausaTipoAtual = tipo; reg.pausaObsAtual = obs || null;
  } else {
    if(!reg.pausas) reg.pausas = [];
    reg.pausas.push({ id: uid(), inicio: ini, fim, tipo, obs: obs || null, manual: true });
  }
  persist.registros(); showToast(fimD ? 'Pausa registrada.' : 'Pausa em aberto registrada: a etapa está pausada.'); render();
  return false;
}
window.registrarPausaManual = registrarPausaManual;
function excluirPausa(regId, pausaId){
  if(!confirm('Excluir esse registro de pausa?')) return;
  const reg = DB.registros.find(r=>r.id===regId);
  if(!reg) return;
  reg.pausas = (reg.pausas||[]).filter(p=>p.id!==pausaId);
  persist.registros();
  showToast('Pausa excluída.');
  render();
}
window.excluirPausa = excluirPausa;
function concluirRegistroAgora(id){
  const r = DB.registros.find(x=>x.id===id);
  const prevTermino = r.termino;
  const prevPausadoDesde = r.pausadoDesde;
  const prevPausas = (r.pausas||[]).slice();
  if(r.pausadoDesde){
    r.pausas = [...(r.pausas||[]), { inicio: r.pausadoDesde, fim: nowLocalISO() }];
    r.pausadoDesde = null;
  }
  r.termino = nowLocalISO();
  persist.registros();
  apontar.quantidadeRegId = id;
  render();
  showToast('Etapa concluída.', 'Desfazer', () => {
    r.termino = prevTermino; r.pausadoDesde = prevPausadoDesde; r.pausas = prevPausas;
    apontar.quantidadeRegId = null;
    persist.registros();
    render();
  });
}
window.concluirRegistroAgora = concluirRegistroAgora;
function reabrirRegistro(id){
  const r = DB.registros.find(x=>x.id===id);
  if(!r || !r.termino) return;
  if(!confirm('Reabrir esta etapa e voltar para "Em execução"? Isso desfaz a conclusão.')) return;

}
window.reabrirRegistro = reabrirRegistro;

function renderAlocarRecursos(regId){

        </div>
      </div>`;
  }).join('');

  // -- disponíveis: lista compacta, um toque adiciona 1 e o item sobe pra "alocados" --
  const empresasComRecurso = DB.empresas.filter(emp => DB.recursos.some(r=>r.empresaId===emp.id));
  const gruposHtml = empresasComRecurso.map((emp, idx)=>{
    const disponiveis = DB.recursos.filter(r=>r.empresaId===emp.id && !idsAlocados.has(r.id));
    if(!disponiveis.length) return '';
    const itensHtml = disponiveis.map(r=>`

    return `
      <details class="grupo-recolhivel" ${gruposRecApoioAbertos(regId).has(emp.id) ? 'open' : ''} ontoggle="toggleGrupoRecApoio('${regId}','${emp.id}', this.open)">

        <div class="lista-compacta">${itensHtml}</div>

  const semNadaCadastrado = DB.recursos.length===0;

      ${idsAlocados.size ? `<h4 style="font-size:11px; color:var(--grafite-suave); text-transform:uppercase; letter-spacing:0.04em; margin:0 0 8px 0;">Alocados</h4>${alocadosHtml}<div style="margin:16px 0 14px 0; border-top:1px solid var(--linha-grade);"></div>` : ''}
      ${gruposHtml || (semNadaCadastrado ? `<div class="empty"><div class="big">Nenhum recurso cadastrado</div><p>Cadastre mão de obra e equipamentos na aba Recursos.</p></div>` : '')}

    </div>`;

function alterarQtdRecurso(regId, recursoId, delta){
  const reg = DB.registros.find(r=>r.id===regId);
  if(!reg.recursos) reg.recursos = [];
  let item = reg.recursos.find(x=>x.recursoId===recursoId);
  if(!item){ item = { recursoId, quantidade: 0 }; reg.recursos.push(item); }
  item.quantidade = Math.max(0, item.quantidade + delta);
  if(item.quantidade===0) reg.recursos = reg.recursos.filter(x=>x.recursoId!==recursoId);
  persist.registros();
  render();
}

function salvarQuantidadeExecutada(regId){
  const reg = DB.registros.find(r=>r.id===regId);

  reg.quantidadeExecutada = qtd;

   RANKINGS REUTILIZÁVEIS
--------------------------------------------------------- */
function normalizarNomeEtapa(nome){
  return String(nome||'').trim().replace(/\s+/g,' ').toUpperCase();
}
function montarRanking(items, calcH){
  const comH = items.map(x => ({ ...x, h: calcH(x), m: comprimentoFrenteMetros(x.faixaInicio, x.faixaFim) }));
  const totalH = comH.reduce((s,x)=>s+x.h, 0);
  const totalM = comH.reduce((s,x)=>s+x.m, 0);
  const media = comH.length ? totalH/comH.length : 0;
  const porEtapa = {};
  comH.forEach(x=>{
    const chave = normalizarNomeEtapa(nomeEtapa(x.etapaId));
    if(!porEtapa[chave]) porEtapa[chave] = { soma:0, n:0, metros:0, etapaId:x.etapaId, nome: nomeEtapa(x.etapaId).trim() };
    porEtapa[chave].soma += x.h; porEtapa[chave].n += 1; porEtapa[chave].metros += x.m;
  });
  const ranking = Object.values(porEtapa).map(v => ({
    nome: v.nome, etapaId: v.etapaId, media: v.soma/v.n, n: v.n, metros: v.metros, mPorHora: v.soma>0 ? v.metros/v.soma : null,
  })).sort((a,b)=>b.media-a.media);
  return { comH, mediaGeral: media, ranking, maxMedia: Math.max(...ranking.map(r=>r.media), 1), totalM, totalH, produtividadeGeral: totalH>0 ? totalM/totalH : null };
}
function rankingHtml(ranking, maxMedia, cor){
  return ranking.map(r=>`
    <div class="rank-row">
      <div class="label">${esc(nomeEtapa(r.etapaId))}</div>
      <div class="bar-track"><div class="bar-fill ${cor}" style="width:${Math.max((r.media/maxMedia)*100,2)}%"></div></div>
      <div class="val">${fmtHoras(r.media)} méd. · ${r.n}x${(r.metros>0 && r.mPorHora!==null) ? ` · ${r.metros}m · ${r.mPorHora.toFixed(1)} m/h` : ''}</div>
    </div>`).join('');
}
function montarRankingEmpresa(items, calcH){
  const comH = items.map(x => ({ ...x, h: calcH(x), m: comprimentoFrenteMetros(x.faixaInicio, x.faixaFim) }));
  const porEmpresa = {};
  comH.forEach(x=>{
    if(!porEmpresa[x.empresaId]) porEmpresa[x.empresaId] = { soma:0, n:0, metros:0 };
    porEmpresa[x.empresaId].soma += x.h; porEmpresa[x.empresaId].n += 1; porEmpresa[x.empresaId].metros += x.m;
  });
  const ranking = Object.entries(porEmpresa).map(([empresaId, v]) => ({
    empresaId, media: v.soma/v.n, n: v.n, metros: v.metros, mPorHora: v.soma>0 ? v.metros/v.soma : null,
  })).sort((a,b)=> (b.mPorHora||0) - (a.mPorHora||0));
  return { ranking, maxMPorHora: Math.max(...ranking.map(r=>r.mPorHora||0), 1) };
}
function rankingEmpresaHtml(ranking, maxMPorHora){
  return ranking.map(r=>`
    <div class="rank-row">
      <div class="label">${esc(nomeEmpresa(r.empresaId))}</div>
      <div class="bar-track"><div class="bar-fill verde" style="width:${Math.max(((r.mPorHora||0)/maxMPorHora)*100,2)}%"></div></div>
      <div class="val">${r.mPorHora!==null ? r.mPorHora.toFixed(1)+' m/h' : '—'} · ${fmtHoras(r.media)} méd. · ${r.n}x</div>
    </div>`).join('');
}

  if(state.tlFiltroDataAte) timeline = timeline.filter(r=>r.liberacao && r.liberacao.slice(0,10) <= state.tlFiltroDataAte);
  const maxH = Math.max(...regsH.map(r=>r.h), 1);
  const timelineHtml = timeline.length ? timeline.map(r=>{
    const sev = severidade(r.h);
    const situacao = r.inicio
      ? `<span class="chip ${sev}">${fmtHoras(r.h)} ocioso</span>`
      : `<span class="chip vermelho pulse">aguardando efetivo · ${fmtHoras(r.h)}</span>`;
    return `<div class="idle-row">
        <div class="head">
          <span class="name">${esc(regFrenteLabel(r))} · ${esc(nomeEtapa(r.etapaId))} · <span class="empresa-tag">${esc(nomeEmpresa(r.empresaId))}</span></span>
          <span class="meta">Liberada ${fmtDataHora(r.liberacao)} ${r.inicio?`→ iniciada ${fmtDataHora(r.inicio)}`:''}</span>
        </div>
        <div class="bar-track"><div class="bar-fill ${sev}" style="width:${Math.max((r.h/maxH)*100,2)}%"></div></div>
        <div style="margin-top:5px">${situacao}</div>
      </div>`;
  }).join('') : `<div class="board-empty">Nenhum registro com esse filtro</div>`;

  // Ociosidade por dia acompanha o mesmo filtro da linha do tempo: geral quando não há filtro, só os filtrados quando há.
  const porDia = {};
  timeline.forEach(r=>{
    const d = new Date(r.liberacao);
    if(isNaN(d.getTime())) return;
    const key = d.toISOString().slice(0,10);
    porDia[key] = (porDia[key]||0) + r.h;
  });
  const dias = Object.keys(porDia).sort();
  const maxDia = Math.max(...Object.values(porDia), 1);
  const daybarsHtml = dias.length ? dias.map(k=>{
    const v = porDia[k];
    const alt = new Date(k+'T12:00:00');
    return `<div class="daybar" style="cursor:pointer" title="Ver atividades liberadas em ${alt.toLocaleDateString('pt-BR')}" onclick="irParaOciosidadeDoDia('${k}')"><div class="val">${fmtHoras(v)}</div><div class="col" style="height:${Math.max((v/maxDia)*100,3)}px"></div><div class="dlabel">${alt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div></div>`;
  }).join('') : `<div class="board-empty">Nenhum registro com esse filtro</div>`;

  // Relatório de impressão dedicado da linha do tempo: só o filtro escolhido (ou tudo, se nenhum filtro ativo) + gráfico.
  const tlFiltroPartes = [];
  if(state.tlFiltroEmpresa!=='all') tlFiltroPartes.push(`Empresa: ${nomeEmpresa(state.tlFiltroEmpresa)}`);
  if(state.tlFiltroDataDe) tlFiltroPartes.push(`Liberada de: ${fmtData(state.tlFiltroDataDe)}`);
  if(state.tlFiltroDataAte) tlFiltroPartes.push(`Liberada até: ${fmtData(state.tlFiltroDataAte)}`);
  const tlFiltroResumo = tlFiltroPartes.length ? tlFiltroPartes.join(' · ') : 'Todos os registros (nenhum filtro aplicado)';
  const relatorioTimelinePrint = `
    <div id="painel-relatorio-print" class="only-print">
      <div class="card relatorio-header">
        <img src="${document.querySelector('#brand img').src}" alt="AH Brant" style="height:40px; width:auto; border-radius:3px;">
        <div>
          <h2 style="font-size:18px; margin-bottom:2px;">Relatório de Ociosidade — Linha do tempo de liberações</h2>
          <p style="font-size:12px; color:var(--grafite-suave); margin:0;">${esc(tlFiltroResumo)} · gerado em ${fmtDataHora(nowLocalISO())}</p>
        </div>
      </div>
      <div class="card">
        <h3>Ociosidade por dia de liberação <span class="tag">soma de horas ociosas</span></h3>
        <div class="daybars">${daybarsHtml}</div>
      </div>
      <div class="card">
        <h3>Linha do tempo de liberações <span class="tag">${timeline.length} registro(s)</span></h3>
        ${timelineHtml}
      </div>
    </div>`;

  return `
    <div class="topbar no-print"><div><h2>Painel</h2><p class="desc">Visão geral de todas as frentes: ociosas, em execução e concluídas.</p></div>
      ${filtros}
    </div>
    <div class="no-print">${board}</div>
    <div class="no-print">${efetivoHojeCard}</div>
    <div class="card no-print">
      <div class="kpi-row">
        <div class="kpi"><div class="label">Ociosidade total</div><div class="value">${fmtHoras(totalHoras)}</div></div>
        <div class="kpi"><div class="label">Ociosidade média</div><div class="value">${fmtHoras(mediaHoras)}</div></div>
        <div class="kpi"><div class="label">Aguardando efetivo agora</div><div class="value" style="color:${aguardando.length>0?'var(--vermelho)':'var(--verde)'}">${aguardando.length}</div></div>
        <div class="kpi"><div class="label">Etapa mais crítica</div><div class="value" style="font-size:14px; font-family:'Oswald',sans-serif; text-transform:uppercase;">${esc(etapaCritica)}</div></div>
      </div>
    </div>
    <div class="card no-print"><h3>Ociosidade média <span class="tag">${ranking.length} ${LABELS_NIVEIS_OCIOSIDADE[painelNivel].toLowerCase()}(s)</span></h3>
      <div class="niveis">${niveisBtnsHtml}</div>
      <div class="crumb">${crumbHtml}</div>
      ${rankingOcioHtml}
    </div>
    <div class="card no-print"><h3>Ociosidade por dia de liberação <span class="tag">${tlFiltroAtivo ? `soma de horas ociosas · filtrado (${timeline.length} registro${timeline.length!==1?'s':''})` : 'soma de horas ociosas · todos os registros · clique num dia pra ver as atividades'}</span></h3><div class="daybars">${daybarsHtml}</div></div>
    <div class="card no-print" id="painel-timeline"><h3>Linha do tempo de liberações <span class="tag">${timeline.length} registro(s)${tlFiltroAtivo?' filtrado(s)':''}, mais recentes primeiro</span> <button class="btn small ghost" style="margin-left:6px" onclick="window.print()">${ICONS.print} Exportar / Imprimir relatório</button></h3>${tlFiltros}${timelineHtml}</div>

    <div class="card"><h3>Produtividade por empresa <span class="tag">comparativo — mais produtiva primeiro</span></h3>${rankingEmpresaHtml(RE.ranking, RE.maxMPorHora)}</div>

function listaDiarioLinhas(){
  const linhas = [];
  DB.registros.forEach(r=>{

      if(!entrada.itens || !entrada.itens.length) return;
      linhas.push({
        data: entrada.data, empresaId: entrada.empresaId, projetoId: r.projetoId,
        frente: regFrenteLabel(r) + (entrada.turno ? ` · ${entrada.turno}` : ''), etapa: nomeEtapa(r.etapaId), estrutura: nomeEstrutura(r.estruturaId),
        itens: entrada.itens, totalQuantidade: entrada.itens.reduce((s,i)=>s+(i.quantidade||0),0),
        registroId: r.id, turno: entrada.turno,
        horaInicio: entrada.horaInicio||null, horaFim: entrada.horaFim||null,
      });
    });
  });
  return linhas.sort((a,b)=> b.data.localeCompare(a.data));

/* =========================================================
   RDO — RELATÓRIO DIÁRIO DE OBRA
========================================================= */
const RDO_TEMPOS = ['Bom','Nublado','Chuva fraca','Chuva forte'];
const RDO_PERIODOS = [['manha','Manhã'],['tarde','Tarde'],['noite','Noite']];
function _msDia(d){ return new Date(`${d}T00:00:00`).getTime(); }
function _hhmm(ms){ const x = new Date(ms); return `${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`; }
function numRDO(r){ return String(r.numero||0).padStart(3,'0'); }
function diaSemanaExt(d){ return ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][new Date(d+'T12:00:00').getDay()]; }
function prazoRDO(projetoId, data){
  const pj = DB.projetos.find(p=>p.id===projetoId);
  const ct = pj && DB.contratos.find(c=>c.id===pj.contratoId);
  if(!ct || !ct.dataOrdemInicio || !ct.prazoDias) return { prazo:null, decorridos:null, restantes:null, contrato: ct ? (ct.codigo + (ct.nome?' — '+ct.nome:'')) : null };
  const dec = Math.floor((_msDia(data) - _msDia(ct.dataOrdemInicio))/86400000) + 1;
  return { prazo: ct.prazoDias, decorridos: dec, restantes: ct.prazoDias - dec, contrato: ct.codigo + (ct.nome?' — '+ct.nome:'') };
}
function situacaoNoDia(r, d){
  const a = _msDia(d), b = a + 86400000;
  const t = v => v ? new Date(v).getTime() : null;
  const lib = t(r.liberacao), ini = t(r.inicio), ter = t(r.termino);
  const pausas = (r.pausas||[]).map(p=>[t(p.inicio), p.fim ? t(p.fim) : Date.now()]);
  if(r.pausadoDesde && !r.termino) pausas.push([t(r.pausadoDesde), Date.now()]);
  const pausouNoDia = pausas.some(([x,y])=>x<b && y>a);
  if(ter && ter>=a && ter<b) return 'Concluída';
  if(ini && ini>=a && ini<b) return pausouNoDia ? 'Iniciada (pausada)' : 'Iniciada';
  if(ini && ini<a && (!ter || ter>=b)) return pausouNoDia ? 'Pausada' : 'Em execução';
  if(!ini && lib && lib>=a && lib<b) return 'Liberada';
  return null;
}
function dadosAutoRDO(projetoId, d){
  const a = _msDia(d), b = a + 86400000;
  const regs = DB.registros.filter(r=>r.projetoId===projetoId);
  // efetivo: vale o efetivo geral da empresa no dia; sem geral, usa o apontado nas frentes (inclui turnos extras)
  const ef = {};
  const add = (emp, tipo, q) => { if(!ef[emp]) ef[emp] = { direto:0, indireto:0 }; ef[emp][tipo==='indireto'?'indireto':'direto'] += (q||0); };
  const geral = DB.efetivoGeral.filter(g=>g.data===d && g.projetoId===projetoId);
  const comGeral = new Set(geral.map(g=>g.empresaId));
  geral.forEach(g=>add(g.empresaId, g.tipo || tipoAprendido(g.empresaId, g.profissional) || 'direto', g.quantidade));
  let turnoNoturno = false;
  regs.forEach(r=>turnosEfetivoReg(r).filter(t=>t.data===d).forEach(t=>{
    if(t.turno) turnoNoturno = true;
    if(comGeral.has(t.empresaId)) return;
    t.itens.forEach(i=>add(t.empresaId, tipoAprendido(t.empresaId, i.nome) || 'direto', i.quantidade));
  }));
  const efetivo = Object.entries(ef).map(([empresaId,v])=>({ empresaId, empresa: nomeEmpresa(empresaId), direto:v.direto, indireto:v.indireto }))
    .filter(x=>x.direto+x.indireto>0).sort((x,y)=>x.empresa.localeCompare(y.empresa));
  const atividades = [];
  regs.forEach(r=>{ const sit = situacaoNoDia(r, d); if(sit) atividades.push({ frente: regFrenteLabel(r), etapa: nomeEtapa(r.etapaId), empresa: nomeEmpresa(r.empresaId), situacao: sit }); });
  const ocorrencias = [];
  regs.forEach(r=>{
    const fr = regFrenteLabel(r);
    const pausas = (r.pausas||[]).map(p=>({ ini:new Date(p.inicio).getTime(), fim:p.fim?new Date(p.fim).getTime():null, obs:p.obs }));
    if(r.pausadoDesde && !r.termino) pausas.push({ ini:new Date(r.pausadoDesde).getTime(), fim:null, obs:r.pausaObsAtual });
    pausas.filter(p=>p.ini<b && (!p.fim || p.fim>a)).forEach(p=>{
      ocorrencias.push(`${fr} — ${p.ini>=a ? `pausada às ${_hhmm(p.ini)}` : 'pausada desde '+fmtData(ymdLocal(p.ini))}${p.obs?': '+p.obs:''}${p.fim && p.fim<b ? ` (retomada às ${_hhmm(p.fim)})` : ''}.`);
    });
    (r.ocorrencias||[]).forEach(o=>{
      const oi = new Date(o.inicio).getTime(), of = o.fim ? new Date(o.fim).getTime() : null;
      if(oi<b && (!of || of>=a)) ocorrencias.push(`${fr} — ocorrência ${of && of<b ? 'resolvida' : 'aberta'}: ${o.tipo}${o.descricao?' — '+o.descricao:''}.`);
    });
  });
  return { efetivo, atividades, ocorrencias, turnoNoturno };
}
function equipamentosCatalogo(){
  const porEmp = {};
  DB.recursos.filter(r=>r.tipo==='equipamento').forEach(r=>{ (porEmp[r.empresaId||''] = porEmp[r.empresaId||''] || []).push(r); });

function novoRDO(d){
  const pid = state.rdoProjetoId;
  if(!d){ showToast('Informe a data.'); return; }
  const existe = DB.rdos.find(r=>r.projetoId===pid && r.data===d);
  if(existe){ state.rdoAbertoId = existe.id; render(); return; }
  const doProj = DB.rdos.filter(r=>r.projetoId===pid);
  const numero = doProj.reduce((m,r)=>Math.max(m, r.numero||0), 0) + 1;
  const anterior = doProj.filter(r=>r.data<d).sort((a,b)=>b.data.localeCompare(a.data))[0];
  const clima = { manha:{ tempo:null, condicao:null, horario:'' }, tarde:{ tempo:null, condicao:null, horario:'' }, noite:null };
  const rdo = { id: uid(), projetoId: pid, data: d, numero, status:'rascunho', clima,
    equipamentos: anterior ? { ...(anterior.equipamentos||{}) } : {}, equipDoAnterior: anterior ? numRDO(anterior) : null,
    obsContratada:'', obsFiscalizacao:'', snap:null, criadoEm: Date.now(), emitidoEm:null, reaberturas:[] };
  DB.rdos.push(rdo); persist.rdos();
  state.rdoAbertoId = rdo.id; render();
}
window.novoRDO = novoRDO;
function rdoAtual(){ return DB.rdos.find(r=>r.id===state.rdoAbertoId); }
function rdoSetClima(periodo, campo, valor){
  const r = rdoAtual(); if(!r || r.status==='emitido') return;
  if(!r.clima[periodo]) r.clima[periodo] = { tempo:null, condicao:null, horario:'' };
  r.clima[periodo][campo] = (campo!=='horario' && r.clima[periodo][campo]===valor) ? null : valor;
  persist.rdos(); render();
}

function rdoToggleNoite(){ const r = rdoAtual(); if(!r || r.status==='emitido') return; r.clima.noite = r.clima.noite ? null : { tempo:null, condicao:null, horario:'' }; persist.rdos(); render(); }
window.rdoToggleNoite = rdoToggleNoite;
function rdoEquip(recursoId, delta){
  const r = rdoAtual(); if(!r || r.status==='emitido') return;
  r.equipamentos = r.equipamentos || {};
  r.equipamentos[recursoId] = Math.max(0, (r.equipamentos[recursoId]||0) + delta);
  if(!r.equipamentos[recursoId]) delete r.equipamentos[recursoId];
  persist.rdos(); render();
}

function rdoObs(campo, valor){ const r = rdoAtual(); if(!r || r.status==='emitido') return; r[campo] = valor; persist.rdos(); }

function emitirRDO(){
  const r = rdoAtual(); if(!r) return;
  const semClima = ['manha','tarde'].filter(k=>!r.clima[k] || !r.clima[k].tempo || !r.clima[k].condicao);
  if(semClima.length && !confirm('O clima de manhã/tarde não está completo. Emitir mesmo assim?')) return;
  if(!confirm(`Emitir o RDO nº ${numRDO(r)}? Os dados ficam congelados como estão agora.`)) return;
  r.snap = { ...dadosAutoRDO(r.projetoId, r.data), prazo: prazoRDO(r.projetoId, r.data), projeto: nomeProjeto(r.projetoId), equipamentos: equipamentosRDOLista(r) };
  r.status = 'emitido'; r.emitidoEm = Date.now();
  persist.rdos(); showToast(`RDO nº ${numRDO(r)} emitido.`); render();

window.emitirRDO = emitirRDO;
function reabrirRDO(){
  const r = rdoAtual(); if(!r) return;
  if(!confirm(`Reabrir o RDO nº ${numRDO(r)} para edição? A reabertura fica registrada.`)) return;

function excluirRDO(id){
  const r = DB.rdos.find(x=>x.id===id); if(!r) return;
  if(r.status==='emitido'){
    const resp = prompt(`O RDO nº ${numRDO(r)} já foi emitido. O número ficará vago.\nDigite EXCLUIR para confirmar:`);
    if(resp===null || resp.trim().toUpperCase()!=='EXCLUIR'){ if(resp!==null) showToast('Exclusão cancelada.'); return; }
  } else if(!confirm(`Excluir o rascunho do RDO nº ${numRDO(r)}?`)) return;
  DB.rdos = DB.rdos.filter(x=>x.id!==id);

function rdoDescontarCalendario(periodo){
  const r = rdoAtual(); if(!r) return;
  const c = r.clima[periodo]; if(!c) return;
  const calP = DB.calendario.atribuicoes.projeto[r.projetoId] || DB.calendario.padraoId;
  const base = janelasDoDia(r.data, r.projetoId, calP).janelas;
  const dia0 = _msDia(r.data);
  let corte;
  const j = c.horario ? parseJanelas(c.horario.replace(/[–—]/g,'-')) : null;
  if(j && j.length) corte = _intervalosDoDia(r.data, j);
  else corte = _intervalosDoDia(r.data, [{ manha:{ini:'00:00',fim:'12:00'}, tarde:{ini:'12:00',fim:'18:00'}, noite:{ini:'18:00',fim:'24:00'} }[periodo]]);
  const resto = _subtrair(_intervalosDoDia(r.data, base), corte).map(([x,y])=>{
    const m = v => Math.max(0, Math.min(1440, Math.round((v-dia0)/60000)));
    const hh = v => `${String(Math.floor(m(v)/60)).padStart(2,'0')}:${String(m(v)%60).padStart(2,'0')}`;
    return { ini: hh(x), fim: m(y)>=1440 ? '24:00' : hh(y) };
  }).filter(x=>x.ini<x.fim);
  if(!confirm(`Criar exceção no calendário do projeto em ${fmtData(r.data)}: ${resto.length ? 'trabalho '+fmtJanelas(resto) : 'folga (dia todo impraticável)'}?`)) return;
  const cal = DB.calendario;
  cal.excecoes = cal.excecoes.filter(e=>!(e.data===r.data && e.projetoId===r.projetoId && !e.calendarioId));
  cal.excecoes.push({ id: uid(), data: r.data, projetoId: r.projetoId, calendarioId: null, tipo: resto.length?'trabalho':'folga', janelas: resto, nome: `Impraticável — RDO nº ${numRDO(r)}` });
  persist.calendario(); showToast('Calendário atualizado para este dia.'); render();
}

function _rdosAlvo(ids){ return (ids ? ids.map(id=>DB.rdos.find(r=>r.id===id)).filter(Boolean) : rdosFiltrados()).slice().sort((a,b)=>a.data.localeCompare(b.data)); }
function imprimirRDOs(ids){
  const lista = _rdosAlvo(ids);

function carregarXlsxEstilo(){
  if(window.XLSXS) return Promise.resolve(window.XLSXS);
  return new Promise((ok, erro)=>{
    const orig = window.XLSX;
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    sc.onload = () => { window.XLSXS = window.XLSX; window.XLSX = orig; ok(window.XLSXS); };
    sc.onerror = () => { window.XLSX = orig; erro(new Error('falha ao carregar')); };
    document.head.appendChild(sc);
  });
}
function planilhaRDO(X, r){
  const dd = dadosRDO(r), pz = dd.prazo;
  const ws = {}, merges = []; let row = 0;
  const bord = { top:{style:'thin',color:{rgb:'BFB8B2'}}, bottom:{style:'thin',color:{rgb:'BFB8B2'}}, left:{style:'thin',color:{rgb:'BFB8B2'}}, right:{style:'thin',color:{rgb:'BFB8B2'}} };
  const st = (o={}) => ({ font:{ name:'Arial', sz:o.sz||10, bold:!!o.b, italic:!!o.i, color:{ rgb:o.cor||'000000' } }, alignment:{ horizontal:o.al||'left', vertical:'center', wrapText:true }, border: o.semBorda?{}:bord, ...(o.fill?{ fill:{ patternType:'solid', fgColor:{ rgb:o.fill } } }:{}) });
  const put = (c1, c2, v, o={}) => {
    for(let c=c1;c<=c2;c++){ const ref = X.utils.encode_cell({ r:row, c }); ws[ref] = { v: c===c1 ? (v ?? '') : '', t: (c===c1 && typeof v==='number') ? 'n' : 's', s: st(o) }; }
    if(c2>c1) merges.push({ s:{ r:row, c:c1 }, e:{ r:row, c:c2 } });
  };
  const formula = (c, f, o={}) => { ws[X.utils.encode_cell({ r:row, c })] = { f, t:'n', s: st(o) }; };
  const V = '7A1F1B', CZ = 'F2EFEC';
  const sec = t => { put(0,7,t.toUpperCase(),{ b:true, cor:'FFFFFF', fill:V }); row++; };
  put(0,1,'AH BRANT ENGENHARIA',{ b:true, sz:11, cor:V, al:'center' }); put(2,5,'RELATÓRIO DIÁRIO DE OBRA',{ b:true, sz:14, al:'center' }); put(6,7,`RDO nº ${numRDO(r)}`,{ b:true, sz:12, al:'center' }); row++;
  put(0,1,'',{}); put(2,5,`${pz.contrato?'Contrato '+pz.contrato+' · ':''}Projeto ${dd.projeto}`,{ cor:'595959', al:'center' }); put(6,7,`${diaSemanaExt(r.data)}, ${fmtData(r.data)}`,{ sz:9, al:'center' });
  merges.push({ s:{r:0,c:0}, e:{r:1,c:1} }); row++;
  const q = [['Prazo contratual', pz.prazo!=null?pz.prazo+' dias':'não informado'],['Dias decorridos', pz.decorridos ?? 'não informado'],['Dias restantes', pz.restantes ?? 'não informado'],['Situação', r.status==='emitido'?'Emitido':'Rascunho']];
  q.forEach(([a],i)=>put(i*2,i*2+1,a,{ sz:8, cor:'595959', fill:CZ, al:'center' })); row++;
  q.forEach(([,b],i)=>put(i*2,i*2+1,b,{ b:true, sz:11, al:'center', cor: b==='Rascunho'?'B8860B':'000000' })); row+=2;
  sec('Clima e condição');
  put(0,1,'Período',{ b:true, sz:9, fill:CZ }); put(2,3,'Tempo',{ b:true, sz:9, fill:CZ }); put(4,5,'Condição',{ b:true, sz:9, fill:CZ }); put(6,7,'Horário impraticável',{ b:true, sz:9, fill:CZ }); row++;
  RDO_PERIODOS.filter(([k])=>r.clima[k]).forEach(([k,l])=>{ const c = r.clima[k]; put(0,1,l); put(2,3,c.tempo||'—'); put(4,5,c.condicao||'—',{ b:c.condicao==='Impraticável', cor:c.condicao==='Impraticável'?'C00000':'000000' }); put(6,7,c.horario||'—',{ al:'center' }); row++; });
  row++; sec('Efetivo');
  put(0,3,'Empresa',{ b:true, sz:9, fill:CZ }); put(4,5,'Direto',{ b:true, sz:9, fill:CZ, al:'right' }); put(6,6,'Indireto',{ b:true, sz:9, fill:CZ, al:'right' }); put(7,7,'Total',{ b:true, sz:9, fill:CZ, al:'right' }); row++;
  const ini = row;
  dd.efetivo.forEach(e=>{ put(0,3,e.empresa); put(4,5,e.direto,{ al:'right' }); put(6,6,e.indireto,{ al:'right' }); formula(7, `E${row+1}+G${row+1}`, { al:'right' }); row++; });
  put(0,3,'Total',{ b:true }); put(4,5,'',{ b:true, al:'right' }); put(6,6,'',{ b:true, al:'right' });
  if(row>ini){ formula(4, `SUM(E${ini+1}:E${row})`, { b:true, al:'right' }); formula(6, `SUM(G${ini+1}:G${row})`, { b:true, al:'right' }); formula(7, `SUM(H${ini+1}:H${row})`, { b:true, al:'right' }); }
  else { put(4,5,0,{ b:true, al:'right' }); put(6,6,0,{ b:true, al:'right' }); put(7,7,0,{ b:true, al:'right' }); }
  row+=2; sec('Equipamentos');
  put(0,1,'Empresa',{ b:true, sz:9, fill:CZ }); put(2,6,'Equipamento',{ b:true, sz:9, fill:CZ }); put(7,7,'Qtd.',{ b:true, sz:9, fill:CZ, al:'right' }); row++;
  (dd.equipamentos.length ? dd.equipamentos : [{ empresa:'—', nome:'Nenhum equipamento', qtd:'' }]).forEach(e=>{ put(0,1,e.empresa); put(2,6,e.nome); put(7,7,e.qtd,{ al:'right' }); row++; });
  row++; sec('Atividades do dia');
  put(0,2,'Frente',{ b:true, sz:9, fill:CZ }); put(3,5,'Etapa',{ b:true, sz:9, fill:CZ }); put(6,7,'Situação',{ b:true, sz:9, fill:CZ }); row++;
  (dd.atividades.length ? dd.atividades : [{ frente:'Sem atividades no dia.', etapa:'', situacao:'' }]).forEach(a=>{ put(0,2,a.frente); put(3,5,a.etapa,{ sz:9 }); put(6,7,a.situacao); row++; });
  row++; sec('Paralisações e ocorrências');
  (dd.ocorrencias.length ? dd.ocorrencias : ['Sem paralisações ou ocorrências no dia.']).forEach(o=>{ put(0,7,o); row++; });
  row++; sec('Observações');
  put(0,3,'Contratada',{ b:true, sz:9, fill:CZ }); put(4,7,'Fiscalização',{ b:true, sz:9, fill:CZ }); row++;
  const obsRow = row;
  put(0,3,r.obsContratada||'',{}); put(4,7,r.obsFiscalizacao||'',{});
  for(let k=1;k<3;k++){ row++; put(0,3,'',{}); put(4,7,'',{}); }
  merges.splice(merges.length-6, 6); merges.push({ s:{r:obsRow,c:0}, e:{r:obsRow+2,c:3} }, { s:{r:obsRow,c:4}, e:{r:obsRow+2,c:7} });
  row+=4;
  const linhaAss = { font:{ name:'Arial', sz:9 }, alignment:{ horizontal:'center' }, border:{ top:{ style:'thin', color:{ rgb:'000000' } } } };
  [[0,2,'Responsável contratada'],[5,7,'Fiscalização']].forEach(([a,b,t])=>{ for(let c=a;c<=b;c++) ws[X.utils.encode_cell({r:row,c})] = { v: c===a?t:'', t:'s', s: linhaAss }; merges.push({ s:{r:row,c:a}, e:{r:row,c:b} }); });
  row++; put(0,2,'Nome / data',{ sz:8, cor:'7F7F7F', al:'center', semBorda:true }); put(5,7,'Nome / data',{ sz:8, cor:'7F7F7F', al:'center', semBorda:true });
  row+=2; put(0,7, r.status==='emitido' ? `Emitido em ${new Date(r.emitidoEm).toLocaleString('pt-BR')} · Frente Livre` : 'RASCUNHO — não válido como documento oficial', { sz:8, i:true, al:'right', semBorda:true, cor: r.status==='emitido'?'7F7F7F':'C00000' });
  ws['!ref'] = X.utils.encode_range({ s:{r:0,c:0}, e:{r:row,c:7} });
  ws['!merges'] = merges;
  ws['!cols'] = [12,11,11,11,10,10,10,9].map(w=>({ wch:w }));
  ws['!rows'] = [{ hpt:26 }, { hpt:20 }];
  ws['!print'] = {}; ws['!margins'] = { left:0.4, right:0.4, top:0.5, bottom:0.5, header:0.2, footer:0.2 };
  return ws;
}
async function exportarRDOsExcel(ids){
  const lista = _rdosAlvo(ids);
  if(!lista.length){ showToast('Nenhum RDO para exportar.'); return; }
  let X;
  try{ X = await carregarXlsxEstilo(); }
  catch(e){ showToast('Não foi possível carregar o gerador de Excel formatado. Verifique a internet.'); return; }
  const wb = X.utils.book_new();
  const nomes = new Set();
  lista.forEach(r=>{ let nome = `RDO ${numRDO(r)}`; let k=2; while(nomes.has(nome)) nome = `RDO ${numRDO(r)} (${k++})`; nomes.add(nome); X.utils.book_append_sheet(wb, planilhaRDO(X, r), nome.slice(0,31)); });
  const proj = nomeProjeto(lista[0].projetoId).replace(/[^\w\-]+/g,'_');
  const arq = lista.length===1 ? `RDO_${numRDO(lista[0])}_${proj}_${lista[0].data}.xlsx` : `RDOs_${proj}_${lista[0].data}_a_${lista[lista.length-1].data}.xlsx`;
  X.writeFile(wb, arq);
  showToast(`Excel gerado (${lista.length} RDO${lista.length>1?'s':''}).`);
}
window.exportarRDOsExcel = exportarRDOsExcel;

function indicadoresElementoEtapa(estruturaId, regsBase){
  const elementosDaEstrutura = DB.elementos.filter(el=>el.estruturaId===estruturaId && (state.filtroProjeto==='all' || el.projetoId===state.filtroProjeto));
  const elementoIds = new Set(elementosDaEstrutura.map(e=>e.id));
  const etapasDosElementos = DB.etapas.filter(et=>et.elementoId && elementoIds.has(et.elementoId));
  const porNome = {};
  etapasDosElementos.forEach(et=>{
    const chave = normalizarNomeEtapa(et.name);
    if(!porNome[chave]) porNome[chave] = { nome: et.name.trim(), unidade: et.unidadeOrcada||'', orcadoTotal:0, etapaIds:[] };
    porNome[chave].orcadoTotal += (et.quantidadeOrcada||0);
    porNome[chave].etapaIds.push(et.id);
    if(!porNome[chave].unidade && et.unidadeOrcada) porNome[chave].unidade = et.unidadeOrcada;
  });
  Object.values(porNome).forEach(grupo=>{
    const etapaIdSet = new Set(grupo.etapaIds);
    const regsGrupo = regsBase.filter(r=>etapaIdSet.has(r.etapaId) && r.inicio && r.termino);

    });

      empresaId, duracaoMedia: v.n ? v.horas/v.n : 0, executado: v.executado, n: v.n,
      produtividade: v.horas>0 ? v.executado/v.horas : null,

}

function opcoesProdutividadeTemporal(regsBase){
  const idsComRegistro = new Set(regsBase.filter(r=>r.elementoId && r.inicio && r.termino && r.quantidadeExecutada!=null).map(r=>r.etapaId));
  const nomes = {};
  DB.etapas.filter(et=>et.elementoId && idsComRegistro.has(et.id)).forEach(et=>{
    const chave = normalizarNomeEtapa(et.name);
    if(!nomes[chave]) nomes[chave] = { chave, nome: et.name.trim(), unidade: et.unidadeOrcada||'' };
  });
  return Object.values(nomes).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
function produtividadePorPeriodo(chave, regsBase, modo){
  const etapaIds = new Set(DB.etapas.filter(et=>et.elementoId && normalizarNomeEtapa(et.name)===chave).map(et=>et.id));
  const regs = regsBase.filter(r=>etapaIds.has(r.etapaId) && r.inicio && r.termino && r.quantidadeExecutada!=null);
  const porPeriodo = {};
  regs.forEach(r=>{
    const dataRef = (r.termino||'').slice(0,10);
    if(!dataRef) return;
    const p = modo==='dia' ? dataRef : dataRef.slice(0,7);
    if(!porPeriodo[p]) porPeriodo[p] = { quantidade:0, horas:0 };
    porPeriodo[p].quantidade += (r.quantidadeExecutada||0);
    porPeriodo[p].horas += execHours(r);
  });
  return Object.entries(porPeriodo).map(([periodo,v])=>({ periodo, quantidade:v.quantidade, horas:v.horas, produtividade: v.horas>0 ? v.quantidade/v.horas : null })).sort((a,b)=>a.periodo.localeCompare(b.periodo));
}
function renderProdutividadeTemporalHtml(regsBase){
  const opcoes = opcoesProdutividadeTemporal(regsBase);
  if(!opcoes.length) return '';
  if(!state.relatorioProdutividadeChave || !opcoes.some(o=>o.chave===state.relatorioProdutividadeChave)) state.relatorioProdutividadeChave = opcoes[0].chave;
  const opcaoAtual = opcoes.find(o=>o.chave===state.relatorioProdutividadeChave);
  const modo = state.relatorioProdutividadeModo || 'dia';
  const serie = produtividadePorPeriodo(state.relatorioProdutividadeChave, regsBase, modo);
  const maxV = Math.max(...serie.map(s=>s.produtividade||0), 1);
  const bars = serie.map(s=>{
    const label = modo==='dia'
      ? new Date(s.periodo+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})
      : new Date(s.periodo+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
    return `<div class="daybar"><div class="val">${s.produtividade!==null?s.produtividade.toFixed(1):'—'}</div><div class="col" style="height:${Math.max(((s.produtividade||0)/maxV)*100,3)}px"></div><div class="dlabel">${esc(label)}</div></div>`;
  }).join('');
  return `
    <div class="card no-print">
      <h3>Produtividade ao longo do tempo
        <span class="tag" style="cursor:pointer; text-decoration:underline; ${modo==='dia'?'font-weight:700;':''}" onclick="state.relatorioProdutividadeModo='dia'; render();">● diário</span>
        <span class="tag" style="cursor:pointer; text-decoration:underline; ${modo==='mes'?'font-weight:700;':''}" onclick="state.relatorioProdutividadeModo='mes'; render();">● mensal</span>
      </h3>
      <div style="max-width:320px; margin-bottom:10px"><label>Etapa</label><select onchange="state.relatorioProdutividadeChave=this.value; render();">${opcoes.map(o=>`<option value="${o.chave}" ${o.chave===state.relatorioProdutividadeChave?'selected':''}>${esc(o.nome)}</option>`).join('')}</select></div>
      <p style="font-size:12px; color:var(--grafite-suave); margin:0 0 4px 0">${esc(opcaoAtual.unidade)}/h ${modo==='dia'?'por dia':'por mês'}, considerando execuções concluídas dessa etapa em todas as peças.</p>
      ${serie.length ? `<div class="daybars">${bars}</div>` : `<div class="board-empty">Nenhuma execução concluída dessa etapa ainda</div>`}
    </div>`;
}

function exportarCSV(){
  const linhas = [['Projeto','Elemento','Estrutura','Empresa','Trecho','Frente (estacas)','Etapa','Liberação','Início','Término','Ociosidade (h)','Duração (h)','Metros','Produtividade (m/h)','Quantidade executada','Unidade','Índice real','Situação','Recursos de apoio alocados','Custo (R$)']];
  DB.registros.forEach(r=>{
    const hOcio = idleHours(r);
    const hExec = execHours(r);
    const m = comprimentoFrenteMetros(r.faixaInicio, r.faixaFim);
    const situacao = r.termino ? 'Concluída' : (r.pausadoDesde ? 'Pausada' : (r.inicio ? 'Em execução' : 'Aguardando efetivo'));
    const custo = custoRecursosRegistro(r);
    const ir = indiceRealRegistro(r);
    linhas.push([nomeProjeto(r.projetoId), r.elementoId ? (nomeElemento(r.elementoId)||'') : '', nomeEstrutura(r.estruturaId), nomeEmpresa(r.empresaId), trechoNomeCurto(r.trechoId), `${r.faixaInicio}-${r.faixaFim}`, nomeEtapa(r.etapaId), r.liberacao||'', r.inicio||'', r.termino||'', hOcio.toFixed(2), hExec!==null?hExec.toFixed(2):'', m, (hExec && m) ? (m/hExec).toFixed(1) : '', r.quantidadeExecutada??'', r.unidadeExecutada||'', ir!==null?ir.toFixed(2):'', situacao, recursosResumo(r), custo.toFixed(2)]);
  });
  const csv = linhas.map(linha => linha.map(campo => {
    const s = String(campo??'');
    return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `frente-livre-indicadores-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV exportado.');
}
window.exportarCSV = exportarCSV;

function importarBackupJSON(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const leitor = new FileReader();
  leitor.onload = async (e) => {
    try{
      const backup = JSON.parse(e.target.result);
      if(!backup || !Array.isArray(backup.registros)){ showToast('Arquivo inválido.'); return; }
      const resumo = `Projetos: ${(backup.projetos||[]).length} · Trechos: ${(backup.estacas||[]).length} · Estruturas: ${(backup.estruturas||[]).length} · Etapas: ${(backup.etapas||[]).length} · Empresas: ${(backup.empresas||[]).length} · Recursos: ${(backup.recursos||[]).length} · Elementos: ${(backup.elementos||[]).length} · Lançamentos: ${(backup.registros||[]).length}`;
      if(!confirm(`Isso vai SUBSTITUIR todos os dados atuais pelos do backup (exportado em ${backup.exportadoEm ? fmtDataHora(backup.exportadoEm) : 'data desconhecida'}).\n\n${resumo}\n\nContinuar?`)) return;
      DB.projetos = backup.projetos || [{ id: uid(), nome: 'Projeto Padrão' }];
      DB.estacas = backup.estacas || [];
      DB.estruturas = (backup.estruturas || []).map(e => ({ usaElementos:false, categoria:null, projetoId: DB.projetos[0].id, ...e }));
      DB.etapas = backup.etapas || [];
      DB.empresas = (backup.empresas || []).map(e => ({ profissionais:[], ...e }));
      DB.recursos = (backup.recursos || []).map(r => ({ custoHora:0, ...r }));
      DB.elementos = (backup.elementos || []).map(el => ({ orcamento:[], projetoId: DB.projetos[0].id, ...el }));
      DB.registros = (backup.registros || []).map(r => ({ recursos:[], quantidadeExecutada:null, unidadeExecutada:null, elementoId:null, pausas:[], pausadoDesde:null, efetivoDiario:[], projetoId: DB.projetos[0].id, ...r }));
      DB.eixos = backup.eixos || [];
      DB.unidades = backup.unidades && backup.unidades.length ? backup.unidades : DB.unidades;
      DB.efetivoGeral = backup.efetivoGeral || [];
      DB.contratos = backup.contratos || [];
      DB.custoOrcamentos = backup.custoOrcamentos || [];
      DB.custoMedicoes = backup.custoMedicoes || [];
      DB.cronogramas = backup.cronogramas || [];
      DB.cronogramaItens = backup.cronogramaItens || [];
      if(backup.calendario) DB.calendario = normalizarCalendario(backup.calendario);
      if(backup.aprendizado) DB.aprendizado = normalizarAprendizado(backup.aprendizado);
      DB.rdos = Array.isArray(backup.rdos) ? backup.rdos : [];
      DB.insumos = Array.isArray(backup.insumos) ? backup.insumos : [];
      DB.tracos = Array.isArray(backup.tracos) ? backup.tracos : [];
      DB.servicosAux = Array.isArray(backup.servicosAux) ? backup.servicosAux : [];
      DB.insConfig = normalizarInsConfig(backup.insConfig);
      DB.insMov = Array.isArray(backup.insMov) ? backup.insMov : [];
      DB.insPools = Array.isArray(backup.insPools) ? backup.insPools : [];
      DB.canteiros = Array.isArray(backup.canteiros) ? backup.canteiros : [];
      _calCache.clear();
      window.DB_LOAD_FAILED = false; // uma importação bem-sucedida também destrava a gravação, caso estivesse bloqueada
      await Promise.all([
        persist.projetos(), persist.estacas(), persist.estruturas(), persist.etapas(), persist.empresas(),
        persist.recursos(), persist.elementos(), persist.registros(), persist.eixos(), persist.unidades(),
        persist.efetivoGeral(), persist.contratos(), persist.custoOrcamentos(), persist.custoMedicoes(),
        persist.cronogramas(), persist.cronogramaItens(), persist.calendario(), persist.aprendizado(), persist.rdos(),
        persist.insumos(), persist.tracos(), persist.servicosAux(), persist.insConfig(), persist.insMov(), persist.insPools(), persist.canteiros(),
      ]);
      showToast('Backup restaurado com sucesso.');
      inputEl.value = '';
      render();
    } catch(err){ showToast('Não foi possível ler o arquivo de backup.'); }
  };
  leitor.readAsText(file);
}

function renderCalendario(){
