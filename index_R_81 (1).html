<!DOCTYPE html>
<!--
  FRENTE LIVRE — AH Brant Engenharia & Construções
  Rev. 41 · 20/08/2026
  Nesta versão: dá pra editar o horário (dia e hora) de uma pausa ainda em
  aberto, não só depois de encerrada.
  Histórico completo de versões: ver array APP_CHANGELOG logo no início do bloco de JavaScript.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AH Brant — Frente Livre · Indicadores de Produtividade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --preto:#161311; --preto2:#141110; --fundo:#F1EFED; --papel:#FFFFFF;
    --vinho:#96110D; --vinho-escuro:#6E0C09;
    --verde:#3D8361; --verde-bg:#E4F1E9;
    --vermelho:#D64545; --vermelho-bg:#FBE6E3;
    --amarelo:#C97A1A; --amarelo-bg:#FBEEDD;
    --azul:#3D6A8B; --azul-bg:#E4EDF3;
    --roxo:#6B4C9A; --roxo-bg:#EBE5F3;
    --laranja:#D97A34; --laranja-bg:#FBE9DA;
    --grafite:#211D1C; --grafite-suave:#655D5A; --linha-grade:#DCD8D5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'IBM Plex Sans', sans-serif; background:var(--fundo); color:var(--grafite);
    background-image: linear-gradient(var(--linha-grade) 1px, transparent 1px), linear-gradient(90deg, var(--linha-grade) 1px, transparent 1px);
    background-size: 28px 28px; }
  h1,h2,h3,h4{ font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.03em; margin:0; color:var(--preto2); }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  #shell{ display:flex; min-height:100vh; }

  #sidebar{ width:230px; flex-shrink:0; background:var(--preto);
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 28px);
    color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  #brand{ padding:20px 20px 16px 20px; border-bottom:1px solid rgba(255,255,255,0.12); }
  #brand img{ width:100%; max-width:196px; display:block; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.35); }
  #brand .mark{ font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; letter-spacing:0.05em; color:#fff; display:flex; align-items:center; gap:7px; margin-top:12px; }
  #brand .sub{ font-size:11px; color:#B9B2AE; margin-top:4px; letter-spacing:0.03em; line-height:1.4; }
  nav{ padding:14px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
  nav button{ all:unset; cursor:pointer; display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:4px;
    font-family:'Oswald', sans-serif; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:#C9C4C1; transition:background .15s, color .15s; }
  nav button svg{ flex-shrink:0; opacity:0.85; }
  nav button:hover{ background:rgba(255,255,255,0.07); color:#fff; }
  nav button.active{ background:var(--vinho); color:#fff; }
  #sidebar-foot{ margin-top:auto; padding:16px 20px; font-size:10.5px; color:#8C8480; border-top:1px solid rgba(255,255,255,0.12); line-height:1.5; }

  #main{ flex:1; min-width:0; padding:32px 40px 60px 40px; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .topbar h2{ font-size:26px; }
  .topbar p.desc{ color:var(--grafite-suave); font-size:13.5px; margin-top:4px; max-width:560px; }

  .card{ background:var(--papel); border:1px solid var(--linha-grade); border-radius:6px; padding:20px 22px; margin-bottom:18px; box-shadow:0 1px 2px rgba(11,30,51,0.04); }
  .card h3{ font-size:16px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .card h3 .tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:11px; color:var(--grafite-suave); font-weight:400; }
  .relatorio-header{ display:flex; align-items:center; gap:14px; }
  .empresa-tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; background:var(--roxo-bg); color:var(--roxo); }
  .estrutura-tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; background:var(--azul-bg); color:var(--azul); }
  .projeto-tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; background:var(--amarelo-bg); color:var(--amarelo); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .grid4{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; }
  @media (max-width:900px){ .grid2,.grid3,.grid4{ grid-template-columns:1fr; } }

  label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--grafite-suave); margin-bottom:5px; font-weight:600; }
  input, select, textarea{ width:100%; padding:9px 10px; border:1px solid var(--linha-grade); border-radius:4px; font-size:13.5px;
    font-family:'IBM Plex Sans',sans-serif; background:#fff; color:var(--grafite); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--vinho); outline-offset:1px; border-color:var(--vinho); }
  input:disabled, select:disabled{ background:var(--fundo); color:var(--grafite-suave); }
  .field{ margin-bottom:12px; }
  .btn{ all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px; background:var(--vinho); color:#fff; padding:10px 18px;
    border-radius:4px; font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.05em; text-transform:uppercase; transition:background .15s; }
  .btn:hover{ background:var(--vinho-escuro); }
  .btn:focus-visible{ outline:2px solid var(--preto2); outline-offset:2px; }
  .btn.secondary{ background:var(--preto); }
  .btn.secondary:hover{ background:var(--preto2); }
  .btn.small{ padding:7px 12px; font-size:11.5px; }
  .btn.ghost{ background:transparent; color:var(--grafite-suave); border:1px solid var(--linha-grade); }
  .btn.ghost:hover{ background:var(--fundo); color:var(--grafite); }
  .btn[disabled]{ opacity:.4; cursor:default; pointer-events:none; }
  .icon-btn{ all:unset; cursor:pointer; color:var(--grafite-suave); padding:4px 6px; border-radius:4px; }
  .icon-btn:hover{ background:var(--vermelho-bg); color:var(--vermelho); }
  .icon-btn.up:hover, .icon-btn.down:hover{ background:var(--azul-bg); color:var(--azul); }
  .icon-btn.edit:hover{ background:var(--azul-bg); color:var(--azul); }
  .edit-row-box{ background:var(--azul-bg); border:1px solid var(--azul); border-radius:6px; padding:14px; }
  .inline-edit{ display:inline-flex; align-items:center; gap:6px; }
  .inline-edit input{ padding:4px 8px; font-size:13px; max-width:180px; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-family:'Oswald',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--grafite-suave);
    padding:8px 8px; border-bottom:2px solid var(--linha-grade); }
  td{ padding:9px 8px; border-bottom:1px solid var(--linha-grade); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .num{ font-family:'IBM Plex Mono',monospace; text-align:right; }

  .empty{ text-align:center; padding:44px 20px; color:var(--grafite-suave); }
  .empty .big{ font-family:'Oswald',sans-serif; font-size:16px; color:var(--preto2); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em; }

  .chip{ display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
  .chip.verde{ background:var(--verde-bg); color:var(--verde); }
  .chip.amarelo{ background:var(--amarelo-bg); color:var(--amarelo); }
  .chip.vermelho{ background:var(--vermelho-bg); color:var(--vermelho); }
  .chip.azul{ background:var(--azul-bg); color:var(--azul); }
  .chip.roxo{ background:var(--roxo-bg); color:var(--roxo); }
  .chip.pulse{ position:relative; }
  .chip.pulse::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:6px; animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .kpi-row{ display:flex; gap:22px; margin-bottom:6px; flex-wrap:wrap; }
  .kpi{ min-width:160px; }
  .kpi .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--grafite-suave); margin-bottom:4px; }
  .kpi .value{ font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--preto2); font-weight:600; }

  .idle-row{ margin-bottom:16px; }
  .idle-row .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; gap:10px; flex-wrap:wrap; }
  .idle-row .head .name{ font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.02em; text-transform:uppercase; color:var(--grafite); }
  .idle-row .head .meta{ font-size:11.5px; color:var(--grafite-suave); font-family:'IBM Plex Mono',monospace; }
  .bar-track{ position:relative; height:22px; background:repeating-linear-gradient(90deg, #E3E1DE 0 1px, #F6F5F3 1px 10px, #F6F5F3 10px 50px);
    border:1px solid var(--linha-grade); border-radius:3px; overflow:hidden; }
  .bar-fill{ position:absolute; top:0; left:0; bottom:0; border-radius:2px 0 0 2px; transition:width .3s; min-width:2px; }
  .bar-fill.verde{ background:linear-gradient(180deg, #4C9975, var(--verde)); }
  .bar-fill.amarelo{ background:linear-gradient(180deg, #D98A2C, var(--amarelo)); }
  .bar-fill.vermelho{ background:linear-gradient(180deg, #D14A3B, var(--vermelho)); }
  .bar-fill.azul{ background:linear-gradient(180deg, #5786A6, var(--azul)); }
  .bar-fill.roxo{ background:linear-gradient(180deg, #8367AC, var(--roxo)); }

  .rank-row{ display:grid; grid-template-columns:170px 1fr 230px; align-items:center; gap:10px; margin-bottom:10px; }
  .rank-row .label{ font-size:12.5px; color:var(--grafite); font-family:'Oswald',sans-serif; letter-spacing:0.02em; text-transform:uppercase; }
  .rank-row .val{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:right; color:var(--grafite-suave); }
  .rank-row.clicavel{ cursor:pointer; border-radius:6px; }
  .rank-row.clicavel:hover{ background:var(--fundo); }
  .rank-row .drill-icon{ color:var(--linha-grade); font-size:10px; margin-left:6px; font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; }
  .rank-row.clicavel:hover .drill-icon{ color:var(--vinho); }

  .niveis{ display:flex; gap:6px; background:var(--fundo); border:1px solid var(--linha-grade); border-radius:8px; padding:4px; width:fit-content; margin:2px 0 10px; }
  .nivel-btn{ all:unset; cursor:pointer; font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:0.03em; text-transform:uppercase;
    padding:7px 14px; border-radius:6px; color:var(--grafite-suave); }
  .nivel-btn.ativo{ background:var(--vinho); color:#fff; }
  .nivel-btn:not(.ativo):hover{ background:#fff; color:var(--grafite); }
  .crumb{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:11px;
    color:var(--grafite-suave); margin-bottom:14px; }
  .crumb b{ cursor:pointer; color:var(--vinho); font-weight:600; text-decoration:underline; text-decoration-style:dotted; }
  .crumb .sep{ color:var(--linha-grade); }
  .crumb .crumb-atual{ color:var(--grafite-suave); }

  .gantt-wrap{ position:relative; }
  .gantt-row{ display:grid; grid-template-columns:220px 1fr 150px; align-items:center; gap:10px; margin-bottom:8px; }
  .gantt-track{ position:relative; height:22px; background:var(--fundo); border:1px solid var(--linha-grade); border-radius:4px; overflow:hidden; }
  .gantt-bar{ position:absolute; top:2px; bottom:2px; border-radius:3px; cursor:default; }
  .gantt-bar.verde{ background:linear-gradient(180deg, #4C9975, var(--verde)); }
  .gantt-bar.amarelo{ background:linear-gradient(180deg, #D98A2C, var(--amarelo)); }
  .gantt-bar.vermelho{ background:linear-gradient(180deg, #D14A3B, var(--vermelho)); }
  .gantt-bar.azul{ background:linear-gradient(180deg, #5786A6, var(--azul)); }
  .gantt-hoje-line{ position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--vinho); z-index:2; }
  .gantt-hoje-label{ position:absolute; top:-18px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--vinho); white-space:nowrap; transform:translateX(-50%); }
  .gantt-legenda{ display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--grafite-suave); margin:2px 0 16px; }
  .gantt-legenda span{ display:inline-flex; align-items:center; gap:5px; }
  .gantt-legenda i{ width:10px; height:10px; border-radius:2px; display:inline-block; }
  @media (max-width:760px){ .gantt-row{ grid-template-columns:1fr; gap:4px; } }

  /* indicador inteligente de prazo */
  .indic-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px; }
  .indic-card{ border:1px solid var(--linha-grade); border-radius:8px; padding:16px; }
  .indic-card .indic-nome{ font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase; margin-bottom:10px; }
  .indic-linha{ display:flex; justify-content:space-between; align-items:center; font-size:12px; margin-bottom:7px; gap:10px; }
  .indic-linha .k{ color:var(--grafite-suave); }
  .indic-linha .v{ font-family:'IBM Plex Mono',monospace; font-weight:600; white-space:nowrap; }
  .status-chip{ display:inline-block; padding:4px 10px; border-radius:20px; font-size:10.5px; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; margin-top:6px; }
  .status-chip.verde, .status-chip.no-prazo{ background:var(--verde-bg); color:var(--verde); }
  .status-chip.amarelo, .status-chip.atencao{ background:var(--amarelo-bg); color:var(--amarelo); }
  .status-chip.vermelho, .status-chip.atrasado{ background:var(--vermelho-bg); color:var(--vermelho); }

  /* curva S */
  .periodo-toggle{ display:flex; gap:4px; background:var(--fundo); border:1px solid var(--linha-grade); border-radius:8px; padding:4px; width:fit-content; }
  .periodo-btn{ all:unset; cursor:pointer; font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:0.03em; text-transform:uppercase;
    padding:8px 16px; border-radius:6px; color:var(--grafite-suave); }
  .periodo-btn.ativo{ background:var(--vinho); color:#fff; }
  .periodo-btn:not(.ativo):hover{ background:#fff; color:var(--grafite); }
  .curva-legenda{ display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--grafite-suave); margin-bottom:10px; }
  .curva-legenda span{ display:inline-flex; align-items:center; gap:5px; }
  .curva-legenda i{ width:11px; height:11px; border-radius:2px; display:inline-block; }
  .curva-resumo{ display:flex; gap:26px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--linha-grade); }
  .curva-resumo .item{ font-size:12px; }
  .curva-resumo .item .k{ color:var(--grafite-suave); display:block; margin-bottom:2px; }
  .curva-resumo .item .v{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; }
  .curva-tooltip{ position:absolute; pointer-events:none; background:var(--preto2); color:#fff; border-radius:6px; padding:9px 12px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; line-height:1.6; box-shadow:0 3px 10px rgba(0,0,0,.25); z-index:5; white-space:nowrap;
    transform:translate(-50%, -100%); margin-top:-10px; opacity:0; transition:opacity .08s; }
  .curva-tooltip.visivel{ opacity:1; }
  .curva-tooltip .data{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; color:#D9D2CC; font-size:9.5px; margin-bottom:3px; }
  .curva-tooltip .l{ display:flex; justify-content:space-between; gap:14px; }
  .curva-tooltip .l .k{ color:#D9D2CC; }
  .curva-par{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:760px){ .curva-par{ grid-template-columns:1fr; } }

  .daybars{ display:flex; align-items:flex-end; gap:10px; height:140px; padding:10px 4px 0 4px; overflow-x:auto; }
  .daybar{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:38px; }
  .daybar .col{ width:22px; border-radius:3px 3px 0 0; background:linear-gradient(180deg, #C0433B, var(--vinho)); min-height:3px; }
  .daybar .col.verde-col{ background:linear-gradient(180deg, #6FBF97, var(--verde)); }
  .col-track{ position:relative; width:26px; }
  .col-direto{ position:absolute; bottom:0; left:2px; width:22px; border-radius:3px 0 0 0; background:linear-gradient(180deg, #8367AC, var(--roxo)); min-height:0; }
  .col-indireto{ position:absolute; left:2px; width:22px; border-radius:0 0 0 0; background:linear-gradient(180deg, #E8A05E, var(--laranja)); min-height:0; }
  .col-frentes-marker{ position:absolute; left:-2px; width:30px; height:3px; background:var(--grafite); border-radius:2px; z-index:2; box-shadow:0 0 0 1px #fff; }
  .daybar .val{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafite-suave); }
  .daybar .dlabel{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafite-suave); }

  .toast{ position:fixed; bottom:22px; right:22px; background:var(--preto2); color:#fff; padding:12px 18px; border-radius:5px; font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,0.2); opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:none; z-index:999; }
  .toast.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .loading-screen{ display:flex; align-items:center; justify-content:center; height:100vh; width:100%; font-family:'Oswald',sans-serif;
    color:var(--grafite-suave); letter-spacing:0.05em; text-transform:uppercase; font-size:13px; }

  .tap-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .tap-card{ all:unset; cursor:pointer; box-sizing:border-box; display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    gap:3px; min-height:64px; padding:14px 16px; border:1.5px solid var(--linha-grade); border-radius:8px; background:#fff;
    transition:border-color .15s, background .15s, transform .1s; position:relative; }
  .tap-card:active{ transform:scale(0.97); }
  .tap-card:hover{ border-color:var(--vinho); background:#FBF4F3; }
  .tap-card.wait{ border-color:var(--vermelho); background:var(--vermelho-bg); align-items:flex-start; }
  .tap-card.exec{ border-color:var(--roxo); background:var(--roxo-bg); align-items:flex-start; }
  .tap-card.opening{ border-color:var(--azul); background:var(--azul-bg); align-items:flex-start; }
  .tap-card.sugerida{ border-color:var(--verde); }
  .tap-card-num{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--grafite-suave); }
  .tap-card-title{ font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:0.02em; text-transform:uppercase; color:var(--grafite); }
  .tap-card-sub{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--grafite-suave); }
  .menu-card{ position:relative; }
  .menu-card .count{ position:absolute; top:10px; right:10px; background:var(--vinho); color:#fff; font-family:'IBM Plex Mono',monospace;
    font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600; }

  .estaca-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .estaca-chip{ all:unset; cursor:pointer; box-sizing:border-box; min-width:64px; text-align:center; padding:12px 10px;
    border:1.5px solid var(--linha-grade); border-radius:8px; background:#fff; font-family:'IBM Plex Mono',monospace;
    font-size:13px; color:var(--grafite); transition:all .12s; }
  .estaca-chip:active{ transform:scale(0.95); }
  .estaca-chip:hover{ border-color:var(--vinho); }
  .estaca-chip.selected{ background:var(--vermelho-bg); border-color:var(--vinho); color:var(--vinho-escuro); }
  .estaca-chip.edge{ background:var(--vinho); border-color:var(--vinho); color:#fff; font-weight:600; }

  .stepper-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--linha-grade); border-radius:8px; background:#fff; margin-bottom:8px; }
  .stepper-row .nome{ font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.02em; }
  .stepper-controls{ display:flex; align-items:center; gap:10px; }
  .stepper-controls .qtd{ min-width:22px; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; }

  .grupo-recolhivel{ border:1px solid var(--linha-grade); border-radius:8px; margin-bottom:8px; overflow:hidden; }
  .grupo-recolhivel summary{ cursor:pointer; padding:10px 14px; font-family:'Oswald',sans-serif; font-size:12.5px; text-transform:uppercase; letter-spacing:0.03em; background:#FBFBFA; list-style:none; display:flex; justify-content:space-between; align-items:center; }
  .grupo-recolhivel summary::-webkit-details-marker{ display:none; }
  .grupo-recolhivel summary::after{ content:'▾'; color:var(--grafite-suave); transition:transform .15s; font-size:11px; }
  .grupo-recolhivel[open] summary::after{ transform:rotate(180deg); }
  .grupo-recolhivel summary .tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; color:var(--grafite-suave); font-size:11px; }
  .lista-compacta{ padding:4px; }
  .lista-item{ all:unset; box-sizing:border-box; cursor:pointer; display:flex; justify-content:space-between; align-items:center; width:100%;
    padding:9px 10px; border-radius:5px; font-size:13px; }
  .lista-item:hover{ background:var(--vermelho-bg); }
  .lista-item:active{ transform:scale(0.99); }
  .lista-item .info{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--grafite-suave); }
  .lista-item .add{ color:var(--vinho); font-weight:700; font-size:15px; margin-left:8px; }

  .board{ display:flex; flex-direction:column; gap:14px; }
  .board-col{ border:1.5px solid var(--linha-grade); border-radius:8px; overflow:hidden; background:#FBFBFA; display:flex; flex-direction:column; }
  .board-col-head{ padding:11px 14px; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.03em; text-transform:uppercase;
    display:flex; justify-content:space-between; align-items:center; color:#fff; }
  .board-col-head .n{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; }
  .board-col.vermelho .board-col-head{ background:var(--vermelho); }
  .board-col.roxo .board-col-head{ background:var(--roxo); }
  .board-col.verde .board-col-head{ background:var(--verde); }
  .board-col-body{ padding:10px; display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:8px;
    align-content:start; max-height:520px; overflow-y:auto;
    -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:var(--grafite-suave) transparent; }
  .board-col-body::-webkit-scrollbar{ width:9px; }
  .board-col-body::-webkit-scrollbar-track{ background:var(--linha-grade); border-radius:6px; }
  .board-col-body::-webkit-scrollbar-thumb{ background:var(--grafite-suave); border-radius:6px; }
  .board-col-body::-webkit-scrollbar-thumb:hover{ background:var(--grafite); }
  .board-item{ background:#fff; border:1px solid var(--linha-grade); border-radius:6px; padding:8px 10px; position:relative; width:100%; min-width:0; }
  /* etiquetas dentro do card: quebram linha no próprio card (máx. 3 linhas) em vez de vazar pro vizinho */
  .board-item .chip{ display:-webkit-box !important; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; white-space:normal; overflow-wrap:anywhere;
    max-width:100%; width:fit-content; line-height:1.45; border-radius:8px; padding:3px 8px; font-size:10.5px; }
  .board-item .chip.pulse::before{ display:inline-block; vertical-align:middle; margin-bottom:2px; }
  .board-item .t{ font-family:'Oswald',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:0.02em; color:var(--grafite); }
  .board-item .s{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--grafite-suave); margin-top:2px; }
  .board-item .reabrir-link{ all:unset; cursor:pointer; display:inline-block; margin-top:7px; font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:0.02em; color:var(--grafite-suave); border-bottom:1px dotted var(--grafite-suave); }
  .board-item .reabrir-link:hover{ color:var(--vinho); border-bottom-color:var(--vinho); }
  .board-empty{ padding:16px 10px; text-align:center; font-size:11.5px; color:var(--grafite-suave); }
  .board-col-filtros{ display:flex; gap:6px; flex-wrap:wrap; padding:2px 14px 10px; }
  .mini-filtro{ font-size:10px; padding:3px 7px; border-radius:4px; border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.14); color:#fff; font-family:'IBM Plex Sans',sans-serif; max-width:150px; }
  .mini-filtro:focus{ outline:1px solid rgba(255,255,255,.7); }
  .mini-filtro option{ color:var(--grafite); }
  .only-print{ display:none; }

  #rdo-print-area{ display:none; }
  .rdo-page{ page:rdo; break-after:page; font-family:Arial, sans-serif; color:#000; background:#fff; }
  .rdo-page:last-child{ break-after:auto; }
  @page rdo{ size:A4 portrait; margin:10mm; }
  @media print{
    body.imprimindo-rdo #shell{ display:none !important; }
    body.imprimindo-rdo #rdo-print-area{ display:block !important; }
    .rdo-page *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #sidebar, .no-print, .toast{ display:none !important; }
    body{ background:#fff; } #shell{ display:block; } #main{ padding:0; }
    .card{ box-shadow:none; border:1px solid #ccc; break-inside:avoid; }
    .bar-track, .bar-fill, .chip{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    @page{ size:landscape; margin:12mm; }
    table{ display:table !important; width:100% !important; table-layout:auto; overflow:visible !important; font-size:10px; }
    th, td{ padding:4px 5px; white-space:normal !important; word-break:break-word; }
    #diario-print table, #relatorio-print table{ font-size:9.5px; }
    .only-print{ display:block !important; }
    .daybars{ overflow-x:visible !important; flex-wrap:wrap; height:auto !important; }
  }
  @media (max-width:760px){
    #shell{ flex-direction:column; }
    #sidebar{ width:100%; height:auto; position:sticky; top:0; z-index:50; flex-direction:row; align-items:center; }
    #brand{ display:none; }
    nav{ flex-direction:row; padding:8px 6px; gap:4px; overflow-x:auto; flex:1; }
    nav button{ flex-direction:column; gap:3px; font-size:8.5px; padding:7px 7px; white-space:nowrap; }
    nav button svg{ width:16px; height:16px; }
    #sidebar-foot{ display:none; }
    #main{ padding:16px 14px 40px 14px; }
    .topbar{ flex-direction:column; align-items:flex-start; }
    .topbar h2{ font-size:21px; }
    .card{ padding:16px 14px; }
    .tap-grid{ grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); }
    .kpi-row{ gap:14px; } .kpi{ min-width:44%; }
    .rank-row{ grid-template-columns:1fr; gap:4px; margin-bottom:16px; }
    table{ display:block; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; }
    [style*="min-width:160px"], [style*="min-width:190px"], [style*="min-width:200px"], [style*="min-width:220px"]{ min-width:0 !important; width:100% !important; }
    .board{ grid-template-columns:1fr; }
    input, select, textarea{ font-size:16px; }
    .btn{ padding:10px 14px; }
    [style*="grid-template-columns:28px 1fr 90px 80px auto"]{ grid-template-columns:1fr 1fr !important; row-gap:4px !important; }
  }
</style>
</head>

const APP_CHANGELOG = [
  { rev: 81, data: '05/10/2026', resumo: 'Estaca raiz na execução: perfuração, umidade da areia e injeção saíram do menu Insumos e ganharam um card próprio no Apontar; no Concluir etapa, o card de uma estaca raiz mostra atalhos ⛏ Perfuração e ▦ Injeção que já abrem a estaca certa. Marcar início direto: botão "Iniciar frente sem liberação" — a frente começa em execução sem liberação prévia e sem ociosidade; quando passa por Liberar etapa, a ociosidade continua sendo contada. Pausas e ocorrências: botão renomeado no card (mostra o total), página com formulário para registrar pausa (motivo da lista, início, fim opcional e detalhe — sem fim fica em aberto), validação de sobreposição e edição de motivo, datas e detalhe de cada pausa, igual às ocorrências.' },
  { rev: 80, data: '05/10/2026', resumo: 'Conversão de unidades no catálogo: cada material pode ter densidade (t/m³) e peso por unidade (kg). Com isso, a nota e a aplicação podem ser lançadas em outra unidade (ex.: areia em M³ no estoque recebida em T; cimento em sacos recebido a granel em T) e o app converte quantidade e preço para a unidade de estoque, mostrando a conta na tela. O movimento guarda também a quantidade e a unidade da nota, que aparecem em Movimentos e no Excel.' },
  { rev: 79, data: '05/10/2026', resumo: 'Fluxo de insumos simplificado: material recebido pela NF já fica disponível no local onde foi guardado. Disponibilizar, Complementar e Devolver saíram do Apontar e deram lugar a um único "Aplicar material" (de qual local saiu e onde foi usado — elemento, trecho, serviço auxiliar ou projeto geral), com a opção "houve perda?" e o motivo. A devolução passa a ser uma transferência entre locais em Insumos › Estoque. A injeção da estaca raiz baixa o cimento direto do local de estoque (usando antes o que já tinha sido separado para a estaca em lançamentos antigos). Perdas apontadas entram no relatório de perdas. Lançamentos antigos continuam válidos.' },
  { rev: 78, data: '05/10/2026', resumo: 'Insumos › Movimentos: consulta de todos os lançamentos (notas recebidas, disponibilizados, complementos, devoluções, transferências, inventários, injeções, umidade, perfuração) com filtros por período (pela data da nota ou pela data do lançamento), tipo, material, local de estoque, projeto e busca por NF, fornecedor, motivo ou peça; totais por material, exclusão e exportação para Excel. "Últimos apontamentos" ganhou o link "ver todos com filtros".' },
  { rev: 77, data: '05/10/2026', resumo: 'Recebimento de material pelo Apontar: novo card "Receber material (NF)" em Apontar › Insumos — lança número da NF, data, fornecedor e os materiais (com preço da nota, aviso de diferença para o catálogo e opção de atualizar o preço); no passo seguinte escolhe-se onde foi guardado, com os locais que já têm aqueles materiais em destaque. Na aba Estoque, o card Entrada por nota volta a ficar sempre visível (inclusive na visão geral), com o campo "Guardado em" e a indicação de onde o material já existe; o cadastro de locais fica no fim da tela, só para criar novos ambientes.' },
  { rev: 76, data: '05/10/2026', resumo: 'Locais de estoque: cadastre quantos ambientes forem necessários (container, galpão, pátio, depósito, silo, baia), cada um pertencendo a um projeto (ex.: container da Estaiada) ou ao canteiro (que abastece vários projetos). O estoque pode ser visto por local, por projeto (soma dos ambientes do projeto, coluna a coluna) ou na visão geral (canteiros × projetos). Ao apontar, o local padrão é o ambiente do próprio projeto; se não houver, o canteiro que o abastece.' },
  { rev: 75, data: '05/10/2026', resumo: 'Canteiros: o estoque passa a ficar em canteiros/almoxarifados cadastrados (nome, onde está armazenado e projetos que abastece), independentes dos projetos. Entradas, inventário, transferências e extrato são por canteiro; ao disponibilizar, devolver e injetar, escolhe-se o canteiro de origem (padrão: o que abastece o projeto), e a transferência sugerida busca saldo em qualquer canteiro. O custo continua indo para o projeto onde o insumo é aplicado (corrigido: na R74, disponibilizar a partir do almoxarifado de outro projeto lançava o custo no projeto de origem). Saldos lançados antes ficam como "almoxarifado antigo" do projeto, com botão para mover tudo para o canteiro certo. Excel de estoque por canteiro.' },
  { rev: 74, data: '05/10/2026', resumo: 'Insumos compartilhados entre projetos: ao disponibilizar, marque vários projetos (e, se quiser, os trechos de cada um); o material vira um saldo compartilhado, sem dividir na hora. As injeções de estaca raiz puxam o cimento desse saldo automaticamente e o custo vai para a estaca onde foi usado; os demais materiais são apropriados depois (por quantidade, percentual ou igualmente) ou devolvidos ao almoxarifado escolhido. Cada linha do disponibilizar mostra o almoxarifado de origem (selecionável) e, se faltar, oferece a transferência do projeto que tem estoque. Relatório e aba Custo mostram o compartilhado ainda não apropriado separado.' },
  { rev: 73, data: '05/10/2026', resumo: 'Estaca raiz por eixo: em Insumos › Estacas raiz, cada eixo recebe as suas cotas (terreno, arrasamento e fundo de cada trecho — solo, rocha…); o comprimento de cada trecho sai das cotas, valendo para todas as peças do eixo. A geometria fica em 3 níveis: padrão da estrutura (trechos, diâmetros, sobreconsumo) → cotas do eixo → peça personalizada. Em campo, a perfuração é apontada pela profundidade a partir do terreno (ex.: rocha a 23,5 m), e o app calcula a cota real da rocha e da ponta, os comprimentos executados e a perfuração em vazio. Boletim e Excel mostram eixo e cotas.' },
  { rev: 72, data: '03/10/2026', resumo: 'Módulo de INSUMOS. Nova aba Insumos (relatório, estoque, catálogo, traços, estacas raiz, composições, serviços auxiliares, norma) e card Insumos no Apontar. Catálogo com unidade, categoria, retornável e preço com histórico por data (importação por Excel); cada movimento congela o preço do dia. Apontamento para 4 destinos: elemento (peça + etapa), trecho de estrutura, serviço auxiliar (acessos, plataformas, canteiro — sem rateio) e projeto geral; disponibilizar antes de executar, complementar com motivo, devolver com trava de saldo e preço da saída. Almoxarifado por projeto: entrada por nota, inventário, transferência e lançamento histórico. Estaca raiz (NBR 6122): traço por batida com itens adicionais (aditivo % sobre cimento, faixa do fabricante, água do aditivo), verificação de consumo ≥ 600 kg/m³, a/c 0,50–0,60 e fck ≥ 20 MPa, consulta à norma com link do PDF; geometria por trechos (solo/rocha, quantos forem) com boletim de perfuração; umidade da areia pela frigideira (constância de massa) ou estimativa; injeção em batidas inteiras e parciais (por sacos), descarte, rateio entre estacas com alerta, dosagem corrigida por umidade e inchamento. Relatório com filtros, 7 agrupamentos, perdas (complementos, descartes e acima do teórico pela composição), limite de perda por categoria, boletins por estaca e Excel com 7 abas. Aba Custo mostra os insumos apropriados por contrato, com data de início e marcação de parcial/completo. Movimentos gravados um documento por movimento (sem limite de tamanho).' },
  { rev: 71, data: '30/09/2026', resumo: 'Correção do aviso de migração: quando as regras do Firestore ainda não liberam a coleção nova, o app mostrava "Alterações não salvas" (falso — os dados estavam sendo salvos no formato antigo), tentava regravar a cada 20 s e pedia confirmação ao fechar a aba. Agora mostra uma faixa azul informativa com botão "Tentar migração"; a permissão é testada antes de baixar o backup (não baixa mais um .json a cada abertura).' },
  { rev: 70, data: '29/09/2026', resumo: 'Apontar › Qual elemento?: elementos já executados (todas as etapas com término, ou marcados como concluídos) saem da lista — fica só o que ainda falta, evitando apontar a mesma peça duas vezes. O subtítulo mostra quantos estão ocultos; eixo/trecho com tudo executado some da escolha anterior. Para voltar a apontar numa peça (retrabalho), use "↺ Reabrir" na etapa concluída, no Painel.' },
  { rev: 69, data: '29/09/2026', resumo: 'Correção de perda de dados entre aparelhos: (1) os lançamentos saíram da ficha única do banco e passaram a ter um documento por lançamento (migração automática na primeira abertura, com backup .json baixado antes e a ficha antiga preservada como cópia) — acaba o risco do limite de 1 MB e cada gravação envia só o que mudou; (2) as demais coleções são gravadas em transação, mesclando item a item com o que está no banco, então um aparelho desatualizado não apaga mais o trabalho de outro; (3) sincronização em tempo real entre todos os aparelhos abertos; (4) abrir o app não regrava mais todas as coleções; (5) falha de gravação mostra faixa vermelha fixa com nova tentativa automática, e o navegador avisa antes de fechar com algo não salvo; (6) aviso quando um aparelho com versão antiga grava dados; (7) backup diário divide coleções grandes em partes. Removidos do código os dados-semente antigos (Projeto Padrão, Muro Armado e trechos de exemplo). Exclusão de projeto mostra a data do último lançamento e alerta se houver lançamentos recentes.' },
  { rev: 68, data: '29/09/2026', resumo: 'Recursos de apoio nesta frente: os grupos por empresa agora abrem todos recolhidos (só o nome e a quantidade disponível); o grupo que você abrir continua aberto enquanto adiciona recursos, em vez de fechar a cada toque.' },
  { rev: 67, data: '23/09/2026', resumo: 'RDO — Relatório Diário de Obra (aba Diário de Obra › RDOs): lista com filtros por projeto, status e período, alerta de dias úteis sem RDO, criar/editar/emitir/reabrir/excluir. Pré-preenchido com efetivo (efetivo geral da empresa, ou apontado nas frentes quando não há geral), atividades do dia, paralisações e ocorrências; clima por período com opção de descontar o impraticável no calendário; equipamentos por empresa (cadastro em Recursos) com + e −, trazendo as quantidades do RDO anterior. Emitir congela os dados. Exporta PDF (A4 em pé, uma página por RDO, marca RASCUNHO) e Excel espelho do PDF (uma aba por RDO). Contratos ganharam data da ordem de início e prazo em dias.' },
  { rev: 66, data: '23/09/2026', resumo: 'Painel (quadro de frentes): etiquetas dos cards (efetivo do dia, pausa, ocorrência) não vazam mais para o card vizinho — quebram linha dentro do próprio card, com no máximo 3 linhas e o texto completo ao passar o mouse.' },
  { rev: 65, data: '23/09/2026', resumo: 'Memória de aprendizado do efetivo: o sistema aprende com as suas classificações Direto/Indireto por função (por empresa, com regra geral de reserva) e aplica sozinho nos próximos lançamentos manuais e importações; aprende também apelidos de função ("ARM." = ARMADOR), apelidos de empresa escritos diferente na planilha e linhas que devem ser sempre ignoradas — tudo ensinado na própria prévia da importação, que agora mostra todas as linhas. Botão para classificar lançamentos antigos sem tipo e painel para revisar/apagar regras (com aviso quando uma função muda de classificação).' },
  { rev: 64, data: '23/09/2026', resumo: 'Turno extra no mesmo lançamento: em Efetivo do dia, "+ turno extra" registra uma segunda equipe (ex.: noturna) com horário próprio — sugerido pelo calendário Noturno —, empresa própria (padrão: a do lançamento) e efetivo separado, sem mexer nos calendários. Horas da frente = união dos turnos do dia (sem contar sobreposição em dobro); efetivo, Painel (pessoas em campo), Diário, aba Efetivo, CSV e consistência somam os turnos e atribuem cada um à sua empresa. Liberação, conclusão, quantidade e avanço continuam únicos.' },
  { rev: 63, data: '23/09/2026', resumo: 'Calendário: exceções de data agora podem valer para todos os calendários ou só para um (ex.: sábado de trabalho só no Noturno, ou folga só no Padrão), e a lista do mês mostra a qual se aplica. Prioridade: projeto+calendário → projeto → global+calendário → global. Trabalho executado em folga/feriado continua contabilizado pelo horário real do dia encerrado ou, sem horário, pela jornada do próprio calendário da etapa.' },
  { rev: 62, data: '23/09/2026', resumo: 'Calendários nomeados (como no MS Project): Padrão, Noturno e 24 horas já criados, podendo criar/renomear/excluir outros, cada um com sua semana, intervalo e uso de feriados. Atribuição em cascata etapa → estrutura → projeto → padrão, feita na própria aba Calendário. Horários podem cruzar a meia-noite (ex.: 22:00-01:00 02:00-05:00) e o turno pertence ao dia em que começou: apontamento de efetivo, encerrar o dia e "em campo hoje" usam a data do turno, então quem aponta às 2h da manhã grava no turno da noite anterior. Encerrar o dia aceita fim menor que o início (virada da noite).' },
  { rev: 61, data: '23/09/2026', resumo: 'Nova aba Calendário (inspirada no "Alterar período de trabalho" do MS Project): jornada padrão por dia da semana, feriados nacionais automáticos (incl. Carnaval, Sexta Santa e Corpus Christi), exceções por data — folga ou trabalho não padrão — globais ou só de um projeto (feriado municipal). Horas de execução e de "aguardando efetivo" passam a contar só horas úteis do calendário; dia encerrado continua valendo o horário real (descontando almoço) e trabalho lançado em dia de folga/feriado é contabilizado normalmente. Encerrar o dia agora grava o início junto quando só o fim é informado. Corrigido "2h60" na formatação de horas.' },
  { rev: 60, data: '23/09/2026', resumo: 'Backup automático em nuvem: uma vez por dia (na primeira abertura do dia, e verificado de hora em hora em sessões abertas) o sistema grava uma cópia completa dos dados em 7 posições rotativas — sempre mantém os últimos 7 backups, sobrescrevendo o mais antigo. Não roda se a carga dos dados falhou, e não sobrescreve cópia boa com banco vazio. Nota no rodapé mostra a data do último backup; clicando nela dá pra baixar qualquer uma das 7 cópias no formato do "Importar backup".' },
  { rev: 59, data: '23/09/2026', resumo: 'Apontar: ícone ☑ nas telas Marcar início e Concluir etapa ativa o modo de seleção — toque nos cards para marcar, "selecionar todos" e exclusão em lote (com Desfazer). Projetos: excluir um projeto agora apaga junto tudo que é dele (lançamentos, trechos, estruturas, etapas, elementos e efetivo geral), mostrando a contagem antes, pedindo para digitar EXCLUIR e baixando um backup .json automático — usado para remover o "Projeto Padrão (dados antigos)".' },
  { rev: 58, data: '10/09/2026', resumo: 'Correção crítica: falha ao carregar dados do Firestore (ex.: instabilidade de conexão) deixa de ser tratada como "banco vazio" — agora trava o app numa tela de erro clara e bloqueia qualquer gravação até recarregar, evitando que dados reais sejam sobrescritos por um estado vazio. Backup exportável (JSON) agora inclui todas as coleções do sistema (antes faltavam unidades, eixos, efetivo geral, contratos, custos e cronograma).' },
  { rev: 57, data: '10/09/2026', resumo: 'Numeração automática de sequência de elementos (E1→E2→E3...) passou a considerar só elementos do mesmo trecho/eixo do original, em vez da estrutura inteira — evita pular pra números muito altos quando já existem códigos iguais em outros eixos da mesma estrutura.' },
  { rev: 56, data: '10/09/2026', resumo: 'Etapas de estruturas sem elemento (medidas por trecho, ex.: Muro Armado) ganharam campo de quantidade orçada — na criação e editável direto na tabela —, barra de progresso (orçado × executado) e botão "ajustar avanço" pra lançar retroativamente um total já executado sem perder o histórico de apontamentos. Peça marcada como "concluído" manualmente passou a refletir 100% também nas etapas dela nos relatórios de progresso.' },
  { rev: 55, data: '10/09/2026', resumo: 'Gravação no Firestore passou a ser enfileirada por chave (uma escrita só começa depois que a anterior da mesma coleção termina), evitando que uma exclusão seguida rápido de uma criação se sobrescrevam fora de ordem e "ressuscitem" um dado que tinha acabado de ser excluído.' },
  { rev: 54, data: '10/09/2026', resumo: 'Correção no card "Avanço Físico por Projeto": elementos vinculados a estruturas já excluídas deixaram de entrar na contagem total, evitando que o denominador ficasse maior do que a soma real das estruturas ativas.' },
  { rev: 53, data: '20/08/2026', resumo: 'Contratos: abaixo de cada contrato, duas curvas S lado a lado — Físico (reaproveita as mesmas etapas do Cronograma) e Financeiro (planejado em S sobre o orçamento cadastrado × medições lançadas na guia Custo), sempre no mesmo período/configuração pra comparar os dois de forma direta. Toggle único de Semanas/Meses controla todas as curvas da página de uma vez, com o mesmo tooltip interativo ao passar o cursor (planejado, realizado, diferença em p.p. e em dias). Contratos sem etapas no cronograma, ou sem orçamento/medição cadastrados, mostram aviso no lugar do gráfico em vez de ficar em branco.' },
  { rev: 52, data: '20/08/2026', resumo: 'Cronograma: reformulado — cada projeto vinculado ao contrato agora vira automaticamente uma etapa do cronograma (usando a previsão de início/término cadastrada em Projetos), com avanço físico sempre atualizado a partir do que já é calculado no sistema. Etapas fora do escopo dos projetos (ex.: aprovação na prefeitura) continuam cadastráveis manualmente, agora com avanço em % lançado à mão em vez de só concluído/não concluído. Adicionado Indicador inteligente de prazo (avanço mínimo esperado, projeção de término pelo ritmo atual, situação no prazo/atenção/atrasado) e Curva S planejado×realizado por semana ou mês, com seletor de item (ou "todos os itens do contrato") e tooltip interativo ao passar o cursor mostrando planejado, realizado e diferença (em p.p. e em dias). Projetos ganharam campos de início/término previstos.' },
  { rev: 51, data: '20/08/2026', resumo: 'Nova guia Cronograma: cada cronograma pertence a um único contrato, com data de início e término. Dentro de cada cronograma, cadastre etapas/atividades com suas próprias datas — visualizadas num gráfico de linha do tempo (estilo Gantt) colorido por situação (planejado, em andamento, atrasado, concluído), com marcador do dia de hoje e avanço % (etapas concluídas / total).' },
  { rev: 50, data: '20/08/2026', resumo: 'Recursos: tipos de profissional cadastrados na aba Empresas agora sincronizam automaticamente como mão de obra na aba Recursos (sem duplicar), com o cadastro manual continuando disponível pra equipamentos ou funções extras. Custo por hora liberado pra qualquer empresa (antes só a AHBT podia cadastrar), refletido também na alocação de recursos em Apontar e nos relatórios de custo (renomeados de "AHBT" pra genéricos, já que agora qualquer empresa pode ter custo).' },
  { rev: 49, data: '20/08/2026', resumo: 'Painel: coluna "Concluídas" ganhou filtro por período (conclusão de/até), junto dos demais. Cards passaram a ordenar por data de início (mais recente primeiro) em vez de data de conclusão.' },
  { rev: 48, data: '20/08/2026', resumo: 'Painel: colunas do quadro voltaram a mostrar os cards em grade (3 colunas em telas largas, se ajustando sozinha em telas menores) em vez de lista única, economizando espaço vertical — mantendo a rolagem vertical quando não couber tudo.' },
  { rev: 47, data: '20/08/2026', resumo: 'Painel: coluna "Concluídas" ganhou também filtro por Empresa (junto com Projeto/Elemento/Etapa), e um botão discreto "✕ limpar" aparece na faixa verde quando algum desses filtros está ativo.' },
  { rev: 46, data: '20/08/2026', resumo: 'Painel: barra de rolagem das colunas do quadro voltou a ser vertical (lista de cards, com altura máxima e rolagem pra baixo) em vez de arrastar pros lados. Coluna "Concluídas" ganhou filtro discreto por Projeto/Elemento/Etapa dentro da própria faixa verde. Botão "Exportar / Imprimir" da Linha do tempo agora gera um relatório dedicado (cabeçalho com logo, filtro aplicado, gráfico de ociosidade por dia e a lista de liberações) mostrando só o que está filtrado — ou tudo, quando nenhum filtro está ativo — sem imprimir o resto da tela do Painel junto.' },
  { rev: 45, data: '20/08/2026', resumo: 'Painel: card "Ociosidade média por etapa" virou "Ociosidade média" com drill-down — seletor de nível (Projeto / Estrutura / Elemento / Etapa) e clique numa barra pra descer um nível, com breadcrumb pra voltar. KPI "Etapa mais crítica" continua calculado sobre a base completa, independente do nível escolhido no card.' },
  { rev: 44, data: '20/08/2026', resumo: 'Painel: o gráfico "Ociosidade por dia de liberação" agora acompanha o filtro da Linha do tempo — mostra todos os registros quando nenhum filtro está ativo, e só os do filtro (empresa/período) quando aplicado, com selo indicando quando está filtrado.' },
  { rev: 43, data: '20/08/2026', resumo: 'Painel: colunas do quadro de frentes ganharam barra de rolagem visível pra deixar claro que dá pra arrastar os cards. Botão de reabrir concluída ficou discreto (link de texto "↺ reabrir" em vez de botão preto de largura total). Linha do tempo de liberações ganhou botão "Exportar / Imprimir" no cabeçalho.' },

/* ---------------------------------------------------------
   PERSISTÊNCIA (Firestore)
--------------------------------------------------------- */
/* ---------------------------------------------------------
   PERSISTÊNCIA + SINCRONIZAÇÃO (Firestore) — R69
   - cada coleção comum continua num documento de "frente_livre_dados", mas:
       · a gravação é feita em transação e MESCLA por id com o que está no banco
         (um aparelho desatualizado não apaga mais o trabalho de outro);
       · todos os aparelhos escutam o banco em tempo real (onSnapshot).
   - os lançamentos (registros) saem da ficha única e passam a ter UM DOCUMENTO
     POR LANÇAMENTO na coleção "frente_livre_registros" (sem limite de 1 MB
     para o conjunto; grava só o que mudou).
   - falha de gravação vira faixa vermelha persistente, com nova tentativa automática.
--------------------------------------------------------- */
const APP_REV = 69;
const COL_DADOS = 'frente_livre_dados';
const COL_REG = 'frente_livre_registros';
const LIMITE_DOC_BYTES = 1000000; // limite do Firestore é 1 MiB por documento; margem de segurança
const _FALHA_LEITURA = Symbol('falha-leitura-firestore');
const CHAVE_CAMPO = {
  frentes_projetos:'projetos', frentes_estacas:'estacas', frentes_estruturas:'estruturas', frentes_etapas:'etapas',
  frentes_empresas:'empresas', frentes_recursos:'recursos', frentes_elementos:'elementos', frentes_eixos:'eixos',
  frentes_unidades:'unidades', frentes_registros_v2:'registros', frentes_efetivo_geral:'efetivoGeral',
  frentes_contratos:'contratos', frentes_custo_orcamentos:'custoOrcamentos', frentes_custo_medicoes:'custoMedicoes',
  frentes_cronogramas:'cronogramas', frentes_cronograma_itens:'cronogramaItens', frentes_calendario:'calendario',
  frentes_aprendizado:'aprendizado', frentes_rdos:'rdos',
  frentes_insumos:'insumos', frentes_tracos:'tracos', frentes_servicos_aux:'servicosAux', frentes_ins_config:'insConfig', frentes_ins_pools:'insPools', frentes_canteiros:'canteiros',
};
const _base = {};                 // chave -> JSON conhecido do servidor (o que este aparelho viu por último)
const _saveQueues = {};           // uma fila de gravação por chave (nunca deixa uma escrita antiga passar na frente)
const _pendentesRemotos = {};     // mudanças que chegaram antes de a carga terminar
const _unsubs = [];
let _syncPronto = false;
let _regModo = 'legado';          // 'legado' (ficha única) | 'documento' (um doc por lançamento)
const _regBase = new Map();       // id -> JSON do lançamento como está no servidor
const _regOrdem = new Map();      // id -> ordem (preserva a sequência original dos lançamentos)
let _regFila = Promise.resolve();
let _regPendentesRemotos = [];
let _migrandoRegistros = false;
const _falhasGravacao = new Map(); // nome -> mensagem
let _gravacoesEmAndamento = 0;

const bytesDe = s => new TextEncoder().encode(s).length;
function jsonLocal(key){ return JSON.stringify(DB[CHAVE_CAMPO[key]] ?? null); }
function erroTamanho(key, bytes){
  const e = new Error('tamanho'); e.code = 'tamanho-excedido';
  e.detalhe = `A coleção "${CHAVE_CAMPO[key]||key}" chegou a ${Math.round(bytes/1024)} KB — acima do limite de 1 MB por documento do Firestore.`;
  return e;
}

/* ---- mescla de 3 vias por id: base (último visto do servidor) × local × remoto ---- */
function _indexarPorId(arr){
  const m = new Map();
  for(const x of arr){ if(!x || x.id==null) return null; m.set(x.id, JSON.stringify(x)); }
  return m;
}
function mesclar3(baseJson, localJson, remotoJson){
  if(localJson===remotoJson) return localJson;
  if(baseJson===localJson) return remotoJson;   // eu não mexi: fica o do banco
  if(baseJson===remotoJson) return localJson;   // ninguém mais mexeu: fica o meu
  let B, L, R;
  try{ B = baseJson ? JSON.parse(baseJson) : []; L = JSON.parse(localJson); R = JSON.parse(remotoJson); } catch(e){ return localJson; }
  if(!Array.isArray(L) || !Array.isArray(R)) return localJson; // objeto único (calendário, aprendizado): vence o local
  const b = Array.isArray(B) ? _indexarPorId(B) : new Map(), l = _indexarPorId(L), r = _indexarPorId(R);
  if(!b || !l || !r) return localJson;
  const decidir = id => {
    const bj = b.get(id), lj = l.get(id), rj = r.get(id);
    if(lj===rj) return lj;
    if(lj===bj) return rj;            // só o outro aparelho mudou (inclui exclusão feita lá)
    if(rj===bj) return lj;            // só eu mudei (inclui exclusão feita aqui)
    if(lj===undefined) return rj;     // eu excluí, mas o outro alterou: preserva o trabalho do outro
    return lj;                        // os dois alteraram o mesmo item: vence o local
  };
  const out = [], vistos = new Set();
  for(const x of L){ vistos.add(x.id); const j = decidir(x.id); if(j!==undefined) out.push(j); }
  for(const x of R){ if(vistos.has(x.id)) continue; vistos.add(x.id); const j = decidir(x.id); if(j!==undefined) out.push(j); }
  return '[' + out.join(',') + ']';
}
// gravação vinda de VERSÃO ANTIGA (sem marca rev): não dá pra confiar nas alterações (a lista dela pode estar velha);
// aproveita só os itens NOVOS que ela criou e mantém o resto como está aqui.
function mesclarSoNovos(baseJson, localJson, remotoJson){
  let B, L, R;
  try{ B = baseJson ? JSON.parse(baseJson) : []; L = JSON.parse(localJson); R = JSON.parse(remotoJson); } catch(e){ return localJson; }
  if(!Array.isArray(L) || !Array.isArray(R)) return localJson;
  const idsL = new Set(L.map(x=>x&&x.id)), idsB = new Set((Array.isArray(B)?B:[]).map(x=>x&&x.id));
  const novos = R.filter(x => x && x.id!=null && !idsL.has(x.id) && !idsB.has(x.id));
  if(!novos.length) return localJson;
  return JSON.stringify(L.concat(novos));
}
function aplicarNoDB(key, json){
  const campo = CHAVE_CAMPO[key];
  let v = json ? JSON.parse(json) : null;
  if(campo==='calendario'){ v = normalizarCalendario(v); _calCache.clear(); }
  else if(campo==='aprendizado'){ v = normalizarAprendizado(v); }
  else if(campo==='insConfig'){ v = normalizarInsConfig(v); }
  else if(v===null) v = [];
  DB[campo] = v;
}

let _avisoVersaoAntiga = false;
let _avisoMigracao = null;
function tentarMigracaoDeNovo(){ _avisoMigracao = null; atualizarFaixaSync(); migrarRegistrosParaDocumentos(); }
window.tentarMigracaoDeNovo = tentarMigracaoDeNovo;
function avisarVersaoAntiga(){ _avisoVersaoAntiga = true; atualizarFaixaSync(); }
function mensagemErroGravacao(e){
  if(e && e.code==='tamanho-excedido') return e.detalhe;
  if(e && e.code==='permission-denied') return 'O Firestore recusou a gravação (permissão). Verifique as regras de segurança do banco.';
  return 'Não foi possível falar com o banco (sem internet ou conexão instável).';
}
function marcarFalhaGravacao(nome, e){ console.warn('Falha ao gravar', nome, e); _falhasGravacao.set(nome, mensagemErroGravacao(e)); atualizarFaixaSync(); }
function marcarGravacaoOk(nome){ if(_falhasGravacao.delete(nome)) atualizarFaixaSync(); }
function tentarGravacoesPendentes(){
  if(window.DB_LOAD_FAILED) return;
  for(const nome of [..._falhasGravacao.keys()]){
    if(nome==='registros') persistRegistros();
    else if(nome==='insMov') persistInsMov();
    else if(CHAVE_CAMPO[nome]) saveKey(nome);
    else _falhasGravacao.delete(nome);
  }
}
window.tentarGravacoesPendentes = tentarGravacoesPendentes;
setInterval(()=>{ if(_falhasGravacao.size) tentarGravacoesPendentes(); }, 20000);
window.addEventListener('online', tentarGravacoesPendentes);
window.addEventListener('beforeunload', ev => {
  if(_falhasGravacao.size || _gravacoesEmAndamento>0){ ev.preventDefault(); ev.returnValue = ''; }
});

/* ---- redesenho quando chega mudança de outro aparelho (sem atrapalhar quem está digitando) ---- */
let _renderRemotoT = null;
function agendarRenderRemoto(){
  clearTimeout(_renderRemotoT);
  _renderRemotoT = setTimeout(()=>{
    const a = document.activeElement;
    const editando = a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable);
    if(editando){ agendarRenderRemoto(); return; }
    try{ render(); } catch(e){ console.warn('render remoto', e); }
  }, 1200);
}

/* ---- carga + escuta de uma chave ---- */
function loadKey(key, fallback){
  if(!db) return Promise.resolve(fallback);
  return new Promise(resolve => {
    let primeiro = true;
    const timer = setTimeout(()=>{ if(primeiro){ primeiro = false; resolve(_FALHA_LEITURA); } }, 30000);
    const unsub = db.collection(COL_DADOS).doc(key).onSnapshot({ includeMetadataChanges:false }, snap => {
      if(primeiro){
        if(snap.metadata.fromCache) return; // sem confirmação do servidor ainda: NUNCA tratar como "vazio"
        primeiro = false; clearTimeout(timer);
        const d = snap.exists ? snap.data() : null;
        const v = d && d.value ? d.value : null;
        _base[key] = v;
        try{ resolve(v ? JSON.parse(v) : fallback); } catch(e){ resolve(_FALHA_LEITURA); }
        return;
      }
      aoMudarRemoto(key, snap);
    }, err => {
      if(primeiro){ primeiro = false; clearTimeout(timer); resolve(_FALHA_LEITURA); }
      else console.warn('Escuta interrompida', key, err);
    });
    _unsubs.push(unsub);
  });
}
function aoMudarRemoto(key, snap){
  if(snap.metadata.hasPendingWrites || snap.metadata.fromCache) return; // eco da minha própria gravação / cache
  if(!_syncPronto){ _pendentesRemotos[key] = snap; return; }
  const d = snap.exists ? snap.data() : null;
  const remoto = d && d.value ? d.value : null;
  if(remoto===null || remoto===_base[key]) return;
  // lançamentos no modo novo: a ficha antiga só muda se alguém com versão antiga gravar — importa o que ele criou/alterou
  if(key==='frentes_registros_v2' && _regModo==='documento'){
    importarDoLegado(_base[key], remoto);
    _base[key] = remoto;
    return;
  }
  const localJson = jsonLocal(key);
  if(remoto===localJson){ _base[key] = remoto; return; }
  const versaoAntiga = !(d && d.rev >= APP_REV);
  const final = versaoAntiga ? mesclarSoNovos(_base[key], localJson, remoto) : mesclar3(_base[key], localJson, remoto);
  if(versaoAntiga) avisarVersaoAntiga();
  _base[key] = remoto;
  aplicarNoDB(key, final);
  if(final!==remoto) saveKey(key); // eu tinha mudanças ainda não gravadas (ou a gravação antiga precisa ser corrigida)
  agendarRenderRemoto();
}

/* ---- gravação de uma chave (transação + mescla) ---- */
function saveKey(key){
  if(!db) return Promise.resolve();
  if(window.DB_LOAD_FAILED){ showToast('Gravação bloqueada: os dados não foram carregados corretamente nesta sessão. Recarregue a página antes de continuar.'); return Promise.resolve(); }
  if(key==='frentes_registros_v2' && _regModo==='documento') return persistRegistros();
  if(!CHAVE_CAMPO[key]) return Promise.resolve();
  _gravacoesEmAndamento++;
  const anterior = _saveQueues[key] || Promise.resolve();
  const atual = anterior
    .catch(()=>{})
    .then(() => gravarChaveMesclando(key))
    .then(() => marcarGravacaoOk(key))
    .catch(e => { marcarFalhaGravacao(key, e); throw e; })
    .finally(() => { _gravacoesEmAndamento--; });
  _saveQueues[key] = atual;
  return atual;
}
async function gravarChaveMesclando(key){
  const ref = db.collection(COL_DADOS).doc(key);
  const localJson = jsonLocal(key);
  let resultado = localJson;
  await db.runTransaction(async tx => {
    const snap = await tx.get(ref);
    const d = snap.exists ? snap.data() : null;
    const remoto = d && d.value ? d.value : null;
    const base = _base[key];
    if(remoto===null || remoto===base || remoto===localJson) resultado = localJson;
    else if(!(d && d.rev >= APP_REV)){ resultado = mesclarSoNovos(base, localJson, remoto); avisarVersaoAntiga(); }
    else resultado = mesclar3(base, localJson, remoto);
    const bytes = bytesDe(resultado);
    if(bytes > LIMITE_DOC_BYTES) throw erroTamanho(key, bytes);
    if(resultado!==remoto) tx.set(ref, { value: resultado, rev: APP_REV, em: Date.now() });
  });
  _base[key] = resultado;
  if(resultado!==localJson){
    // o banco tinha novidades de outro aparelho: incorpora aqui sem perder o que foi editado durante a gravação
    const agora = jsonLocal(key);
    aplicarNoDB(key, agora===localJson ? resultado : mesclar3(localJson, agora, resultado));
    agendarRenderRemoto();
  }
}

/* ---- LANÇAMENTOS: um documento por lançamento ---- */
async function carregarRegistros(){
  if(!db) return [];
  try{
    const meta = await db.collection(COL_DADOS).doc('registros_meta').get({ source:'server' });
    const m = meta.exists && meta.data().value ? JSON.parse(meta.data().value) : null;
    if(m && m.formato==='documento'){
      _regModo = 'documento';
      const [arr, legado] = await Promise.all([ouvirColecaoRegistros(true), loadKey('frentes_registros_v2', [])]);
      if(arr===_FALHA_LEITURA || legado===_FALHA_LEITURA) return _FALHA_LEITURA;
      return arr;
    }
  } catch(e){ return _FALHA_LEITURA; }
  return loadKey('frentes_registros_v2', []);
}
function ouvirColecaoRegistros(comoCarga){
  return new Promise(resolve => {
    let primeiro = true;
    const timer = comoCarga ? setTimeout(()=>{ if(primeiro){ primeiro = false; resolve(_FALHA_LEITURA); } }, 45000) : null;
    const unsub = db.collection(COL_REG).onSnapshot(snap => {
      if(primeiro){
        if(snap.metadata.fromCache) return;
        primeiro = false; if(timer) clearTimeout(timer);
        if(comoCarga){
          const lista = [];
          snap.forEach(doc => {
            const d = doc.data(); if(!d.value) return;
            _regBase.set(doc.id, d.value); _regOrdem.set(doc.id, d.o ?? 0);
            lista.push(JSON.parse(d.value));
          });
          lista.sort((a,b)=>(_regOrdem.get(a.id)??0)-(_regOrdem.get(b.id)??0));
          resolve(lista);
        } else {
          aplicarMudancasRegistros(snap.docChanges());
          resolve(true);
        }
        return;
      }
      if(!_syncPronto){ _regPendentesRemotos.push(...snap.docChanges()); return; }
      aplicarMudancasRegistros(snap.docChanges());
    }, err => {
      if(primeiro){ primeiro = false; if(timer) clearTimeout(timer); resolve(_FALHA_LEITURA); }
      else console.warn('Escuta de lançamentos interrompida', err);
    });
    _unsubs.push(unsub);
  });
}
function aplicarMudancasRegistros(changes){
  let mudou = false, regravar = false;
  for(const ch of changes){
    if(ch.doc.metadata.hasPendingWrites) continue;
    const id = ch.doc.id;
    const idx = DB.registros.findIndex(r=>r.id===id);
    const localJ = idx>=0 ? JSON.stringify(DB.registros[idx]) : undefined;
    const baseJ = _regBase.get(id);
    if(ch.type==='removed'){
      if(baseJ===undefined) continue;
      _regBase.delete(id);
      if(idx>=0 && localJ!==baseJ){ regravar = true; continue; } // alterei aqui e ainda não gravei: mantém o meu
      if(idx>=0){ DB.registros.splice(idx,1); mudou = true; }
      continue;
    }
    const d = ch.doc.data(); const v = d.value;
    if(!v || v===baseJ) continue;
    _regBase.set(id, v); _regOrdem.set(id, d.o ?? Date.now());
    if(idx<0){ DB.registros.push(JSON.parse(v)); mudou = true; }
    else if(localJ===baseJ || localJ===v){ DB.registros[idx] = JSON.parse(v); mudou = true; }
    else regravar = true; // os dois alteraram: vence o local (gravado a seguir)
  }
  if(regravar) persistRegistros();
  if(mudou) agendarRenderRemoto();
}
function importarDoLegado(anteriorJson, novoJson){
  let ant, novo;
  try{ ant = JSON.parse(anteriorJson||'[]'); novo = JSON.parse(novoJson||'[]'); } catch(e){ return; }
  if(!Array.isArray(novo)) return;
  const antMap = new Map((Array.isArray(ant)?ant:[]).map(r=>[r.id, JSON.stringify(r)]));
  let n = 0;
  for(const r of novo){
    if(!r || r.id==null || antMap.get(r.id)===JSON.stringify(r)) continue;
    const i = DB.registros.findIndex(x=>x.id===r.id);
    if(i>=0) DB.registros[i] = r; else DB.registros.push(r);
    n++;
  }
  if(n){ avisarVersaoAntiga(); persistRegistros(); agendarRenderRemoto(); }
}
function persistRegistros(){
  if(!db) return Promise.resolve();
  if(window.DB_LOAD_FAILED){ showToast('Gravação bloqueada: os dados não foram carregados corretamente nesta sessão. Recarregue a página antes de continuar.'); return Promise.resolve(); }
  if(_regModo!=='documento') return saveKey('frentes_registros_v2');
  _gravacoesEmAndamento++;
  _regFila = _regFila.catch(()=>{})
    .then(flushRegistros)
    .then(() => marcarGravacaoOk('registros'))
    .catch(e => marcarFalhaGravacao('registros', e))
    .finally(() => { _gravacoesEmAndamento--; });
  return _regFila;
}
async function flushRegistros(){
  const atuais = new Map();
  DB.registros.forEach(r => atuais.set(r.id, JSON.stringify(r)));
  const ops = [];
  let seq = 0;
  atuais.forEach((j, id) => { if(_regBase.get(id)!==j) ops.push({ tipo:'set', id, j }); });
  _regBase.forEach((j, id) => { if(!atuais.has(id)) ops.push({ tipo:'del', id }); });
  if(!ops.length) return;
  const col = db.collection(COL_REG);
  for(let i=0; i<ops.length; i+=400){
    const lote = ops.slice(i, i+400);
    const batch = db.batch();
    for(const op of lote){
      if(op.tipo==='del'){ batch.delete(col.doc(op.id)); continue; }
      if(!_regOrdem.has(op.id)) _regOrdem.set(op.id, Date.now() + (seq++));
      batch.set(col.doc(op.id), { value: op.j, o: _regOrdem.get(op.id), rev: APP_REV, em: Date.now() });
    }
    await batch.commit();
    for(const op of lote){ if(op.tipo==='del'){ _regBase.delete(op.id); _regOrdem.delete(op.id); } else _regBase.set(op.id, op.j); }
  }
}
function _overlayMigracao(txt){
  let el = document.getElementById('overlay-migracao');
  if(txt===null){ if(el) el.remove(); return; }
  if(!el){
    el = document.createElement('div'); el.id = 'overlay-migracao';
    el.style.cssText = 'position:fixed; inset:0; z-index:10000; background:rgba(20,20,20,.72); display:flex; align-items:center; justify-content:center; padding:20px;';
    document.body.appendChild(el);
  }
  el.innerHTML = `<div style="background:#fff; max-width:480px; padding:28px; border-radius:12px; text-align:center; font-size:14px; line-height:1.5;">
    <h3 style="margin-top:0">Atualizando o formato do banco (Rev. ${APP_REV})</h3><p>${esc(txt)}</p><p style="color:#991b1b"><b>Não feche esta aba.</b></p></div>`;
}
async function migrarRegistrosParaDocumentos(){
  if(_regModo==='documento' || _migrandoRegistros || window.DB_LOAD_FAILED) return;
  _migrandoRegistros = true;
  try{
    // outro aparelho pode ter migrado enquanto este carregava
    const metaAtual = await db.collection(COL_DADOS).doc('registros_meta').get({ source:'server' });
    const mAtual = metaAtual.exists && metaAtual.data().value ? JSON.parse(metaAtual.data().value) : null;
    if(mAtual && mAtual.formato==='documento'){ location.reload(); return; }
    // espera gravações pendentes da ficha antiga terminarem
    await (_saveQueues['frentes_registros_v2'] || Promise.resolve()).catch(()=>{});
    // R71: testa a permissão ANTES de tudo (antes baixava um backup a cada abertura mesmo sem permissão)
    const sonda = db.collection(COL_REG).doc('_teste_permissao');
    await sonda.set({ teste: true, em: Date.now() });
    await sonda.delete();
    _overlayMigracao('Baixando uma cópia de segurança completa no seu computador…');
    try{ exportarBackupJSON(); } catch(e){ console.warn(e); }
    const lista = DB.registros.slice();
    const col = db.collection(COL_REG);
    for(let i=0; i<lista.length; i+=400){
      _overlayMigracao(`Copiando lançamentos: ${Math.min(i+400, lista.length)} de ${lista.length}…`);
      const batch = db.batch();
      lista.slice(i, i+400).forEach((r, k) => batch.set(col.doc(r.id), { value: JSON.stringify(r), o: i+k, rev: APP_REV, em: Date.now() }));
      await batch.commit();
    }
    _overlayMigracao('Conferindo a cópia…');
    const conf = await col.get({ source:'server' });
    const idsGravados = new Set(conf.docs.map(d=>d.id));
    const faltando = lista.filter(r=>!idsGravados.has(r.id));
    if(faltando.length) throw new Error(`Conferência falhou: ${faltando.length} lançamento(s) não apareceram na nova coleção.`);
    await db.collection(COL_DADOS).doc('registros_meta').set({ value: JSON.stringify({ formato:'documento', migradoEm: new Date().toISOString(), total: lista.length, rev: APP_REV }) });
    conf.docs.forEach(d => { const x = d.data(); if(x.value){ _regBase.set(d.id, x.value); _regOrdem.set(d.id, x.o ?? 0); } });
    _regModo = 'documento';
    await ouvirColecaoRegistros(false);
    await persistRegistros(); // o que tiver sido lançado durante a migração
    _overlayMigracao(null);
    showToast(`Banco atualizado: ${lista.length} lançamentos agora gravados um a um. A ficha antiga foi mantida como cópia de segurança.`);
  } catch(e){
    console.error('Migração dos lançamentos falhou', e);
    _overlayMigracao(null);
    _regModo = 'legado';
    // R71: falha da migração NÃO é "alteração não salva" — o app segue gravando normalmente no formato antigo
    _avisoMigracao = e && e.code==='permission-denied'
      ? `As regras do Firestore ainda não liberam a coleção "${COL_REG}". O app está SALVANDO normalmente no formato antigo (com a proteção entre aparelhos). Depois de liberar as regras, toque em "Tentar migração".`
      : `A mudança para o novo formato não terminou (${(e&&e.message)||'erro'}). O app está SALVANDO normalmente no formato antigo.`;
    atualizarFaixaSync();
  } finally {
    _migrandoRegistros = false;
  }
}
function ouvirMetaRegistros(){
  const unsub = db.collection(COL_DADOS).doc('registros_meta').onSnapshot(snap => {
    if(snap.metadata.fromCache || snap.metadata.hasPendingWrites) return;
    const d = snap.exists ? snap.data() : null;
    const m = d && d.value ? JSON.parse(d.value) : null;
    if(m && m.formato==='documento' && _regModo==='legado' && !_migrandoRegistros && _syncPronto){
      // outro aparelho migrou: termina o que estiver gravando e recarrega já no formato novo

    }
  }, ()=>{});
  _unsubs.push(unsub);
}

function showToast(msg, actionLabel, actionFn){
  const t = document.getElementById('toast');
  if(actionLabel && actionFn){
    t.innerHTML = `<span>${esc(msg)}</span> <button id="toast-action" style="all:unset; cursor:pointer; text-decoration:underline; margin-left:10px; font-weight:600;">${esc(actionLabel)}</button>`;

}

function _min(hhmm){ const [h,m] = String(hhmm).split(':').map(Number); return h*60+m; }
// Converte as janelas de um dia em minutos absolutos a partir da 00:00 daquele dia.
// Horário menor que o anterior = dia seguinte (turno que vira a noite pertence ao dia em que começou).
function _janelasAbs(janelas){
  const out = []; let off = 0, prevFim = -1;
  for(const x of (janelas||[])){
    let ini = _min(x.ini) + off;
    if(ini < prevFim){ off += 1440; ini += 1440; }
    let fim = _min(x.fim) + off;
    if(fim <= ini){ off += 1440; fim += 1440; }

function parseJanelas(txt){
  // "07:00-12:00 13:00-17:00" ou "22:00-01:00 02:00-05:00" → [{ini,fim},...] na ordem digitada; null se inválido
  const partes = String(txt||'').trim().split(/[\s,;]+/).filter(Boolean);
  const out = [];
  for(const pt of partes){
    const m = pt.match(/^(\d{1,2}):?(\d{2})-(\d{1,2}):?(\d{2})$/);
    if(!m) return null;
    const ini = `${m[1].padStart(2,'0')}:${m[2]}`, fim = `${m[3].padStart(2,'0')}:${m[4]}`;
    if(ini===fim || _min(ini)>1440 || _min(fim)>1440 || Number(m[2])>59 || Number(m[4])>59) return null;
    out.push({ini,fim});
  }
  const abs = _janelasAbs(out);
  if(abs.length && abs[abs.length-1][1] - abs[0][0] > 1440) return null; // um "dia" de turno não passa de 24h

  if(isNaN(iniMs)) return null;
  const calId = calendarioIdDoReg(reg);
  const k = calendarioPorId(calId);
  const pausas = (reg.pausas||[]).map(p=>[new Date(p.inicio).getTime(), p.fim ? new Date(p.fim).getTime() : Date.now()]);
  if(reg.pausadoDesde && !reg.termino) pausas.push([new Date(reg.pausadoDesde).getTime(), Date.now()]);

  const primeiroDia = ymdLocal(iniMs);
  let total = 0, d = addDiasYmd(primeiroDia, -1); const ultimo = ymdLocal(Math.max(fimMs, iniMs));

      // dia encerrado: vale o horário real informado (mesmo em folga/feriado, e mesmo virando a noite), descontando o intervalo

function parseEstacaVal(str){
  const parts = String(str).trim().split('+');
  const base = parseInt(parts[0], 10) || 0;
  const plus = parts[1] ? parseInt(parts[1], 10) : 0;
  return base + plus/1000;
}

}
function listaEstacasDoTrecho(f){
  const startVal = parseEstacaVal(f.estacaInicio);
  const endVal = parseEstacaVal(f.estacaTermino);
  const list = [];
  if(Math.abs(startVal - Math.floor(startVal)) > 1e-9) list.push(startVal);
  for(let b = Math.ceil(startVal - 1e-9); b <= Math.floor(endVal + 1e-9); b++) list.push(b);
  if(Math.abs(endVal - Math.floor(endVal)) > 1e-9) list.push(endVal);
  return [...new Set(list)].sort((a,b)=>a-b);
}
const METROS_POR_ESTACA = 20;
function distEstacaMetros(str){
  const parts = String(str).trim().split('+');
  const base = parseInt(parts[0], 10) || 0;
  const plus = parts[1] ? parseInt(parts[1], 10) : 0;
  return base*METROS_POR_ESTACA + plus;
}

  if(faixaInicio==null || faixaFim==null) return 0;
  return Math.abs(distEstacaMetros(faixaFim) - distEstacaMetros(faixaInicio));
}

const UNIDADES_INSUMO = ['SC','KG','T','M³','M²','M','L','UN'];

const MOTIVOS_DEV = ['Sobra de execução','Material não utilizado','Troca de especificação'];
const DESTINO_TIPOS = { elemento:'Elemento', trecho:'Trecho de estrutura', servico:'Serviço auxiliar', geral:'Projeto geral', compartilhado:'Compartilhado' };

function normalizarInsConfig(v){
  v = (v && typeof v==='object' && !Array.isArray(v)) ? v : {};
  return {
    limites: { ...(v.limites||{}) },
    linkNorma: v.linkNorma || '',
    revisaoNorma: v.revisaoNorma || 'ABNT NBR 6122:2019 + Emenda 1:2022',
    horasUmidade: v.horasUmidade ?? 3,
  };
}

/* ---------- movimentos: um documento por movimento ---------- */
const _insBase = new Map();
let _insFila = Promise.resolve();
let _insPendentesRemotos = [];
const _insDocId = id => 'insmov__' + id;

function carregarInsMov(){
  if(!db) return Promise.resolve([]);
  return new Promise(resolve => {
    let primeiro = true;
    const timer = setTimeout(()=>{ if(primeiro){ primeiro = false; resolve(_FALHA_LEITURA); } }, 45000);
    const unsub = db.collection(COL_DADOS).where('tipo','==','insmov').onSnapshot(snap => {
      if(primeiro){
        if(snap.metadata.fromCache) return;
        primeiro = false; clearTimeout(timer);
        const lista = [];
        snap.forEach(doc => { const d = doc.data(); if(!d.value) return; _insBase.set(d.mid, d.value); lista.push(JSON.parse(d.value)); });
        lista.sort((a,b)=>(a.criadoEm||0)-(b.criadoEm||0));
        resolve(lista);
        return;
      }
      if(!_syncPronto){ _insPendentesRemotos.push(...snap.docChanges()); return; }
      aplicarMudancasInsMov(snap.docChanges());
    }, err => {
      if(primeiro){ primeiro = false; clearTimeout(timer); resolve(_FALHA_LEITURA); }
      else console.warn('Escuta de insumos interrompida', err);
    });
    _unsubs.push(unsub);
  });
}
function processarPendentesInsMov(){
  if(_insPendentesRemotos.length){ const p = _insPendentesRemotos; _insPendentesRemotos = []; aplicarMudancasInsMov(p); }
}
function aplicarMudancasInsMov(changes){
  let mudou = false, regravar = false;
  for(const ch of changes){
    if(ch.doc.metadata.hasPendingWrites) continue;
    const id = ch.doc.id.replace(/^insmov__/, '');
    const idx = DB.insMov.findIndex(m=>m.id===id);
    const localJ = idx>=0 ? JSON.stringify(DB.insMov[idx]) : undefined;
    const baseJ = _insBase.get(id);
    if(ch.type==='removed'){
      if(baseJ===undefined) continue;
      _insBase.delete(id);
      if(idx>=0 && localJ!==baseJ){ regravar = true; continue; }
      if(idx>=0){ DB.insMov.splice(idx,1); mudou = true; }
      continue;
    }
    const v = ch.doc.data().value;
    if(!v || v===baseJ) continue;
    _insBase.set(id, v);
    if(idx<0){ DB.insMov.push(JSON.parse(v)); mudou = true; }
    else if(localJ===baseJ || localJ===v){ DB.insMov[idx] = JSON.parse(v); mudou = true; }
    else regravar = true;
  }
  if(regravar) persistInsMov();
  if(mudou) agendarRenderRemoto();
}
function persistInsMov(){
  if(!db) return Promise.resolve();
  if(window.DB_LOAD_FAILED){ showToast('Gravação bloqueada: os dados não foram carregados corretamente nesta sessão. Recarregue a página antes de continuar.'); return Promise.resolve(); }
  _gravacoesEmAndamento++;
  _insFila = _insFila.catch(()=>{})
    .then(flushInsMov)
    .then(() => marcarGravacaoOk('insMov'))
    .catch(e => marcarFalhaGravacao('insMov', e))
    .finally(() => { _gravacoesEmAndamento--; });
  return _insFila;
}
async function flushInsMov(){
  const atuais = new Map();
  DB.insMov.forEach(m => atuais.set(m.id, JSON.stringify(m)));
  const ops = [];
  atuais.forEach((j, id) => { if(_insBase.get(id)!==j) ops.push({ tipo:'set', id, j }); });
  _insBase.forEach((j, id) => { if(!atuais.has(id)) ops.push({ tipo:'del', id }); });
  if(!ops.length) return;
  const col = db.collection(COL_DADOS);
  for(let i=0; i<ops.length; i+=400){
    const lote = ops.slice(i, i+400);
    const batch = db.batch();
    for(const op of lote){
      if(op.tipo==='del') batch.delete(col.doc(_insDocId(op.id)));
      else batch.set(col.doc(_insDocId(op.id)), { tipo:'insmov', mid: op.id, value: op.j, rev: APP_REV, em: Date.now() });
    }
    await batch.commit();
    for(const op of lote){ if(op.tipo==='del') _insBase.delete(op.id); else _insBase.set(op.id, op.j); }
  }
}
