        <td>${r.inicio ? `<span class="chip ${sev}">${fmtHoras(h)}</span>` : `<span class="chip vermelho pulse">${fmtHoras(h)}</span>`}</td>
        <td>${eh===null ? '—' : (r.termino ? `<span class="chip roxo">${fmtHoras(eh)}</span>` : `<span class="chip roxo pulse">${fmtHoras(eh)}</span>`)}</td>
        <td>${r.termino ? `<span class="mono" style="cursor:pointer; text-decoration:underline;" onclick="state.tab='apontar'; apontar.acao='concluir'; apontar.quantidadeRegId='${r.id}'; render();">${r.quantidadeExecutada!=null ? `${r.quantidadeExecutada} ${esc(r.unidadeExecutada||'')}` : 'informar'}</span>` : '—'}</td>
        <td>${r.inicio ? `<span class="mono" style="font-size:11.5px; cursor:pointer; text-decoration:underline;" onclick="state.tab='apontar'; apontar.acao='concluir'; apontar.alocarRegId='${r.id}'; render();">${esc(recursosResumo(r))}</span>` : '—'}</td>
        <td class="num">${fmtMoeda(custo)}</td>
        <td style="text-align:right; white-space:nowrap">
          <button class="icon-btn" title="Lançar/editar efetivo retroativo" onclick="state.historicoEfetivoRegId='${r.id}'; state.historicoEfetivoData=null; render();">${ICONS.frentes}</button>
          <button class="icon-btn" title="Ver/registrar ocorrências" style="${ocorrenciasAbertasDe(r).length?'color:var(--vermelho);':''}" onclick="state.historicoOcorrenciaRegId='${r.id}'; render();">⚠${(r.ocorrencias||[]).length?`<span style="font-size:9px; vertical-align:super;">${r.ocorrencias.length}</span>`:''}</button>
          <button class="icon-btn edit" onclick="state.editRegId='${r.id}'; render();">${ICONS.edit}</button>
          <button class="icon-btn" onclick="deleteRegistro('${r.id}')">${ICONS.trash}</button>
        </td>
      </tr>`;
  }).join('');

  return `
    <div class="topbar"><div><h2>Histórico</h2><p class="desc">Lance manualmente ou corrija qualquer lançamento. No dia a dia, use a aba Apontar.</p></div></div>
    <div class="card"><h3>Novo lançamento manual</h3>
      <form onsubmit="return submitRegistro(event)">
        <div class="grid4">
          <div class="field"><label>Projeto *</label><select name="projetoId" required>${projetoOptionsSel(null)}</select></div>
          <div class="field"><label>Trecho *</label><select name="trechoId" required>${trechoOptionsSel(null, null)}</select></div>
          <div class="field"><label>Estaca início *</label><input type="text" name="faixaInicio" required placeholder="Ex.: 4038"></div>
          <div class="field"><label>Estaca término *</label><input type="text" name="faixaFim" required placeholder="Ex.: 4039"></div>

function trechoOptionsGlobal(projetoId, selId){
  return DB.estacas.filter(e=>e.projetoId===projetoId).sort((a,b)=>(a.trecho||'').localeCompare(b.trecho||'', undefined, {numeric:true})).map(e=>`<option value="${e.id}" ${e.id===selId?'selected':''}>${esc(e.trecho||nomeTrecho(e.id))} (${esc(e.estacaInicio)}–${esc(e.estacaTermino)})</option>`).join('');
}
window.trechoOptionsGlobal = trechoOptionsGlobal;
function submitRegistro(ev){
  ev.preventDefault();
  const f = ev.target;
  const projetoId = f.projetoId.value;
  const trechoId = f.trechoId.value;
  const faixaInicio = f.faixaInicio.value.trim().toUpperCase();
  const faixaFim = f.faixaFim.value.trim().toUpperCase();
  const estruturaId = f.estruturaId.value;
  const etapaId = f.etapaId.value;
  const empresaId = f.empresaId.value;
  const liberacao = f.liberacao.value;
  const inicio = f.inicio.value;
  const termino = f.termino.value;
  if(!projetoId || !trechoId || !faixaInicio || !faixaFim || !estruturaId || !etapaId || !empresaId || !liberacao){
    showToast('Preencha todos os campos obrigatórios.');
    return false;
  }
  if(inicio && new Date(inicio) < new Date(liberacao)){ showToast('O início não pode ser antes da liberação.'); return false; }
  if(termino && !inicio){ showToast('Preencha o início antes do término.'); return false; }
  if(termino && new Date(termino) < new Date(inicio)){ showToast('O término não pode ser antes do início.'); return false; }
  DB.registros.push({ id: uid(), projetoId, trechoId, faixaInicio, faixaFim, estruturaId, etapaId, empresaId, liberacao, inicio: inicio||null, termino: termino||null, pausas:[], pausadoDesde:null, recursos:[], efetivoDiario:[], ocorrencias:[], quantidadeExecutada:null, unidadeExecutada:null, elementoId:null, obs: f.obs.value.trim(), createdAt: Date.now() });
  persist.registros();
  showToast('Lançamento registrado.');
  f.reset(); render();
  return false;
}
window.submitRegistro = submitRegistro;
function updateInicio(id, value){
  const reg = DB.registros.find(r=>r.id===id);
  if(value && new Date(value) < new Date(reg.liberacao)){ showToast('O início não pode ser antes da liberação.'); render(); return; }
  reg.inicio = value || null;
  if(!reg.inicio) reg.termino = null;
  persist.registros();
  render();
}
window.updateInicio = updateInicio;
function updateTermino(id, value){
  const reg = DB.registros.find(r=>r.id===id);
  if(value && reg.inicio && new Date(value) < new Date(reg.inicio)){ showToast('O término não pode ser antes do início.'); render(); return; }
  reg.termino = value || null;
  persist.registros();
  render();
}
window.updateTermino = updateTermino;
function salvarEdicaoRegistro(id){
  const r = DB.registros.find(x=>x.id===id);
  const projetoId = document.getElementById(`edit-reg-projeto-${id}`).value;
  const trechoId = document.getElementById(`edit-reg-trecho-${id}`).value;
  const faixaInicio = document.getElementById(`edit-reg-faixaIni-${id}`).value.trim().toUpperCase();
  const faixaFim = document.getElementById(`edit-reg-faixaFim-${id}`).value.trim().toUpperCase();
  const estruturaId = document.getElementById(`edit-reg-estrutura-${id}`).value;
  const etapaId = document.getElementById(`edit-reg-etapa-${id}`).value;
  const empresaId = document.getElementById(`edit-reg-empresa-${id}`).value;
  if(!projetoId || !trechoId || !faixaInicio || !faixaFim || !estruturaId || !etapaId || !empresaId){
    showToast('Preencha todos os campos.');
    return;
  }
  r.projetoId=projetoId; r.trechoId=trechoId; r.faixaInicio=faixaInicio; r.faixaFim=faixaFim; r.estruturaId=estruturaId; r.etapaId=etapaId; r.empresaId=empresaId;
  persist.registros();
  state.editRegId = null;
  showToast('Registro atualizado.');
  render();
}
window.salvarEdicaoRegistro = salvarEdicaoRegistro;
function deleteRegistro(id){
  DB.registros = DB.registros.filter(r=>r.id!==id);
  persist.registros(); render();
}
window.deleteRegistro = deleteRegistro;
