   PROJETOS
--------------------------------------------------------- */
function elementoConcluido(elementoId){
  const el = DB.elementos.find(x=>x.id===elementoId);
  if(el && el.concluido) return true;
  const etapas = etapasDoElemento(elementoId);
  if(!etapas.length) return false;
  return etapas.every(et => DB.registros.some(r=>r.elementoId===elementoId && r.etapaId===et.id && r.termino));
}
function avancoFisicoProjeto(projetoId){
  const elementos = DB.elementos.filter(el=>el.projetoId===projetoId && DB.estruturas.some(es=>es.id===el.estruturaId));
  const total = elementos.length;
  if(total===0) return { total:0, concluidos:0, pct:0 };
  const concluidos = elementos.filter(el=>elementoConcluido(el.id)).length;
  return { total, concluidos, pct: Math.round((concluidos/total)*100) };
}
function avancoQuantidadeProjeto(projetoId){
  const estruturasSemElemento = DB.estruturas.filter(e=>e.projetoId===projetoId && !e.usaElementos);
  if(!estruturasSemElemento.length) return null;
  const etapasRelevantes = DB.etapas.filter(et=>estruturasSemElemento.some(es=>es.id===et.estruturaId) && et.quantidadeOrcada!=null && et.quantidadeOrcada>0);
  if(!etapasRelevantes.length) return null;
  const detalhe = etapasRelevantes.map(et=>{
    const executado = DB.registros.filter(r=>r.etapaId===et.id && !r.elementoId).reduce((s,r)=>s+(r.quantidadeExecutada||0),0);
    const pct = Math.min(100, Math.round((executado/et.quantidadeOrcada)*100));
    return { estruturaId: et.estruturaId, etapaId: et.id, nome: et.name, orcado: et.quantidadeOrcada, unidade: et.unidadeOrcada, executado, pct };
  });
  const pctMedio = Math.round(detalhe.reduce((s,d)=>s+d.pct,0) / detalhe.length);
  return { pct: pctMedio, etapas: detalhe.length, detalhe };
}
function avancoCombinadoProjeto(projetoId){
  const porElemento = avancoFisicoProjeto(projetoId);
  const porQuantidade = avancoQuantidadeProjeto(projetoId);
  if(porElemento.total===0 && !porQuantidade) return { modo:'nenhum' };
  if(porElemento.total>0 && !porQuantidade) return { modo:'elemento', ...porElemento };
  if(porElemento.total===0 && porQuantidade) return { modo:'quantidade', ...porQuantidade };
  // projeto misto: tem os dois tipos de estrutura — média simples dos dois percentuais
  const pct = Math.round((porElemento.pct + porQuantidade.pct) / 2);
  return { modo:'misto', pct, porElemento, porQuantidade };
}
function avancoFisicoContrato(contratoId){
  const projetos = DB.projetos.filter(p=>p.contratoId===contratoId);
  const comDados = projetos.map(p=>({ projeto:p, av: avancoCombinadoProjeto(p.id) })).filter(x=>x.av.modo!=='nenhum');
  if(!projetos.length) return { modo:'sem-projeto' };
  if(!comDados.length) return { modo:'sem-dados', projetos: projetos.length };
  const pct = Math.round(comDados.reduce((s,x)=>s+x.av.pct,0) / comDados.length);
  return { modo:'ok', pct, projetos: projetos.length, comDados: comDados.length };
}

function moveContrato(id, dir){
  const lista = DB.contratos.slice().sort((a,b)=>(a.order??0)-(b.order??0));
  const idx = lista.findIndex(c=>c.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=lista.length) return;
  const tmp = lista[idx].order??idx; lista[idx].order = lista[swapIdx].order??swapIdx; lista[swapIdx].order = tmp;
  persist.contratos(); render();
}

function submitContrato(ev){
  ev.preventDefault();
  const f = ev.target;

  if(!codigo){ showToast('Preencha o código do contrato.'); return false; }
  if(DB.contratos.some(c=>c.codigo.toLowerCase()===codigo.toLowerCase())){ showToast(`Já existe um contrato "${codigo}".`); return false; }
  const maxOrder = DB.contratos.reduce((m,c)=>Math.max(m,c.order??0), -1);

/* ---------------------------------------------------------
   CRONOGRAMA — por contrato. Cada projeto vinculado ao contrato vira automaticamente uma
   etapa do cronograma (usando a previsão cadastrada em Projetos), com avanço físico sempre
   atualizado a partir do que já é calculado em avancoCombinadoProjeto(). Também dá pra cadastrar
   etapas manuais (ex.: "Aprovação do projeto na prefeitura"), com avanço em % lançado à mão.
--------------------------------------------------------- */
function diasEntre(a,b){ return (new Date(b)-new Date(a))/86400000; }
function itensCronograma(contratoId){
  const autoItens = DB.projetos
    .filter(p=>p.contratoId===contratoId && p.dataInicioPrevista && p.dataFimPrevista)
    .map(p=>({ id:'proj-'+p.id, tipo:'projeto', projetoId:p.id, nome:p.nome, dataInicio:p.dataInicioPrevista, dataFim:p.dataFimPrevista, avanco: avancoCombinadoProjeto(p.id).pct||0 }));
  const manualItens = DB.cronogramaItens
    .filter(it=>it.contratoId===contratoId)
    .map(it=>({ id:it.id, tipo:'manual', nome:it.nome, dataInicio:it.dataInicio, dataFim:it.dataFim, avanco: it.avancoManual||0 }));
  return [...autoItens, ...manualItens].sort((a,b)=> a.dataInicio.localeCompare(b.dataInicio));
}
function statusItemCronograma(item){
  const hoje = hojeStr();
  if(item.avanco>=100) return { sev:'verde', label:'concluído' };
  if(hoje > item.dataFim) return { sev:'vermelho', label:'atrasado' };
  if(hoje >= item.dataInicio) return { sev:'amarelo', label:'em andamento' };
  return { sev:'azul', label:'planejado' };
}
function calcularIndicadorItem(item){
  const duracaoTotal = Math.max(diasEntre(item.dataInicio, item.dataFim), 1);
  const decorridos = Math.min(Math.max(diasEntre(item.dataInicio, hojeStr()), 0), duracaoTotal);
  const avancoMinimoEsperado = Math.round((decorridos/duracaoTotal)*100);
  const ritmoDiario = decorridos>0 ? item.avanco/decorridos : 0;
  const diasParaConcluir = ritmoDiario>0 ? (100-item.avanco)/ritmoDiario : Infinity;
  const dataProjetada = isFinite(diasParaConcluir) ? new Date(Date.now()+diasParaConcluir*86400000) : null;
  const atrasoDias = dataProjetada ? Math.round(diasEntre(item.dataFim, dataProjetada.toISOString().slice(0,10))) : null;
  let situacao, sev;
  if(item.avanco>=100){ situacao='concluído'; sev='verde'; }
  else if(atrasoDias===null){ situacao='sem ritmo (0% até agora)'; sev='vermelho'; }
  else if(atrasoDias<=0){ situacao='no prazo'; sev='verde'; }
  else if(atrasoDias<=15){ situacao='atenção'; sev='amarelo'; }
  else { situacao='atrasado'; sev='vermelho'; }
  return { avancoMinimoEsperado, dataProjetada, atrasoDias, situacao, sev };
}

/* -- helpers da curva S: formato "S" (sigmoide), geração de períodos, valor planejado/realizado de um item numa data -- */
function sigmoideCronograma(t){
  const k = 10;
  const raw = 1/(1+Math.exp(-k*(t-0.5)));
  const min = 1/(1+Math.exp(-k*(0-0.5)));
  const max = 1/(1+Math.exp(-k*(1-0.5)));
  return (raw-min)/(max-min);
}
function gerarPeriodosCronograma(inicio, fim, granularidade){
  const periodos = [];
  let cursor = new Date(inicio);
  const fimData = new Date(fim);
  const passoDias = granularidade==='semana' ? 7 : 30;
  while(cursor <= fimData){ periodos.push(new Date(cursor)); cursor = new Date(cursor.getTime()+passoDias*86400000); }
  if(!periodos.length || periodos[periodos.length-1].getTime()!==fimData.getTime()) periodos.push(fimData);
  return periodos;
}
function valorPlanejadoEmCronograma(item, data){
  const duracaoTotal = Math.max(diasEntre(item.dataInicio, item.dataFim), 1);
  const t = Math.min(Math.max(diasEntre(item.dataInicio, data.toISOString().slice(0,10))/duracaoTotal, 0), 1);
  return sigmoideCronograma(t)*100;
}
function valorRealizadoEmCronograma(item, data, hoje){
  if(data > hoje) return null;
  const duracaoTotal = Math.max(diasEntre(item.dataInicio, item.dataFim), 1);
  const t = Math.min(Math.max(diasEntre(item.dataInicio, data.toISOString().slice(0,10))/duracaoTotal, 0), 1);
  const tHoje = Math.min(Math.max(diasEntre(item.dataInicio, hoje.toISOString().slice(0,10))/duracaoTotal, 0), 1);
  const fatorHoje = sigmoideCronograma(tHoje) || 0.0001;
  return Math.min((sigmoideCronograma(t)/fatorHoje) * item.avanco, 100);
}

/* -- Curva S interativa genérica: monta SVG + tooltip num par de containers (idPrefix-svgwrap / idPrefix-resumo),
   reaproveitável tanto no Cronograma (por contrato) quanto abaixo de cada contrato em Contratos (físico e financeiro) -- */
function construirCurvaSInterativa(idPrefix, pontos, rotuloResumo){
  const wrapEl = document.getElementById(idPrefix+'-svgwrap');
  if(!wrapEl || !pontos || !pontos.length) return;
  const hoje = new Date();
  const W = 720, H = 260, padL = 40, padR = 20, padT = 20, padB = 34;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const x = i => padL + (i/Math.max(pontos.length-1,1))*plotW;
  const y = v => padT + plotH - (v/100)*plotH;

  const linhaPlanejada = pontos.map((pt,i)=>`${x(i)},${y(pt.planejado)}`).join(' ');
  const pontosRealizados = pontos.filter(pt=>pt.realizado!==null);
  const linhaRealizada = pontosRealizados.map(pt=>`${x(pontos.indexOf(pt))},${y(pt.realizado)}`).join(' ');
  const idxHoje = pontos.reduce((best,pt,i)=> Math.abs(pt.data-hoje) < Math.abs(pontos[best].data-hoje) ? i : best, 0);
  const xHoje = x(idxHoje);

  const grades = [0,25,50,75,100].map(v=>`
    <line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="var(--linha-grade)" stroke-width="1"/>
    <text x="${padL-8}" y="${y(v)+3}" font-size="9" font-family="IBM Plex Mono, monospace" fill="#655D5A" text-anchor="end">${v}%</text>`).join('');
  const passoLabel = Math.max(Math.ceil(pontos.length/8),1);
  const labelsX = pontos.map((pt,i)=> i%passoLabel===0 ? `<text x="${x(i)}" y="${H-padB+16}" font-size="8.5" font-family="IBM Plex Mono, monospace" fill="#655D5A" text-anchor="middle">${pt.label}</text>` : '').join('');

  const svgId = idPrefix+'-svg', overlayId = idPrefix+'-overlay', guiaId = idPrefix+'-guia', dotPlanId = idPrefix+'-dotplan', dotRealId = idPrefix+'-dotreal', tooltipId = idPrefix+'-tooltip';
  wrapEl.innerHTML = `
    <svg id="${svgId}" viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; font-family:'IBM Plex Mono',monospace; cursor:crosshair;">
      ${grades}
      <line x1="${xHoje}" y1="${padT-6}" x2="${xHoje}" y2="${H-padB+6}" stroke="var(--preto)" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="${xHoje}" y="${padT-10}" font-size="9" fill="var(--preto)" text-anchor="middle">hoje</text>
      <polyline points="${linhaPlanejada}" fill="none" stroke="var(--azul)" stroke-width="2.5"/>
      <polyline points="${linhaRealizada}" fill="none" stroke="var(--vinho)" stroke-width="2.5"/>
      ${pontosRealizados.length ? `<circle cx="${x(pontos.indexOf(pontosRealizados[pontosRealizados.length-1]))}" cy="${y(pontosRealizados[pontosRealizados.length-1].realizado)}" r="4" fill="var(--vinho)"/>` : ''}
      ${labelsX}
      <g id="${guiaId}" style="display:none">

        <circle id="${dotPlanId}" r="4.5" fill="var(--azul)" stroke="#fff" stroke-width="1.5"/>
        <circle id="${dotRealId}" r="4.5" fill="var(--vinho)" stroke="#fff" stroke-width="1.5"/>
      </g>
      <rect id="${overlayId}" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent"/>
    </svg>
    <div id="${tooltipId}" class="curva-tooltip"></div>`;

  const svgEl = document.getElementById(svgId);
  const overlayEl = document.getElementById(overlayId);
  const guiaEl = document.getElementById(guiaId);
  const guiaLinha = guiaEl.querySelector('line');
  const dotPlan = document.getElementById(dotPlanId);
  const dotReal = document.getElementById(dotRealId);
  const tooltipEl = document.getElementById(tooltipId);
  const duracaoTotalGrafico = diasEntre(pontos[0].data.toISOString().slice(0,10), pontos[pontos.length-1].data.toISOString().slice(0,10)) || 1;

  function pontoParaCliente(evt){
    const pt = svgEl.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svgEl.getScreenCTM().inverse());
  }
  function mostrarHover(evt){
    const p = pontoParaCliente(evt);
    const idx = Math.max(0, Math.min(pontos.length-1, Math.round(((p.x-padL)/plotW)*(pontos.length-1))));
    const pt = pontos[idx];
    guiaEl.style.display = '';
    guiaLinha.setAttribute('x1', x(idx)); guiaLinha.setAttribute('x2', x(idx));
    dotPlan.setAttribute('cx', x(idx)); dotPlan.setAttribute('cy', y(pt.planejado));
    if(pt.realizado!==null){ dotReal.style.display=''; dotReal.setAttribute('cx', x(idx)); dotReal.setAttribute('cy', y(pt.realizado)); }
    else { dotReal.style.display='none'; }
    const diff = pt.realizado!==null ? pt.realizado - pt.planejado : null;
    const corDiff = diff===null ? '#D9D2CC' : diff>=0 ? '#7FCBA4' : '#E58C82';
    const diasEquivalentes = diff!==null ? Math.round((diff/100)*duracaoTotalGrafico) : null;
    tooltipEl.innerHTML = `
      <div class="data">${pt.label}</div>
      <div class="l"><span class="k">Planejado</span><span>${pt.planejado}%</span></div>
      <div class="l"><span class="k">Realizado</span><span>${pt.realizado===null?'— (futuro)':pt.realizado+'%'}</span></div>
      ${diff!==null ? `<div class="l"><span class="k">Diferença</span><span style="color:${corDiff}">${diff>=0?'+':''}${diff} p.p. (${diasEquivalentes>=0?'+':''}${diasEquivalentes}d)</span></div>` : ''}
    `;
    tooltipEl.classList.add('visivel');
    const boundsSvg = svgEl.getBoundingClientRect();
    const escalaX = boundsSvg.width / W;
    let leftPx = x(idx)*escalaX;
    leftPx = Math.max(60, Math.min(boundsSvg.width-60, leftPx));
    const topPx = y(pt.planejado)*escalaX;

  function esconderHover(){ guiaEl.style.display = 'none'; tooltipEl.classList.remove('visivel'); }
  overlayEl.addEventListener('mousemove', mostrarHover);
  overlayEl.addEventListener('mouseleave', esconderHover);
  overlayEl.addEventListener('touchmove', e=>{ if(e.touches[0]) mostrarHover(e.touches[0]); }, { passive:true });
  overlayEl.addEventListener('touchend', esconderHover);

    const realizadoHoje = pontoHoje ? pontoHoje.realizado : 0;

    else if(diffPct>=0){ sev='no-prazo'; situacao='no prazo'; }

    else { sev='atrasado'; situacao='atrasado'; }

      <div class="item"><span class="k">${rotuloResumo.k}</span><span class="v">${rotuloResumo.v}</span></div>
      <div class="item"><span class="k">Planejado até hoje</span><span class="v">${planejadoHoje}%</span></div>
      <div class="item"><span class="k">Realizado até hoje</span><span class="v">${realizadoHoje}%</span></div>
      <div class="item"><span class="k">Diferença</span><span class="v" style="color:${diffPct>=0?'var(--verde)':'var(--vermelho)'}">${diffPct>=0?'+':''}${diffPct} p.p.</span></div>
      <div class="item"><span class="k">Situação</span><span class="v"><span class="status-chip ${sev}" style="margin:0">${situacao}</span></span></div>
    `;
  }
}
function calcularPontosCurva(itens, granularidade, inicioBounds, fimBounds){
  const periodos = gerarPeriodosCronograma(inicioBounds, fimBounds, granularidade);
  const hoje = new Date();
  return periodos.map(data=>{
    const planejados = itens.map(it=>valorPlanejadoEmCronograma(it, data));
    const planejado = Math.round(planejados.reduce((s,v)=>s+v,0)/planejados.length);
    let realizado = null;
    if(data <= hoje){
      const realizados = itens.map(it=>valorRealizadoEmCronograma(it, data, hoje)).filter(v=>v!==null);
      realizado = realizados.length ? Math.round(realizados.reduce((s,v)=>s+v,0)/realizados.length) : null;
    }
    return { data, label: granularidade==='semana' ? fmtData(data.toISOString().slice(0,10)) : data.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}), planejado, realizado };
  });
}
function montarCurvaSCronograma(){
  if(!document.getElementById('curva-svgwrap')) return; // card não está na tela
  const itens = itensCronograma(state.cronogramaContratoId);
  if(!itens.length) return;
  const alvo = state.cronogramaCurvaAlvo || '__contrato__';
  const ehContrato = alvo === '__contrato__' || !itens.some(it=>it.id===alvo);
  const itensAlvo = ehContrato ? itens : itens.filter(it=>it.id===alvo);
  const granularidade = state.cronogramaCurvaGranularidade || 'semana';

  const inicioGlobal = new Date(Math.min(...itensAlvo.map(it=>new Date(it.dataInicio).getTime()))).toISOString().slice(0,10);
  const fimGlobal = new Date(Math.max(...itensAlvo.map(it=>new Date(it.dataFim).getTime()))).toISOString().slice(0,10);
  const pontos = calcularPontosCurva(itensAlvo, granularidade, inicioGlobal, fimGlobal);
  construirCurvaSInterativa('curva', pontos, {
    k: ehContrato ? 'Itens considerados' : 'Item',
    v: ehContrato ? itensAlvo.length+' (todo o contrato)' : itensAlvo[0].nome,
  });
}
window.montarCurvaSCronograma = montarCurvaSCronograma;
/* -- curvas S abaixo de cada contrato, em Contratos: físico (reaproveita itensCronograma) e financeiro (orçamento × medições) -- */
function calcularPontosCurvaFinanceira(contratoId, granularidade, inicioBounds, fimBounds){
  const totalOrcado = DB.custoOrcamentos.filter(o=>o.contratoId===contratoId).reduce((s,o)=>s+(o.valor||0),0);
  const medicoes = DB.custoMedicoes.filter(m=>m.contratoId===contratoId);
  if(!totalOrcado || !medicoes.length) return null;
  const periodos = gerarPeriodosCronograma(inicioBounds, fimBounds, granularidade);
  const hoje = new Date();
  const duracaoTotal = Math.max(diasEntre(inicioBounds, fimBounds), 1);
  return periodos.map(data=>{
    const t = Math.min(Math.max(diasEntre(inicioBounds, data.toISOString().slice(0,10))/duracaoTotal, 0), 1);
    const planejado = Math.round(sigmoideCronograma(t)*100);
    let realizado = null;
    if(data <= hoje){
      const medidoAteData = medicoes.filter(m=>m.data <= data.toISOString().slice(0,10)).reduce((s,m)=>s+(m.valor||0),0);
      realizado = Math.round(Math.min((medidoAteData/totalOrcado)*100, 100));
    }
    return { data, label: granularidade==='semana' ? fmtData(data.toISOString().slice(0,10)) : data.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}), planejado, realizado };
  });
}
function montarCurvasContrato(contratoId){
  const granularidade = state.contratosCurvaGranularidade || 'semana';
  const itens = itensCronograma(contratoId);
  if(!itens.length) return; // sem etapas cadastradas nesse contrato ainda — nada pra desenhar
  const inicioBounds = new Date(Math.min(...itens.map(it=>new Date(it.dataInicio).getTime()))).toISOString().slice(0,10);
  const fimBounds = new Date(Math.max(...itens.map(it=>new Date(it.dataFim).getTime()))).toISOString().slice(0,10);

  const pontosFisico = calcularPontosCurva(itens, granularidade, inicioBounds, fimBounds);
  construirCurvaSInterativa('curva-fis-'+contratoId, pontosFisico, { k:'Etapas consideradas', v: itens.length+' (todo o contrato)' });

  const pontosFinanceiro = calcularPontosCurvaFinanceira(contratoId, granularidade, inicioBounds, fimBounds);
  if(pontosFinanceiro){
    construirCurvaSInterativa('curva-fin-'+contratoId, pontosFinanceiro, { k:'Base', v:'orçamento × medições (guia Custo)' });
  }
}

function avancoFinanceiroContrato(contratoId){
  const orcado = DB.custoOrcamentos.filter(o=>o.contratoId===contratoId).reduce((s,o)=>s+(o.valor||0),0);
  const medido = DB.custoMedicoes.filter(m=>m.contratoId===contratoId).reduce((s,m)=>s+(m.valor||0),0);
  if(orcado<=0) return { modo: medido>0 ? 'medido-sem-orcamento' : 'sem-dados', orcado, medido };
  return { modo:'ok', orcado, medido, pct: Math.round((medido/orcado)*100) };
}

function submitCustoOrcamento(ev){
  ev.preventDefault();
  const f = ev.target;
  const descricao = f.descricao.value.trim();
  const valor = parseFloat(f.valor.value);
  if(!descricao || !(valor>0)){ showToast('Preencha descrição e um valor válido.'); return false; }
  const maxOrder = DB.custoOrcamentos.filter(o=>o.contratoId===state.custoContratoId).reduce((m,o)=>Math.max(m,o.order??0),-1);
  DB.custoOrcamentos.push({ id: uid(), contratoId: state.custoContratoId, descricao, valor, order: maxOrder+1 });
  persist.custoOrcamentos();
  showToast('Item de orçamento adicionado.');
  f.reset();
  render();
  return false;
}
window.submitCustoOrcamento = submitCustoOrcamento;
function updateCustoOrcamento(id, campo, valor){
  const o = DB.custoOrcamentos.find(x=>x.id===id);
  if(!o) return;
  o[campo] = campo==='valor' ? Math.max(0, parseFloat(valor)||0) : valor.trim();
  persist.custoOrcamentos();
  render();
}
window.updateCustoOrcamento = updateCustoOrcamento;
function excluirCustoOrcamento(id){

  DB.custoOrcamentos = DB.custoOrcamentos.filter(o=>o.id!==id);

}

function submitCustoMedicao(ev){

function moveProjeto(id, dir){
  const lista = DB.projetos.slice().sort((a,b)=>(a.order??0)-(b.order??0));
  const idx = lista.findIndex(p=>p.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=lista.length) return;
  const tmp = lista[idx].order??idx; lista[idx].order = lista[swapIdx].order??swapIdx; lista[swapIdx].order = tmp;
  persist.projetos(); render();
}
window.moveProjeto = moveProjeto;
function submitProjeto(ev){
  ev.preventDefault();
  const f = ev.target;
  const nome = f.nome.value.trim().toUpperCase();
  const contratoId = f.contratoId.value || null;
  const dataInicioPrevista = f.dataInicioPrevista.value || null;
  const dataFimPrevista = f.dataFimPrevista.value || null;
  if(!nome) return false;
  const maxOrder = DB.projetos.reduce((m,p)=>Math.max(m,p.order??0), -1);
  const novoProjeto = { id: uid(), nome, contratoId, order: maxOrder+1, dataInicioPrevista, dataFimPrevista };
  DB.projetos.push(novoProjeto);
  persist.projetos();

}

function deleteProjeto(id){
  if(DB.projetos.length<=1){ showToast('Precisa existir pelo menos um projeto.'); return; }
  const projeto = DB.projetos.find(p=>p.id===id);
  if(!projeto) return;
  // tudo que pertence ao projeto é apagado junto (nada fica órfão inflando indicadores)
  const estruturasIds = new Set(DB.estruturas.filter(e=>e.projetoId===id).map(e=>e.id));
  const elementosIds = new Set(DB.elementos.filter(e=>e.projetoId===id).map(e=>e.id));
  const alvo = {
    registros: DB.registros.filter(r=>r.projetoId===id),
    estacas: DB.estacas.filter(e=>e.projetoId===id),
    estruturas: DB.estruturas.filter(e=>estruturasIds.has(e.id)),
    elementos: DB.elementos.filter(e=>elementosIds.has(e.id)),
    etapas: DB.etapas.filter(e=>(e.estruturaId && estruturasIds.has(e.estruturaId)) || (e.elementoId && elementosIds.has(e.elementoId))),
    efetivoGeral: DB.efetivoGeral.filter(g=>g.projetoId===id),
  };
  const total = Object.values(alvo).reduce((s,a)=>s+a.length, 0);
  if(total===0){
    if(!confirm(`Excluir o projeto "${projeto.nome}"?`)) return;
  } else {
    const resumo = [
      `${alvo.registros.length} lançamento(s)`,
      `${alvo.estacas.length} trecho(s)/eixo(s)`,
      `${alvo.estruturas.length} estrutura(s)`,
      `${alvo.etapas.length} etapa(s)`,
      `${alvo.elementos.length} elemento(s)`,
      `${alvo.efetivoGeral.length} registro(s) de efetivo geral`,
    ].join('\n  • ');
    const datasReg = alvo.registros.map(r=>r.termino||r.inicio||r.liberacao).filter(Boolean).map(x=>new Date(x).getTime()).filter(x=>!isNaN(x));
    const ultimoReg = datasReg.length ? Math.max(...datasReg) : null;
    const recente = ultimoReg && (Date.now()-ultimoReg) < 7*86400000;
    const avisoUltimo = ultimoReg
      ? `\n\nÚltimo lançamento deste projeto: ${fmtDataHora(new Date(ultimoReg).toISOString())}${recente ? '\n⚠ ATENÇÃO: há lançamentos dos últimos 7 dias — confira se não foram feitos neste projeto por engano antes de excluir.' : ''}`
      : '';
    const resp = prompt(`Excluir o projeto "${projeto.nome}" e TUDO que pertence a ele:\n\n  • ${resumo}${avisoUltimo}\n\nUm backup .json será baixado antes. Isso não afeta os outros projetos.\n\nDigite EXCLUIR para confirmar:`);
    if(resp===null) return;
    if(resp.trim().toUpperCase()!=='EXCLUIR'){ showToast('Exclusão cancelada — texto de confirmação não confere.'); return; }
    try {
      const backup = { exportadoEm: new Date().toISOString(), projeto, ...alvo };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `backup_projeto_${(projeto.nome||'projeto').replace(/[^\w\-]+/g,'_')}_${hojeStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    } catch(e){
      if(!confirm('Não foi possível gerar o backup. Excluir mesmo assim?')) return;
    }
  }
  const idsDe = arr => new Set(arr.map(x=>x.id));
  const rmReg = idsDe(alvo.registros), rmEst = idsDe(alvo.estacas), rmEtp = idsDe(alvo.etapas), rmEf = idsDe(alvo.efetivoGeral);
  DB.projetos = DB.projetos.filter(p=>p.id!==id);
  DB.registros = DB.registros.filter(r=>!rmReg.has(r.id));
  DB.estacas = DB.estacas.filter(e=>!rmEst.has(e.id));
  DB.estruturas = DB.estruturas.filter(e=>!estruturasIds.has(e.id));
  DB.elementos = DB.elementos.filter(e=>!elementosIds.has(e.id));
  DB.etapas = DB.etapas.filter(e=>!rmEtp.has(e.id));
  DB.efetivoGeral = DB.efetivoGeral.filter(g=>!rmEf.has(g.id));
  persist.projetos();
  if(alvo.registros.length) persist.registros();
  if(alvo.estacas.length) persist.estacas();
  if(alvo.estruturas.length) persist.estruturas();
  if(alvo.elementos.length) persist.elementos();
  if(alvo.etapas.length) persist.etapas();
  if(alvo.efetivoGeral.length) persist.efetivoGeral();
  // filtros que apontavam pro projeto removido voltam pro padrão
  ['filtroProjeto','efFiltroProjeto','ccFiltroProjeto','diarioProjetoId'].forEach(k=>{ if(state[k]===id) state[k]='all'; });
  ['etapasProjetoId','estruturasProjetoId','elementosProjetoId','frentesProjetoId'].forEach(k=>{ if(state[k]===id) state[k]=null; });
  if(apontar.projetoId===id) apontar.projetoId=null;
  showToast(`Projeto "${projeto.nome}" excluído${total?` com ${total} item(ns) vinculados`:''}.`);
  render();
}
window.deleteProjeto = deleteProjeto;

      <form onsubmit="return submitEstrutura(event)">
        <div class="grid3">
          <div class="field"><label>Nome *</label><input type="text" name="nome" required placeholder="Ex.: Bloco de Fundação"></div>
          <div class="field"><label>Categoria</label><select name="categoria">${categoriaOptions(null)}</select></div>

function resetElForm(){ state.elForm = { trechoId:null, faixaInicio:null, faixaFim:null, eixoInicioId:null, eixoFimId:null }; state.elementoDuplicadoAviso = null; }
/* ---------------------------------------------------------
   IMPORTAÇÃO DE LEVANTAMENTO (planilha → Projeto/Estrutura/Elemento/Etapa)
--------------------------------------------------------- */
function parseLinhaLevantamento(l){
  const g = (...chaves) => { for(const c of chaves){ if(l[c]!==undefined && l[c]!==null && String(l[c]).trim()!=='') return String(l[c]).trim(); } return null; };
  const qtdRaw = g('Quantidade','quantidade','QUANTIDADE','Qtd','qtd','QTD','Quantidade Orçada','quantidade orçada');
  return {
    projeto: g('Projeto','projeto','PROJETO'),
    estrutura: g('Estrutura','estrutura','ESTRUTURA','Tipo de peça','Tipo','tipo'),
    eixo: g('Eixo','eixo','EIXO','Eixo/Trecho','eixo/trecho'),
    elemento: g('Elemento','elemento','ELEMENTO','Código','Codigo','código','codigo','Peça','peça'),
    etapa: g('Etapa','etapa','ETAPA','Atividade','atividade','Serviço','serviço'),
    quantidade: qtdRaw!=null ? Number(String(qtdRaw).replace(/\./g,'').replace(',','.')) || Number(qtdRaw) || null : null,
    unidade: g('Unidade','unidade','UNIDADE','Un','un','UN'),
  };
}
function estagiarLevantamento(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(/\.pdf$/i.test(file.name)){
    showToast('PDF não dá pra ler automaticamente ainda — exporte/converta o levantamento pra Excel (.xlsx) ou CSV primeiro e importe esse arquivo.');
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const linhasRaw = XLSX.utils.sheet_to_json(ws, { defval:'' });
      const linhas = [];
      const ignoradas = [];
      linhasRaw.forEach((l,i)=>{
        const p = parseLinhaLevantamento(l);
        if(!p.projeto || !p.estrutura || !p.elemento || !p.etapa || !p.quantidade || p.quantidade<=0){
          ignoradas.push({ linha: i+2, motivo: 'faltam campos obrigatórios (Projeto, Estrutura, Elemento, Etapa, Quantidade)' });
          return;
        }
        linhas.push(p);
      });
      if(!linhas.length){
        showToast('Nenhuma linha válida encontrada. Confira as colunas: Projeto, Estrutura, Eixo (opcional), Elemento, Etapa, Quantidade, Unidade.');
        input.value = '';
        return;
      }
      const projetosSet = new Set(linhas.map(l=>l.projeto.toLowerCase()));
      const estruturasSet = new Set(linhas.map(l=>`${l.projeto.toLowerCase()}|${l.estrutura.toLowerCase()}`));
      const elementosSet = new Set(linhas.map(l=>`${l.projeto.toLowerCase()}|${l.estrutura.toLowerCase()}|${(l.eixo||'').toLowerCase()}|${l.elemento.toLowerCase()}`));
      state.levantamentoPreview = {
        linhas, ignoradas,
        resumo: { projetos: projetosSet.size, estruturas: estruturasSet.size, elementos: elementosSet.size, etapas: linhas.length },
        nomeArquivo: file.name,
      };
      render();
    } catch(err){
      showToast('Não foi possível ler essa planilha. Confira o formato (Projeto, Estrutura, Elemento, Etapa, Quantidade, Unidade).');
    }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}
window.estagiarLevantamento = estagiarLevantamento;
function cancelarImportacaoLevantamento(){
  state.levantamentoPreview = null;
  render();
}
window.cancelarImportacaoLevantamento = cancelarImportacaoLevantamento;
function confirmarImportacaoLevantamento(){
  const preview = state.levantamentoPreview;
  if(!preview) return;
  let novosProjetos=0, novasEstruturas=0, novosElementos=0, etapasNovas=0, etapasAtualizadas=0;
  let ultimoProjetoId=null, ultimoEstruturaId=null;

  preview.linhas.forEach(l=>{
    // 1) projeto
    let projeto = DB.projetos.find(p=>p.nome.toLowerCase()===l.projeto.toLowerCase());
    if(!projeto){
      const maxOrder = DB.projetos.reduce((m,p)=>Math.max(m,p.order??0), -1);
      projeto = { id: uid(), nome: l.projeto.toUpperCase(), contratoId: null, order: maxOrder+1 };
      DB.projetos.push(projeto);
      novosProjetos++;
    }
    // 2) estrutura
    let estrutura = DB.estruturas.find(e=>e.projetoId===projeto.id && e.nome.toLowerCase()===l.estrutura.toLowerCase());
    if(!estrutura){
      estrutura = { id: uid(), projetoId: projeto.id, nome: l.estrutura.toUpperCase(), categoria: null, usaElementos: true };
      DB.estruturas.push(estrutura);
      novasEstruturas++;
    }
    // 3) eixo (opcional) — ponto único (início=fim)
    let eixoInicioId=null, eixoFimId=null;
    if(l.eixo){
      let ponto = DB.estacas.find(x=>x.projetoId===projeto.id && x.tipo==='eixo' && x.trecho.toLowerCase()===l.eixo.toLowerCase());
      if(!ponto){
        const maxOrder = DB.estacas.filter(e=>e.projetoId===projeto.id).reduce((m,e)=>Math.max(m,e.order??0), -1);
        ponto = { id: uid(), projetoId: projeto.id, tipo:'eixo', estacaInicio: l.eixo.toUpperCase(), estacaTermino: l.eixo.toUpperCase(), trecho: l.eixo.toUpperCase(), order: maxOrder+1 };
        DB.estacas.push(ponto);
      }
      eixoInicioId = ponto.id; eixoFimId = ponto.id;
    }
    // 4) elemento (duplicidade escopada por eixo, igual ao cadastro manual)
    let elemento = DB.elementos.find(x=>x.estruturaId===estrutura.id && x.codigo.toLowerCase()===l.elemento.toLowerCase() &&
      ((l.eixo && x.eixoInicioId===eixoInicioId && x.eixoFimId===eixoFimId) || (!l.eixo && !x.eixoInicioId)));
    if(!elemento){
      elemento = { id: uid(), projetoId: projeto.id, estruturaId: estrutura.id, codigo: l.elemento, trechoId: null, faixaInicio: null, faixaFim: null, eixoInicioId, eixoFimId, orcamento: [] };
      DB.elementos.push(elemento);
      novosElementos++;
    }
    // 5) etapa dentro do elemento
    const etapasDoEl = DB.etapas.filter(e=>e.elementoId===elemento.id);
    let etapa = etapasDoEl.find(e=>e.name.toLowerCase()===l.etapa.toLowerCase());
    if(!etapa){
      const maxOrder = etapasDoEl.reduce((m,e)=>Math.max(m,e.order??0), -1);
      DB.etapas.push({ id: uid(), estruturaId: null, elementoId: elemento.id, name: l.etapa.toUpperCase(), desc: null, order: maxOrder+1, empresaPadraoId: null, quantidadeOrcada: l.quantidade, unidadeOrcada: l.unidade||null });
      etapasNovas++;
    } else {
      etapa.quantidadeOrcada = l.quantidade;
      if(l.unidade) etapa.unidadeOrcada = l.unidade;
      etapasAtualizadas++;
    }
    ultimoProjetoId = projeto.id; ultimoEstruturaId = estrutura.id;
  });

  persist.projetos(); persist.estruturas(); persist.estacas(); persist.elementos(); persist.etapas();
  state.levantamentoPreview = null;
  state.elementosProjetoId = ultimoProjetoId;
  state.elementosEstruturaId = ultimoEstruturaId;
  showToast(`Importado: ${novosProjetos} projeto(s) novo(s), ${novasEstruturas} estrutura(s) nova(s), ${novosElementos} elemento(s) novo(s), ${etapasNovas} etapa(s) nova(s), ${etapasAtualizadas} etapa(s) atualizada(s).`);
  render();
}
window.confirmarImportacaoLevantamento = confirmarImportacaoLevantamento;
function renderImportarLevantamentoHtml(){
  const preview = state.levantamentoPreview;
  if(preview){
    const amostra = preview.linhas.slice(0,8).map(l=>`<tr>
        <td>${esc(l.projeto)}</td><td>${esc(l.estrutura)}</td><td>${esc(l.eixo||'—')}</td><td>${esc(l.elemento)}</td><td>${esc(l.etapa)}</td><td class="num">${l.quantidade}</td><td>${esc(l.unidade||'—')}</td>
      </tr>`).join('');
    return `<div class="card" style="border-left:3px solid var(--roxo)">
      <h3>Confirmar importação de "${esc(preview.nomeArquivo)}"</h3>
      <p style="font-size:13px; margin:0 0 12px 0">Encontrei <strong>${preview.linhas.length} linha(s)</strong> válida(s), resultando em aproximadamente:
        <strong>${preview.resumo.projetos}</strong> projeto(s) · <strong>${preview.resumo.estruturas}</strong> estrutura(s) · <strong>${preview.resumo.elementos}</strong> elemento(s) · <strong>${preview.resumo.etapas}</strong> etapa(s)/quantidade(s).
        ${preview.ignoradas.length ? ` <span style="color:var(--vermelho)">${preview.ignoradas.length} linha(s) ignorada(s) por falta de dados.</span>` : ''}
      </p>
      <p style="font-size:12px; color:var(--grafite-suave); margin:0 0 8px 0">Projetos, estruturas e elementos que já existem (nome igual) não são duplicados — só recebem a etapa/quantidade nova. Prévia das primeiras linhas:</p>

      ${preview.linhas.length>8 ? `<p style="font-size:11.5px; color:var(--grafite-suave)">+ ${preview.linhas.length-8} linha(s) a mais...</p>` : ''}

        <button class="btn ghost" onclick="cancelarImportacaoLevantamento()">Cancelar</button>
      </div>
    </div>`;
  }
  return `<div class="card">
    <h3>Importar levantamento (planilha)</h3>
    <p style="font-size:12.5px; color:var(--grafite-suave); margin:0 0 12px 0">Anexe uma planilha (.xlsx ou .csv) de levantamento pra criar/preencher Projeto, Estrutura e Elementos com as quantidades automaticamente — sem precisar cadastrar peça por peça. PDF ainda não é lido automaticamente; converta pra Excel/CSV antes.</p>
    <label class="btn" style="cursor:pointer; display:inline-flex;">
      ${ICONS.plus} Anexar planilha de levantamento
      <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="estagiarLevantamento(this)">
    </label>
    <p style="font-size:11px; color:var(--grafite-suave); margin:10px 0 0 0">Colunas esperadas (nomes flexíveis): <strong>Projeto, Estrutura, Eixo</strong> (opcional), <strong>Elemento, Etapa, Quantidade, Unidade</strong>.</p>
  </div>`;
}

  const podeSubmeter = (!!state.elForm.trechoId && state.elForm.faixaInicio!==null) || !!state.elForm.eixoInicioId;

  const temTrechoSelAtual = !!state.elForm.trechoId && state.elForm.faixaInicio!==null;
  const temEixoSelAtual = !!state.elForm.eixoInicioId;
  const filtroFaixaInicio = temTrechoSelAtual ? formatEstacaVal(Math.min(state.elForm.faixaInicio, state.elForm.faixaFim)) : null;
  const filtroFaixaFim = temTrechoSelAtual ? formatEstacaVal(Math.max(state.elForm.faixaInicio, state.elForm.faixaFim)) : null;
  const elementosLista = ordenarElementosPorCodigo(DB.elementos.filter(el=>{

      return el.eixoInicioId===state.elForm.eixoInicioId && el.eixoFimId===state.elForm.eixoFimId;

  const listaHtml = elementosLista.length ? elementosLista.map(el=>{
    const etapasEl = etapasDoElemento(el.id);
    const editandoEtapas = state.elementoEtapasAbertoId === el.id;
    const linhasEtapas = etapasEl.map((et,i)=>{
      const executadoReal = et.quantidadeOrcada!=null ? DB.registros.filter(r=>r.elementoId===el.id && r.etapaId===et.id).reduce((s,r)=>s+(r.quantidadeExecutada||0),0) : null;
      const executado = (el.concluido && et.quantidadeOrcada!=null) ? et.quantidadeOrcada : executadoReal;
      const pct = (et.quantidadeOrcada>0 && executado!=null) ? Math.min(100,(executado/et.quantidadeOrcada)*100) : (el.concluido ? 100 : 0);

          <div class="grid3">
            <div class="field" style="margin-bottom:0"><input type="text" name="name" list="lista-nomes-etapa" required placeholder="Ex.: Locação, Concretagem"></div>

            <div class="field" style="margin-bottom:0"><select name="unidade">${unidadeOptionsHtml(null, false)}</select></div>
          </div>
          <div style="display:flex; gap:8px; margin-top:10px">

            <button class="btn small ghost" type="button" onclick="state.elementoEtapasAbertoId=null; render();">Fechar</button>
          </div>
        </form>` : `<button class="btn small ghost" style="margin-top:12px" onclick="state.elementoEtapasAbertoId='${el.id}'; render();">${ICONS.plus} Gerenciar etapas dessa peça</button>`}
    </div>`;
  }).join('') : `<div class="empty"><div class="big">Nenhum elemento cadastrado</div></div>`;

  const nomesEtapaUsados = [...new Set(DB.etapas.map(e=>e.name))].sort();
  const datalistEtapas = `<datalist id="lista-nomes-etapa">${nomesEtapaUsados.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;

      <p style="font-size:13px; margin:0">⚠️ <strong>Códigos duplicados detectados nesta estrutura:</strong> ${duplicadasEl.map(esc).join(', ')}. As etapas podem estar espalhadas entre as cópias — recomendo excluir a duplicata.</p>

  return `

      ${podeSubmeter ? `
        <form onsubmit="return submitElemento(event)" style="margin-top:18px; padding-top:18px; border-top:1px solid var(--linha-grade)">

    </div>
    <div class="card"><h3>Elementos cadastrados ${(temTrechoSelAtual||temEixoSelAtual) ? 'neste eixo/trecho' : ''} <span class="tag">${elementosLista.length}</span></h3>${listaHtml}</div>
  `;
}
function tapEstacaElemento(val){
  if(state.elForm.faixaInicio===null){ state.elForm.faixaInicio = val; state.elForm.faixaFim = val; }
  else if(state.elForm.faixaInicio===state.elForm.faixaFim && val!==state.elForm.faixaInicio){
    if(val > state.elForm.faixaInicio) state.elForm.faixaFim = val;
    else { state.elForm.faixaFim = state.elForm.faixaInicio; state.elForm.faixaInicio = val; }
  } else { state.elForm.faixaInicio = val; state.elForm.faixaFim = val; }
  render();
}
window.tapEstacaElemento = tapEstacaElemento;
function ajustarFaixaFimElemento(deltaMetros){
  if(state.elForm.faixaInicio===null) return;
  const trecho = DB.estacas.find(f=>f.id===state.elForm.trechoId);
  const minMetros = Math.min(distEstacaMetros(trecho.estacaInicio), distEstacaMetros(trecho.estacaTermino));
  const maxMetros = Math.max(distEstacaMetros(trecho.estacaInicio), distEstacaMetros(trecho.estacaTermino));
  function deslocar(val){
    const metrosAtual = distEstacaMetros(formatEstacaVal(val));
    let novoMetros = metrosAtual + deltaMetros;
    if(novoMetros > maxMetros) novoMetros = maxMetros;
    if(novoMetros < minMetros) novoMetros = minMetros;
    const novaBase = Math.floor(novoMetros / METROS_POR_ESTACA);
    const novoResto = Math.round(novoMetros - novaBase*METROS_POR_ESTACA);
    return novaBase + novoResto/1000;
  }

function proximoCodigoSequencial(codigo, existeFn){
  const re = /\d+/g;
  let m, ultimo = null;
  while((m = re.exec(codigo))){ ultimo = m; }
  if(!ultimo) return null;
  const numStr = ultimo[0];
  const start = ultimo.index;
  const end = start + numStr.length;
  let n = parseInt(numStr, 10);
  let novo;
  do {
    n += 1;
    const nStr = String(n).padStart(numStr.length, '0');
    novo = codigo.slice(0, start) + nStr + codigo.slice(end);
  } while(existeFn(novo));
  return novo;
}
function duplicarElementoSequencia(id){
  const original = DB.elementos.find(x=>x.id===id);
  if(!original) return;
  // só considera "já existe" dentro do MESMO trecho/eixo do original — cada localização tem sua própria numeração
  const mesmaLocalizacao = (el) => el.estruturaId===original.estruturaId
    && el.trechoId===original.trechoId
    && el.faixaInicio===original.faixaInicio
    && el.faixaFim===original.faixaFim
    && el.eixoInicioId===original.eixoInicioId
    && el.eixoFimId===original.eixoFimId;
  const novoCodigo = proximoCodigoSequencial(original.codigo, (cod)=>
    DB.elementos.some(el=>mesmaLocalizacao(el) && el.codigo.toLowerCase()===cod.toLowerCase())
  );
  if(!novoCodigo){
    showToast(`"${original.codigo}" não tem número no código pra gerar sequência automática.`);
    return;
  }
  const novoElemento = {
    id: uid(), projetoId: original.projetoId, estruturaId: original.estruturaId, codigo: novoCodigo,
    trechoId: original.trechoId, faixaInicio: original.faixaInicio, faixaFim: original.faixaFim,
    eixoInicioId: original.eixoInicioId, eixoFimId: original.eixoFimId, orcamento: [],
  };
  DB.elementos.push(novoElemento);
  const etapasOriginais = etapasDoElemento(original.id);
  etapasOriginais.forEach(et=>{
    DB.etapas.push({
      id: uid(), estruturaId: null, elementoId: novoElemento.id,
      name: et.name, desc: et.desc, order: et.order, empresaPadraoId: et.empresaPadraoId,
      quantidadeOrcada: et.quantidadeOrcada, unidadeOrcada: et.unidadeOrcada,
    });
  });
  persist.elementos();
  persist.etapas();
  showToast(`"${novoCodigo}" criado na sequência de "${original.codigo}", com ${etapasOriginais.length} etapa(s) copiada(s).`);
  render();
}

  if(et.quantidadeOrcada==null){ showToast('Defina a quantidade orçada dessa etapa antes de ajustar o avanço.'); return; }
  const executadoAtual = DB.registros.filter(r=>r.etapaId===etapaId && (r.elementoId||null)===(elementoId||null)).reduce((s,r)=>s+(r.quantidadeExecutada||0),0);

  const novoTotal = parseFloat(String(valor).replace(',','.'));
  if(isNaN(novoTotal) || novoTotal<0){ showToast('Valor inválido.'); return; }
  const diff = Math.round((novoTotal - executadoAtual)*100)/100;

  const projetoId = elementoId
    ? (DB.elementos.find(x=>x.id===elementoId)||{}).projetoId

/* -- mantém em sincronia: todo profissional cadastrado numa empresa (aba Empresas) vira um recurso de

   (equipamentos, ou funções que não vêm dos profissionais) continua disponível normalmente. -- */
function sincronizarRecursoDeProfissional(empresaId, nomeProfissional){
  const nome = nomeProfissional.trim().toUpperCase();
  if(!nome) return;
  const jaExiste = DB.recursos.some(r=>r.empresaId===empresaId && r.tipo==='mao_obra' && r.nome.trim().toUpperCase()===nome);
  if(jaExiste) return;
  DB.recursos.push({ id: uid(), tipo:'mao_obra', nome, unidade:'h', custoHora:0, empresaId });
  persist.recursos();
}
function sincronizarTodosRecursosDeProfissionais(){
  let mudou = false;
  DB.empresas.forEach(emp=>{
    (emp.profissionais||[]).forEach(p=>{
      const nome = (p.nome||'').trim().toUpperCase();
      if(!nome) return;
      const jaExiste = DB.recursos.some(r=>r.empresaId===emp.id && r.tipo==='mao_obra' && r.nome.trim().toUpperCase()===nome);
      if(!jaExiste){ DB.recursos.push({ id: uid(), tipo:'mao_obra', nome, unidade:'h', custoHora:0, empresaId: emp.id }); mudou = true; }
    });
  });
  if(mudou) persist.recursos();
}
function deleteProfissional(empresaId, profissionalId){
  const emp = DB.empresas.find(e=>e.id===empresaId);
  emp.profissionais = emp.profissionais.filter(p=>p.id!==profissionalId);
  persist.empresas();
  render();
}

  DB.empresas = DB.empresas.filter(e=>e.id!==id);
  DB.etapas.forEach(e=>{ if(e.empresaPadraoId===id) e.empresaPadraoId=null; });
  persist.empresas(); persist.etapas(); render();
}

  const horaFimVal = entrada ? (entrada.horaFim||'') : '';
  const horaInicioVal = entrada ? (entrada.horaInicio||'') : '';

  const diasLancados = reg.efetivoDiario.filter(e=>e.itens && e.itens.length).slice().sort((a,b)=>b.data.localeCompare(a.data));
  const listaDias = diasLancados.length ? diasLancados.map(e=>{

function excluirEfetivoDia(regId, data){
  const reg = DB.registros.find(r=>r.id===regId);
  if(!reg || !reg.efetivoDiario) return;
  if(!confirm(`Excluir todo o efetivo lançado em ${fmtData(data+'T12:00:00')} (incluindo turnos extras)?`)) return;
  reg.efetivoDiario = reg.efetivoDiario.filter(e=>e.data!==data);
  persist.registros();
  showToast('Efetivo desse dia excluído.');
  render();
}

function efetivoLinhasBrutas(){
  const linhas = [];
  DB.registros.forEach(r=>{
    turnosEfetivoReg(r).forEach(t=>{
      if(!t.itens.length) return;
      linhas.push({ reg:r, data:t.data, entrada:{ ...t.entrada, itens:t.itens, horaInicio:t.horaInicio, horaFim:t.horaFim }, empresaId:t.empresaId, turno:t.turno, extraId:t.extraId, total: t.itens.reduce((s,i)=>s+(i.quantidade||0),0) });
    });
  });
  return linhas;
}
function efetivoPorDiaDiretoIndireto(){
  const porDia = {};
  efetivoGeralLista().forEach(g=>{
    if(!g.data || !g.quantidade) return;
    if(!porDia[g.data]) porDia[g.data] = { direto:0, indireto:0, frentes:0 };
    if(g.tipo==='indireto') porDia[g.data].indireto += g.quantidade;
    else porDia[g.data].direto += g.quantidade; // sem classificação (lançamentos antigos) entra como direto
  });
  let regsFiltrados = DB.registros;
  if(state.efFiltroProjeto!=='all') regsFiltrados = regsFiltrados.filter(r=>r.projetoId===state.efFiltroProjeto);
  regsFiltrados.forEach(r=>{
    turnosEfetivoReg(r).forEach(e=>{
      if(!e.itens || !e.itens.length) return;
      if(state.efFiltroEmpresa!=='all' && e.empresaId!==state.efFiltroEmpresa) return;
      if(state.efFiltroDataDe && e.data < state.efFiltroDataDe) return;
      if(state.efFiltroDataAte && e.data > state.efFiltroDataAte) return;
      const tot = e.itens.reduce((s,i)=>s+(i.quantidade||0),0);
      if(tot<=0) return;
      if(!porDia[e.data]) porDia[e.data] = { direto:0, indireto:0, frentes:0 };
      porDia[e.data].frentes += tot;
    });
  });
  return porDia;
}
function renderEfetivoGraficoHtml(){
  const porDiaMap = efetivoPorDiaDiretoIndireto();
  const modo = state.efGraficoModo || 'dia';
  let entries;
  if(modo==='dia'){
    entries = Object.entries(porDiaMap).sort((a,b)=>a[0].localeCompare(b[0]));
  } else {
    const porMes = {};
    Object.entries(porDiaMap).forEach(([data,v])=>{
      const mes = data.slice(0,7);
      if(!porMes[mes]) porMes[mes] = { direto:0, indireto:0, frentes:0 };
      porMes[mes].direto += v.direto; porMes[mes].indireto += v.indireto; porMes[mes].frentes += v.frentes;
    });
    entries = Object.entries(porMes).sort((a,b)=>a[0].localeCompare(b[0]));
  }
  const maxV = Math.max(...entries.map(([,v])=>Math.max(v.direto+v.indireto, v.frentes)), 1);
  let divergencias = 0;
  const bars = entries.map(([k,v])=>{
    const label = modo==='dia'
      ? new Date(k+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})
      : new Date(k+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
    const total = v.direto + v.indireto;
    const alturaDireto = (v.direto/maxV)*100;
    const alturaIndireto = (v.indireto/maxV)*100;
    const alturaFrentes = (v.frentes/maxV)*100;
    const diverge = total>0 && v.frentes !== total;
    const divergeForte = total>0 && v.frentes>total;
    if(diverge) divergencias++;
    return `<div class="daybar" title="Direto: ${v.direto} · Indireto: ${v.indireto} · Total geral: ${total} · Alocado nas frentes: ${v.frentes}${diverge?' ⚠ diferença de '+Math.abs(total-v.frentes):''}">
        <div class="val"><span style="color:var(--roxo)">${v.direto}</span>/<span style="color:var(--laranja)">${v.indireto}</span>${diverge?` <span style="color:${divergeForte?'var(--vermelho)':'var(--amarelo)'}">⚠</span>`:''}</div>
        <div class="col-track" style="height:100px">
          <div class="col-direto" style="height:${Math.max(alturaDireto, v.direto>0?3:0)}px; border-radius:${v.indireto>0?'0':'3px 3px 0 0'};"></div>
          <div class="col-indireto" style="height:${Math.max(alturaIndireto, v.indireto>0?3:0)}px; bottom:${Math.max(alturaDireto, v.direto>0?3:0)}px; border-radius:${v.indireto>0?'3px 3px 0 0':'0'};"></div>
          ${v.frentes>0 ? `<div class="col-frentes-marker" style="bottom:${Math.max(alturaFrentes,2)}px; ${divergeForte?'background:var(--vermelho);':''}"></div>` : ''}
        </div>
        <div class="dlabel">${esc(label)}</div>
      </div>`;
  }).join('');
  return `
    <div class="card">
      <h3>Efetivo geral da obra por dia
        <span class="tag" style="cursor:pointer; text-decoration:underline; ${modo==='dia'?'font-weight:700;':''}" onclick="state.efGraficoModo='dia'; render();">● diário</span>
        <span class="tag" style="cursor:pointer; text-decoration:underline; ${modo==='mes'?'font-weight:700;':''}" onclick="state.efGraficoModo='mes'; render();">● mensal</span>
        ${divergencias ? `<span class="chip vermelho">⚠ ${divergencias} dia(s) com divergência</span>` : ''}
      </h3>
      <p style="font-size:12px; color:var(--grafite-suave); margin:-4px 0 4px 0">
        <span style="display:inline-flex; align-items:center; gap:4px"><span style="width:9px; height:9px; border-radius:2px; background:var(--roxo); display:inline-block"></span>roxo = direto</span> ·
        <span style="display:inline-flex; align-items:center; gap:4px"><span style="width:9px; height:9px; border-radius:2px; background:var(--laranja); display:inline-block"></span>laranja = indireto</span> ·
        <span style="display:inline-flex; align-items:center; gap:4px"><span style="width:12px; height:2px; background:var(--grafite); display:inline-block"></span>traço = total alocado nas frentes (Apontar) naquele dia</span>. O número no topo é <strong>direto/indireto</strong> (ex.: 117/4 = 117 diretos, 4 indiretos).
        Quando o traço não bate com o topo da barra, passe o mouse pra ver a diferença — sinal de gente não apontada em nenhuma frente, ou apontada a mais do que o efetivo geral informado.
        ${(state.efFiltroProjeto!=='all'||state.efFiltroEmpresa!=='all'||state.efFiltroDataDe||state.efFiltroDataAte) ? ' Considerando os filtros aplicados abaixo.' : ''}
      </p>
      ${entries.length ? `<div class="daybars">${bars}</div>` : `<div class="board-empty">Nenhum efetivo lançado ainda</div>`}
    </div>`;
}
function efetivoGeralLista(){
  let lista = DB.efetivoGeral.slice();
  if(state.efFiltroProjeto!=='all') lista = lista.filter(g=>g.projetoId===state.efFiltroProjeto);
  if(state.efFiltroEmpresa!=='all') lista = lista.filter(g=>g.empresaId===state.efFiltroEmpresa);

  if(state.efFiltroDataAte) lista = lista.filter(g=>g.data <= state.efFiltroDataAte);
  return lista.sort((a,b)=> b.data.localeCompare(a.data));
}

function submitEfetivoGeral(ev){
  ev.preventDefault();
  const f = ev.target;
  const data = f.data.value;
  const empresaId = f.empresaId.value || null;
  const quantidade = Math.max(0, parseInt(f.quantidade.value,10) || 0);
  const profissional = f.profissional.value.trim() || null;
  const tipo = f.tipo.value || null;
  const obs = f.obs.value.trim() || null;
  if(!data || quantidade<=0 || !tipo){ showToast('Preencha data, tipo (direto/indireto) e uma quantidade válida.'); return false; }
  const projetoId = DB.projetos.length===1 ? DB.projetos[0].id : null;
  DB.efetivoGeral.push({ id: uid(), data, projetoId, empresaId, profissional, tipo, quantidade, obs, createdAt: Date.now() });
  persist.efetivoGeral();
  if(profissional && aprenderTipo(empresaId, profissional, tipo)) persist.aprendizado();
  showToast('Efetivo geral lançado.');
  f.reset(); f.data.value = hojeStr(); f.quantidade.value = 1;
  render();
  return false;
}
window.submitEfetivoGeral = submitEfetivoGeral;
function sugerirTipoEfetivoGeral(f){
  if(!f || !f.profissional.value.trim()) return;
  const t = tipoAprendido(f.empresaId.value||null, f.profissional.value);
  if(t && !f.tipo.value){ f.tipo.value = t; showToast(`Tipo sugerido pelo aprendizado: ${t==='direto'?'Direto':'Indireto'}.`); }
}
window.sugerirTipoEfetivoGeral = sugerirTipoEfetivoGeral;
function aplicarClassificacaoAprendida(){
  let n = 0;
  DB.efetivoGeral.forEach(g=>{ if(!g.tipo && g.profissional){ const t = tipoAprendido(g.empresaId, g.profissional); if(t){ g.tipo = t; n++; } } });

  else showToast('Nenhum lançamento sem tipo com regra aprendida.');

}
window.aplicarClassificacaoAprendida = aplicarClassificacaoAprendida;
function renderMemoriaAprendizado(){

  const tAliasE = aliasE.map(([k,v])=>linha(esc(k), `→ <strong>${esc(nomeEmpresa(v))}</strong>`, del('aliasEmpresa', k))).join('');
  const tIgn = A.ignorar.map(n=>linha(esc(n), 'ignorado nas importações', del('ignorar', n))).join('');

    ${bloco('Linhas ignoradas', tIgn)}
  </div>`;
}
function alterarRegraTipo(chave, tipo){
  const [, f] = chave.split('|'); const A = apr(); const ant = A.tipoFuncao[chave];
  A.tipoFuncao[chave] = { tipo, em: Date.now(), trocas: ant && ant.tipo!==tipo ? (ant.trocas||0)+1 : (ant ? ant.trocas||0 : 0), anterior: ant ? ant.tipo : null };
  A.tipoFuncao[`*|${f}`] = { ...A.tipoFuncao[chave] };
  persist.aprendizado(); render();
}
window.alterarRegraTipo = alterarRegraTipo;
function esquecerRegra(tipo, chave){
  const A = apr();
  if(tipo==='ignorar') A.ignorar = A.ignorar.filter(n=>n!==chave);
  else {

function normalizarTexto(str){
  return String(str||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase().replace(/\s+/g,' ');
}
/* ---------------------------------------------------------
   MEMÓRIA DE APRENDIZADO (efetivo / importação de planilhas)
   tipoFuncao:   "empresaId|FUNCAO" e "*|FUNCAO" → { tipo, em, trocas, anterior }
   aliasFuncao:  "empresaId|VARIANTE" → "NOME CANÔNICO"
   aliasEmpresa: "TEXTO DA PLANILHA" → empresaId
   ignorar:      ["TEXTO", ...] linhas sempre ignoradas na importação
--------------------------------------------------------- */
function normalizarAprendizado(a){
  a = a || {};
  return { tipoFuncao: a.tipoFuncao||{}, aliasFuncao: a.aliasFuncao||{}, aliasEmpresa: a.aliasEmpresa||{}, ignorar: Array.isArray(a.ignorar)?a.ignorar:[] };
}
function chaveFuncao(txt){ return normalizarTexto(txt).replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }
function apr(){ if(!DB.aprendizado) DB.aprendizado = normalizarAprendizado(null); return DB.aprendizado; }
function funcaoCanonica(empresaId, funcao){
  const k = chaveFuncao(funcao), A = apr();
  return A.aliasFuncao[`${empresaId||'*'}|${k}`] || A.aliasFuncao[`*|${k}`] || String(funcao||'').trim();
}
function tipoAprendido(empresaId, funcao){
  const k = chaveFuncao(funcaoCanonica(empresaId, funcao)), A = apr();
  const r = A.tipoFuncao[`${empresaId||'*'}|${k}`] || A.tipoFuncao[`*|${k}`];
  return r ? r.tipo : null;
}
function aprenderTipo(empresaId, funcao, tipo){
  if(!funcao || !tipo) return false;
  const k = chaveFuncao(funcaoCanonica(empresaId, funcao)); if(!k) return false;
  const A = apr(); let mudou = false;
  [`${empresaId||'*'}|${k}`, `*|${k}`].forEach(ch=>{
    const ant = A.tipoFuncao[ch];
    if(ant && ant.tipo===tipo) return;
    A.tipoFuncao[ch] = { tipo, em: Date.now(), trocas: ant ? (ant.trocas||0)+1 : 0, anterior: ant ? ant.tipo : null };
    mudou = true;
  });
  return mudou;
}
function aprenderAliasFuncao(empresaId, variante, canonica){
  const k = chaveFuncao(variante); if(!k || !canonica) return;
  if(chaveFuncao(canonica)===k){ delete apr().aliasFuncao[`${empresaId||'*'}|${k}`]; return; }
  apr().aliasFuncao[`${empresaId||'*'}|${k}`] = String(canonica).toUpperCase().trim();
}
function empresaPorAlias(texto){
  const id = apr().aliasEmpresa[normalizarTexto(texto)];
  return id && DB.empresas.find(e=>e.id===id) ? id : null;
}
function linhaIgnorada(texto){ const n = normalizarTexto(texto); return apr().ignorar.includes(n); }
const RDO_PALAVRAS_IGNORAR = ['TOTAL','SUBTOTAL','GERAL','INDIRETO','DIRETO','SUBCONTRATADO','SUBCONTRATADOS','EFETIVO','DATA','ANTERIOR','FALTA','ADMISSAO','DEMISSAO','ATUAL'];
// PADRÃO DO SISTEMA: só gravar/cadastrar função quando a quantidade de efetivo for > 0.
// Isso vale pra qualquer entrada de efetivo (lançamento manual, importação de planilha
// padrão, importação de RDO) — evita poluir o banco com linhas/profissionais "zerados"
// e mantém a base enxuta. Não remover esses filtros de quantidade<=0 em edições futuras.
function rdoParaData(valor){
  if(valor instanceof Date && !isNaN(valor)) return valor.toISOString().slice(0,10);
  if(typeof valor === 'string'){
    const m1 = valor.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m1) return `${m1[1]}-${m1[2]}-${m1[3]}`;
    const m2 = valor.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-]?(\d{2,4})?/);
    if(m2){
      const dia = m2[1].padStart(2,'0'), mes = m2[2].padStart(2,'0');
      let ano = m2[3] || String(new Date().getFullYear());
      if(ano.length===2) ano = '20'+ano;
      return `${ano}-${mes}-${dia}`;
    }
  }
  return null;
}
function extrairDataDoRDO(matriz, nomeAba){
  for(let r=0;r<matriz.length;r++){
    for(let c=0;c<matriz[r].length;c++){
      const cel = matriz[r][c];
      if(typeof cel === 'string' && normalizarTexto(cel).includes('DATA')){
        for(let cc=c+1; cc<matriz[r].length; cc++){
          const d = rdoParaData(matriz[r][cc]);
          if(d) return d;
        }
        for(let rr=r+1; rr<Math.min(r+3,matriz.length); rr++){
          const d = rdoParaData(matriz[rr][c]);
          if(d) return d;
        }
      }
    }
  }
  const dData = rdoParaData(nomeAba);
  if(dData) return dData;
  for(let r=0;r<Math.min(matriz.length,15);r++){
    for(let c=0;c<matriz[r].length;c++){
      const d = matriz[r][c] instanceof Date ? rdoParaData(matriz[r][c]) : null;
      if(d) return d;
    }
  }
  return null;
}
function classificarDiretoIndireto(valor){
  const norm = normalizarTexto(valor);
  if(!norm) return null;
  if(norm.startsWith('INDIRET') || norm==='I' || norm==='IND') return 'indireto';
  if(norm.startsWith('DIRET') || norm==='D' || norm==='DIR') return 'direto';
  return null;
}
function detectarColunasRDO(matriz){
  const roles = { anterior:null, falta:null, admissao:null, demissao:null, atual:null, classificacao:null };
  for(let r=0;r<matriz.length;r++){
    let achouPrincipais = 0;
    matriz[r].forEach((cel,c)=>{
      const t = normalizarTexto(cel);
      if(t==='ANTERIOR'){ roles.anterior=c; achouPrincipais++; }
      else if(t==='FALTA'){ roles.falta=c; achouPrincipais++; }
      else if(t.startsWith('ADMISS')){ roles.admissao=c; achouPrincipais++; }
      else if(t.startsWith('DEMISS')){ roles.demissao=c; achouPrincipais++; }
      else if(t==='ATUAL'){ roles.atual=c; achouPrincipais++; }
      else if(t==='CLASSIFICACAO' || t==='TIPO' || t==='DIRETO/INDIRETO' || t==='DIRETO INDIRETO' || t==='D/I'){ roles.classificacao=c; }
    });
    if(achouPrincipais>=2 && roles.classificacao==null){
      // continua procurando a coluna de classificação em outras linhas de cabeçalho, mas já fixa as principais
    }
    if(achouPrincipais>=2) break;
  }
  // busca adicional pela coluna de classificação em todo o cabeçalho, caso não tenha vindo junto das outras
  if(roles.classificacao==null){
    for(let r=0;r<Math.min(matriz.length,10);r++){
      for(let c=0;c<matriz[r].length;c++){
        const t = normalizarTexto(matriz[r][c]);
        if(t==='CLASSIFICACAO' || t==='TIPO' || t==='DIRETO/INDIRETO' || t==='DIRETO INDIRETO' || t==='D/I'){ roles.classificacao=c; break; }
      }
      if(roles.classificacao!=null) break;
    }
  }
  return roles;
}
function extrairLinhasRDO(matriz, empresasNormalizadas){
  const roles = detectarColunasRDO(matriz);
  const linhas = [];
  const naoReconhecidas = new Set();
  let empresaAtual = null;
  let linhaAnteriorVazia = true; // a primeira linha de dados conta como início de bloco
  matriz.forEach(row=>{
    const vazia = !row || !row.some(v=>v!==null && v!==undefined && v!=='');
    if(vazia){ linhaAnteriorVazia = true; return; }
    let textoCol=-1, texto=null;
    for(let c=0;c<row.length;c++){
      if(c===roles.classificacao) continue; // não deixa a coluna de classificação virar "nome da função"
      if(typeof row[c]==='string' && row[c].trim()!==''){ textoCol=c; texto=row[c].trim(); break; }
    }
    if(!texto){ linhaAnteriorVazia = false; return; }
    const norm = normalizarTexto(texto);
    if(RDO_PALAVRAS_IGNORAR.some(p=>norm===p || norm.startsWith(p+' ')) || linhaIgnorada(texto)){ linhaAnteriorVazia = false; return; }

    const empresaMatch = empresasNormalizadas.find(e=>e.norm===norm);
    // início de bloco = linha em branco antes, OU o texto bate com uma empresa cadastrada (mesmo sem branco antes)
    const inicioDeBloco = linhaAnteriorVazia || !!empresaMatch;
    if(inicioDeBloco){
      empresaAtual = empresaMatch || null; // bloco de empresa não cadastrada = ignorado até o próximo início de bloco
      if(!empresaMatch && norm.split(' ').length<=5) naoReconhecidas.add(texto);
      linhaAnteriorVazia = false;
      return;
    }
    linhaAnteriorVazia = false;
    if(!empresaAtual) return;

    const num = (c)=> (c!=null && typeof row[c]==='number') ? row[c] : null;
    let qtd = null;
    if(roles.atual!=null && num(roles.atual)!=null){
      qtd = num(roles.atual);
    } else if(roles.anterior!=null){
      const a = num(roles.anterior)||0, f = num(roles.falta)||0, ad = num(roles.admissao)||0, d = num(roles.demissao)||0;
      qtd = a - f + ad - d;
    } else {
      for(let c=row.length-1;c>textoCol;c--){ const n = num(c); if(n!=null){ qtd=n; break; } }
    }
    if(qtd==null || qtd<=0) return;
    const tipoDetectado = roles.classificacao!=null ? classificarDiretoIndireto(row[roles.classificacao]) : null;
    linhas.push({ empresaId: empresaAtual.id, empresaNome: empresaAtual.nome, funcao: texto, quantidade: Math.round(qtd), tipo: tipoDetectado });
  });
  return { linhas, naoReconhecidas };
}
function empresasNormalizadasComAlias(){
  const lista = DB.empresas.map(emp=>({ id: emp.id, nome: emp.nome, norm: normalizarTexto(emp.nome) }));
  Object.entries(apr().aliasEmpresa).forEach(([norm, id])=>{ const emp = DB.empresas.find(e=>e.id===id); if(emp) lista.push({ id, nome: emp.nome, norm }); });
  return lista;
}
function montarPreviewRDO(abas, nomeArquivo, manter){
  const empresasNormalizadas = empresasNormalizadasComAlias();
  let todasLinhas = [];
  const naoReconhecidasSet = new Set();
  let dataDetectada = null;
  abas.forEach(({ matriz, dAba })=>{
    if(!dataDetectada) dataDetectada = dAba;
    const { linhas, naoReconhecidas } = extrairLinhasRDO(matriz, empresasNormalizadas);
    todasLinhas = todasLinhas.concat(linhas.map(l=>({ ...l, data: dAba })));
    naoReconhecidas.forEach(n=>naoReconhecidasSet.add(n));
  });
  // aplica o que já foi aprendido: nome canônico da função + classificação
  todasLinhas.forEach(l=>{
    l.funcaoOriginal = l.funcao;
    l.funcao = funcaoCanonica(l.empresaId, l.funcao);
    if(l.tipo){ l.tipoOrigem = 'planilha'; }
    else { const t = tipoAprendido(l.empresaId, l.funcao); if(t){ l.tipo = t; l.tipoOrigem = 'aprendido'; } }
    const manual = manter && manter.manuais && manter.manuais[`${l.empresaId}|${chaveFuncao(l.funcao)}`];
    if(manual){ l.tipo = manual; l.tipoOrigem = 'manual'; }
  });
  const empresasEncontradasIds = new Set(todasLinhas.map(l=>l.empresaId));
  const funcoesNovasPorEmpresa = {};
  todasLinhas.forEach(l=>{
    const emp = DB.empresas.find(e=>e.id===l.empresaId);
    const jaTem = emp.profissionais.some(p=>normalizarTexto(p.nome)===normalizarTexto(l.funcao));
    l.funcaoNova = !jaTem;
    if(!jaTem){
      if(!funcoesNovasPorEmpresa[l.empresaId]) funcoesNovasPorEmpresa[l.empresaId] = new Set();
      funcoesNovasPorEmpresa[l.empresaId].add(l.funcao);
    }
  });
  const tipoPorEmpresa = (manter && manter.tipoPorEmpresa) || {};
  empresasEncontradasIds.forEach(id=>{ if(!tipoPorEmpresa[id]) tipoPorEmpresa[id] = 'direto'; });
  return {
    linhas: todasLinhas, nomeArquivo, dataDetectada, abas,
    empresasEncontradas: empresasEncontradasIds.size,
    naoReconhecidas: [...naoReconhecidasSet],
    funcoesNovas: Object.entries(funcoesNovasPorEmpresa).map(([empresaId,set])=>({ empresaId, nomeEmpresa: nomeEmpresa(empresaId), funcoes: [...set] })),
    totalPessoas: todasLinhas.reduce((s,l)=>s+l.quantidade,0),
    contratoId: manter ? manter.contratoId : (DB.contratos[0] ? DB.contratos[0].id : null),
    dataFinal: manter ? manter.dataFinal : (dataDetectada || hojeStr()),
    tipoPorEmpresa,
    manuais: (manter && manter.manuais) || {},
    classificadasAuto: todasLinhas.filter(l=>l.tipoOrigem==='planilha').length,
    classificadasAprendidas: todasLinhas.filter(l=>l.tipoOrigem==='aprendido').length,
  };
}
function reprocessarRDO(){
  const p = state.rdoPreview; if(!p) return;
  state.rdoPreview = montarPreviewRDO(p.abas, p.nomeArquivo, p);
  render();
}
function estagiarRDO(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(/\.pdf$/i.test(file.name)){
    showToast('PDF não dá pra ler automaticamente ainda — exporte/converta o RDO pra Excel (.xlsx) ou CSV primeiro.');
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array', cellDates:true });
      const abas = wb.SheetNames.map(nomeAba=>{
        const matriz = XLSX.utils.sheet_to_json(wb.Sheets[nomeAba], { header:1, raw:true, defval:null });
        return { nomeAba, matriz, dAba: extrairDataDoRDO(matriz, nomeAba) };
      });
      const prev = montarPreviewRDO(abas, file.name, null);
      if(!prev.linhas.length && !prev.naoReconhecidas.length){
        showToast('Não encontrei nenhuma linha reconhecível — confira se os nomes das empresas na planilha batem com os nomes cadastrados no sistema.');
        input.value = '';
        return;
      }
      state.rdoPreview = prev;
      render();
    } catch(err){
      showToast('Não foi possível ler essa planilha. Formato inesperado.');
    }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function rdoAssociarEmpresa(texto, empresaId){

function confirmarImportacaoRDO(){
  const preview = state.rdoPreview;
  if(!preview) return;
  if(!preview.contratoId){ showToast('Escolha o contrato desse efetivo antes de confirmar.'); return; }
  if(!preview.dataFinal){ showToast('Informe a data desse efetivo antes de confirmar.'); return; }
  // se o contrato tiver só 1 projeto vinculado, aproveita pra também marcar o projeto (mantém os filtros por projeto funcionando)
  const projetosDoContrato = DB.projetos.filter(p=>p.contratoId===preview.contratoId);
  const projetoId = projetosDoContrato.length===1 ? projetosDoContrato[0].id : null;
  let profissoesAdicionadas = 0, criados = 0, atualizados = 0;
  preview.linhas.forEach(l=>{
    const emp = DB.empresas.find(e=>e.id===l.empresaId);
    if(!emp) return;
    const nomeFuncao = l.funcao.toUpperCase();
    const jaTem = emp.profissionais.some(p=>normalizarTexto(p.nome)===normalizarTexto(nomeFuncao));
    if(!jaTem){
      emp.profissionais.push({ id: uid(), nome: nomeFuncao });
      profissoesAdicionadas++;
    }
    const tipo = l.tipo || (preview.tipoPorEmpresa && preview.tipoPorEmpresa[l.empresaId]) || 'direto';
    if(l.tipo && (l.tipoOrigem==='planilha' || l.tipoOrigem==='manual')) aprenderTipo(l.empresaId, nomeFuncao, l.tipo); // só aprende o que foi informado de fato (não o padrão da empresa)
    // não duplica: se já existe lançamento pra essa empresa/função/data/contrato, atualiza em vez de criar de novo
    const existente = DB.efetivoGeral.find(g=>g.data===preview.dataFinal && g.contratoId===preview.contratoId && g.empresaId===l.empresaId && normalizarTexto(g.profissional||'')===normalizarTexto(nomeFuncao));
    if(existente){
      existente.quantidade = l.quantidade;
      existente.tipo = tipo;
      existente.obs = `Importado de ${preview.nomeArquivo}`;
      atualizados++;
    } else {
      DB.efetivoGeral.push({
        id: uid(), data: preview.dataFinal, contratoId: preview.contratoId, projetoId, empresaId: l.empresaId,
        profissional: nomeFuncao, tipo, quantidade: l.quantidade, obs: `Importado de ${preview.nomeArquivo}`, createdAt: Date.now(),
      });
      criados++;
    }
  });
  persist.empresas(); persist.efetivoGeral(); persist.aprendizado();
  const nEmpresas = new Set(preview.linhas.map(l=>l.empresaId)).size;
  state.rdoPreview = null;
  showToast(`Importado: ${criados} lançamento(s) novo(s)${atualizados?`, ${atualizados} atualizado(s) (sem duplicar)`:''}, ${nEmpresas} empresa(s), ${preview.totalPessoas} pessoas no total${profissoesAdicionadas ? `. ${profissoesAdicionadas} função(ões) nova(s) cadastrada(s) automaticamente` : ''}.`);
  render();
}

function importarEfetivoGeralExcel(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array', cellDates:true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const linhas = XLSX.utils.sheet_to_json(ws, { defval:'' });
      let importados = 0, ignorados = 0;
      linhas.forEach(l=>{
        const nomeCol = (obj, ...chaves) => { for(const c of chaves){ if(obj[c]!==undefined && obj[c]!=='') return obj[c]; } return null; };
        const dataRaw = nomeCol(l, 'Data','data','DATA');
        const projetoNome = nomeCol(l, 'Projeto','projeto','PROJETO');
        const empresaNome = nomeCol(l, 'Empresa','empresa','EMPRESA');
        const profissional = nomeCol(l, 'Profissional','profissional','Função','função');
        const quantidade = parseInt(nomeCol(l, 'Quantidade','quantidade','QUANTIDADE'), 10);
        const obs = nomeCol(l, 'Observação','Observacao','observação','obs');
        let dataStr = null;
        if(dataRaw instanceof Date){ dataStr = dataRaw.toISOString().slice(0,10); }
        else if(typeof dataRaw === 'string'){
          const m1 = dataRaw.match(/^(\d{4})-(\d{2})-(\d{2})/);
          const m2 = dataRaw.match(/^(\d{2})\/(\d{2})\/(\d{2,4})/);
          if(m1) dataStr = `${m1[1]}-${m1[2]}-${m1[3]}`;
          else if(m2) dataStr = `${m2[3].length===2?'20'+m2[3]:m2[3]}-${m2[2]}-${m2[1]}`;
        }
        const projeto = projetoNome ? DB.projetos.find(p=>p.nome.toLowerCase()===String(projetoNome).toLowerCase().trim()) : null;
        const empresa = empresaNome ? (DB.empresas.find(e=>e.nome.toLowerCase()===String(empresaNome).toLowerCase().trim()) || DB.empresas.find(e=>e.id===empresaPorAlias(empresaNome))) : null;
        const tipoCol = nomeCol(l, 'Tipo','tipo','TIPO','Classificação','Classificacao');
        if(!dataStr || !projeto || !quantidade || quantidade<=0){ ignorados++; return; }
        DB.efetivoGeral.push({
          id: uid(), data: dataStr, projetoId: projeto.id, empresaId: empresa ? empresa.id : null,
          profissional: profissional ? funcaoCanonica(empresa ? empresa.id : null, String(profissional).trim()) : null,
          tipo: (tipoCol ? classificarDiretoIndireto(tipoCol) : null) || (profissional ? tipoAprendido(empresa ? empresa.id : null, profissional) : null),
          quantidade, obs: obs ? String(obs).trim() : null, createdAt: Date.now(),
        });
        importados++;
      });
      if(importados) persist.efetivoGeral();
      showToast(`${importados} lançamento(s) importado(s)${ignorados ? `, ${ignorados} ignorado(s) (projeto/data/quantidade inválidos)` : ''}.`);
      render();
    } catch(err){
      showToast('Não foi possível ler essa planilha. Confira o formato (Data, Projeto, Empresa, Profissional, Quantidade).');
    }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function consistenciaEfetivo(){
  const apontadoTotal = {};
  const apontadoDetalhe = {};
  DB.registros.forEach(r=>{
    turnosEfetivoReg(r).forEach(e=>{
      (e.itens||[]).forEach(it=>{
        if(!it.quantidade) return;
        const keyD = `${e.empresaId}|${e.data}`;
        const keyP = `${e.empresaId}|${e.data}|${(it.nome||'').toLowerCase().trim()}`;
        apontadoTotal[keyD] = (apontadoTotal[keyD]||0) + it.quantidade;
        apontadoDetalhe[keyP] = (apontadoDetalhe[keyP]||0) + it.quantidade;
      });
    });
  });
  const informadoTotal = {};
  const informadoDetalhe = {};
  DB.efetivoGeral.forEach(g=>{
    if(!g.empresaId || !g.quantidade) return;
    const keyD = `${g.empresaId}|${g.data}`;
    informadoTotal[keyD] = (informadoTotal[keyD]||0) + g.quantidade;
    if(g.profissional){
      const keyP = `${g.empresaId}|${g.data}|${g.profissional.toLowerCase().trim()}`;
      informadoDetalhe[keyP] = (informadoDetalhe[keyP]||0) + g.quantidade;
    }
  });
  const chaves = new Set([...Object.keys(apontadoTotal), ...Object.keys(informadoTotal)]);
  const divergencias = [];
  chaves.forEach(keyD=>{
    const informado = informadoTotal[keyD];
    if(informado==null) return; // sem efetivo geral cadastrado pra essa empresa/dia -> nada a cruzar
    const apontado = apontadoTotal[keyD]||0;
    if(apontado === informado) return;
    const [empresaId, data] = keyD.split('|');
    // detalhe por função, quando dá pra cruzar (função aparece nos dois lados)
    const funcoes = new Set();
    Object.keys(apontadoDetalhe).forEach(k=>{ if(k.startsWith(keyD+'|')) funcoes.add(k.slice(keyD.length+1)); });
    Object.keys(informadoDetalhe).forEach(k=>{ if(k.startsWith(keyD+'|')) funcoes.add(k.slice(keyD.length+1)); });
    const porFuncao = [...funcoes].map(fn=>({
      funcao: fn, apontado: apontadoDetalhe[`${keyD}|${fn}`]||0, informado: informadoDetalhe[`${keyD}|${fn}`]||null,
    })).filter(f=>f.informado!=null && f.apontado!==f.informado);
    divergencias.push({ empresaId, data, apontado, informado, diff: apontado-informado, porFuncao });
  });
  divergencias.sort((a,b)=> b.data.localeCompare(a.data));
  return divergencias;
}
function renderConsistenciaEfetivoHtml(){
  const divergencias = consistenciaEfetivo();
  if(!divergencias.length){
    return `<div class="card">
      <h3>Consistência do efetivo <span class="chip verde">✓ tudo bate</span></h3>
      <p style="font-size:12.5px; color:var(--grafite-suave); margin:0">O efetivo apontado nas frentes bate com o efetivo geral informado por empresa/dia, sempre que os dois estão cadastrados. Lance o efetivo geral (abaixo) por empresa pra ativar essa checagem.</p>

  const rows = divergencias.map(d=>{

    const detalheFuncoes = d.porFuncao.length ? `<div style="font-size:11.5px; color:var(--grafite-suave); margin-top:4px;">${d.porFuncao.map(f=>`${esc(f.funcao)}: apontado ${f.apontado} × informado ${f.informado}`).join(' · ')}</div>` : '';
    return `<tr>

  return `<div class="card">

  </div>`;

        <div class="field"><label>Projeto</label><select onchange="state.efFiltroProjeto=this.value; render();">${filtroProjetoOptions}</select></div>
        <div class="field"><label>Empresa</label><select onchange="state.efFiltroEmpresa=this.value; render();">${filtroEmpresaOptions}</select></div>
        <div class="field"><label>De</label><input type="date" value="${state.efFiltroDataDe||''}" onchange="state.efFiltroDataDe=this.value||null; render();"></div>
        <div class="field"><label>Até</label><input type="date" value="${state.efFiltroDataAte||''}" onchange="state.efFiltroDataAte=this.value||null; render();"></div>
      </div>
      ${(state.efFiltroProjeto!=='all'||state.efFiltroEmpresa!=='all'||state.efFiltroDataDe||state.efFiltroDataAte) ? `<button class="btn small ghost" style="margin-top:8px" onclick="state.efFiltroProjeto='all'; state.efFiltroEmpresa='all'; state.efFiltroDataDe=null; state.efFiltroDataAte=null; render();">Limpar filtros</button>` : ''}
    </div>
    ${renderEfetivoGraficoHtml()}
    ${renderConsistenciaEfetivoHtml()}
    <div class="card">
      <h3>Lançamentos de efetivo <span class="tag">${linhas.length} dia(s)·frente · ${diasDistintos} data(s) distinta(s) · ${totalPessoasDia} pessoas-dia</span></h3>
      ${linhas.length ? `<table><thead><tr><th>Data</th><th>Projeto</th><th>Frente</th><th>Etapa</th><th>Empresa</th><th>Efetivo</th><th>Total</th><th>Horário</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
        : `<div class="empty"><div class="big">Nenhum lançamento de efetivo com esse filtro</div><p>O efetivo diário é lançado na aba Apontar, em "Efetivo do dia" ou ao iniciar/encerrar uma etapa.</p></div>`}
    </div>
    ${renderEfetivoGeralHtml()}`;
}
function exportarEfetivoCSV(){
  const linhas = [['Data','Projeto','Frente','Estrutura','Etapa','Turno','Empresa','Profissional','Quantidade','Início do dia','Fim do dia']];
  efetivoLinhasBrutas().forEach(l=>{
    const r = l.reg;
    l.entrada.itens.forEach(it=>{
      linhas.push([l.data, nomeProjeto(r.projetoId), regFrenteLabel(r), nomeEstrutura(r.estruturaId), nomeEtapa(r.etapaId), l.turno||'Principal', nomeEmpresa(l.empresaId||r.empresaId), it.nome, it.quantidade, l.entrada.horaInicio||'', l.entrada.horaFim||'']);
    });
  });
  const csv = linhas.map(linha => linha.map(campo => {
    const s = String(campo??'');
    return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `frente-livre-efetivo-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV de efetivo exportado.');
}
window.exportarEfetivoCSV = exportarEfetivoCSV;

            <div class="field"><label>Etapa</label><select id="edit-reg-etapa-${r.id}">${etapaOptionsSel(r.estruturaId, r.etapaId)}</select></div>
            <div class="field"><label>Empresa</label><select id="edit-reg-empresa-${r.id}">${empresaOptionsSel(r.empresaId)}</select></div>

    return `<tr>

        <td>${esc(regFrenteLabel(r))}</td>
