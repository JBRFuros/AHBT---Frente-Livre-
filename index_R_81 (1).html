const numIn = v => { const s = String(v??'').trim(); if(!s) return NaN; const n = parseFloat(s.includes(',') ? s.replace(/\./g,'').replace(',','.') : s); return isFinite(n) ? n : NaN; };
// famílias de unidade: massa (kg) e volume (L). Densidade em t/m³ (= kg/L); peso por unidade em kg (saco, peça)
const UN_FAM = { 'T':['m',1000], 'KG':['m',1], 'M³':['v',1000], 'L':['v',1] };
// quantas unidades de estoque (base) existem em 1 'un'
function fatorParaBase(ins, un){
  if(!ins || !un || un===ins.unidade) return 1;
  const fu = UN_FAM[un]; if(!fu) return NaN;
  const dens = +ins.densidade, peso = +ins.pesoUn;
  let fam = fu[0], q = fu[1];
  const fb = UN_FAM[ins.unidade];
  if(fb){
    if(fam!==fb[0]){ if(!(dens>0)) return NaN; if(fam==='m'){ q = q/dens; fam = 'v'; } else { q = q*dens; fam = 'm'; } }
    return q / fb[1];
  }
  if(!(peso>0)) return NaN;
  const kg = fam==='m' ? q : (dens>0 ? q*dens : NaN);
  return kg / peso;
}
function unidadesDoInsumo(ins){
  if(!ins) return [];
  return [ins.unidade, ...Object.keys(UN_FAM).filter(u=>u!==ins.unidade && isFinite(fatorParaBase(ins,u)))];
}
function unidadesOptions(ins, sel){ return unidadesDoInsumo(ins).map(u=>`<option ${u===(sel||ins.unidade)?'selected':''}>${esc(u)}</option>`).join(''); }
function conversaoTexto(ins){
  const outras = unidadesDoInsumo(ins).slice(1);
  if(!outras.length) return '';
  return outras.map(u=>{ const f = fatorParaBase(ins,u); return `1 ${u} = ${fmtQ(f, f<0.01?5:3)} ${ins.unidade}`; }).join(' · ');
}
function precoNaData(insumoId, dataISO){
  const i = insumoPorId(insumoId);
  if(!i || !i.precos || !i.precos.length) return 0;
  const d = (dataISO || hojeStr()).slice(0,10);
  const ord = i.precos.slice().sort((a,b)=>a.data.localeCompare(b.data));
  let p = ord[0].valor;
  for(const x of ord){ if(x.data<=d) p = x.valor; }
  return +p || 0;
}

function chaveDestino(d){
  if(!d) return 'pg:';
  if(d.tipo==='elemento') return 'el:' + d.elementoId;
  if(d.tipo==='trecho') return 'tr:' + d.estruturaId + ':' + (d.trechoId||'') + ':' + (d.faixa||'');
  if(d.tipo==='servico') return 'sa:' + d.servicoId;
  if(d.tipo==='compartilhado') return 'cp:' + d.poolId;
  return 'pg:' + (d.motivo||'');
}
function labelDestino(d){
  if(!d) return 'Projeto geral';
  if(d.tipo==='elemento'){
    const el = DB.elementos.find(e=>e.id===d.elementoId);
    return `${el ? el.codigo : '(elemento removido)'} · ${nomeEstrutura(d.estruturaId || (el && el.estruturaId))}${d.etapaId ? ' › '+nomeEtapa(d.etapaId) : ''}`;
  }
  if(d.tipo==='trecho') return `${nomeEstrutura(d.estruturaId)}${d.trechoId ? ' · '+trechoNomeCurto(d.trechoId) : ''}${d.faixa ? ' · '+d.faixa : ''}${d.etapaId ? ' › '+nomeEtapa(d.etapaId) : ''}`;
  if(d.tipo==='servico'){ const s = DB.servicosAux.find(x=>x.id===d.servicoId); return s ? s.nome : '(serviço removido)'; }
  if(d.tipo==='compartilhado') return 'Compartilhado · ' + nomePool(d.poolId);
  return (d.motivo || 'Projeto geral') + (d.trechoId ? ' · ' + trechoNomeCurto(d.trechoId) : '');
}
function grupoDestino(d){
  if(!d) return 'Projeto geral';
  if(d.tipo==='elemento' || d.tipo==='trecho') return nomeEstrutura(d.estruturaId || ((DB.elementos.find(e=>e.id===d.elementoId)||{}).estruturaId));
  if(d.tipo==='servico') return 'Serviços auxiliares';
  if(d.tipo==='compartilhado') return 'Compartilhado (não apropriado)';

// local de estoque do movimento: canteiro (R75) ou, nos lançamentos antigos, o próprio projeto
const localDe = m => m.localId || m.projetoId;
const localDestinoDe = m => m.localDestinoId || m.projetoDestinoId;
const TIPOS_ESTOQUE = ['entrada','dev','ajuste','disp','comp','consumo','transf'];
function saldoEstoque(localId, insumoId){
  let s = 0;
  for(const m of DB.insMov){
    if(m.insumoId!==insumoId) continue;
    if(m.tipo==='transf'){ if(localDe(m)===localId) s -= m.qtd; if(localDestinoDe(m)===localId) s += m.qtd; continue; }
    if(localDe(m)!==localId) continue;
    if(m.tipo==='entrada' || m.tipo==='dev' || m.tipo==='ajuste') s += m.qtd;
    else if(m.tipo==='disp' || m.tipo==='comp' || m.tipo==='consumo') s -= m.qtd;
  }
  return s;
}
const canteiroPorId = id => (DB.canteiros||[]).find(c=>c.id===id);
const TIPOS_AMBIENTE = ['Container','Galpão','Pátio','Depósito','Silo','Baia','Outro'];
const ehDoProjeto = c => !!(c && c.vinculoProjetoId);
function nomeLocal(id){
  const c = canteiroPorId(id);
  if(c) return c.vinculoProjetoId ? `${c.nome} · ${nomeProjeto(c.vinculoProjetoId)}` : `${c.nome} · canteiro`;
  const p = DB.projetos.find(x=>x.id===id);
  return p ? 'Almoxarifado antigo · ' + p.nome : '(local removido)';
}
function projetosAtendidos(c){ return c.vinculoProjetoId ? [c.vinculoProjetoId] : (c.projetoIds||[]); }
function locaisEstoque(){
  const legado = new Set();
  DB.insMov.forEach(m=>{ if(!TIPOS_ESTOQUE.includes(m.tipo)) return; [localDe(m), m.tipo==='transf' ? localDestinoDe(m) : null].forEach(x=>{ if(x && !canteiroPorId(x) && DB.projetos.find(p=>p.id===x)) legado.add(x); }); });
  return [...(DB.canteiros||[]).map(c=>c.id), ...legado];
}
function localPadrao(projetoId){
  const proprio = (DB.canteiros||[]).find(c=>c.vinculoProjetoId===projetoId);
  if(proprio) return proprio.id;
  const c = (DB.canteiros||[]).find(c=>!c.vinculoProjetoId && (c.projetoIds||[]).includes(projetoId));
  if(c) return c.id;
  if(locaisEstoque().includes(projetoId)) return projetoId;
  return (DB.canteiros||[])[0] ? DB.canteiros[0].id : projetoId;
}
function locaisOptions(sel){

// o que está "parado" no destino: disponibilizado + complementos − devolvido − usado em batidas
function saldoNoDestino(projetoId, destino, insumoId){
  const k = chaveDestino(destino);
  let s = 0;
  for(const m of DB.insMov){
    if(m.insumoId!==insumoId || (projetoId && m.projetoId!==projetoId) || !m.destino || chaveDestino(m.destino)!==k) continue;
    if(m.tipo==='disp' || m.tipo==='comp' || m.tipo==='apropEnt') s += m.qtd;
    else if(m.tipo==='dev' || m.tipo==='uso' || m.tipo==='apropSai') s -= m.qtd;
  }
  return s;
}

function membrosPool(p){ return (p.membros && p.membros.length) ? p.membros : (p.projetoIds||[]).map(pid=>({ projetoId: pid, trechoId: null })); }
function labelMembro(m){ return nomeProjeto(m.projetoId) + (m.trechoId ? ' · ' + trechoNomeCurto(m.trechoId) : ''); }

  DB.insMov.forEach(m=>{ if(m.destino && m.destino.tipo==='compartilhado' && m.destino.poolId===poolId && m.insumoId){ out[m.insumoId] = out[m.insumoId] || 0; } });

}
// tira 'qtd' de um compartilhado e põe no destino (custo vai para onde foi usado)
function apropriarDoPool(poolId, insumoId, qtd, projetoId, destino, motivo){
  const preco = precoMedioDestino(null, { tipo:'compartilhado', poolId }, insumoId);
  const data = nowLocalISO();
  const sai = novoMovIns({ tipo:'apropSai', projetoId, insumoId, qtd, preco, data, destino:{ tipo:'compartilhado', poolId }, motivo: motivo||'Apropriação' });
  novoMovIns({ tipo:'apropEnt', projetoId, insumoId, qtd, preco, data, destino, refPool: poolId, refSai: sai.id, motivo: motivo||'Apropriação' });
}
function precoMedioDestino(projetoId, destino, insumoId){
  const k = chaveDestino(destino);
  let q = 0, v = 0;
  for(const m of DB.insMov){
    if(m.insumoId!==insumoId || (projetoId && m.projetoId!==projetoId) || !m.destino || chaveDestino(m.destino)!==k) continue;
    if(m.tipo==='disp' || m.tipo==='comp' || m.tipo==='apropEnt'){ q += m.qtd; v += m.qtd*(m.preco||0); }
  }
  return q ? v/q : precoAtual(insumoId);
}

/* ---------- traço, umidade e geometria da estaca raiz ---------- */
const tracoPorId = id => DB.tracos.find(t=>t.id===id);
function tracoCalc(t){
  const kgCim = (+t.sacos||0) * (+t.kgSaco||50);
  const areiaSeca = (+t.padiolas||0) * (+t.volPadiola||30) * (+t.massaUnit||1.45);
  const agua = +t.aguaL || 0;
  const adit = (t.aditivos||[]).map(a => {
    const kg = kgCim * (+a.pct||0) / 100, L = kg / (+a.dens||1);
    return { ...a, kg, L, aguaL: kg * (+a.teorAgua||0) / 100 };
  });
  const aguaAdit = adit.reduce((s,a)=>s+a.aguaL, 0);
  const rendCalc = (kgCim/3.10 + areiaSeca/2.65 + agua + aguaAdit) * 1.02 / 1000;
  const rend = +t.rendMedido > 0 ? +t.rendMedido : rendCalc;
  const consumo = rend ? kgCim/rend : 0;
  const ac = kgCim ? (agua + aguaAdit)/kgCim : 0;
  const conf = [
    ['Consumo de cimento ≥ 600 kg/m³', fmtQ(consumo,0)+' kg/m³', consumo >= NBR_RAIZ.consumoMin],
    ['Fator água/cimento entre 0,50 e 0,60', fmtQ(ac,3), ac >= NBR_RAIZ.acMin-0.005 && ac <= NBR_RAIZ.acMax+0.005],
    ['fck de projeto ≥ 20 MPa', fmtQ(+t.fck||0,0)+' MPa', (+t.fck||0) >= NBR_RAIZ.fckMin],
    ...adit.map(a => [`Aditivo ${nomeInsumo(a.insumoId)} na faixa do fabricante`, fmtQ(+a.pct||0,2)+'%', !((+a.min||0)>0 || (+a.max||0)>0) || ((+a.pct||0) >= (+a.min||0) && (+a.pct||0) <= ((+a.max||0) || 999))]),
  ];
  return { kgCim, areiaSeca, agua, adit, aguaAdit, rendCalc, rend, consumo, ac, conf, conforme: conf.every(c=>c[2]) };
}
function coefInchamento(t, h){
  const hc = +t.incHc || 4, cm = +t.incMax || 1.30;
  if(h<=0) return 1;
  if(h<=hc) return 1 + (cm-1)*h/hc;
  return Math.max(1 + (cm-1)*0.75, cm - 0.01*(h-hc));
}
function dosagemCorrigida(t, h){
  const c = tracoCalc(t);
  const ci = coefInchamento(t, h);
  const padiolas = c.areiaSeca / (+t.massaUnit||1.45) * ci / (+t.volPadiola||30);
  const aguaAreia = c.areiaSeca * h / 100;
  const aguaAdd = Math.max(0, c.agua - aguaAreia);
  const acReal = c.kgCim ? (aguaAdd + aguaAreia + c.aguaAdit)/c.kgCim : 0;
  return { ...c, ci, padiolas, aguaAreia, aguaAdd, acReal };
}
function geoRaiz(el){
  if(!el) return null;
  if(el.geoRaiz && el.geoRaiz.trechos && el.geoRaiz.trechos.length) return { ...el.geoRaiz, origem:'personalizada', personalizada:true };
  const est = DB.estruturas.find(e=>e.id===el.estruturaId);
  if(!(est && est.geoRaiz && est.geoRaiz.trechos && est.geoRaiz.trechos.length)) return null;
  const cot = est.geoEixos && est.geoEixos[elementoGrupoKey(el)];
  if(cot && cotasValidas(cot, est.geoRaiz.trechos.length)){
    let topo = +cot.arrasamento;
    const trechos = est.geoRaiz.trechos.map((t,i)=>{ const l = topo - (+cot.fundos[i]); topo = +cot.fundos[i]; return { ...t, l }; });
    return { ...est.geoRaiz, trechos, cotas:{ terreno:+cot.terreno, arrasamento:+cot.arrasamento, fundos:cot.fundos.map(Number) }, origem:'eixo', personalizada:false };
  }
  return { ...est.geoRaiz, origem:'padrão', personalizada:false };
}
function cotasValidas(c, n){
  if(!c || !(isFinite(+c.terreno) && isFinite(+c.arrasamento)) || !Array.isArray(c.fundos) || c.fundos.length!==n) return false;
  if(+c.terreno < +c.arrasamento) return false;
  let topo = +c.arrasamento;
  for(const f of c.fundos){ if(!(isFinite(+f) && +f < topo)) return false; topo = +f; }
  return true;
}

function tracoPadraoElemento(el){
  const est = el ? DB.estruturas.find(e=>e.id===el.estruturaId) : null;
  return (est && est.geoRaiz && est.geoRaiz.tracoId) || null;

function perfuracaoDe(elId){
  return DB.insMov.filter(m=>m.tipo==='perfuracao' && m.elementoId===elId).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0))[0] || null;
}
function volumesEstaca(el){
  const g = geoRaiz(el);
  if(!g) return null;
  const p = perfuracaoDe(el.id);
  const tr = g.trechos.map((t,i) => {
    const area = Math.PI/4 * Math.pow((+t.d||0)/100, 2);
    const lExec = p && p.trechos && p.trechos[i]!=null ? +p.trechos[i] : +t.l||0;
    // cotas executadas (quando a perfuração foi apontada por profundidade a partir do terreno)
    const s = (+t.s||0)/100;
    return { ...t, lExec, teo: area*lExec, teoProj: area*(+t.l||0), esp: area*lExec*(1+s), espProj: area*(+t.l||0)*(1+s) };
  });
  const sum = k => tr.reduce((a,t)=>a+t[k], 0);
  return { trechos: tr, teo: sum('teo'), esp: sum('esp'), espProj: sum('espProj'), comprimento: sum('lExec'), comprimentoProj: tr.reduce((a,t)=>a+(+t.l||0),0), executado: !!p,
    cotas: g.cotas || null, origem: g.origem, vazio: g.cotas ? g.cotas.terreno - g.cotas.arrasamento : null, perf: p };
}
function ultimaUmidade(projetoId){
  return DB.insMov.filter(m=>m.tipo==='umidade' && m.projetoId===projetoId).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0))[0] || null;
}
function batidasDoElemento(elId){
  return DB.insMov.filter(m=>m.tipo==='batida' && (m.alocacao||[]).some(a=>a.elementoId===elId)).sort((a,b)=>(a.criadoEm||0)-(b.criadoEm||0));
}
function cimentoEmUnidade(t, sacos){
  const un = unInsumo(t.cimentoInsumoId);
  const kg = sacos * (+t.kgSaco||50);
  return un==='KG' ? kg : un==='T' ? kg/1000 : sacos;
}
function areiaEmUnidade(t, kgSeca){
  const un = unInsumo(t.areiaInsumoId);
  if(un==='KG') return kgSeca;
  if(un==='T') return kgSeca/1000;
  return kgSeca / ((+t.massaUnit||1.45) * 1000); // m³ de areia solta seca
}
function aguaEmUnidade(t, litros){ return unInsumo(t.aguaInsumoId)==='M³' ? litros/1000 : litros; }
function aditivoEmUnidade(a, litros){ const un = unInsumo(a.insumoId); return un==='KG' ? litros*(+a.dens||1) : litros; }

/* boletim consolidado de uma estaca raiz */
function boletimEstaca(el){
  const vol = volumesEstaca(el);
  const bats = batidasDoElemento(el.id);
  let nb = 0, volProd = 0, volApl = 0, descarteL = 0, acs = [], estimada = false, semAditivo = false, umids = [];
  bats.forEach(b => {
    const a = (b.alocacao||[]).find(x=>x.elementoId===el.id); const fr = b.nb ? a.nb/b.nb : 0;
    nb += a.nb; volProd += (b.volProd||0)*fr; volApl += (b.volApl||0)*fr; descarteL += (b.descarteL||0)*fr;
    acs.push(b.acReal); if(b.estimada) estimada = true; if(b.temAditivo && !b.aditivoOk) semAditivo = true;
    if(b.h!=null) umids.push(b.h);
  });
  const desvio = vol && vol.esp ? (volApl/vol.esp - 1)*100 : null;
  const custo = DB.insMov.filter(m=>m.destino && m.destino.tipo==='elemento' && m.destino.elementoId===el.id).reduce((s,m)=>s+valorAprop(m), 0);
  const t = bats.length ? tracoPorId(bats[bats.length-1].tracoId) : null;
  const tc = t ? tracoCalc(t) : null;
  const acMax = acs.length ? Math.max(...acs) : null, acMin = acs.length ? Math.min(...acs) : null;
  const conf = bats.length ? [
    ['Consumo de cimento do traço ≥ 600 kg/m³', tc ? fmtQ(tc.consumo,0)+' kg/m³' : '—', !!tc && tc.consumo >= NBR_RAIZ.consumoMin],
    ['Fator a/c real entre 0,50 e 0,60', acMin!=null ? (acMin===acMax ? fmtQ(acMin,3) : fmtQ(acMin,3)+' a '+fmtQ(acMax,3)) : '—', acMin!=null && acMin >= NBR_RAIZ.acMin-0.005 && acMax <= NBR_RAIZ.acMax+0.005],
    ['Umidade da areia medida (não estimada)', umids.length ? umids.map(h=>fmtQ(h,1)+'%').join(', ') : '—', !estimada],
    [`Argamassa dentro da tolerância (${TOL_INJ.min}% a +${TOL_INJ.max}%)`, desvio!=null ? (desvio>0?'+':'')+fmtQ(desvio,1)+'%' : 'sem geometria', desvio!=null && desvio >= TOL_INJ.min && desvio <= TOL_INJ.max],
    ['Aditivo aplicado conforme o traço', semAditivo ? 'faltou em batida' : 'sim', !semAditivo],
  ] : [];
  return { el, vol, bats, nb, volProd, volApl, descarteL, desvio, custo, conf, conforme: conf.length && conf.every(c=>c[2]), perf: perfuracaoDe(el.id) };
}

/* ---------- teórico pela composição da etapa (elementos e trechos) ---------- */
// composição fica na estrutura, por nome de etapa: vale para a etapa-modelo e para as etapas próprias de cada elemento
function composicaoDaEtapa(etapaId){
  const et = DB.etapas.find(e=>e.id===etapaId);
  if(!et) return [];
  const estId = et.estruturaId || ((DB.elementos.find(x=>x.id===et.elementoId)||{}).estruturaId);
  const est = DB.estruturas.find(e=>e.id===estId);
  return (est && est.composicoes && est.composicoes[et.name]) || [];
}
function teoricoComposicao(projetoId, destino, insumoId){
  if(!destino || !destino.etapaId) return null;
  const comp = composicaoDaEtapa(destino.etapaId);
  if(!comp.length) return null;
  const c = comp.find(x=>x.insumoId===insumoId);
  if(!c || !(+c.indice>0)) return null;
  let exec = 0;
  for(const r of DB.registros){
    if(r.etapaId!==destino.etapaId || r.quantidadeExecutada==null) continue;
    if(destino.tipo==='elemento' && r.elementoId!==destino.elementoId) continue;
    if(destino.tipo==='trecho' && (r.estruturaId!==destino.estruturaId || (destino.trechoId && r.trechoId!==destino.trechoId))) continue;
    exec += +r.quantidadeExecutada || 0;
  }
  return exec * (+c.indice);
}

        : `<td style="text-align:right"><input type="text" inputmode="decimal" style="max-width:100px; text-align:right" value="${esc(ai.aprop[id]??fmtQ(v,4).replace(/\./g,''))}" oninput="ai.aprop['${id}']=this.value"></td>`}</tr>`).join('')}

    <button class="btn" onclick="salvarAiPool()">Apropriar</button></div>`;
}
function salvarAiPool(){
  const pool = poolPorId(ai.poolId); if(!pool) return;
  const membros = membrosPool(pool), saldos = saldosPool(pool.id), plano = [];
  for(const [id, saldo] of Object.entries(saldos)){
    if(!(saldo>1e-6)) continue;
    let partes = [];
    if(ai.apropModo==='manual'){ partes = membros.map((m,j)=>numIn(ai.aprop[id+'|'+j])||0); }
    else {
      const raw = ai.aprop[id]; const tot = raw===undefined || String(raw).trim()==='' ? saldo : numIn(raw);
      if(!(tot>=0)){ showToast(`Quantidade inválida para ${nomeInsumo(id)}.`); return; }
      if(ai.apropModo==='igual') partes = membros.map(()=>tot/membros.length);
      else { const pcts = membros.map((m,j)=>numIn(ai.aprop['pct|'+j])||0); const sp = pcts.reduce((a,b)=>a+b,0);
        if(Math.abs(sp-100)>0.01){ showToast(`Os percentuais somam ${fmtQ(sp,2)}%: precisam somar 100%.`); return; }
        partes = pcts.map(p=>tot*p/100); }
    }
    const soma = partes.reduce((a,b)=>a+b,0);
    if(soma > saldo + 1e-6){ showToast(`${nomeInsumo(id)}: ${fmtQ(soma,2)} é mais que o saldo de ${fmtQ(saldo,2)}.`); return; }
    partes.forEach((q,j)=>{ if(q>1e-9) plano.push({ id, q, m: membros[j] }); });
  }
  if(!plano.length){ showToast('Informe quanto apropriar.'); return; }
  const antes = new Set(DB.insMov.map(m=>m.id));
  plano.forEach(x=>apropriarDoPool(pool.id, x.id, x.q, x.m.projetoId, { tipo:'geral', motivo:'Compartilhado · '+pool.nome, trechoId: x.m.trechoId||null }, 'Apropriação de compartilhado'));
  persistInsMov();
  const novos = new Set(DB.insMov.filter(m=>!antes.has(m.id)).map(m=>m.id));
  showToast(`${plano.length} apropriação(ões) registrada(s).`, 'Desfazer', () => { DB.insMov = DB.insMov.filter(m=>!novos.has(m.id)); persistInsMov(); render(); });
  aiVoltarInsumos();
}
window.salvarAiPool = salvarAiPool;
/* ---------- receber material pela nota fiscal ---------- */
function aiNfInit(){ if(!ai.nf) ai.nf = { numero:'', data: hojeStr(), fornecedor:'', linhas:[{ insumoId:'', qtd:'', preco:'', atualiza:false, un:'' }], ok:false, localId:null }; return ai.nf; }
// quantidade e preço convertidos para a unidade de estoque
function linhaEmBase(l){
  const ins = insumoPorId(l.insumoId); const un = l.un || (ins && ins.unidade); const f = fatorParaBase(ins, un);
  const q = numIn(l.qtd), p = numIn(l.preco);
  return { un, f, q, qBase: q*f, pBase: isFinite(p) ? p/f : NaN, base: ins ? ins.unidade : '' };
}
function aiNfLinha(i, k, v, rerender){ ai.nf.linhas[i][k] = v; if(rerender) render(); }
function aiNfAdd(){ ai.nf.linhas.push({ insumoId:'', qtd:'', preco:'', atualiza:false, un:'' }); render(); }
function aiNfRem(i){ ai.nf.linhas.splice(i,1); if(!ai.nf.linhas.length) aiNfAdd(); else render(); }
function aiNfContinuar(){
  const nf = ai.nf, linhas = nf.linhas.filter(l=>l.insumoId || String(l.qtd).trim());
  if(!linhas.length){ showToast('Informe ao menos um material da nota.'); return; }
  for(const l of linhas){
    if(!l.insumoId){ showToast('Escolha o material de todas as linhas.'); return; }
    if(!(numIn(l.qtd)>0)){ showToast(`Quantidade inválida para ${nomeInsumo(l.insumoId)}.`); return; }
    if(String(l.preco).trim() && !(numIn(l.preco)>=0)){ showToast(`Preço inválido para ${nomeInsumo(l.insumoId)}.`); return; }
    if(!isFinite(linhaEmBase(l).f)){ showToast(`${nomeInsumo(l.insumoId)}: cadastre a densidade no catálogo para receber em ${l.un}.`); return; }
  }
  nf.linhas = linhas; nf.ok = true; render();
}
Object.assign(window, { aiNfLinha, aiNfAdd, aiNfRem, aiNfContinuar });

    }).join('');
    return topo + `<div class="card"><h3>1. Nota fiscal</h3>

        <div class="field"><label>Fornecedor</label><input type="text" value="${esc(nf.fornecedor)}" oninput="ai.nf.fornecedor=this.value"></div></div>
      ${linhas}

    .sort((a,b)=>(b.ja.length-a.ja.length) || nomeLocal(a.id).localeCompare(nomeLocal(b.id)));

    <div class="card"><h3>2. Onde foi guardado?</h3>

        ${x.ja.length ? `<span class="tap-card-sub" style="color:var(--verde)">já tem ${x.ja.map(j=>`${esc(nomeInsumo(j.i))} ${fmtQ(j.s,2)}`).join(', ')}</span>` : ''}</button>`).join('')}</div>`

function salvarAiNF(localId){
  const nf = ai.nf, c = canteiroPorId(localId);
  if(!confirm(`Lançar a NF ${nf.numero||'s/n'} em ${nomeLocal(localId)}?\n\n${nf.linhas.map(l=>{ const cv = linhaEmBase(l); return `• ${nomeInsumo(l.insumoId)}: ${fmtQ(cv.q,2)} ${cv.un}${cv.un!==cv.base ? ` (= ${fmtQ(cv.qBase,3)} ${cv.base})` : ''}`; }).join('\n')}`)) return;
  const criados = [], precosAntes = {};
  nf.linhas.forEach(l=>{
    const cv = linhaEmBase(l), pn = cv.pBase, i = insumoPorId(l.insumoId);
    if(isFinite(pn) && l.atualiza){ precosAntes[i.id] = JSON.stringify(i.precos||[]); i.precos = (i.precos||[]).filter(p=>p.data!==nf.data); i.precos.push({ data: nf.data, valor: +pn.toFixed(4) }); }
    criados.push(novoMovIns({ tipo:'entrada', projetoId: c ? (projetosAtendidos(c)[0]||null) : null, localId, insumoId: l.insumoId, qtd: +cv.qBase.toFixed(4),
      qtdNF: cv.q, unNF: cv.un, precoNF: isFinite(numIn(l.preco)) ? numIn(l.preco) : null,
      preco: isFinite(pn) ? pn : precoNaData(l.insumoId, nf.data), data: nf.data + 'T' + nowLocalISO().slice(11,16), doc: nf.numero ? 'NF '+nf.numero.trim() : '', fornecedor: nf.fornecedor.trim() }));
  });
  if(Object.keys(precosAntes).length) persist.insumos();
  persistInsMov();
  const ids = new Set(criados.map(m=>m.id));
  showToast(`NF lançada: ${criados.length} material(is) em ${nomeLocal(localId)}.`, 'Desfazer', () => {
    DB.insMov = DB.insMov.filter(m=>!ids.has(m.id));
    Object.entries(precosAntes).forEach(([id,j])=>{ const i = insumoPorId(id); if(i) i.precos = JSON.parse(j); });
    if(Object.keys(precosAntes).length) persist.insumos();
    persistInsMov(); render(); });
  aiVoltarInsumos();
}
window.salvarAiNF = salvarAiNF;
function excluirMovIns(id){
  const m = DB.insMov.find(x=>x.id===id);
  if(!m) return;
  if(!confirm('Excluir este apontamento de insumo?' + (m.tipo==='batida' ? '\n\nOs consumos de areia, água e aditivo desta injeção também serão removidos.' : ''))) return;
  const removidos = DB.insMov.filter(x=>x.id===id || x.refBatidaId===id || (m.tipo==='apropEnt' && x.id===m.refSai) || (m.tipo==='apropSai' && x.refSai===id));
  const ids = new Set(removidos.map(x=>x.id));
  DB.insMov = DB.insMov.filter(x=>!ids.has(x.id));
  persistInsMov();
  showToast('Apontamento excluído.', 'Desfazer', () => { removidos.forEach(x=>{ if(!DB.insMov.some(y=>y.id===x.id)) DB.insMov.push(x); }); persistInsMov(); render(); });
  render();
}

/* ---------- disponibilizar / complementar ---------- */
function sugestaoEstacaHtml(){
  if(ai.destTipo!=='elemento' || !ai.elementoId) return '';
  const el = DB.elementos.find(e=>e.id===ai.elementoId);
  const vol = volumesEstaca(el);
  const t = tracoPorId(tracoPadraoElemento(el));
  if(!vol || !t) return '';
  const c = tracoCalc(t);
  const bat = Math.max(0.5, Math.ceil(vol.esp / c.rend * 2) / 2);
  const sacos = Math.ceil(bat * (+t.sacos||0));
  return `<div style="padding:10px 12px; background:var(--azul-bg); color:var(--azul); border-radius:6px; font-size:13px; margin-bottom:12px">

      motivo: (ai.modo==='comp' || ai.modo==='apl') ? ai.motivo : '', perda: ai.modo==='apl' && !!ai.motivo, doc: ai.doc.trim(), obs: ai.obs.trim() }));

  ai.linhas = [{ insumoId:'', qtd:'' }]; ai.doc = ''; ai.obs = ''; ai.motivo = '';
  aiVoltarInsumos();
}

function salvarAiDev(){
  const destino = aiDestino(), criados = [];
  for(const [id, v] of Object.entries(ai.dev)){
    if(!String(v).trim()) continue;
    const q = numIn(v), saldo = saldoNoDestino(ai.destTipo==='compartilhado' ? null : ai.projetoId, destino, id);
    if(!(q>0)){ showToast(`Quantidade inválida para ${nomeInsumo(id)}.`); return; }
    if(q > saldo + 1e-6){ showToast(`Só há ${fmtQ(saldo,2)} ${unInsumo(id)} de ${nomeInsumo(id)} neste local.`); return; }
  }
  for(const [id, v] of Object.entries(ai.dev)){
    const q = numIn(v); if(!(q>0)) continue;
    criados.push(novoMovIns({ tipo:'dev', projetoId: aiProjetoDoApontamento(), localId: aiOrigemEstoque(), insumoId: id, qtd: q, preco: precoMedioDestino(ai.destTipo==='compartilhado' ? null : ai.projetoId, destino, id), destino, motivo: ai.motivo || MOTIVOS_DEV[0], obs: ai.obs.trim() }));
  }
  if(!criados.length){ showToast('Informe a quantidade a devolver.'); return; }
  persistInsMov();
  const ids = new Set(criados.map(m=>m.id));
  showToast('Devolução registrada.', 'Desfazer', () => { DB.insMov = DB.insMov.filter(m=>!ids.has(m.id)); persistInsMov(); render(); });
  aiVoltarInsumos();
}

function salvarAiPerf(){
  const el = DB.elementos.find(e=>e.id===ai.elementoId);

  const vals = ai.perf.map(numIn);
  let rec;
  if(g && g.cotas){

    let topo = g.cotas.arrasamento; const trechos = [], cotas = [];
    for(const prof of vals){ const c = g.cotas.terreno - prof; if(!(c < topo)){ showToast('As profundidades precisam aumentar de um trecho para o outro e passar da cota de arrasamento.'); return; } trechos.push(+(topo - c).toFixed(3)); cotas.push(+c.toFixed(3)); topo = c; }

/* ---------- umidade da areia ---------- */
function umidadeFrigideira(u){
  const t = numIn(u.t), mu = numIn(u.u), s1 = numIn(u.s1), s2 = numIn(u.s2);
  if(!(mu>t)) return { erro:'O peso com areia úmida precisa ser maior que a frigideira vazia.' };
  if(!(s1>t) || s1>mu) return { erro:'O peso após secar deve ficar entre a frigideira vazia e o peso com areia úmida.' };
  if(isFinite(s2) && (!(s2>t) || s2>mu)) return { erro:'A nova pesagem deve ficar entre a frigideira vazia e o peso úmido.' };
  const seca = Math.min(s1, isFinite(s2) ? s2 : s1) - t, agua = (mu - t) - seca;
  const constante = isFinite(s2) && Math.abs(s1-s2) <= 1;
  return { h: agua/seca*100, seca, agua, amostra: mu-t, constante, temS2: isFinite(s2) };
}

function salvarAiInj(){
  const els = ai.elIds.map(id=>DB.elementos.find(e=>e.id===id)).filter(Boolean);
  const t = tracoPorId(ai.tracoId);
  const ult = ultimaUmidade(ai.projetoId);
  if(!t || !els.length){ showToast('Escolha o traço e a estaca.'); return; }
  if(!ult){ showToast('Registre a umidade da areia antes de bater.'); return; }
  const sacosT = +t.sacos||0, parcial = numIn(ai.parcial)||0;
  if(parcial >= sacosT){ showToast(`Com ${sacosT} sacos ou mais é uma batida inteira.`); return; }
  const fr = sacosT ? parcial/sacosT : 0, nb = (+ai.inteiras||0) + fr;
  if(!(nb>0)){ showToast('Informe ao menos uma batida.'); return; }
  const tc = tracoCalc(t), dz = dosagemCorrigida(t, ult.h);
  const volProd = nb*tc.rend, descL = numIn(ai.descarte)||0;
  if(descL/1000 > volProd){ showToast('O descarte é maior que a argamassa produzida.'); return; }
  const precisaCim = cimentoEmUnidade(t, nb*sacosT);
  const saldos = els.map(el=>saldoNoDestino(ai.projetoId, { tipo:'elemento', elementoId: el.id }, t.cimentoInsumoId));
  const poolsCim = poolsAbertosDoProjeto(ai.projetoId, t.cimentoInsumoId);
  const saldoCim = saldos.reduce((a,b)=>a+b,0) + poolsCim.reduce((s,p)=>s+saldoNoDestino(null, { tipo:'compartilhado', poolId:p.id }, t.cimentoInsumoId), 0);
  // R79: o que não estiver na estaca (lançamentos antigos) sai direto do local de estoque
  if(!tc.conforme && !t.justificativa && !confirm('Este traço está fora da NBR 6122 e não tem justificativa registrada. Registrar mesmo assim?')) return;
  // rateio proporcional ao esperado de cada estaca (ou igual, sem geometria)
  const esp = els.map(el=>{ const v = volumesEstaca(el); return v ? v.esp : 0; });
  const totEsp = esp.reduce((a,b)=>a+b,0);
  const pesos = els.map((_,i)=> totEsp ? esp[i]/totEsp : 1/els.length);
  const volApl = Math.max(0, volProd - descL/1000);
  const temAdit = (t.aditivos||[]).length>0;
  const bat = novoMovIns({ tipo:'batida', projetoId: ai.projetoId, tracoId: t.id, inteiras: +ai.inteiras||0, parcialSacos: parcial, nb, descarteL: descL,
    aditivoOk: !!ai.aditivoOk, temAditivo: temAdit, umidadeId: ult.id, h: ult.h, estimada: !!ult.estimada, padiolas: dz.padiolas*nb, aguaAddL: dz.aguaAdd*nb,
    acReal: dz.acReal, volProd, volApl, rateio: els.length>1,
    alocacao: els.map((el,i)=>({ elementoId: el.id, nb: nb*pesos[i], vol: volApl*pesos[i] })) });
  const data = bat.data;
  const localInj = aiOrigemEstoque();
  bat.localId = localInj;
  // cimento usado: parte proporcional de cada estaca, limitada ao saldo dela; o restante sai das estacas que ainda têm saldo
  const usoCim = els.map((_,i)=>Math.min(cimentoEmUnidade(t, nb*pesos[i]*sacosT), Math.max(0, saldos[i])));
  let faltaCim = precisaCim - usoCim.reduce((a,b)=>a+b,0);
  for(let i=0; i<els.length && faltaCim>1e-9; i++){ const livre = Math.max(0, saldos[i]-usoCim[i]); const q = Math.min(livre, faltaCim); usoCim[i] += q; faltaCim -= q; }
  // o que ainda faltar sai do saldo compartilhado: é apropriado na estaca que usou (o custo vai pra ela)
  const cimDireto = els.map(()=>0);
  if(faltaCim>1e-9){
    const deficit = els.map((_,i)=>Math.max(0, cimentoEmUnidade(t, nb*pesos[i]*sacosT) - usoCim[i]));
    for(let i=0; i<els.length && faltaCim>1e-9; i++){
      let precisa = Math.min(deficit[i] || (i===els.length-1 ? faltaCim : 0), faltaCim);
      for(const pl of poolsCim){
        if(precisa<=1e-9) break;
        const disp = saldoNoDestino(null, { tipo:'compartilhado', poolId:pl.id }, t.cimentoInsumoId);
        const q = Math.min(disp, precisa); if(q<=1e-9) continue;
        apropriarDoPool(pl.id, t.cimentoInsumoId, q, ai.projetoId, { tipo:'elemento', elementoId: els[i].id, estruturaId: els[i].estruturaId, etapaId: null }, 'Usado na injeção');
        usoCim[i] += q; faltaCim -= q; precisa -= q;
      }
    }
    // o que ainda faltar sai direto do local de estoque, proporcional ao que cada estaca usou
    if(faltaCim>1e-9){
      const def2 = els.map((_,i)=>Math.max(0, cimentoEmUnidade(t, nb*pesos[i]*sacosT) - usoCim[i])), sd = def2.reduce((a,b)=>a+b,0);
      els.forEach((_,i)=>{ cimDireto[i] = sd>1e-9 ? faltaCim*def2[i]/sd : faltaCim/els.length; });
      faltaCim = 0;
    }
  }
  els.forEach((el,i)=>{
    const destino = { tipo:'elemento', elementoId: el.id, estruturaId: el.estruturaId, etapaId: (etapasDoElemento(el.id).find(e=>/INJE/i.test(e.name))||{}).id || null };
    const p = pesos[i], nbi = nb*p;
    // cimento: sai do que foi disponibilizado (sem novo custo); usa o saldo das estacas em ordem
    if(usoCim[i]>1e-9) novoMovIns({ tipo:'uso', projetoId: ai.projetoId, insumoId: t.cimentoInsumoId, qtd: usoCim[i], destino, refBatidaId: bat.id, data });
    if(cimDireto[i]>1e-9) novoMovIns({ tipo:'consumo', projetoId: ai.projetoId, localId: localInj, insumoId: t.cimentoInsumoId, qtd: cimDireto[i], preco: precoNaData(t.cimentoInsumoId, data), destino, refBatidaId: bat.id, data, motivo:'Batida de argamassa' });
    if(t.areiaInsumoId) novoMovIns({ tipo:'consumo', projetoId: ai.projetoId, localId: localInj, insumoId: t.areiaInsumoId, qtd: areiaEmUnidade(t, tc.areiaSeca*nbi), preco: precoNaData(t.areiaInsumoId, data), destino, refBatidaId: bat.id, data, motivo:'Batida de argamassa' });
    if(t.aguaInsumoId) novoMovIns({ tipo:'consumo', projetoId: ai.projetoId, localId: localInj, insumoId: t.aguaInsumoId, qtd: aguaEmUnidade(t, dz.aguaAdd*nbi), preco: precoNaData(t.aguaInsumoId, data), destino, refBatidaId: bat.id, data, motivo:'Batida de argamassa' });
    if(temAdit && ai.aditivoOk){
      dz.adit.forEach(a=>{
        if(!a.insumoId) return;
        const q = aditivoEmUnidade(a, a.L*nbi);
        const noLocal = Math.max(0, saldoNoDestino(ai.projetoId, destino, a.insumoId));
        const doLocal = Math.min(q, noLocal), direto = q - doLocal;
        if(doLocal>0) novoMovIns({ tipo:'uso', projetoId: ai.projetoId, insumoId: a.insumoId, qtd: doLocal, destino, refBatidaId: bat.id, data });
        if(direto>1e-9) novoMovIns({ tipo:'consumo', projetoId: ai.projetoId, localId: localInj, insumoId: a.insumoId, qtd: direto, preco: precoNaData(a.insumoId, data), destino, refBatidaId: bat.id, data, motivo:'Batida de argamassa' });
      });
    }
  });
  persistInsMov();
  showToast(`Injeção registrada: ${fmtQ(nb,2)} batida(s), ${fmtQ(volApl,3)} m³.`, 'Desfazer', () => { DB.insMov = DB.insMov.filter(m=>m.id!==bat.id && m.refBatidaId!==bat.id); persistInsMov(); render(); });
  aiVoltarInsumos();
}

function insUnidadesOptions(sel){
  const lista = [...new Set([...UNIDADES_INSUMO, ...DB.unidades.map(u=>u.nome).filter(n=>n!=='H')])];
  return lista.map(u=>`<option ${u===sel?'selected':''}>${esc(u)}</option>`).join('');
}
function submitInsumo(ev){
  ev.preventDefault();
  const f = ev.target, nome = f.nome.value.trim();
  const preco = numIn(f.preco.value);
  if(!nome) return false;
  if(DB.insumos.some(i=>i.nome.toLowerCase()===nome.toLowerCase())){ showToast('Já existe um insumo com esse nome.'); return false; }
  if(!(preco>=0)){ showToast('Informe um preço válido.'); return false; }
  const dens = numIn(f.densidade.value), peso = numIn(f.pesoUn.value);
  DB.insumos.push({ id: uid(), nome, unidade: f.unidade.value, categoria: f.categoria.value, retornavel: f.retornavel.value==='1', densidade: dens>0 ? dens : null, pesoUn: peso>0 ? peso : null, precos:[{ data: f.data.value || hojeStr(), valor: preco }] });
  persist.insumos(); showToast('Insumo cadastrado.'); f.reset(); render();
  return false;
}
function updInsumo(id, campo, valor){
  const i = insumoPorId(id); if(!i) return;
  if(['densidade','teorAgua','massaUnit','pesoUn'].includes(campo)){ const n = numIn(valor); i[campo] = isFinite(n) ? n : null; }
  else if(campo==='nome'){ const n = String(valor).trim(); if(!n) return; i.nome = n; }
  else i[campo] = valor;
  persist.insumos(); render();
}
function addPrecoInsumo(id){
  const i = insumoPorId(id), d = document.getElementById('np-data-'+id).value, v = numIn(document.getElementById('np-valor-'+id).value);
  if(!d || !(v>=0)){ showToast('Informe data e preço.'); return; }
  i.precos = (i.precos||[]).filter(p=>p.data!==d); i.precos.push({ data:d, valor:v });
  persist.insumos(); showToast('Preço registrado.'); render();
}
function remPrecoInsumo(id, data){
  const i = insumoPorId(id);
  if((i.precos||[]).length<=1){ showToast('O insumo precisa de ao menos um preço.'); return; }
  i.precos = i.precos.filter(p=>p.data!==data); persist.insumos(); render();
}
function excluirInsumo(id){
  if(DB.insMov.some(m=>m.insumoId===id)){ showToast('Este insumo tem movimentos e não pode ser excluído.'); return; }
  if(DB.tracos.some(t=>t.cimentoInsumoId===id || t.areiaInsumoId===id || t.aguaInsumoId===id || (t.aditivos||[]).some(a=>a.insumoId===id))){ showToast('Este insumo é usado em um traço.'); return; }
  if(!confirm(`Excluir o insumo "${nomeInsumo(id)}"?`)) return;
  DB.insumos = DB.insumos.filter(i=>i.id!==id); persist.insumos(); render();
}
function setLimitePerda(cat, v){
  const n = numIn(v);
  if(isFinite(n)) DB.insConfig.limites[cat] = n; else delete DB.insConfig.limites[cat];
  persist.insConfig();
}
function baixarModeloCatalogo(){
  const ws = XLSX.utils.aoa_to_sheet([['Nome','Unidade','Categoria','Preço','Data','Retornável'],['Cimento CP-II-E-32','SC','Cimento e argamassa',38,hojeStr(),'S'],['Areia média lavada','M³','Agregados',145,hojeStr(),'S'],['Concreto fck 30','M³','Concreto',520,hojeStr(),'N']]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Insumos'); XLSX.writeFile(wb, 'modelo-catalogo-insumos.xlsx');
}
function importarCatalogoInsumos(input){
  const file = input.files && input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const wb = XLSX.read(e.target.result, { type:'array', cellDates:true });
      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
      const pega = (l, ...ks) => { for(const k of Object.keys(l)){ const n = k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); if(ks.includes(n)) return l[k]; } return ''; };
      let novos = 0, atual = 0, ignorados = 0;
      for(const l of linhas){
        const nome = String(pega(l,'nome','insumo')).trim(); if(!nome){ ignorados++; continue; }
        const un = String(pega(l,'unidade','un')).trim().toUpperCase() || 'UN';
        let cat = String(pega(l,'categoria')).trim(); if(!CATEGORIAS_INSUMO.includes(cat)) cat = CATEGORIAS_INSUMO.find(c=>c.toLowerCase()===cat.toLowerCase()) || 'Outros';
        const pv = pega(l,'preco','valor'); const preco = typeof pv==='number' ? pv : numIn(pv);
        let dv = pega(l,'data','vigencia'); let data = hojeStr();
        if(dv instanceof Date && !isNaN(dv)) data = new Date(dv.getTime()-dv.getTimezoneOffset()*60000).toISOString().slice(0,10);
        else if(/^\d{4}-\d{2}-\d{2}/.test(String(dv))) data = String(dv).slice(0,10);
        else if(/^\d{2}\/\d{2}\/\d{4}/.test(String(dv))){ const [d,m,a] = String(dv).split('/'); data = `${a.slice(0,4)}-${m}-${d}`; }
        const rv = String(pega(l,'retornavel','retorna')).trim().toUpperCase();
        const ex = DB.insumos.find(i=>i.nome.toLowerCase()===nome.toLowerCase());
        if(ex){
          ex.unidade = un || ex.unidade; ex.categoria = cat;
          if(rv) ex.retornavel = !rv.startsWith('N');
          if(isFinite(preco) && precoNaData(ex.id, data)!==preco){ ex.precos = (ex.precos||[]).filter(p=>p.data!==data); ex.precos.push({ data, valor: preco }); }
          atual++;
        } else {
          DB.insumos.push({ id: uid(), nome, unidade: un, categoria: cat, retornavel: !rv.startsWith('N'), precos: isFinite(preco) ? [{ data, valor: preco }] : [{ data, valor: 0 }] });
          novos++;
        }
      }
      persist.insumos();
      showToast(`Catálogo importado: ${novos} novo(s), ${atual} atualizado(s)${ignorados?`, ${ignorados} linha(s) sem nome ignorada(s)`:''}.`);
      input.value = ''; render();
    } catch(err){ console.warn(err); showToast('Não foi possível ler a planilha.'); }
  };
  r.readAsArrayBuffer(file);
}
Object.assign(window, { submitInsumo, updInsumo, addPrecoInsumo, remPrecoInsumo, excluirInsumo, setLimitePerda, baixarModeloCatalogo, importarCatalogoInsumos });

function salvarTraco(){
  const d = state.insTracoDraft;
  if(!d.nome.trim()){ showToast('Dê um nome ao traço.'); return; }
  if(!d.cimentoInsumoId || !d.areiaInsumoId){ showToast('Escolha o cimento e a areia do catálogo.'); return; }
  if(!(+d.sacos>0) || !(+d.padiolas>0) || !(+d.volPadiola>0) || !(+d.massaUnit>0)){ showToast('Preencha sacos, padiolas, volume da padiola e massa unitária.'); return; }
  if((d.aditivos||[]).some(a=>!a.insumoId || !(+a.pct>0) || !(+a.dens>0))){ showToast('Complete os aditivos (produto, dosagem e densidade) ou remova a linha.'); return; }
  const c = tracoCalc(d);
  if(!c.conforme && !String(d.justificativa||'').trim() && !confirm('O traço está fora da NBR 6122 e não tem justificativa. Salvar mesmo assim? (as injeções vão pedir confirmação)')) return;
  if(d.id){ const i = DB.tracos.findIndex(t=>t.id===d.id); DB.tracos[i] = { ...d }; }
  else DB.tracos.push({ ...d, id: uid() });
  persist.tracos(); state.insTracoDraft = null; showToast('Traço salvo.'); render();
}

      <td style="text-align:right"><input type="text" inputmode="decimal" style="max-width:90px; text-align:right" value="${esc(t.s)}" onchange="state.${chave}.trechos[${i}].s=numIn(this.value); render();"></td>

    <span style="font-size:12px; color:var(--grafite-suave); margin-left:10px">Comprimento total de projeto: ${fmtQ(prof,2)} m</span>`;

function renderCotasEixos(est, els){
  if(!est.geoRaiz || !est.geoRaiz.trechos || !est.geoRaiz.trechos.length) return `<div class="card"><h3>Cotas por eixo</h3><p style="font-size:12.5px; color:var(--grafite-suave)">Salve a geometria padrão da estrutura primeiro.</p></div>`;
  const trs = est.geoRaiz.trechos;
  const grupos = {};
  els.forEach(el=>{ const k = elementoGrupoKey(el); (grupos[k] = grupos[k] || { k, label: elementoGrupoLabel(el), els:[] }).els.push(el); });
  const lista = Object.values(grupos).sort((a,b)=>a.label.localeCompare(b.label, 'pt-BR', { numeric:true }));
  const cot = est.geoEixos || {};
  return `<div class="card"><h3>Cotas por eixo <span class="tag">${lista.length} eixo(s)</span></h3>
    <p style="font-size:12.5px; color:var(--grafite-suave); margin-top:0">Cada local tem cotas diferentes. Informe a cota do terreno (plataforma de perfuração), a de arrasamento (topo da estaca) e a cota de fundo de cada trecho pelo projeto e sondagem. O comprimento de cada trecho é calculado; em campo, a perfuração é apontada pela profundidade a partir do terreno.</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Eixo</th><th style="text-align:right">Peças</th><th style="text-align:right">Terreno</th><th style="text-align:right">Arrasamento</th>
      ${trs.map(t=>`<th style="text-align:right">Fundo · ${esc(t.rotulo||'trecho')}</th>`).join('')}<th style="text-align:right">Comprimentos</th><th></th></tr></thead><tbody>
    ${lista.map(g=>{ const c = cot[g.k] || {}, idx = lista.indexOf(g), val = cotasValidas(c, trs.length);
      let topo = +c.arrasamento; const comp = val ? c.fundos.map(f=>{ const l = topo - (+f); topo = +f; return fmtQ(l,2); }).join(' + ')+' m' : '';
      return `<tr><td><b style="font-weight:500">${esc(g.label)}</b></td><td class="num">${g.els.length}</td>
        <td style="text-align:right"><input id="cx-t-${idx}" type="text" inputmode="decimal" style="max-width:90px; text-align:right" value="${esc(c.terreno??'')}"></td>
        <td style="text-align:right"><input id="cx-a-${idx}" type="text" inputmode="decimal" style="max-width:90px; text-align:right" value="${esc(c.arrasamento??'')}"></td>
        ${trs.map((t,i)=>`<td style="text-align:right"><input id="cx-f-${idx}-${i}" type="text" inputmode="decimal" style="max-width:90px; text-align:right" value="${esc(c.fundos && c.fundos[i]!=null ? c.fundos[i] : '')}"></td>`).join('')}
        <td class="num" style="font-size:12px">${val ? comp : (c.terreno!=null ? '<span style="color:var(--vermelho)">cotas inválidas</span>' : '—')}</td>
        <td style="text-align:right; white-space:nowrap"><button class="btn small" onclick="salvarCotasEixo('${est.id}', ${idx})">Salvar</button>${cot[g.k] ? ` <button class="icon-btn" onclick="limparCotasEixo('${est.id}', ${idx})">${ICONS.trash}</button>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p style="font-size:11.5px; color:var(--grafite-suave); margin:8px 0 0">Cotas em metros, como no projeto (ex.: terreno 745,20 · arrasamento 744,00 · fundo do solo 722,00 · ponta 711,00). Peças personalizadas ignoram as cotas do eixo.</p></div>`;
}
function _gruposEstrutura(est){
  const els = DB.elementos.filter(el=>el.estruturaId===est.id && el.projetoId===est.projetoId);
  const grupos = {};
  els.forEach(el=>{ const k = elementoGrupoKey(el); (grupos[k] = grupos[k] || { k, label: elementoGrupoLabel(el) }); });
  return Object.values(grupos).sort((a,b)=>a.label.localeCompare(b.label, 'pt-BR', { numeric:true }));
}
function salvarCotasEixo(estId, idx){
  const est = DB.estruturas.find(e=>e.id===estId), g = _gruposEstrutura(est)[idx];
  const n = est.geoRaiz.trechos.length;
  const c = { terreno: numIn(document.getElementById(`cx-t-${idx}`).value), arrasamento: numIn(document.getElementById(`cx-a-${idx}`).value),
    fundos: Array.from({length:n}, (_,i)=>numIn(document.getElementById(`cx-f-${idx}-${i}`).value)) };
  if(!cotasValidas(c, n)){ showToast('Cotas inválidas: o terreno deve ficar acima (ou igual) do arrasamento, e cada fundo abaixo do anterior.'); return; }
  est.geoEixos = est.geoEixos || {};
  est.geoEixos[g.k] = c;
  persist.estruturas(); showToast(`Cotas de ${g.label} salvas.`); render();
}
function limparCotasEixo(estId, idx){
  const est = DB.estruturas.find(e=>e.id===estId), g = _gruposEstrutura(est)[idx];
  if(!confirm(`Remover as cotas de ${g.label}? As peças voltam à geometria padrão.`)) return;
  delete est.geoEixos[g.k]; persist.estruturas(); render();
}
Object.assign(window, { salvarCotasEixo, limparCotasEixo });
function geoValida(tr){ return tr.length && tr.every(t=>+t.d>0 && +t.l>=0 && +t.s>=0); }
function salvarGeoEstrutura(id){
  const d = state.insGeoDraft, est = DB.estruturas.find(e=>e.id===id);
  if(!geoValida(d.trechos)){ showToast('Preencha diâmetro, comprimento e sobreconsumo de todos os trechos.'); return; }
  est.geoRaiz = { trechos: d.trechos.map(t=>({ rotulo:t.rotulo||'', d:+t.d, l:+t.l, s:+t.s })), tracoId: d.tracoId||null };
  persist.estruturas(); showToast('Geometria da estrutura salva.'); render();
}
function editarGeoElemento(id){
  const el = DB.elementos.find(e=>e.id===id), g = geoRaiz(el) || { trechos:[{ rotulo:'Fuste em solo', d:31, l:9, s:25 }] };
  state.insGeoElDraft = { alvo:'el:'+id, trechos: JSON.parse(JSON.stringify(g.trechos)) }; render();
}
function salvarGeoElemento(id){
  const d = state.insGeoElDraft, el = DB.elementos.find(e=>e.id===id);
  if(!geoValida(d.trechos)){ showToast('Preencha diâmetro, comprimento e sobreconsumo de todos os trechos.'); return; }
  el.geoRaiz = { trechos: d.trechos.map(t=>({ rotulo:t.rotulo||'', d:+t.d, l:+t.l, s:+t.s })) };
  persist.elementos(); state.insGeoElDraft = null; showToast(`Geometria da ${el.codigo} salva.`); render();
}
function geoElementoPadrao(id){ const el = DB.elementos.find(e=>e.id===id); delete el.geoRaiz; persist.elementos(); render(); }
Object.assign(window, { salvarGeoEstrutura, editarGeoElemento, salvarGeoElemento, geoElementoPadrao });

function submitCanteiro(ev){
  ev.preventDefault(); const f = ev.target, nome = f.nome.value.trim(), local = f.local.value.trim(), vinc = f.vinculo.value || null;
  if(!nome || !local) return false;
  if((DB.canteiros||[]).some(c=>c.nome.toLowerCase()===nome.toLowerCase() && (c.vinculoProjetoId||null)===vinc)){ showToast('Já existe um local com esse nome aqui.'); return false; }
  const projetoIds = vinc ? [vinc] : [...f.querySelectorAll('input[name=proj]:checked')].map(x=>x.value);
  const c = { id: uid(), nome, local, tipo: f.tipo.value, vinculoProjetoId: vinc, projetoIds };
  DB.canteiros.push(c); persist.canteiros(); state.insEstLocal = c.id; showToast(`Local "${nomeLocal(c.id)}" cadastrado.`); render(); return false;
}
function seletorEstoque(){
  const sel = state.insEstLocal;

// estoque consolidado: visão geral (insumo × grupo) ou de um projeto (insumo × ambiente)
function renderVisaoEstoque(){
  const sel = state.insEstLocal;

  let colunas;
  if(pid){
    colunas = todos.filter(id=>{ const c = canteiroPorId(id); return (c && c.vinculoProjetoId===pid) || id===pid; }).map(id=>({ k:id, label: canteiroPorId(id) ? canteiroPorId(id).nome : 'Almox. antigo', ids:[id] }));
  } else {
    const g = {};
    todos.forEach(id=>{ const k = grupoDe(id); (g[k] = g[k] || []).push(id); });
    colunas = Object.entries(g).map(([k,ids])=>({ k, ids, label: k==='canteiro' ? 'Canteiros' : k.startsWith('p:') ? nomeProjeto(k.slice(2)) : 'Antigo · '+nomeProjeto(k.slice(4)) }))
      .sort((a,b)=>(a.k==='canteiro'?-1:b.k==='canteiro'?1:0) || a.label.localeCompare(b.label));
  }
  const ids = [...new Set(DB.insMov.filter(m=>m.insumoId && TIPOS_ESTOQUE.includes(m.tipo)).map(m=>m.insumoId))].sort((a,b)=>nomeInsumo(a).localeCompare(nomeInsumo(b)));
  const linhas = ids.map(id=>({ id, vals: colunas.map(c=>c.ids.reduce((s,l)=>s+saldoEstoque(l,id),0)) })).filter(l=>l.vals.some(v=>Math.abs(v)>1e-9));
  const tot = l => l.vals.reduce((a,b)=>a+b,0);
  const valorTotal = linhas.reduce((s,l)=>s+Math.max(0,tot(l))*precoAtual(l.id),0);
  const ambientes = pid ? (DB.canteiros||[]).filter(c=>c.vinculoProjetoId===pid) : [];
  const abastece = pid ? (DB.canteiros||[]).filter(c=>!c.vinculoProjetoId && (c.projetoIds||[]).includes(pid)) : [];
  return `<div class="card"><div class="grid3"><div class="field" style="grid-column: span 2"><label>Estoque de</label>${seletorEstoque()}</div></div>
    ${pid ? `<p style="font-size:12.5px; color:var(--grafite-suave); margin:0 0 10px">Ambientes do projeto: ${ambientes.length ? esc(ambientes.map(c=>c.nome+' ('+(c.local||'')+')').join(' · ')) : 'nenhum cadastrado'}${abastece.length ? ' · também abastecido por '+esc(abastece.map(c=>c.nome).join(', ')) : ''}</p>` : ''}
    ${!colunas.length ? `<p style="font-size:12.5px; color:var(--grafite-suave)">${pid ? 'Este projeto ainda não tem ambiente de estoque. Cadastre um container ou depósito acima, em "Pertence a: Projeto…".' : 'Nenhum estoque lançado.'}</p>` :
    linhas.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Insumo</th>${colunas.map(c=>`<th style="text-align:right">${esc(c.label)}</th>`).join('')}<th style="text-align:right">Total</th><th style="text-align:right">Valor</th></tr></thead><tbody>

const INS_GRUPOS = [['destTipo','Destino'],['projeto','Projeto'],['grupo','Estrutura / serviço'],['local','Elemento / local'],['insumo','Insumo'],['categoria','Categoria'],['mes','Mês']];
function insRelFiltros(){

// linhas de apropriação (custo aplicado) já com sinais
function insLinhasAprop(f){
  return DB.insMov.filter(m=>TIPOS_APROP[m.tipo] && m.insumoId)
    .filter(m=>(!f.de || m.data.slice(0,10)>=f.de) && (!f.ate || m.data.slice(0,10)<=f.ate))
    .filter(m=>!f.projetoId || (m.destino && m.destino.tipo==='compartilhado' ? (poolPorId(m.destino.poolId) && membrosPool(poolPorId(m.destino.poolId)).some(x=>x.projetoId===f.projetoId)) : m.projetoId===f.projetoId))
    .filter(m=>!f.destTipo || (m.destino ? m.destino.tipo : 'geral')===f.destTipo)
    .filter(m=>!f.categoria || catInsumo(m.insumoId)===f.categoria)
    .map(m=>({ m, data: m.data, projeto: m.destino && m.destino.tipo==='compartilhado' ? 'Compartilhado · '+nomePool(m.destino.poolId) : nomeProjeto(m.projetoId), destTipo: DESTINO_TIPOS[m.destino ? m.destino.tipo : 'geral'], grupo: grupoDestino(m.destino), local: labelDestino(m.destino),
      insumo: nomeInsumo(m.insumoId), categoria: catInsumo(m.insumoId), un: unInsumo(m.insumoId), qtd: qtdAprop(m), preco: m.preco||0, valor: valorAprop(m), mes: m.data.slice(0,7),
      perda: (m.tipo==='comp' || (m.tipo==='consumo' && m.perda)) ? (m.qtd||0)*(m.preco||0) : 0 }));
}
// perdas: complementos (com motivo) + descartes de injeção + aplicado acima do teórico (composição da etapa)
function insPerdas(f){
  const out = [];
  insLinhasAprop(f).filter(l=>l.m.tipo==='consumo' && l.m.perda).forEach(l=>out.push({ origem:'Perda apontada', motivo: l.m.motivo||'—', projeto:l.projeto, local:l.local, insumo:l.insumo, categoria:l.categoria, qtd:l.m.qtd, un:l.un, valor:(l.m.qtd||0)*(l.m.preco||0), data:l.data }));
  insLinhasAprop(f).filter(l=>l.m.tipo==='comp').forEach(l=>out.push({ origem:'Complemento', motivo: l.m.motivo||'—', projeto:l.projeto, local:l.local, insumo:l.insumo, categoria:l.categoria, qtd:l.m.qtd, un:l.un, valor:l.perda, data:l.data }));
  DB.insMov.filter(m=>m.tipo==='batida' && m.descarteL>0 && (!f.projetoId || m.projetoId===f.projetoId) && (!f.de || m.data.slice(0,10)>=f.de) && (!f.ate || m.data.slice(0,10)<=f.ate)).forEach(b=>{
    const t = tracoPorId(b.tracoId); if(!t) return;
    const c = tracoCalc(t), fr = c.rend ? (b.descarteL/1000)/c.rend : 0;
    const valor = fr * (cimentoEmUnidade(t, +t.sacos||0)*precoNaData(t.cimentoInsumoId,b.data)
      + areiaEmUnidade(t, c.areiaSeca)*precoNaData(t.areiaInsumoId,b.data) + c.adit.reduce((s,a)=>s+aditivoEmUnidade(a,a.L)*precoNaData(a.insumoId,b.data),0));
    out.push({ origem:'Descarte no misturador', motivo:`${fmtQ(b.descarteL,0)} L de argamassa`, projeto: nomeProjeto(b.projetoId), local: b.alocacao.map(a=>nomeElemento(a.elementoId)).join(', '), insumo:'Argamassa ('+t.nome+')', categoria:'Cimento e argamassa', qtd: b.descarteL/1000, un:'M³', valor, data:b.data });
  });
  // aplicado × teórico onde a etapa tem composição
  const grupos = {};
  insLinhasAprop(f).forEach(l=>{ const d = l.m.destino; if(!d || !d.etapaId) return; const k = chaveDestino(d)+'|'+d.etapaId+'|'+l.m.insumoId; (grupos[k] = grupos[k] || { d, projetoId:l.m.projetoId, insumoId:l.m.insumoId, qtd:0, valor:0, l }); grupos[k].qtd += l.qtd; grupos[k].valor += l.valor; });
  Object.values(grupos).forEach(g=>{
    const teo = teoricoComposicao(g.projetoId, g.d, g.insumoId);
    if(teo==null || !(g.qtd>teo+1e-6)) return;
    const pm = g.qtd ? g.valor/g.qtd : 0;
    out.push({ origem:'Acima do teórico', motivo:`aplicado ${fmtQ(g.qtd,2)} × teórico ${fmtQ(teo,2)}`, projeto: nomeProjeto(g.projetoId), local: labelDestino(g.d), insumo: nomeInsumo(g.insumoId), categoria: catInsumo(g.insumoId), qtd: g.qtd-teo, un: unInsumo(g.insumoId), valor:(g.qtd-teo)*pm, data:'' });
  });
  return out;
}
function renderInsRelatorio(){
  const f = insRelFiltros();
  const L = insLinhasAprop(f);
  const perdas = insPerdas(f);
  const total = L.reduce((s,l)=>s+l.valor,0), totPerda = perdas.reduce((s,p)=>s+p.valor,0);
  const aux = L.filter(l=>l.m.destino && l.m.destino.tipo==='servico').reduce((s,l)=>s+l.valor,0);
  const agg = {};
  L.forEach(l=>{ const k = l[f.grupo] || '—'; agg[k] = agg[k] || { n:0, v:0 }; agg[k].n++; agg[k].v += l.valor; });
  const perdaPor = {}; perdas.forEach(p=>{ const k = f.grupo==='insumo' ? p.insumo : f.grupo==='categoria' ? p.categoria : f.grupo==='projeto' ? p.projeto : f.grupo==='local' ? p.local : null; if(k) perdaPor[k] = (perdaPor[k]||0) + p.valor; });
  const E = Object.entries(agg).sort((a,b)=>b[1].v-a[1].v), mx = E.length ? Math.max(...E.map(e=>Math.abs(e[1].v)),1) : 1;
  // perdas acima do limite por categoria

const NOMES_MOV = { entrada:'Recebido (NF)', consumo:'Aplicado', disp:'Disponibilizado', comp:'Complemento', dev:'Devolução', ajuste:'Ajuste de inventário', transf:'Transferência', historico:'Histórico', apropEnt:'Apropriado de compartilhado', apropSai:'Saiu do compartilhado', uso:'Usado na injeção', batida:'Injeção (batidas)', umidade:'Umidade da areia', perfuracao:'Perfuração' };
function insMovFiltros(){
  if(!state.insMovF) state.insMovF = { de:'', ate:'', tipo:'', insumoId:'', localId:'', projetoId:'', texto:'', base:'nota' };
  return state.insMovF;
}
function insMovFiltrados(){
  const f = insMovFiltros(), txt = f.texto.trim().toLowerCase();
  return DB.insMov.filter(m=>{
    const dia = f.base==='lancamento' ? new Date(m.criadoEm||0).toISOString().slice(0,10) : (m.data||'').slice(0,10);
    if(f.de && dia < f.de) return false;
    if(f.ate && dia > f.ate) return false;
    if(f.tipo && m.tipo!==f.tipo) return false;
    if(f.insumoId && m.insumoId!==f.insumoId) return false;
    if(f.localId && localDe(m)!==f.localId && localDestinoDe(m)!==f.localId) return false;
    if(f.projetoId && m.projetoId!==f.projetoId && m.projetoDestinoId!==f.projetoId) return false;
    if(txt){ const alvo = [m.doc, m.fornecedor, m.motivo, m.obs, m.insumoId ? nomeInsumo(m.insumoId) : '', m.destino ? labelDestino(m.destino) : '', m.elementoId ? nomeElemento(m.elementoId) : ''].join(' ').toLowerCase(); if(!alvo.includes(txt)) return false; }
    return true;
  }).sort((a,b)=> f.base==='lancamento' ? (b.criadoEm||0)-(a.criadoEm||0) : (b.data||'').localeCompare(a.data||'') || (b.criadoEm||0)-(a.criadoEm||0));
}
function insMovOnde(m){
  if(m.tipo==='transf') return nomeLocal(localDe(m)) + ' → ' + nomeLocal(localDestinoDe(m));
  if(m.tipo==='entrada' || m.tipo==='ajuste') return nomeLocal(localDe(m));
  if(m.destino) return labelDestino(m.destino) + (m.localId ? ' · de ' + nomeLocal(m.localId) : '');
  if(m.elementoId) return nomeElemento(m.elementoId) || '';
  return '';
}

function exportarMovimentosExcel(){
  const L = insMovFiltrados(), f = insMovFiltros();

    Quantidade: m.qtd!=null ? +(+m.qtd).toFixed(4) : '', Unidade: m.insumoId ? unInsumo(m.insumoId) : '', 'Qtd. na nota': m.unNF ? m.qtdNF : '', 'Unidade da nota': m.unNF || '', 'Preço unit. (R$)': m.preco!=null ? +(+m.preco).toFixed(4) : '', 'Valor (R$)': m.qtd!=null && m.preco!=null ? +(m.qtd*m.preco).toFixed(2) : '',
    'Local de estoque': (m.tipo==='entrada'||m.tipo==='ajuste'||m.tipo==='transf'||m.localId) ? nomeLocal(localDe(m)) : '', 'Local de destino': m.tipo==='transf' ? nomeLocal(localDestinoDe(m)) : '',

    'Umidade (%)': m.tipo==='umidade' ? +m.h.toFixed(2) : '', Batidas: m.tipo==='batida' ? +m.nb.toFixed(2) : '', 'Lançado em': m.criadoEm ? new Date(m.criadoEm).toLocaleString('pt-BR') : '' }));

}

/* ---------------------------------------------------------
   BACKUP AUTOMÁTICO ROTATIVO (1x por dia, 7 cópias em loop)
   - grava na mesma coleção, em docs "backup_s{0..6}__{chave}" + "backup_meta"
   - custo: ~17 gravações/dia (uma por chave + meta); leitura só do meta (1 doc)
   - nunca roda se a carga falhou; nunca troca cópia com dados por banco vazio
--------------------------------------------------------- */
const BACKUP_SLOTS = 7;
const BACKUP_PARTE_CHARS = 300000; // ~300 mil caracteres por parte (< 1 MB mesmo com acentos)
const BACKUP_CHAVES = {
  frentes_projetos:'projetos', frentes_estacas:'estacas', frentes_estruturas:'estruturas', frentes_etapas:'etapas',
  frentes_empresas:'empresas', frentes_recursos:'recursos', frentes_elementos:'elementos', frentes_eixos:'eixos',
  frentes_unidades:'unidades', frentes_registros_v2:'registros', frentes_efetivo_geral:'efetivoGeral',
  frentes_contratos:'contratos', frentes_custo_orcamentos:'custoOrcamentos', frentes_custo_medicoes:'custoMedicoes',
  frentes_cronogramas:'cronogramas', frentes_cronograma_itens:'cronogramaItens', frentes_calendario:'calendario', frentes_aprendizado:'aprendizado', frentes_rdos:'rdos',
  frentes_insumos:'insumos', frentes_tracos:'tracos', frentes_servicos_aux:'servicosAux', frentes_ins_config:'insConfig', frentes_ins_mov:'insMov', frentes_ins_pools:'insPools', frentes_canteiros:'canteiros',
};
let _backupMeta = null;      // cache local do meta (evita reler o Firestore a cada verificação)
let _backupRodando = false;
async function lerBackupMeta(){
  const doc = await db.collection('frente_livre_dados').doc('backup_meta').get();
  return (doc.exists && doc.data().value) ? JSON.parse(doc.data().value) : { ultimoEm:null, ultimoDia:null, proximoSlot:0, slots:{} };
}
function atualizarNotaBackup(){
  const el = document.getElementById('backup-nota');
  if(!el) return;
  if(!_backupMeta || !_backupMeta.ultimoEm){ el.textContent = '☁ backup automático: nenhum ainda'; return; }
  const dias = Math.floor((Date.now() - new Date(_backupMeta.ultimoEm).getTime()) / 86400000);
  const n = Object.keys(_backupMeta.slots||{}).length;
  el.textContent = `☁ último backup: ${fmtDataHora(_backupMeta.ultimoEm)} · ${n}/${BACKUP_SLOTS} cópias`;
  el.style.color = dias>=2 ? '#F2B35B' : 'rgba(231,184,182,0.7)';
}
async function executarBackupDiario(){
  if(!db || window.DB_LOAD_FAILED || _backupRodando) return;
  const hoje = hojeStr();
  if(_backupMeta && _backupMeta.ultimoDia===hoje) return; // já feito hoje (cache local) — zero leituras
  _backupRodando = true;
  try{
    _backupMeta = await lerBackupMeta();           // 1 leitura: outro aparelho pode já ter feito hoje
    if(_backupMeta.ultimoDia===hoje){ atualizarNotaBackup(); return; }
    const contagens = { registros: DB.registros.length, elementos: DB.elementos.length, estruturas: DB.estruturas.length, projetos: DB.projetos.length };
    const ultimoSlot = _backupMeta.ultimoEm ? _backupMeta.slots[String((_backupMeta.proximoSlot + BACKUP_SLOTS - 1) % BACKUP_SLOTS)] : null;
    if(ultimoSlot && ultimoSlot.contagens && ultimoSlot.contagens.registros>0 && contagens.registros===0){
      showToast('Backup automático suspenso: os lançamentos estão vazios, mas o último backup tinha dados. Verifique antes de continuar.');
      return;
    }
    const slot = _backupMeta.proximoSlot || 0;
    const em = new Date().toISOString();
    const col = db.collection('frente_livre_dados');
    // grava todas as chaves primeiro; o meta só é atualizado se tudo deu certo
    // R69: coleções grandes (ex.: lançamentos) são divididas em partes, pra nenhuma cópia bater no limite de 1 MB do Firestore
    const escritas = [];
    for(const [chave, campo] of Object.entries(BACKUP_CHAVES)){
      const json = JSON.stringify(DB[campo] ?? null);
      if(json.length <= BACKUP_PARTE_CHARS){
        escritas.push(col.doc(`backup_s${slot}__${chave}`).set({ value: json, dia: hoje, em }));
      } else {
        const partes = [];
        for(let i=0; i<json.length; i+=BACKUP_PARTE_CHARS) partes.push(json.slice(i, i+BACKUP_PARTE_CHARS));
        partes.forEach((pt, i) => escritas.push(col.doc(`backup_s${slot}__${chave}__p${i}`).set({ value: pt, dia: hoje, em })));
        escritas.push(col.doc(`backup_s${slot}__${chave}`).set({ value: null, partes: partes.length, dia: hoje, em }));
      }
    }
    await Promise.all(escritas);
    const novoMeta = {
      ultimoEm: em, ultimoDia: hoje, proximoSlot: (slot + 1) % BACKUP_SLOTS,
      slots: { ...(_backupMeta.slots||{}), [String(slot)]: { em, dia: hoje, contagens } },
    };
    await col.doc('backup_meta').set({ value: JSON.stringify(novoMeta) });
    _backupMeta = novoMeta;
  } catch(e){
    console.warn('Backup automático falhou:', e); // silencioso: tenta de novo na próxima verificação
  } finally {
    _backupRodando = false;
    atualizarNotaBackup();
  }
}
function iniciarLoopBackup(){
  setTimeout(executarBackupDiario, 20000);          // espera o uso inicial assentar
  setInterval(executarBackupDiario, 60*60*1000);    // de hora em hora checa se virou o dia (sem ler o banco se não virou)
}
async function baixarBackupNuvem(){
  if(!db) return;
  try{
    if(!_backupMeta) _backupMeta = await lerBackupMeta();
    const slots = Object.entries(_backupMeta.slots||{}).sort((a,b)=>b[1].em.localeCompare(a[1].em));
    if(!slots.length){ showToast('Ainda não há backup automático gravado.'); return; }
    const lista = slots.map(([k,v],i)=>`${i+1}) ${fmtDataHora(v.em)} — ${v.contagens ? v.contagens.registros : '?'} lançamentos`).join('\n');
    const resp = prompt(`Cópias de backup na nuvem (mais recente primeiro):\n\n${lista}\n\nDigite o número da cópia para baixar (.json, compatível com "Importar backup"):`);
    if(resp===null) return;
    const idx = parseInt(resp,10) - 1;
    if(!(idx>=0 && idx<slots.length)){ showToast('Número inválido.'); return; }
    const [slotKey, info] = slots[idx];
    const col = db.collection('frente_livre_dados');
    const backup = { versao: 3, exportadoEm: info.em };
    await Promise.all(Object.entries(BACKUP_CHAVES).map(async ([chave, campo]) => {
      const d = await col.doc(`backup_s${slotKey}__${chave}`).get();
      const dd = d.exists ? d.data() : null;
      if(dd && dd.partes){
        const partes = await Promise.all(Array.from({length: dd.partes}, (_, i) => col.doc(`backup_s${slotKey}__${chave}__p${i}`).get()));
        backup[campo] = JSON.parse(partes.map(x => (x.exists && x.data().value) || '').join(''));
      } else {
        backup[campo] = (dd && dd.value) ? JSON.parse(dd.value) : [];
      }
    }));
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `frente-livre-backup-nuvem-${info.dia}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    showToast('Cópia de backup baixada.');
  } catch(e){ showToast('Não foi possível baixar o backup.'); }
}
window.baixarBackupNuvem = baixarBackupNuvem;

function barraSelecao(lista){
  if(!selApontar.ativo) return '';

  selApontar.ids = selApontar.ids.filter(id=>idsLista.includes(id));
  const n = selApontar.ids.length;

  return `<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:-4px 0 14px 0; padding:10px 12px; background:var(--fundo); border:1px dashed var(--linha-grade); border-radius:6px; font-size:12.5px;">

    <button class="btn small" ${n?'':'disabled style="opacity:.4; cursor:not-allowed"'} onclick="excluirSelecionadosApontar()">${ICONS.trash} Excluir ${n||''}</button>

function toggleSelecionadoApontar(id){
  const i = selApontar.ids.indexOf(id);

  render();

function selecionarTodosApontar(marcar){
  if(!marcar){ selApontar.ids = []; render(); return; }
  const lista = apontar.acao==='iniciar' ? DB.registros.filter(r=>!r.inicio) : DB.registros.filter(r=>r.inicio && !r.termino);
  selApontar.ids = lista.map(r=>r.id);
  render();
}
window.selecionarTodosApontar = selecionarTodosApontar;
function excluirSelecionadosApontar(){
  const ids = selApontar.ids.slice();
  if(!ids.length) return;
  if(!confirm(`Excluir ${ids.length} lançamento(s) selecionado(s)?`)) return;
  const removidos = DB.registros.filter(r=>ids.includes(r.id));
  DB.registros = DB.registros.filter(r=>!ids.includes(r.id));
  persist.registros();
  selApontar = { ativo:false, ids:[] };
  showToast(`${removidos.length} lançamento(s) excluído(s).`, 'Desfazer', () => {
    const existentes = new Set(DB.registros.map(r=>r.id));
    removidos.forEach(r=>{ if(!existentes.has(r.id)) DB.registros.push(r); });
    persist.registros();
    render();
  });
  render();
}

          <button class="tap-card menu-card" onclick="apontar.acao='concluir'; render();">

          </button>
          <button class="tap-card menu-card" onclick="apontar.acao='insumos'; aiReset(); render();">
            ${ICONS.insumos}
            <span class="tap-card-title">Insumos</span>
            <span class="tap-card-sub">Receber NF · aplicar material</span>
          </button>
          <button class="tap-card menu-card" onclick="state.tab='efetivo'; render();">
            ${ICONS.efetivo}
            <span class="tap-card-title">Ver / editar efetivo lançado</span>
            <span class="tap-card-sub">Consultar, corrigir, excluir ou exportar por dia</span>
